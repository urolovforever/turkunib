page.terms.title=Колдонуу шарттары
page.terms.lastupdated=Акыркы жаңыланган:
page.terms.intro=turkunib.org сайтына («Сайт») кош келиңиз. Бул Колдонуу шарттары («Шарттар», «Макулдашуу») сиздин Сайтка кирүүңүздү жана аны колдонууңузду жөнгө салат. Сайтка кирүү же аны колдонуу менен сиз ушул Шарттарга баш ийүүгө макул болосуз. Эгер сиз бул Шарттарга макул болбосоңуз, Сайтты колдонбоңуз.
page.terms.s1.title=1. Аныктамалар
page.terms.s1.text=«Биз», «биздин» Сайттын операторун билдирет. «Сиз» же «Колдонуучу» Сайтка кирген кайсы гана конок, колдонуучу же башка адамды билдирет.
page.terms.s2.title=2. Шарттарды кабыл алуу
page.terms.s2.text=Сиздин Сайтты колдонууңуз ушул Шарттарга жана бардык колдонулуучу мыйзамдарга жана эрежелерге баш ийет. Эгер сиз Сайтты уюмдун атынан колдонсоңуз, анын атынан ушул Шарттарды кабыл алууга ыйгарым укуктуу экениңизди ырастайсыз.
page.terms.s3.title=3. Уруксат берилген колдонуу
page.terms.s3.item1=Сайтты башкалардын укуктарын бузбаган түрдө жана мыйзамдуу максаттарда гана колдонуңуз.
page.terms.s3.item2=Сайтка, анын серверлерине же байланышкан системаларга уруксатсыз кирүүгө аракет кылбаңыз.
page.terms.s3.item3=Зыяндуу программаларды, зыяндуу кодду киргизбеңиз же Сайтты бузган же начарлаткан иш-аракеттерди жасабаңыз.
page.terms.s4.title=4. Аккаунттар жана коопсуздук
page.terms.s4.text=Эгер Сайт аккаунт түзүү мүмкүнчүлүгүн сунуштаса, сиз эсептик маалыматыңызды коргоо жана аккаунтуңуздун астында болгон бардык иш-аракеттер үчүн жоопкерчиликтүүсүз. Биз ушул Шарттарды же колдонулуучу мыйзамды бузган аккаунттарды токтотуу же жоюу укугуна ээбиз.
page.terms.s5.title=5. Интеллектуалдык менчик
page.terms.s5.text=Сайттагы бардык мазмун, анын ичинде текст, графика, логотиптер, белгилер, сүрөттөр жана дизайн элементтери бизге же биздин лицензиарларга таандык жана колдонулуучу автордук укук жана башка интеллектуалдык менчик мыйзамдары менен корголгон. Сиз биздин алдын ала жазуу жүзүндөгү макулдугубузсуз кандайдыр бир мазмунду көчүрө, кайра чыгара, өзгөртө, тарата же ачык көрсөтө албайсыз.
page.terms.s6.title=6. Мазмун жана тактык
page.terms.s6.text=Биз Сайттагы маалыматтын так жана жаңы болушун камсыздоо үчүн негиздүү аракеттерди жасайбыз; бирок мазмундун каталардан же кемчиликтерден таза экенине кепилдик бербейбиз. Биз маалыматты каалаган убакта алдын ала эскертүүсүз жаңырта же оңдой алабыз.
page.terms.s7.title=7. Үчүнчү тараптын шилтемелери
page.terms.s7.text=Сайт бизге таандык эмес же башкарылбаган үчүнчү тараптын вебсайттарына же кызматтарына шилтемелерди камтышы мүмкүн. Биз кайсы гана үчүнчү тараптын вебсайттарынын мазмуну, купуялык саясаттары же тажрыйбалары үчүн жооптуу эмеспиз.
page.terms.s8.title=8. Тыюу салынган иш-аракеттер
page.terms.s8.item1=Сайтты иштен чыгара турган, ашыкча жүктөй турган же бузуучу кандайдыр бир түрдө колдонуу.
page.terms.s8.item2=Биздин макулдугубузсуз маалыматтарды казуу, скрапинг же ушул сыяктуу маалымат чогултуу ыкмалары.
page.terms.s8.item3=Кандайдыр бир адамга же мекемеге окшоштуруу же өзүңүздүн таандыктыгыңызды бурмалоо.
page.terms.s9.title=9. Жоопкерчиликтен баш тартуулар
page.terms.s9.text=Сайт жана анын мазмуну «кандай болсо ошондой» жана «жеткиликтүү болгондой» негизде, кандайдыр бир түрдөгү ачык же кыйыр кепилдиктерсиз, анын ичинде, бирок чектелбестен, сатылыктын кыйыр кепилдиктерин, белгилүү максатка ылайыктуулугун жана укук бузбоону кошкондо, берилет.
page.terms.s10.title=10. Жоопкерчиликти чектөө
page.terms.s10.text=Мыйзам уруксат берген толук көлөмдө биз (а) сиздин Сайтты колдонууңуздан же колдоно албай калууңуздан; (б) биздин серверлерге уруксатсыз кирүүдөн же колдонуудан; же (в) Сайттан алынган кандайдыр бир мазмундан келип чыккан кандайдыр бир кыйыр, кокус, өзгөчө, кесепеттүү же жазалоочу зыяндар үчүн, же пайданын же кирешенин жоготуусу үчүн, түз же кыйыр түрдө, же маалыматтын, колдонуунун, кадыр-баркынын же башка материалдык эмес жоготуулардын кесепети үчүн жооптуу эмеспиз.
page.terms.s11.title=11. Компенсация
page.terms.s11.text=Сиз бизди жана биздин филиалдарды, кызмат адамдарын, кызматкерлерди жана агенттерди сиздин Сайтты колдонууңуздан же ушул Шарттарды бузууңуздан келип чыккан же ага кандайдыр бир жол менен байланышкан кандайдыр бир дооматтардан, милдеттенмелерден, зыяндардан, жоготуулардан жана чыгашалардан коргоого, компенсациялоого жана зыянсыз сактоого макул болосуз.
page.terms.s12.title=12. Колдонулуучу мыйзам жана юрисдикция
page.terms.s12.text=Бул Шарттар биздин негизги иш ордубуздун юрисдикциясында колдонулуучу мыйзамдарга ылайык, анын мыйзамдар коллизиясынын жоболоруна карабастан, жөнгө салынат жана чечмеленет. Кандайдыр бир талаш-тартыштар ошол юрисдикцияда жайгашкан соттордун өзгөчө юрисдикциясына баш ийет.
page.terms.s13.title=13. Бул Шарттардагы өзгөрүүлөр
page.terms.s13.text=Биз бул Шарттарды убакыт-убакыты менен карап чыгышыбыз мүмкүн. Жаңыланган Шарттар «Акыркы жаңыланган» датасы менен ушул баракка жайгаштырылат. Өзгөрүүлөр күчүнө киргенден кийин Сайтты улантып колдонууңуз кайра каралган Шарттарды кабыл алууну түшүндүрөт.
page.terms.s14.title=14. Биз менен байланышыңыз
page.terms.s14.text=Бул Колдонуу шарттары тууралуу суроолоруңуз болсо, төмөнкү дарек менен байланышыңыз:
