page.orhun.title=Орхун алмашуу программасы
page.orhun.intro.p1=Түрк университеттер бирлигинин (TURKUNIB) алкагында иштеген Орхун алмашуу программасы Түрк мамлекеттеринин уюмунун (ТМУ) жогорку билим берүү жаатындагы негизги мобилдүүлүк механизмине айланды. 2017–2018-окуу жылындагы пилоттук башталышынан бери Программа масштабы жана таасири боюнча туруктуу өсүп, мүчө жана байкоочу мамлекеттердеги болжол менен 170 университеттин ортосундагы академиялык алмашууга шарт түзүп келет. Түзүмдүү мобилдүүлүк схемалары аркылуу Программа студенттерди жана кызматкерлерди алмашууну, биргелешкен изилдөө демилгелерин, окуу программаларын биргелешип иштеп чыгууну жана окутуу менен илимий иш жаатындагы университеттер аралык кызматташтыкты колдойт.
page.orhun.intro.p2=Түздөн-түз академиялык натыйжалардан тышкары, Орхун алмашуу программасы бирдиктүү жана атаандаштыкка жөндөмдүү Түрк жогорку билим берүү мейкиндигин калыптандыруунун, катышуучу университеттердин институционалдык жакындашуусун, сапатты жогорулатууну жана академиялык квалификацияларды өз ара таанууну илгерилетүүнүн стратегиялык куралы болуп саналат. Студенттердин, окутуучулардын жана изилдөөчүлөрдүн түз байланышына мүмкүндүк берүү менен Программа түрк дүйнөсүндөгү адамдар аралык байланышты, маданий түшүнүшүүнү жана академиялык ынтымакты бекемдөөдө чечүүчү роль ойноп, Түрк мамлекеттеринин уюму көздөгөн аймактык интеграциянын кеңири көрөгөчтүгүнө салым кошот.
page.orhun.regulation.title=Жобо
page.orhun.regulation.text=Бул жобонун максаттары — Түрк кеңешинин Түрк университеттер бирлигинин мүчөсү болгон жогорку окуу жайлардын ортосундагы окутуучулар менен студенттерди алмашуунун негизин аныктоо. Бул Жобо Түрк кеңешинин Түрк университеттер бирлигинин мүчөсү болгон жогорку окуу жайлардын ортосундагы окутуучулар менен студенттерди алмашуунун негиздерин камтыйт.
