page.cookies.howuse.item1=Сайттын негизги функциясын камсыздоо жана колдоо.
page.cookies.howuse.item2=Вебсайтты жакшыртуу үчүн трафикти, колдонуу үлгүлөрүн жана өндүрүмдүүлүктү талдоо.
page.cookies.howuse.item3=Тил же мурда тандалган опциялар сыяктуу тандоолоруңузду эстеп калуу.
page.cookies.howuse.item4=Мазмунду жекелештирүү жана, тиешелүү учурларда, ылайыктуу акцияларды жеткирүү.
page.cookies.manage.title=Кукилерди башкаруу
page.cookies.manage.text=Кукилерди серепчиңиздин жөндөөлөрү жана башка куралдар аркылуу башкара аласыз. Айрым кукилерди өчүрүү вебсайттын кээ бир бөлүктөрүнүн иштешине таасир этиши мүмкүн экенин эске алыңыз.
page.cookies.browserguides=Серепчи көрсөтмөлөрү
page.cookies.choices.title=Сиздин тандооңуз
page.cookies.choices.item1=Кукилерди бөгөттөө же өчүрүү үчүн серепчинин жөндөөлөрүн өзгөртүңүз.
page.cookies.choices.item2=Жеткиликтүү учурда «Do Not Track» же ушул сыяктуу купуялык тандоолорун колдонуңуз.
page.cookies.choices.item3=Мындай кызматтар колдонулган жерде үчүнчү тараптын аналитикасынан/жарнамаларынан баш тартыңыз.
page.cookies.thirdparty.title=Үчүнчү тараптын кукилери
page.cookies.thirdparty.text=Айрым кукилер биздин баракчаларда пайда болгон үчүнчү тараптын кызматтары тарабынан коюлушу мүмкүн (мисалы, кыстарылган медиа, карталар же аналитика). Бул үчүнчү тараптардын өздөрүнүн купуялык жана куки саясаттары бар. Маалыматыңызды кантип иштетерин билүү үчүн алардын документтерин карап чыгууну сунуштайбыз.
page.cookies.changes.title=Бул саясаттагы өзгөрүүлөр
page.cookies.changes.text=Биз технологиядагы, мыйзамдардагы же кызматтарыбыздагы өзгөрүүлөрдү чагылдыруу үчүн бул куки саясатын убакыт-убакыты менен жаңыртышыбыз мүмкүн. Эң акыркы маалымат үчүн бул баракты мезгил-мезгили менен карап турууну сунуштайбыз.
