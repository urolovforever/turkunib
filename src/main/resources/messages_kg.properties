page.cookies.lastupdated=Акыркы жаңыланган:
page.cookies.intro=Бул вебсайт серепчилик тажрыйбаңызды жакшыртуу, сайт трафигин талдоо жана жекелештирилген мазмунду камсыздоо үчүн кукилерди колдонот. Бул саясат кукилер деген эмне экенин, кайсы түрлөрүн колдонорубузду жана аларды кантип башкарууга болорун түшүндүрөт.
page.cookies.what.title=Куки деген эмне?
page.cookies.what.text=Кукилер — бул вебсайт сиз ага киргенде түзмөгүңүзгө сактаган кичинекей текст файлдары. Алар сайтка түзмөгүңүздү таанууга, тандоолоруңузду эстеп калууга жана баракчалар менен функциялар менен кантип иштешериңизди түшүнүүгө мүмкүндүк берет.
