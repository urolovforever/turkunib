page.orhunguide.s1.title=1. Орхун алмашуу программасы жөнүндө
page.orhunguide.s1.p1=Орхун алмашуу программасы — Түрк мамлекеттеринин уюмунун (ТМУ) алдында иштеген Түрк университеттер бирлигинин (TURKUNIB) негизги программасы болуп, мүчө өлкөлөрдүн жогорку окуу жайларынын ортосунда студенттердин жана окутуучулардын мобилдүүлүгүн колдойт. Программа академиялык кызматташтыкты өнүктүрүүнү, окуу жайлар аралык байланыштарды бекемдөөнү жана элдердин ортосундагы маданий байланышты арттырууну максат кылат.
page.orhunguide.s1.p2=Программа 2017–2018-окуу жылында пилоттук долбоор катары башталган; COVID-19дан кийинки мезгилде кайра жанданып, масштабы кеңейген жана бүгүнкү күндө 170 мүчө университетти бириктирген кеңири тармакка айланды.
page.orhunguide.s1.obj.title=Стратегиялык максаттар
page.orhunguide.s1.obj1=Мүчө өлкөлөрдүн университеттеринин ортосунда академиялык интеграцияны жана мобилдүүлүктү жогорулатуу,
page.orhunguide.s1.obj2=«Түрк дүйнөсүнүн жогорку билим берүү мейкиндигин» түзүүгө салым кошуу,
page.orhunguide.s1.obj3=Жогорку билим берүү системаларын Болон процесси жана ECTS сыяктуу эл аралык стандарттарга шайкеш келтирүү,
page.orhunguide.s1.obj4=Аймактык өнүгүүгө, изилдөө кызматташтыгына жана инновацияга салым кошуу.
page.orhunguide.s1.countries.title=Программа камтыган мүчө өлкөлөр
page.orhunguide.s1.countries.p1=Программанын алкагында академиялык кызматкерлер жана студенттер Түрк мамлекеттеринин уюмунун университеттер бирлигине мүчө болгон университеттерге мобилдүүлүккө баруу мүмкүнчүлүгүнө ээ. Мүчө өлкөлөр: Түркия, Азербайжан, Кыргызстан, Казакстан, Өзбекстан, Түндүк Кипр Түрк Республикасы жана Венгрия.
page.orhunguide.s2.title=2. Жалпы принциптер
page.orhunguide.s2s1.title=2.1 Протоколдорго негизделүү
page.orhunguide.s2s1.p1=Орхун алмашуу программасы мүчө окуу жайлардын ортосунда кол коюлган «Орхун алмашуу программасынын протоколунун» алкагында гана ишке ашырылат. Университет протокол түзүлбөгөн окуу жайдан студенттерди же окутуучуларды кабыл ала албайт жана ага жөнөтө албайт. Протоколдун бир нускасы Түрк мамлекеттеринин уюмунун Катчылыгында сакталат.
page.orhunguide.s2s2.title=2.2 Тилдер
page.orhunguide.s2s2.p1=Программага тиешелүү ченемдик укуктук актылар, маалыматтар, файлдар жана документтер мүчө мамлекеттердин расмий тилдеринде, түрк жана англис тилдеринде даярдалат. Тексттердин ортосунда карама-каршылык болгон учурда англисче текст артыкчылыкка ээ.
page.orhunguide.s2s3.title=2.3 Каржы булактары
page.orhunguide.s2s3.fin1=Улуттук же эл аралык мекемелер жана уюмдар тарабынан берилүүчү каражаттар,
page.orhunguide.s2s3.fin2=Мүчө университеттердин өз бюджеттик каражаттары,
page.orhunguide.s2s3.fin3=TURKUNIBдин кезектеги төрагалык кылуучу университети жана Түрк мамлекеттеринин уюму тарабынан берилүүчү каражаттар.
page.orhunguide.s2s3.p1=Мүчө университеттер ар бир окуу жылы үчүн каржылык муктаждыктарын мобилдүүлүккө чейин өз бюджеттеринде көрсөтүүгө милдеттүү; каражаттарды бөлүштүрүүдө зарыл координацияны Түрк мамлекеттеринин уюмунун Катчылыгы камсыздайт.
page.orhunguide.s3.title=3. Студенттер кантип өтүнмө беришет?
page.orhunguide.s3.p1=Орхун алмашуу программасынын алкагында формалдуу билим берүүдө окуган студенттер өз жогорку окуу жайы протокол түзгөн мүчө окуу жайда бир же эки семестр бою (жалпысынан бир окуу жылынан ашпаган мөөнөттө) окуусун улантса болот.
page.orhunguide.s3s1.title=3.1 Өтүнмөгө коюлган талаптар
page.orhunguide.s3s1.req1=Формалдуу жогорку билим берүү программасында окуп жатуу,
page.orhunguide.s3s1.req2=4 баллдык системада жалпы орточо баллы (GPA) кеминде 2.5 болушу (же ага барабар көрсөткүч),
page.orhunguide.s3s1.req3=Даярдоо курсунун, биринчи курстун жана бүтүрүүчү курстун студенттери программадан пайдалана алышпайт,
page.orhunguide.s3s1.req4=Чет өлкөдө эл аралык студент статусунда окугандар өз өлкөсүндөгү университетке өтүнмө бере алышпайт.
page.orhunguide.s3s2.title=3.2 Өтүнмө берүү процесси жана жарыя
page.orhunguide.s3s2.item1=Жогорку окуу жайы өзү кол койгон Орхун алмашуу программасынын протоколдорун жана тиешелүү квоталарды өзүнүн сайтында жарыялайт.
page.orhunguide.s3s2.item2=Жарыяда программа менен тааныштыруу, өтүнмөгө коюлган талаптар жана процесстин кадамдары камтылат.
page.orhunguide.s3s2.item3=Студент жарыяланган квотага жана календарга ылайык тиешелүү окуу жайга өтүнмө берет.
page.orhunguide.s3s2.item4=Өтүнмөлөр системага жүктөлгөн документтер менен бирге кабыл алуучу окуу жайга жеткирүү үчүн координатор университетке жөнөтүлөт.
page.orhunguide.s3s2.item5=TURKUNIBдин кезектеги төрагалык кылуучу университети эки тараптуу протоколдордун алкагында алмашуу студенттеринин санын жана бөлүштүрүлүшүн аныктайт.
page.orhunguide.s3s2.item6=Баалоо талапкерлердин орточо баллына негизделет; жыйынтыктар протоколго кол койгон окуу жайлардын сайттарында жарыяланат.
page.orhunguide.s3.note1=100 баллдык баалоо системасынан 4 баллдык системага өткөрүү кабыл алуучу университеттин эквиваленттүүлүк чечимине негизделет. Мындан тышкары, TURKUNIBдин кезектеги төрагалык кылуучу университети натыйжалуу жана үзүрлүү мобилдүүлүк үчүн кошумча шарттарды белгилеши мүмкүн.
page.orhunguide.s3s3.title=3.3 Талап кылынган документтер
page.orhunguide.s3.doc1=Өтүнмө формасы
page.orhunguide.s3.doc1.desc=Студенттин өтүнмө документи
page.orhunguide.s3.doc2=Транскрипт
page.orhunguide.s3.doc2.desc=Баалар көрсөтүлгөн жаңыланган транскрипт
page.orhunguide.s3.doc3=Студенттин милдеттенмелер келишими
page.orhunguide.s3.doc3.desc=Орхун алмашуу программасынын студенттик милдеттенмелер келишими — студент менен окуу жайдын ортосунда кол коюлат
page.orhunguide.s3.doc4=Башка документтер
page.orhunguide.s3.doc4.desc=Протоколго кол койгон университеттер аныктаган кошумча документтер (бар болсо)
page.orhunguide.s3s3.p1=Алмашуу мезгили аяктагандан кийин студент транскрипти, окуу мөөнөтүн көрсөткөн Катышуу сертификатын жана студенттин жыйынтык отчетун кайтып келген күндөн тартып 30 күндүн ичинде өз окуу жайынын Орхун алмашуу программасынын координация бөлүмүнө жеке өзү, почта же электрондук почта аркылуу тапшырат. Жетишпеген документтер үчүн 15 күнгө чейин кошумча мөөнөт берилиши мүмкүн; документтер берилген мөөнөттө толукталбаса, процесс жараксыз деп эсептелип, жасалган төлөмдөрдү кайтарып берүү талап кылынат.
page.orhunguide.s3s4.title=3.4 Окуу келишими (Learning Agreement)
page.orhunguide.s3s4.p1=Мобилдүүлүк башталганга чейин студенттин кабыл алуучу окуу жайда ала турган курстары менен кредиттери жана аларга өз окуу жайында дал келген курстар «Окуу келишими» (Learning Agreement) аркылуу аныкталат. Келишим үч нускада даярдалат; бир нускасы студентте, калгандары эки окуу жайда сакталат. Келишимге тиешелүү кафедра башчылары жана окуу жайлардын жогорку жетекчилери (же алардын ыйгарым укуктуу өкүлдөрү) кол коюшат. Милдеттүү өзгөртүүлөр кабыл алуучу окуу жайдын окуу мезгили башталгандан тартып эң кеч 30 күндүн ичинде (жана милдеттүү экзамен даталарына чейин) киргизилиши керек.
page.orhunguide.s3s5.title=3.5 Курстардын эквиваленттүүлүгү, кайра окуу жана экзамендер
page.orhunguide.s3s5.item1=Окуу жүктөмү кредиттик негизде аныкталат; курстардын саны эмес, кредиттер негиз катары алынат. Окуу жайлар ECTS системасын таяныч катары колдонсо болот.
page.orhunguide.s3s5.item2=Студент өздөштүрө албаган курстар окуу келишиминде (Learning Agreement) көрсөтүлгөн эквиваленттүү курстун негизинде өз окуу жайында кайра окулат; кайра окула турган курсту кабыл алуучу окуу жайда алууга болбойт.
page.orhunguide.s3s5.item3=Орхун алмашуу программасынын студенттерине шарттуу өтүү колдонулбайт; кайра тапшыруу экзаменин студент учурда алмашуу студенти болуп жаткан окуу жайда гана тапшырса болот.
page.orhunguide.s3s5.item4=Дипломдук иштер, практикалар жана лабораториялык иштер сыяктуу иштер студенттин өз окуу жайынын эрежелерине баш ийет.
page.orhunguide.s3s5.item5=Алмашуу аяктаганда окуу жайлар ийгиликтүү аяктаган курстардын кредиттерин жана бааларын таанууга милдеттүү; бул курстар дипломдун тиркемесинде көрсөтүлөт.
page.orhunguide.s3s6.title=3.6 Каржылык милдеттенмелер
page.orhunguide.s3s6.item1=Студент алмашуу мезгилинде милдеттүү төгүмдү/окуу акысын өз окуу жайына төлөй берет; каттоону токтотуп турууга болбойт.
page.orhunguide.s3s6.item2=Кабыл алуучу окуу жайга кошумча окуу акысы төлөнбөйт.
page.orhunguide.s3s6.item3=Башка стипендиялар жана насыялар окуу мезгили бою уланат.
page.orhunguide.s3s7.title=3.7 Тартип
page.orhunguide.s3s7.p1=Алмашуу студенттери мобилдүүлүк мезгилинде өздөрү жүргөн окуу жайдын тартип эрежелерине баш ийет. Тартиптик иликтөө ачылса, анын жыйынтыгы жөнүндө студенттин өз окуу жайына билдирилет; жаза мобилдүүлүк мезгилинде колдонулбай калса, аны студенттин өз окуу жайы аткарат.
page.orhunguide.s4.title=4. Академиялык кызматкерлер кантип өтүнмө беришет?
page.orhunguide.s4.p1=Орхун алмашуу программасынын протоколуна кол койгон окуу жайларда иштеген бардык окутуучулар окутуучулардын мобилдүүлүгүнө катыша алышат. Мобилдүүлүк бир окуу жайдын кызматкери башка мүчө окуу жайда жүргүзө турган окутуу иштерин камтыйт.
page.orhunguide.s4s1.title=4.1 Камтуу чөйрөсү жана мөөнөтү
page.orhunguide.s4s1.item1=Мобилдүүлүк мөөнөтү кеминде эки жума жана көп дегенде үч ай болушу мүмкүн; бир эле окуу жылында бир жолу гана ишке ашырылат.
page.orhunguide.s4s1.item2=Жумалык жалпы академиялык иш кеминде алты саат болушу керек (негиз катары окутуу сааттары алынат; жетишсиз болсо, семинар, панель же конференция сыяктуу иш-чаралар менен толукталышы мүмкүн).
page.orhunguide.s4s1.item3=Окутууну камтыбаган мобилдүүлүк пландары Орхун алмашуу программасынын алкагында кабыл алынбайт.
page.orhunguide.s4s2.title=4.2 Өтүнмө жарыясы жана тандоо процесси
page.orhunguide.s4s2.item1=Кол коюлган протоколдор жана квоталар окуу жайдын жана TURKUNIBдин сайттарында жарыяланат; жарыялар кеминде 15 күн бою жарыяланган бойдон турат.
page.orhunguide.s4s2.item2=Жарыя мезгилинде берилген бардык өтүнмөлөр катталат; бир нускасы окуу жайдын Орхун алмашуу программасынын координация бөлүмүндө сакталат.
page.orhunguide.s4s2.item3=Кызматкер ылайыктуу курстарды аныктоо үчүн барууну каалаган окуу жайынын тиешелүү кафедрасы менен байланышып, «Окутуучулардын мобилдүүлүк планын» даярдайт.
page.orhunguide.s4s2.item4=План жөнөтүүчү жана кабыл алуучу окуу жайлардын тиешелүү академиялык бөлүмдөрүнүн кеңештери тарабынан бекитилип, мобилдүүлүк башталганга кеминде 15 күн калганда координация бөлүмүнө тапшырылат.
page.orhunguide.s4s2.item5=Баалоодо алмашуу программасына мурда катышпаган окутуучуларга жана Орхун боюнча кафедра координаторлоруна артыкчылык берилет.
page.orhunguide.s4s2.item6=Жыйынтыктар протоколго кол койгон окуу жайдын сайтында жарыяланат.
page.orhunguide.s4.note2=Тандалып, бирок жүйөлүү себепсиз катышпаган кызматкер үч жыл бою программадан пайдалана албайт.
page.orhunguide.s4s3.title=4.3 Талап кылынган документтер
page.orhunguide.s4.doc1=Академиялык кызматкердин маалымат формасы
page.orhunguide.s4.doc1.desc=Окуу жайдын сайтындагы «Документтер» менюсунан алынат
page.orhunguide.s4.doc2=Академиялык кызматкердин мобилдүүлүк программасы
page.orhunguide.s4.doc2.desc=Жүргүзүлө турган иш-чараларды майда-чүйдөсүнө чейин камтыган план; окуу жайдын сайтынан алынат
page.orhunguide.s4.doc3=Өмүр баян (CV)
page.orhunguide.s4.doc3.desc=Жаңыланган CV
page.orhunguide.s4.doc4=Катышуу сертификаты
page.orhunguide.s4.doc4.desc=Мобилдүүлүк аяктаганда кабыл алуучу окуу жай тарабынан кол коюлуп/мөөр басылып берилет
page.orhunguide.s4.doc5=Иш-чаранын жыйынтык отчету
page.orhunguide.s4.doc5.desc=Кызматкер тарабынан даярдалат; иш-чара аяктагандан кийин эң кеч 15 күндүн ичинде координация бөлүмүнө тапшырылат
page.orhunguide.s4s4.title=4.4 Каржылык укуктар жана милдеттер
page.orhunguide.s4s4.item1=Кызматкердин эмгектик укуктары өз университетинде сакталат.
page.orhunguide.s4s4.item2=Алгачкы эки жума үчүн суткалык акы жана жол чыгымдары жөнөтүүчү окуу жай тарабынан төлөнөт.
page.orhunguide.s4s4.item3=Жашоо жана күнүмдүк камсыздоо (турак жай жана тамактануу) кабыл алуучу университет тарабынан камсыздалат.
page.orhunguide.s5.title=5. Мен мобилдүүлүккө тандалдым — эми эмне кылышым керек?
page.orhunguide.s5.p1=Мобилдүүлүккө тандалган студенттерге жана академиялык кызматкерлерге мобилдүүлүк башталганга чейин төмөнкү алты кадамды ирети менен аткаруу сунушталат:
page.orhunguide.s5.step1=Kion аккаунтун түзүү
page.orhunguide.s5.step1.text=Тиешелүү алмашуу программасынын сайтында берилген шилтеме аркылуу Kion аккаунтун түзүү керек. Мобилдүүлүк үчүн талап кылынган документтер ушул системага жүктөлөт.
page.orhunguide.s5.step2=Кабыл алуу катын алуу
page.orhunguide.s5.step2.text=Кабыл алуу катын алуу үчүн жайгаштырылган университет менен электрондук почта аркылуу байланышуу керек.
page.orhunguide.s5.step3=Курстардын мазмунун алуу
page.orhunguide.s5.step3.text=Курстардын мазмунун кабыл алуучу университеттин сайтынан алуу керек. Бул маалымат сайтта жок болсо, аны өнөктөш окуу жайдан электрондук почта аркылуу суроо керек.
page.orhunguide.s5.step4=Окуу келишимин (Learning Agreement) даярдоо
page.orhunguide.s5.step4.text=Жаңыланган транскрипттин жана өнөктөш окуу жайдан алынган курстардын тизмесинин негизинде Окуу келишими (Learning Agreement) окуу жайдын Орхун боюнча кафедра координатору менен бирге даярдалышы керек.
page.orhunguide.s5.step5=Окуу/окутуу келишимине кол коюу процесси
page.orhunguide.s5.step5.text=Даярдалган Окуу/окутуу келишимине (Learning/Teaching Agreement) кафедра башчысы жана кафедра координатору кол коюшат; андан кийин акыркы кол тамга жана мөөр үчүн ал электрондук почта аркылуу Алмашуу программаларынын координация бөлүмүнө жөнөтүлөт.
page.orhunguide.s5.step6=Талап кылынган документтерди тапшыруу
page.orhunguide.s5.step6.text=Студенттин милдеттенме каты жана Учуу сурамынын формасы сыяктуу мобилдүүлүк үчүн талап кылынган документтер Kion системасына жүктөлөт.
page.orhunguide.s5.note3=Бул алты кадам мобилдүүлүккө тандалгандан кийин аткарыла турган жалпы процессти кыскача чагылдырат; ар бир мүчө окуу жайдын өзүнүн институционалдык системасына (мисалы, Kion) жараша анча-мынча айырмачылыктар болушу мүмкүн. Жаңыланган маалымат үчүн тиешелүү окуу жайдын Алмашуу программаларынын координация бөлүмүнө кайрылуу сунушталат.
page.orhun.guidelink=Өтүнмө берүү боюнча колдонмо

