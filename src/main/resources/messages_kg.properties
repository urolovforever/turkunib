page.about.intro.p1=Түрк мамлекеттеринин уюмуна (ТМУ) мүчө мамлекеттердин ортосундагы жогорку билим берүү тармагындагы кызматташтыкка институционалдык түзүм берүү максатында Түрк университеттер бирлигин (TURKUNIB) түзүү Уюм негизделгенден бери күн тартибиндеги артыкчылыктуу маселелердин бири болуп келген. Бирлик жалпы тарыхтын, маданияттын жана тилдик мурастын негизинде университеттер аралык кызматташтыкты бекемдөөнү, студенттердин жана академиялык кызматкерлердин мобилдүүлүгүн жогорулатууну жана жалпы түрк жогорку билим берүү мейкиндигин түзүүнү максат кылат.
page.about.intro.p2=Бүгүнкү күндө TURKUNIB ТМУнун мүчө же байкоочу мамлекеттери болгон Азербайжан, Казакстан, Кыргызстан, Түркия, Өзбекстан, Венгрия жана Түндүк Кипр Түрк Республикасында жайгашкан 170 университетти камтыган кеңири программага айланды.
page.about.intro.p3=Орхун студенттерди жана академиялык кызматкерлерди алмашуу программасы да TURKUNIB алкагында ишке ашырылат. TURKUNIBдин пайдубалын түзгөн Орхун алмашуу программасы – мүчө мамлекеттердин ортосунда студенттерди жана академиялык кызматкерлерди алмашууну караган биргелешкен жогорку билим берүү механизми. Анын пилоттук ишке ашырылышы 2017–2018-окуу жылында башталып, андан бери этап-этабы менен кеңейтилип келе жатат.
page.about.members=Биздин мүчөлөр
page.about.history=Биздин тарых
page.about.mission.title=Миссия
page.about.mission.text=Окутуу менен изилдөөдөгү мыктылыкты колдоо, мүчө университеттердин ортосунда академиялык мобилдүүлүктү жана кредиттерди которууну камсыздоо, ошондой эле Орхун алмашуу программасы сыяктуу биргелешкен программалар аркылуу маданий жана институционалдык байланыштарды бекемдөө менен түрк дүйнөсүндөгү жогорку билимди өнүктүрүү. TURKUNIB студенттерге, окутуучуларга жана мекемелерге жалпы академиялык жана коомдук максаттарга жетүү жолунда чек ара аша кызматташууга мүмкүндүк берген бирдиктүү жогорку билим берүү экосистемасын курууга умтулат.
page.about.vision.title=Көрөгөчтүк
page.about.vision.text=Студенттер менен окумуштуулар чек ара аша эркин кызматташкан – таасирдүү изилдөөлөрдү жүргүзгөн, инновацияны өнүктүргөн жана күчтүү, өз ара тыгыз байланышкан түрк дүйнөсүн калыптандыра турган окумуштуулардын, лидерлердин жана адистердин жаңы муунун тарбиялаган – жандуу, интеграцияланган түрк жогорку билим берүү мейкиндиги.
page.about.goals.title=Биздин максаттар
page.about.goals.subtitle=Биз студенттерге, окутуучуларга жана мекемелерге пайда алып келген практикалык кызматташтыкка басым жасайбыз.
page.about.goal.mobility.title=Академиялык мобилдүүлүк
page.about.goal.mobility.text=Студенттер менен кызматкерлердин алмашуу программалары; кредиттерди жана дипломдорду өз ара таануу.
page.about.goal.standards.title=Жалпы стандарттар
page.about.goal.standards.text=Кредиттерди которуунун жана сапатты камсыздоонун жалпы алкагын иштеп чыгуу.
page.about.goal.culture.title=Маданий интеграция
page.about.goal.culture.text=Жалпы тарыхты, маданиятты жана тилдерди даңазалаган программалар.
page.about.goal.faculty.title=Окутуучулардын өнүгүүсү
page.about.goal.faculty.text=Биргелешкен окутуу, семинарлар жана кызматташтык менен окутуу демилгелери.
page.about.goal.competitions.title=Сынактар жана симпозиумдар
page.about.goal.competitions.text=Мүчөлөрдүн арасында академиялык сынактар, симпозиумдар жана маданий иш-чаралар.
page.about.goal.scholarships.title=Стипендиялар
page.about.goal.scholarships.text=Түрк дүйнөсүнө багытталган студенттерди жана изилдөөчүлөрдү колдоо.
page.about.history.title=Биздин тарых
page.about.history.subtitle=Түрк университеттер бирлигин калыптандырган белгилүү окуялар.
page.about.history.item1=Билим берүү министрлеринин жыйынындагы алгачкы талкуулар кызматташтык үчүн негиз түптөдү.
page.about.history.item2=Түрк тилдүү мамлекеттердин кызматташтык кеңешинин экинчи саммитинде кабыл алынган чечимдер.
page.about.history.item3=Бирликтин мүчө университеттеринин арасында жогорку билим берүү мейкиндигин түзүү боюнча директива кабыл алынды.
