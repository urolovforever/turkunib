page.directive.art1.title=Максат
page.directive.art1.p1=(1) Бул Директиванын максаты – Түрк мамлекеттеринин уюмуна мүчө мамлекеттердин ортосундагы жогорку билим берүү жаатындагы кызматташтыкты өркүндөтүү аркылуу Түрк мамлекеттеринин уюмунун жогорку билим берүү мейкиндигин түзүү.
page.directive.art1.p2=(2) Бул Директива ошондой эле Түрк мамлекеттеринин уюмунун колдоосу астында түзүлгөн Түрк университеттер бирлигинин түзүмүн, иштөө принциптерин жана иш чөйрөсүн жөнгө салууну көздөйт.
page.directive.art2.title=Колдонуу чөйрөсү
page.directive.art2.p1=(1) Бул Директива Түрк мамлекеттеринин уюмунун Түрк университеттер бирлигине мүчө университеттердин ортосунда жогорку билим берүү жаатында жүргүзүлүүчү кызматташтыктын тартиптерин жана принциптерин камтыйт.
page.directive.art3.title=Негиз
page.directive.art3.intro=(1) Бул Директива төмөнкүлөрдө кабыл алынган чечимдердин негизинде даярдалган:
page.directive.art3.ref1=2012-жылдын 23-августунда Бишкекте өткөн Түрк мамлекеттеринин уюмунун Экинчи саммитинде;
page.directive.art3.ref2=2012-жылдын 10-августунда Чолпон-Атада өткөн Түрк мамлекеттеринин уюмунун билим берүү министрлеринин жыйынында;
page.directive.art3.ref3=2012-жылдын 28-29-мартында Стамбулда өткөн Түрк мамлекеттеринин уюмунун Түрк университеттер бирлигинин даярдоо жыйынында;
page.directive.art3.ref4=2014-жылдын 16-17-октябрында Эрзурумда өткөн Түрк университеттер бирлигинин Биринчи Башкы Ассамблеясында;
page.directive.art3.ref5=2014-жылдын 28-ноябрында Бакуда өткөн билим берүү министрлеринин үчүнчү жыйынында;
page.directive.art3.ref6=2015-жылдын 5-сентябрында Астанада өткөн билим берүү министрлеринин төртүнчү жыйынында;
page.directive.art3.ref7=2019-жылдын 15-мартында Бишкекте өткөн билим берүү министрлеринин бешинчи жыйынында;
page.directive.art3.ref8=2021-жылдын 4-ноябрында Стамбулда өткөн билим берүү министрлеринин алтынчы жыйынында;
page.directive.art3.ref9=2023-жылдын 14-июнунда Самаркандда өткөн билим берүү министрлеринин жетинчи жыйынында;
page.directive.art3.ref10=2022-жылдын 23-ноябрында Түркстанда өткөн Түрк мамлекеттеринин уюмунун Түрк университеттер бирлигинин Алтынчы Башкы Ассамблеясында.
page.directive.art4.title=Аныктамалар
page.directive.art4.intro=(1) Бул Директиванын максаттары үчүн:
page.directive.art4.def1=Түрк мамлекеттеринин уюму – Түрк тилдүү мамлекеттердин кызматташтык кеңешин билдирет;
page.directive.art4.def2=Түрк мамлекеттеринин уюмунун саммити – мүчө мамлекеттердин мамлекет башчыларынын жыл сайын өтүүчү жыйынын билдирет;
page.directive.art4.def3=Түрк мамлекеттеринин уюмунун билим берүү министрлеринин жыйыны – билим берүү министрлери чогулган жыйынды билдирет. Бирликке байланыштуу маселелер каралганда ага Түркиянын Жогорку билим берүү кеңешинин төрагасы да катышат;
page.directive.art4.def4=Катчылык – Түрк мамлекеттеринин уюмунун Катчылыгын билдирет;
page.directive.art4.def5=Түрк мамлекеттеринин уюмунун билим берүү министрлеринин жогорку кызмат адамдары – мүчө мамлекеттердин билим берүү министрликтери дайындаган улуттук эксперттерден турган топту билдирет;
page.directive.art4.def6=Бирлик – Түрк мамлекеттеринин уюмунун колдоосу астында түзүлгөн Түрк университеттер бирлигин билдирет;
page.directive.art4.def7=Бирликтин Башкы Ассамблеясы – мүчө университеттердин ректорлорунун же алардын өкүлдөрүнүн, ошондой эле Түрк мамлекеттеринин уюмунун Башкы катчысынын же анын өкүлүнүн катышуусунда түзүлгөн комитетти билдирет;
page.directive.art4.def8=TCHEA – Түрк мамлекеттеринин уюмунун жогорку билим берүү мейкиндигин билдирет.
page.directive.art5.title=Уюштуруучу мүчөлөр
page.directive.art5.p1=(1) Бирликтин уюштуруучу мүчөлөрү – төрт мүчө мамлекеттен төмөнкү 15 университет.
page.directive.art5.country=Өлкө
page.directive.art5.university=Университет
page.directive.art5.memberslink=Бирликтин учурдагы мүчө университеттерин көрүү
page.directive.country.az=Азербайжан
page.directive.country.kz=Казакстан
page.directive.country.kg=Кыргызстан
page.directive.country.tr=Түркия
page.directive.art6.title=Уюштуруу түзүмү
page.directive.art6.p1=(1) Бирлик Түрк мамлекеттеринин уюмуна мүчө жана байкоочу мамлекеттердин жана тектеш коомдоштуктардын университеттеринен турат.
page.directive.art6.chairmanship=Бирликтин төрагалыгы
page.directive.art6.p2=(2) Бирликтин төрагасы – Түрк мамлекеттеринин уюмунун Башкы катчысы.
page.directive.art6.p3=(3) Кезектеги төрагалык Башкы Ассамблеянын жыйынында мүчө университеттердин арасынан ыктыярдуу негизде же башка катышуучулардын сунушу менен эки жылдык мөөнөткө жөнөкөй көпчүлүк добуш менен шайланат.
page.directive.art6.p4=(4) Бирликтин төрагасы өз милдеттерин академиялык иштерге жооптуу кезектеги төрагалык кылуучу университеттин ректору менен координацияда аткарат.
page.directive.art6.p5=(5) Кезектеги төрагалык кылуучу университеттин милдеттери:
page.directive.art6.duty1=Бирликтин Башкы Ассамблеясынын жыйынын өткөрүү жана Башкы Ассамблеяда кабыл алынган чечимдерди ишке ашыруу;
page.directive.art6.duty2=төрагалык мезгилинде Катчылык менен координацияда Бирликтин мүчөлөрүнүн ортосунда зарыл кызматташтыкты жана байланышты камсыздоо.
page.directive.art6.p6=(6) Кезектеги төрагалык кылуучу университеттин ректору өз милдеттерине байланыштуу Түрк мамлекеттеринин уюмунун билим берүү министрлеринин жыйынына жана/же Түрк мамлекеттеринин уюмунун саммитине чакырылышы мүмкүн.
page.directive.art6.assembly=Башкы Ассамблея
page.directive.art6.p7=(7) Түрк университеттер бирлигинин Башкы Ассамблеясы мүчө өлкөлөрдүн университеттеринин өкүлдөрүнөн турат. Мүчө университеттин өкүлдөрү – ректор, тиешелүү проректор жана эл аралыкташтыруу бөлүмүнөн бир өкүл.
page.directive.art6.board=Директорлор кеңеши
page.directive.art6.secretariat=Катчылык
page.directive.art6.subcommittees=Кичи комитеттер
page.directive.art6.subcommittees.intro=Башкы Ассамблея аныктаган артыкчылыктуу иш-чараларды аткаруу үчүн жети аткаруучу комитет түзүлгөн:
page.directive.art6.committee1=Түрк дүйнөсүнүн жогорку билим берүү маалымат банкы
page.directive.art6.committee2=Билим берүү-окутуу комитети
page.directive.art6.committee3=Илимий комитет
page.directive.art6.committee4=Түрк дүйнөсүнүн билим берүү порталы
page.directive.art6.committee5=Жогорку билим берүү сапатын камсыздоо кеңеши
page.directive.art6.committee6=Спорт-маданият комитети
page.directive.art6.committee7=Студенттик кеңеш
page.directive.art6.contactgroup=Байланыш тобу
page.directive.art6.p8=(8) Байланыш тобуна катышуу үчүн Түрк мамлекеттеринин уюму Башкы катчынын орун басарын, ал эми мүчө университеттер проректорду жана Бирликтин иш-чараларына жооптуу өкүлдү дайындайт.
page.directive.art6.p9=(9) Байланыш тобунун милдети – Бирликтин чечимдеринин аткарылышын координациялоо.
page.directive.art6.p10=(10) Байланыш тобу жылына кеминде эки жолу чогулат.
page.directive.art6.studentcouncil=Студенттик кеңеш
page.directive.art6.p11=(11) Бирликтин Студенттик кеңеши Бирликтин мүчө университеттеринен шайланган студенттерден турат.
page.directive.art6.p12=(12) Студенттик кеңешти түзүү, анын милдеттери менен жоопкерчиликтери жана башка маселелер боюнча Бирлик тарабынан Директива даярдалат.
page.directive.art7.title=Бирликтин максаттары
page.directive.art7.intro=Жалпы тарыхка, маданиятка жана тилге таянуу менен, түрк тилдүү элдердин ортосунда достукту жана кызматташтыкты өнүктүрүү жана мүчө мамлекеттердин жогорку окуу жайларынын ортосундагы кызматташтыкты камсыздоо үчүн билим берүү деңгээлин жогорулатуу максатында төмөнкү милдеттер ишке ашырылууга тийиш:
page.directive.art7.obj1=бардык мүчө университеттерде заманбап илимий деңгээлге ылайык билим берүү стандарттарын колдонуу аркылуу жалпы цивилизация курстарын окутуу жана ушуну менен жалпы иденттүүлүккө жана маданий аң-сезимге ээ муундарды тарбиялоо;
page.directive.art7.obj2=жогорку билим берүү программаларын эл аралык аккредитация стандарттарына ылайык шайкештирүү;
page.directive.art7.obj3=академиялык кызматкерлер үчүн квалификацияны жогорулатуу программаларын түзүү жана ишке ашыруу;
page.directive.art7.obj4=студенттерди жана академиялык кызматкерлерди алмашууну колдоо жана буга байланыштуу зарыл жөнгө салууларды жүргүзүү;
page.directive.art7.obj5=жалпы кредит которуу системасын түзүү;
page.directive.art7.obj6=мүчө университеттердин ортосунда жогорку билим берүү программаларынын таанылышын камсыздоо жана мүчө университеттердин документтеринин эквиваленттүүлүгүн өз ара таануу үчүн тиешелүү негиз түзүү;
page.directive.art7.obj7=айрым тармактарда университеттердин салыштырмалуу артыкчылыктарынан пайдалануу;
page.directive.art7.obj8=колдонууга мүмкүн болгон биргелешкен билим берүү жана изилдөө долбоорлорун жана программаларын ишке ашыруу, ошондой эле бул тармакта басылмаларды чыгаруу;
page.directive.art7.obj9=социалдык жана маданий тармактарда кызматташуу;
page.directive.art7.obj10=түрк дүйнөсү боюнча изилдөө жүргүзгөн студенттерге атайын стипендияларды берүү;
page.directive.art7.obj11=түрк дүйнөсүнө байланыштуу академиялык изилдөөлөр жана долбоорлор жөнүндө маалымат алмашууну электрондук түрдө камсыздоо жана университеттер жүргүзгөн тиешелүү изилдөөлөрдүн даректерин Түрк мамлекеттеринин уюмунун сайтында шилтеме берүү үчүн Катчылыктын сайтына жөнөтүү;
page.directive.art7.obj12=Бирликтин мүчө университеттеринин тышкы баалоо жана аккредитация процесстеринин сапатын камсыздоого кызмат кылуучу көз карандысыз «Жогорку билим берүү сапатын камсыздоо кеңешин» түзүү жана анын ишине колдоо көрсөтүү;
page.directive.art7.obj13=Түрк мамлекеттеринин уюмунун мүчөлөрү үчүн жогорку билим берүү маалымат банкын түзүү;
page.directive.art7.obj14=Түрк дүйнөсү индексин жана тармактык индекстерди түзүү;
page.directive.art7.obj15=Түрк дүйнөсүнүн билим берүү порталын түзүү;
page.directive.art7.obj16=Түрк жогорку билим берүү мейкиндигин түзүү.
page.directive.art8.title=Иштөө принциптери
page.directive.art8.p1=(1) Бирликтин чечимдери Бирликтин мүчө университеттеринин ректорлору же ректордун өкүлдөрү жана Түрк мамлекеттеринин уюмунун Башкы катчысы же анын өкүлдөрү катышкан Башкы Ассамблеянын жыйынында жөнөкөй көпчүлүк добуш менен кабыл алынат.
page.directive.art8.p2=(2) Бирликтин катчылык иштери Түрк мамлекеттеринин уюмунун Катчылыгы тарабынан кезектеги төрагалык кылуучу университет менен кызматташтыкта жүргүзүлөт.
page.directive.art8.p3=(3) Бирликтин институционалдык түзүмү, иштөө тартиптери жана принциптери, ошондой эле каржы маселелериндеги практикасы Бирликтин мүчө университеттери жөнөкөй көпчүлүк добуш менен кабыл алган чечимдин негизинде даярдалуучу директиваларга ылайык аныкталат.
page.directive.art8.p4=(4) Ишке ашыруу үчүн кабыл алынган чечимдер жана Бирлик даярдаган директивалар Түркиянын Жогорку билим берүү кеңешинин төрагасы да катышкан Түрк кеңешинин билим берүү министрлеринин жыйынында бекитилгенден кийин күчүнө кирет.
page.directive.art8.p5=(5) Бирликтин иши Жогорку билим берүү кеңешинин төрагалыгынын өкүлүн камтыган Түрк мамлекеттеринин уюмунун билим берүү министрлеринин жогорку кызмат адамдары тарабынан көзөмөлдөнөт. Аталган топтун максаты:
page.directive.art8.wp1=процесстин алкагында ишке ашырылуусу пландалган долбоорлорго мониторинг жүргүзүү;
page.directive.art8.wp2=мүчө мамлекеттердин ортосунда зарыл координацияны камсыздоо;
page.directive.art8.wp3=процессте келип чыгышы мүмкүн болгон көйгөйлөрдү чечүү иштерин жүргүзүү;
page.directive.art8.wp4=процесстин тараптарынын ортосунда кабыл алынуу жана колдонулуу деңгээлин жогорулатуу боюнча иш-чараларды жүргүзүү;
page.directive.art8.wp5=улуттук деңгээлде туш болгон көйгөйлөрдү чечүү үчүн зарыл болгон улуттук мыйзамдык өзгөртүүлөрдү изилдөө жана тиешелүү органдарга сунуштарды берүү аркылуу колдоо көрсөтүү.
page.directive.art9.title=Бирликтин каржы булактары
page.directive.art9.intro=(1) Бирлик тарабынан жүргүзүлүүчү жогорку билим берүү иш-чараларынын бардык чыгымдары төмөндө көрсөтүлгөн булактардан каржыланат:
page.directive.art9.fin1=мүчө университеттердин каржы ресурстары;
page.directive.art9.fin2=түзүлө турган «Түрк илимий изилдөө фонду» бөлгөн ресурстар, ошондой эле улуттук же эл аралык мекемелердин ресурстары;
page.directive.art9.fin3=мүчө мамлекеттердин университеттеринен долбоордук негизде берилүүчү кошумча ресурстар;
page.directive.art9.fin4=Түрк мамлекеттеринин уюмунун мүчөлөрүнүн бюджеттеринен бөлүнгөн ресурстар.
page.directive.art10.title=Бирликке мүчөлүк
page.directive.art10.p1=(1) Талапкерлик өтүнмөлөрү жазуу жүзүндөгү жүйөлөрү менен Түрк кеңешинин Катчылыгына берилет. Мүчөлүккө кабыл алуу жана мүчөлүктү токтотуу маселелери, байланыш тобу аркылуу мүчө университеттердин пикирлери алынгандан кийин, Бирлик мүчөлөрүнүн кеминде үчтөн экиси катышкан Башкы Ассамблеянын жыйынында жөнөкөй көпчүлүк добуш менен чечилет.
page.directive.art10.membershiplink=Мүчөлүк тартиби жөнүндө көбүрөөк билүү
page.directive.art11.title=Түрк дүйнөсүнүн жогорку билим берүү мейкиндиги
page.directive.art11.p1=(1) TCHEA – мүчө мамлекеттердин ортосунда түзүлгөн жана жогорку билимге байланыштуу билим берүү иш-чаралары жүргүзүлүүчү мейкиндик.
page.directive.art11.p2=(2) TCHEA мүчө мамлекеттер түзө турган жалпы платформалар аркылуу 7-беренеде көрсөтүлгөн максаттарга жетүүнү көздөйт.
page.directive.art12.title=Ишке ашыруу процесстери
page.directive.art12.p1=(1) Түрк дүйнөсүнүн жогорку билим берүү мейкиндигинин алкагында Бирликтин мүчө мамлекеттери кызматташтык багыттары боюнча төмөнкү пункттарды шайкештириши зарыл:
page.directive.art12.item1=студенттерди жана академиялык кызматкерлерди алмашуу программалары;
page.directive.art12.item2=формалдык, аралыктан же ачык билим берүү аркылуу ишке ашырылуучу ассоциат, бакалавриат жана жогорку окуу жайдан кийинки даражалардагы биргелешкен сертификаттык программаларды ачууга байланыштуу өз өлкөлөрүндө колдонуудагы мыйзамдар.
page.directive.art12.p2=(2) Жүргүзүлө турган кызматташтыктын алкагында төмөнкү пункттар Түркиянын Жогорку билим берүү кеңешинин төрагалыгынын өкүлүн камтыган Түрк мамлекеттеринин уюмунун билим берүү министрлеринин жогорку кызмат адамдары тарабынан колдоого алынат:
page.directive.art12.sup1=Бирликтин мүчө университеттери жана башка расмий илимий мекемелер берген документтердин эквиваленттүүлүгүн камсыздоо;
page.directive.art12.sup2=Түрк дүйнөсүнүн жогорку билим берүү мейкиндигин түзүү жана жайылтуу куралдарын колдонуу жана илгерилетүү Түркиянын Жогорку билим берүү кеңешинин төрагалыгынын өкүлүнүн, ошондой эле түрк билим берүү министрлеринин жогорку кызмат адамдарынын колдоосу аркылуу кубатталат.
page.directive.art13.title=Студенттердин жана академиялык кызматкерлердин мобилдүүлүгү
page.directive.art13.p1=(1) Мүчө университеттерде учурда иштеп жаткан жана/же ачыла турган жайкы жана кышкы мектептерге башка мүчө университеттердин студенттери кабыл алынат. Бул программаларда студенттерге түзүлүүчү шарттар өз ара негизде аныкталат.
page.directive.art13.p2=(2) Студенттерди жана академиялык кызматкерлерди алмашуу үчүн Орхун программасы үлгү катары колдонулат.
page.directive.art13.p3=(3) Студенттердин мурунку билимин таануу, студенттерди кабыл алуу, окуу келишими жана транскрипт даярдоо мүчө университеттер аныктай турган жалпы кредиттик системага ылайык уюштурулат.
page.directive.art13.orhunlink=Орхун алмашуу программасы жөнүндө көбүрөөк билүү
page.directive.art14.title=Жоболордо каралбаган маселелер
page.directive.art14.p1=Бул Директиваны ишке ашырууда келип чыгышы мүмкүн болгон көйгөйлөрдү чечүү үчүн өзгөртүүлөр Башкы Ассамблея тарабынан кошумча документ менен кабыл алынышы мүмкүн.
page.directive.art15.title=Директиванын тилдери
page.directive.art15.p1=Бул Директива азербайжан, казак, кыргыз, түрк жана англис тилдеринде даярдалган.
page.directive.art16.title=Күчүнө кириши
page.directive.art16.p1=Бул Директиванын жоболору Бирликтин Башкы Ассамблеясында жактырылгандан кийин Түрк мамлекеттеринин уюмунун билим берүү министрлеринин жыйынында бекитилген күндөн тартып күчүнө кирет.
page.directive.art17.title=Аткаруу
page.directive.art17.p1=Бул Директиванын жоболору Катчылык тарабынан кезектеги төрагалык кылуучу университет менен кызматташтыкта аткарылат.
page.directive.art17.p2=Бул процесс Орхун программасы деп аталган.

# Orhun Application Guide page
page.orhunguide.title=Орхун алмашуу программасы — Өтүнмө берүү боюнча колдонмо
page.orhunguide.intro=Студенттер жана академиялык кызматкерлер үчүн практикалык колдонмо: талаптар, өтүнмө берүү процесси, талап кылынган документтер жана мобилдүүлүккө тандалгандан кийин аткарыла турган кадамдар.
