# About the program
main.about.program=TURKUNIB жөнүндө
main.about.program.tagline=Түрк университеттерин күчтүү келечек үчүн бириктирүү
main.about.program.p1=TURKUNIB (Түрк университеттер бирлиги) – түрк дүйнөсүндөгү университеттердин ортосундагы академиялык байланыштарды бекемдөөгө жана кызматташтыкты өнүктүрүүгө багытталган динамикалуу демилге. Азербайжан, Казакстан, Кыргызстан, Түркия, Өзбекстан, Венгрия жана Түндүк Кипр Түрк Республикасындагы 170 университетти бириктирип, TURKUNIB жалпы тарыхка, маданиятка жана тилге негизделген бирдиктүү жогорку билим берүү мейкиндигин түзөт.
main.about.program.p2=Бирдиктүү платформа түзүү аркылуу программа студенттик мобилдүүлүктү, окутуучулар алмашуусун жана аймактык жана глобалдык жалпы көйгөйлөрдү чечүүгө багытталган биргелешкен изилдөө долбоорлорун колдойт. Өз тармагы – анын ичинде Орхун студенттерди жана академиялык кызматкерлерди алмашуу программасы – аркылуу TURKUNIB билим берүү мүмкүнчүлүктөрүн кеңейтип, маданий түшүнүшүүнү, билим алмашууну жана инновацияны өнүктүрөт.
main.about.program.p3=TURKUNIB өз өлкөлөрүнүн туруктуу өнүгүүсүнө салым кошуп, түрк элдеринин биримдик сезимин чыңдай турган жаңы муун окумуштууларды, лидерлерди жана адистерди даярдоого умтулат.
main.about.program.p4=Түпкүлүгүндө TURKUNIB – бул жөн гана академиялык өнөктөштүк эмес, ал адамдарды, идеяларды жана институттарды бириктирген көпүрө болуп, күчтүү жана өз ара тыгыз байланышкан келечектин пайдубалын түптөйт.
main.about.program.overview=Программанын жалпы мүнөздөмөсү

