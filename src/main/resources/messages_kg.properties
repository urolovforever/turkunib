# --- membership page ---
page.membership.title=Түрк университеттер бирлигине (TURKUNIB) мүчөлүк
page.membership.intro=TURKUNIBге кантип мүчө болуу керек: мүчөлүк критерийлери, өтүнмө берүү тартиби жана өтүнмө топтомун даярдоо боюнча көрсөтмөлөр.
page.membership.criteria.title=Мүчөлүк критерийлери
page.membership.criteria.intro=TURKUNIB мүчөлүгүнө талапкер университет төмөнкү шарттарга жооп бериши күтүлөт:
page.membership.criteria.item1=TURKUNIBдин максаттарына жана милдеттерине шайкеш иш-чараларды уюштурган болушу,
page.membership.criteria.item2=Түрк дүйнөсүнө байланыштуу илимий изилдөөлөрдү же илимий иштерди жүргүзгөн болушу,
page.membership.criteria.item3=Түрк мамлекеттеринин уюмуна (ТМУ) мүчө мамлекеттердин университеттери менен конкреттүү жана өлчөнө турган кызматташтыктарды түзгөн болушу (биргелешкен долбоорлор, студенттерди/кызматкерлерди алмашуу, биргелешкен изилдөөлөр ж.б.),
page.membership.criteria.item4=Алмашуу программалары боюнча тажрыйбага жана Орхун алмашуу программасына салым кошуу үчүн институционалдык дараметке ээ болушу,
page.membership.criteria.item5=Эл аралык рейтинг агенттиктеринин маалыматы боюнча өз өлкөсүндөгү университеттердин алдыңкы 20%ынын катарына кириши.
page.membership.procedure.title=Өтүнмө берүү тартиби
page.membership.procedure.intro=Мүчөлүк өтүнмөлөрү төмөнкү этаптардан өтөт:
page.membership.procedure.item1=Талапкер университеттер өтүнмөлөрүн иш алып барган өлкөсүнүн дипломатиялык каналдары аркылуу түздөн-түз ТМУ Катчылыгына тапшырышат.
page.membership.procedure.item2=Өтүнмөлөр келип түшкөндөн кийин ТМУ Катчылыгы аларды баалоо үчүн Бирликтин Төрагасы менен макулдашуу боюнча дайындалган, мүчө университеттердин өкүлдөрүнөн турган 5 кишилик комиссия түзөт.
page.membership.procedure.item3=Комиссия ар бир өтүнмөнү мүчөлүк критерийлерине ылайык баалап, жыйынтыктарын ТМУ Катчылыгына билдирет.
page.membership.procedure.item4=ТМУ Катчылыгы комиссиянын сунушун акыркы чечим кабыл алуу үчүн TURKUNIB Башкы Ассамблеясына жөнөтөт.
page.membership.procedure.item5=Бирликке мүчөлүк маселеси Бирлик мүчөлөрүнүн кеминде үчтөн экиси катышкан Башкы Ассамблеянын жыйынында жөнөкөй көпчүлүк добуш менен чечилет.
page.membership.procedure.item6=ТМУга мүчө мамлекеттердин биринде иш алып барбаган, бирок Бирликке кошулууну каалаган университеттерге жогорудагы тартиптерди жана критерийлерди аткарган шартта Байкоочу статусу берилиши мүмкүн.
page.membership.procedure.item7=Жүйөлүү себепсиз Башкы Ассамблеянын катары менен үч жыйынына катышпаган мүчө университеттин Бирликтеги мүчөлүгү токтотулат.
page.membership.guidance.title=Өтүнмө топтому жана Ректордун каты боюнча көрсөтмөлөр
page.membership.guidance.item1=Мүчөлүк өтүнмөлөрү негизделген болушу күтүлөт. Өтүнмө топтомуна Ректор кол койгон, өтүнмөнүн жүйөсүн жана университеттин TURKUNIBге кошулуу ниетин так баяндаган Ректордун катын (коштомо кат) кошуу сунушталат.
page.membership.guidance.item2=Ректордун катына университеттин мүчөлүк критерийлерине жооп берерин далилдеген толук өтүнмө топтому тиркелиши керек; тастыктоочу документтерге тиешелүү иш-чаралардын далилдери, өнөктөштүк келишимдери, алмашуу программаларынын жазуулары, институционалдык дарамет тууралуу билдирүүлөр жана биргелешкен долбоорлордун мисалдары кириши мүмкүн.
page.membership.guidance.item3=Өтүнмө каты жана ага тиркелген документтер ТМУ Катчылыгынын дарегине жөнөтүлүшү керек. Тапшырылган топтом ТМУ Катчылыгы тарабынан алдын ала каралат. Ылайыктуу деп табылса, өтүнмө TURKUNIB Башкы Ассамблеясынын күн тартибине киргизилип, акыркы чечим добуш берүү менен кабыл алынат. Бекитилген мүчөлүктөр ТМУ Катчылыгы даярдаган отчет аркылуу мүчө мамлекеттерге билдирилип, өтүнмө процесси аяктайт.
