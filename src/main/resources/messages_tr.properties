# --- membership page ---
page.membership.title=Türk Üniversiteler Birliği'ne (TURKUNIB) Üyelik
page.membership.intro=TURKUNIB'e nasıl üye olunur: üyelik kriterleri, başvuru prosedürü ve başvuru dosyasının hazırlanmasına ilişkin rehberlik.
page.membership.criteria.title=Üyelik Kriterleri
page.membership.criteria.intro=TURKUNIB üyeliğine başvuran bir üniversitenin aşağıdaki koşulları karşılaması beklenir:
page.membership.criteria.item1=TURKUNIB'in amaç ve hedefleriyle uyumlu faaliyetler düzenlemiş olmak,
page.membership.criteria.item2=Türk dünyasına ilişkin bilimsel araştırmalar veya akademik çalışmalar yürütmüş olmak,
page.membership.criteria.item3=TDT Üye Devletlerindeki üniversitelerle somut ve ölçülebilir iş birlikleri kurmuş olmak (ortak projeler, öğrenci/personel değişimi, ortak araştırmalar vb.),
page.membership.criteria.item4=Değişim programları konusunda deneyime ve Orhun Değişim Programı'na katkı sağlayacak kurumsal kapasiteye sahip olmak,
page.membership.criteria.item5=Uluslararası sıralama kuruluşlarına göre, faaliyet gösterdiği ülkedeki üniversitelerin ilk %20'lik dilimi içinde yer almak.
page.membership.procedure.title=Başvuru Prosedürü
page.membership.procedure.intro=Üyelik başvuruları aşağıdaki aşamaları izler:
page.membership.procedure.item1=Aday üniversiteler, başvurularını faaliyet gösterdikleri ülkenin diplomatik kanalları aracılığıyla doğrudan TDT Sekretaryasına iletir.
page.membership.procedure.item2=Başvurunun alınmasının ardından TDT Sekretaryası, başvuruları değerlendirmek üzere Birlik Başkanı ile istişare içinde atanan, Üye Üniversitelerden 5 kişiden oluşan bir komisyon kurar.
page.membership.procedure.item3=Komisyon, her başvuruyu üyelik kriterleri çerçevesinde değerlendirir ve bulgularını TDT Sekretaryasına bildirir.
page.membership.procedure.item4=TDT Sekretaryası, komisyonun önerisini nihai karar için TURKUNIB Genel Kuruluna iletir.
page.membership.procedure.item5=Birlik üyeliğine, Birlik üyelerinin en az üçte ikisinin katıldığı Genel Kurul toplantısında salt çoğunlukla karar verilir.
page.membership.procedure.item6=TDT Üye Devletlerinden birinde faaliyet göstermeyen ancak Birliğe katılmak isteyen üniversitelere, yukarıdaki prosedürleri ve kriterleri yerine getirmeleri koşuluyla Gözlemci statüsü verilebilir.
page.membership.procedure.item7=Geçerli bir mazereti olmaksızın üst üste üç Genel Kurul toplantısına katılmayan Üye Üniversitenin Birlik üyeliği sona erdirilir.
page.membership.guidance.title=Başvuru Dosyası ve Rektör Mektubu İçin Rehberlik
page.membership.guidance.item1=Üyelik başvurularının gerekçelendirilmesi beklenir. Başvuru dosyasında, başvurunun gerekçesini ve üniversitenin TURKUNIB'e katılma niyetini açıkça ortaya koyan, Rektör tarafından imzalanmış bir Rektör Mektubu'nun (ön yazı) yer alması tavsiye edilir.
page.membership.guidance.item2=Rektör Mektubu'na, üniversitenin üyelik kriterlerini karşıladığını gösteren kapsamlı bir başvuru dosyası eşlik etmelidir; destekleyici belgeler arasında ilgili faaliyetlere ilişkin kanıtlar, ortaklık anlaşmaları, değişim programı kayıtları, kurumsal kapasite beyanları ve ortak proje örnekleri yer alabilir.
page.membership.guidance.item3=Başvuru mektubu ve ekindeki belgeler TDT Sekretaryasına hitaben hazırlanmalıdır. Sunulan dosya, TDT Sekretaryası tarafından ön incelemeden geçirilir. Uygun görülmesi halinde başvuru, TURKUNIB Genel Kurulu gündemine alınır ve nihai karar oylama ile verilir. Onaylanan üyelikler, TDT Sekretaryası tarafından hazırlanan bir raporla Üye Devletlere bildirilir ve başvuru süreci tamamlanır.
footer.about.membership=Üyelik

