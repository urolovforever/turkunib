# --- single pages (about/contacts/cookies/orhun/council/terms) ---
page.about.intro.p1=Türk Devletleri Teşkilatı (TDT) üye devletleri arasında yükseköğretim alanındaki iş birliğine kurumsal bir yapı kazandırmak amacıyla Türk Üniversiteler Birliği'nin (TURKUNIB) kurulması, Teşkilatın kuruluşundan bu yana öncelikli gündem maddelerinden biri olmuştur. Birlik; ortak tarih, kültür ve dil mirası temelinde üniversiteler arası iş birliğini güçlendirmeyi, öğrenci ve akademik personel hareketliliğini artırmayı ve ortak bir Türk yükseköğretim alanı oluşturmayı amaçlamaktadır.
page.about.intro.p2=Bugün TURKUNIB, TDT'nin üye veya gözlemci devletleri olan Azerbaycan, Kazakistan, Kırgızistan, Türkiye, Özbekistan, Macaristan ve Kuzey Kıbrıs Türk Cumhuriyeti'nde bulunan 170 üniversiteyi kapsayan geniş çaplı bir programa dönüşmüştür.
page.about.intro.p3=Orhun Öğrenci ve Akademik Personel Değişim Programı da TURKUNIB çatısı altında yürütülmektedir. TURKUNIB'in temelini oluşturan Orhun Değişim Programı, üye devletler arasında öğrenci ve akademik personel değişimini öngören ortak bir yükseköğretim mekanizmasıdır. Pilot uygulaması 2017–2018 akademik yılında başlatılmış ve o tarihten bu yana aşamalı olarak genişletilmiştir.
page.about.members=Üyelerimiz
page.about.history=Tarihçemiz
page.about.mission.title=Misyon
page.about.mission.text=Öğretim ve araştırmada mükemmelliği teşvik ederek, üye üniversiteler arasında akademik hareketliliği ve kredi transferini mümkün kılarak ve Orhun Değişim Programı gibi ortak programlar aracılığıyla kültürel ve kurumsal bağları güçlendirerek Türk dünyasında yükseköğretimi ileriye taşımak. TURKUNIB; öğrencilerin, öğretim üyelerinin ve kurumların ortak akademik ve toplumsal hedefler doğrultusunda sınırların ötesinde iş birliği yapmasını sağlayan bütünleşik bir yükseköğretim ekosistemi kurmaya kararlıdır.
page.about.vision.title=Vizyon
page.about.vision.text=Öğrencilerin ve akademisyenlerin sınırların ötesinde kesintisiz iş birliği yaptığı; etkili araştırmalara öncülük eden, yenilikçiliği besleyen ve daha güçlü, birbirine daha bağlı bir Türk dünyasını şekillendirecek yeni nesil akademisyenleri, liderleri ve profesyonelleri yetiştiren canlı ve bütünleşik bir Türk yükseköğretim alanı.
page.about.goals.title=Hedeflerimiz
page.about.goals.subtitle=Öğrencilere, öğretim üyelerine ve kurumlara fayda sağlayan pratik iş birliğine odaklanıyoruz.
