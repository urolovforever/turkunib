page.terms.title=Şartlar ve Koşullar
page.terms.lastupdated=Son güncelleme:
page.terms.intro=turkunib.org sitesine (“Site”) hoş geldiniz. Bu Şartlar ve Koşullar (“Şartlar”, “Sözleşme”), Site'ye erişiminizi ve kullanımınızı düzenler. Site'ye erişerek veya Site'yi kullanarak bu Şartlara bağlı kalmayı kabul etmiş olursunuz. Bu Şartları kabul etmiyorsanız, lütfen Site'yi kullanmayın.
page.terms.s1.title=1. Tanımlar
page.terms.s1.text=“Biz”, “bizim” ve “bize” ifadeleri Site'nin işletmecisini ifade eder. “Siz” veya “Kullanıcı”, Site'ye erişen herhangi bir ziyaretçiyi, kullanıcıyı veya başka bir kişiyi ifade eder.
page.terms.s2.title=2. Şartların Kabulü
page.terms.s2.text=Site'yi kullanmanız bu Şartlara ve tüm geçerli yasa ve düzenlemelere tabidir. Site'yi bir kuruluş adına kullanıyorsanız, bu Şartları onun adına kabul etmeye yetkili olduğunuzu beyan edersiniz.
page.terms.s3.title=3. İzin Verilen Kullanım
page.terms.s3.item1=Site'yi yalnızca yasal amaçlarla ve başkalarının haklarını ihlal etmeyecek şekilde kullanın.
page.terms.s3.item2=Site'ye, sunucularına veya ilgili herhangi bir sisteme yetkisiz erişim sağlamaya çalışmayın.
page.terms.s3.item3=Kötü amaçlı yazılım, zararlı kod eklemeyin veya Site'yi aksatan ya da bozan faaliyetlerde bulunmayın.
page.terms.s4.title=4. Hesaplar ve Güvenlik
page.terms.s4.text=Site bir hesap oluşturma imkanı sunuyorsa, kimlik bilgilerinizi korumaktan ve hesabınız altında gerçekleşen tüm faaliyetlerden siz sorumlusunuz. Bu Şartları veya geçerli yasaları ihlal eden hesapları askıya alma veya sonlandırma hakkını saklı tutarız.
page.terms.s5.title=5. Fikri Mülkiyet
page.terms.s5.text=Metin, grafikler, logolar, simgeler, görseller ve tasarım öğeleri dahil olmak üzere Site'deki tüm içerik bize veya lisans verenlerimize aittir ve geçerli telif hakkı ile diğer fikri mülkiyet yasalarıyla korunmaktadır. Önceden yazılı iznimiz olmadan herhangi bir içeriği kopyalayamaz, çoğaltamaz, değiştiremez, dağıtamaz veya kamuya açık olarak gösteremezsiniz.
page.terms.s6.title=6. İçerik ve Doğruluk
page.terms.s6.text=Site'deki bilgilerin doğru ve güncel olmasını sağlamak için makul çaba gösteririz; ancak içeriğin hatasız veya eksiksiz olduğunu garanti etmeyiz. Bilgileri önceden bildirimde bulunmaksızın herhangi bir zamanda güncelleyebilir veya düzeltebiliriz.
page.terms.s7.title=7. Üçüncü Taraf Bağlantıları
page.terms.s7.text=Site, bizim sahip olmadığımız veya kontrol etmediğimiz üçüncü taraf web sitelerine veya hizmetlerine bağlantılar içerebilir. Herhangi bir üçüncü taraf web sitesinin içeriğinden, gizlilik politikalarından veya uygulamalarından sorumlu değiliz.
page.terms.s8.title=8. Yasaklı Faaliyetler
page.terms.s8.item1=Site'yi devre dışı bırakabilecek, aşırı yükleyebilecek veya bozabilecek herhangi bir şekilde kullanmak.
page.terms.s8.item2=Onayımız olmadan veri madenciliği, kazıma veya benzeri veri toplama yöntemleri.
page.terms.s8.item3=Herhangi bir kişi veya kuruluşu taklit etmek ya da bağlantınızı yanlış beyan etmek.
page.terms.s9.title=9. Sorumluluk Reddi
page.terms.s9.text=Site ve içeriği, ticari elverişlilik, belirli bir amaca uygunluk ve ihlal etmeme konusundaki zımni garantiler dahil ancak bunlarla sınırlı olmamak üzere, açık veya zımni hiçbir garanti olmaksızın “olduğu gibi” ve “mevcut olduğu şekliyle” sunulmaktadır.
page.terms.s10.title=10. Sorumluluğun Sınırlandırılması
page.terms.s10.text=Yasaların izin verdiği azami ölçüde, (a) Site'yi kullanmanızdan veya kullanamamanızdan; (b) sunucularımıza herhangi bir yetkisiz erişim veya kullanımdan; ya da (c) Site'den elde edilen herhangi bir içerikten kaynaklanan, doğrudan veya dolaylı olarak ortaya çıkan herhangi bir dolaylı, arızi, özel, sonuç olarak ortaya çıkan veya cezai zarardan, herhangi bir kar veya gelir kaybından ya da herhangi bir veri, kullanım, itibar veya diğer maddi olmayan kayıplardan sorumlu olmayacağız.
page.terms.s11.title=11. Tazminat
page.terms.s11.text=Site'yi kullanmanızdan veya bu Şartları ihlal etmenizden kaynaklanan ya da herhangi bir şekilde bunlarla bağlantılı tüm taleplere, yükümlülüklere, zararlara, kayıplara ve masraflara karşı bizi ve iştiraklerimizi, yetkililerimizi, çalışanlarımızı ve temsilcilerimizi savunmayı, tazmin etmeyi ve zarardan korumayı kabul edersiniz.
page.terms.s12.title=12. Geçerli Hukuk ve Yargı Yetkisi
page.terms.s12.text=Bu Şartlar, kanunlar ihtilafı hükümleri dikkate alınmaksızın, ana iş yerimizin bulunduğu yargı bölgesinde geçerli olan yasalara göre yönetilir ve yorumlanır. Her türlü uyuşmazlık, söz konusu yargı bölgesinde bulunan mahkemelerin münhasır yargı yetkisine tabi olacaktır.
page.terms.s13.title=13. Bu Şartlardaki Değişiklikler
page.terms.s13.text=Bu Şartları zaman zaman revize edebiliriz. Güncellenmiş Şartlar, “Son güncelleme” tarihiyle birlikte bu sayfada yayınlanacaktır. Değişiklikler yürürlüğe girdikten sonra Site'yi kullanmaya devam etmeniz, revize edilmiş Şartları kabul ettiğiniz anlamına gelir.
