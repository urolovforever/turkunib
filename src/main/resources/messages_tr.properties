# About the program
main.about.program=TURKUNIB Hakkında
main.about.program.tagline=Daha Güçlü Bir Gelecek İçin Türk Üniversitelerini Birleştiriyoruz
main.about.program.p1=TURKUNIB (Türk Üniversiteler Birliği), Türk dünyasındaki üniversiteler arasında akademik bağları güçlendirmek ve iş birliğini teşvik etmek amacıyla tasarlanmış dinamik bir girişimdir. Azerbaycan, Kazakistan, Kırgızistan, Türkiye, Özbekistan, Macaristan ve Kuzey Kıbrıs Türk Cumhuriyeti'nden 170 üniversiteyi bir araya getiren TURKUNIB, ortak tarih, kültür ve dil temeline dayanan ortak bir yükseköğretim alanı inşa etmektedir.
main.about.program.p2=Program, birleşik bir platform oluşturarak öğrenci hareketliliğini, öğretim üyesi değişimini ve ortak bölgesel ile küresel sorunlara yönelik ortak araştırma projelerini teşvik etmektedir. TURKUNIB, Orhun Öğrenci ve Akademik Personel Değişim Programı'nı da kapsayan ağı aracılığıyla eğitim fırsatlarını artırırken kültürel anlayışı, bilgi aktarımını ve yenilikçiliği desteklemektedir.
main.about.program.p3=TURKUNIB, ülkelerinin sürdürülebilir kalkınmasına katkıda bulunacak ve Türk halkları arasındaki birlik duygusunu pekiştirecek yeni nesil akademisyenleri, liderleri ve profesyonelleri yetiştirmeye kararlıdır.
main.about.program.p4=Özünde TURKUNIB, bir akademik ortaklıktan çok daha fazlasıdır; insanları, fikirleri ve kurumları birbirine bağlayan, daha güçlü ve birbirine daha bağlı bir geleceğin temelini atan bir köprüdür.
main.about.program.overview=Programın Genel Tanıtımı

