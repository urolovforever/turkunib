page.orhun.title=Orhun Değişim Programı
page.orhun.intro.p1=Türk Üniversiteler Birliği (TURKUNIB) bünyesinde yürütülen Orhun Değişim Programı, Türk Devletleri Teşkilatı'nın (TDT) başlıca yükseköğretim hareketlilik mekanizması haline gelmiştir. 2017–2018 akademik yılındaki pilot uygulamasından bu yana Program, kapsam ve etki bakımından istikrarlı biçimde büyüyerek üye ve gözlemci devletlerdeki yaklaşık 170 üniversite arasında akademik değişimi kolaylaştırmaktadır. Program, yapılandırılmış hareketlilik planları aracılığıyla öğrenci ve personel değişimini, ortak araştırma girişimlerini, iş birliğine dayalı müfredat geliştirmeyi ve öğretim ile bilimsel faaliyetlerde üniversiteler arası iş birliğini desteklemektedir.
page.orhun.intro.p2=Orhun Değişim Programı, doğrudan akademik çıktılarının ötesinde, uyumlu ve rekabetçi bir Türk Yükseköğretim Alanı'nın oluşturulması için stratejik bir araç niteliği taşımakta; katılımcı üniversiteler arasında kurumsal yakınsamayı, kalitenin artırılmasını ve akademik yeterliliklerin karşılıklı tanınmasını teşvik etmektedir. Program, öğrenciler, öğretim üyeleri ve araştırmacılar arasında doğrudan etkileşimi mümkün kılarak Türk dünyası genelinde insanlar arası bağların, kültürel anlayışın ve akademik dayanışmanın güçlendirilmesinde kilit bir rol oynamakta ve böylece Türk Devletleri Teşkilatı'nın öngördüğü daha kapsamlı bölgesel bütünleşme vizyonuna katkıda bulunmaktadır.
page.orhun.regulation.title=Yönetmelik
page.orhun.regulation.text=Bu yönetmeliğin amacı, Türk Konseyi Türk Üniversiteler Birliği üyesi olan yükseköğretim kurumları arasında öğretim elemanı ve öğrenci değişiminin esaslarını belirlemektir. Bu Yönetmelik, Türk Konseyi Türk Üniversiteler Birliği üyesi olan yükseköğretim kurumları arasında öğretim elemanı ve öğrenci değişiminin esaslarını kapsar.
