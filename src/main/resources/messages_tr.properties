page.directive.title=Türk Üniversiteler Birliği ve Yükseköğretim Alanı Kurulmasına İlişkin Direktif
page.directive.intro=Türk Üniversiteler Birliği'nin (TURKUNIB) yapısını, çalışma esaslarını ve faaliyet alanlarını düzenleyen ve Türk Devletleri Teşkilatı Yükseköğretim Alanı'nı tesis eden kuruluş belgesi.
page.directive.download=Resmî belgeyi indirin (PDF)
page.directive.amendnote=(8 Haziran 2026 tarihli Türk Devletleri Teşkilatı Üye Devletleri Eğitim Bakanları 9. Toplantısı Kararı ile değiştirilmiştir)
page.directive.toc=İçindekiler
page.directive.art.n=Md. {0}
page.directive.article.n=Madde {0}
page.directive.part1=Bölüm I
page.directive.part2=Bölüm II
page.directive.part3=Bölüm III
page.directive.part4=Bölüm IV
page.directive.part5=Bölüm V
page.directive.part1.title=Amaç, Kapsam, Dayanak ve Tanımlar
page.directive.part2.title=Birliğin Yapısı
page.directive.part3.title=Birliğin Çalışma Esasları, Mali Kaynaklar, Üyelik
page.directive.part4.title=Türk Konseyi Yükseköğretim Alanı, Uygulama Süreçleri ve Değişim Programları
page.directive.part5.title=Diğer Hükümler
page.directive.art1.title=Amaç
page.directive.art1.p1=(1) Bu Direktifin amacı, Türk Devletleri Teşkilatı Üye Devletleri arasında yükseköğretim alanındaki iş birliğini geliştirerek Türk Devletleri Teşkilatı Yükseköğretim Alanı'nı oluşturmaktır.
page.directive.art1.p2=(2) Bu Direktif ayrıca, Türk Devletleri Teşkilatı himayesinde kurulan Türk Üniversiteler Birliği'nin yapısını, çalışma esaslarını ve faaliyet alanlarını düzenlemeyi amaçlamaktadır.
page.directive.art2.title=Kapsam
page.directive.art2.p1=(1) Bu Direktif, Türk Devletleri Teşkilatı Türk Üniversiteler Birliği üyesi üniversiteler arasında yükseköğretim alanında yürütülecek iş birliğinin usul ve esaslarını kapsar.
page.directive.art3.title=Dayanak
page.directive.art3.intro=(1) Bu Direktif, aşağıda belirtilen toplantılarda alınan kararlara dayanılarak hazırlanmıştır:
page.directive.art3.ref1=23 Ağustos 2012 tarihinde Bişkek'te düzenlenen Türk Devletleri Teşkilatı İkinci Zirvesi;
page.directive.art3.ref2=10 Ağustos 2012 tarihinde Çolpan-Ata'da düzenlenen Türk Devletleri Teşkilatı Eğitim Bakanları Toplantısı;
page.directive.art3.ref3=28-29 Mart 2012 tarihlerinde İstanbul'da düzenlenen Türk Devletleri Teşkilatı Türk Üniversiteler Birliği Hazırlık Toplantısı;
page.directive.art3.ref4=16-17 Ekim 2014 tarihlerinde Erzurum'da düzenlenen Türk Üniversiteler Birliği Birinci Genel Kurulu;
page.directive.art3.ref5=28 Kasım 2014 tarihinde Bakü'de düzenlenen Üçüncü Eğitim Bakanları Toplantısı;
page.directive.art3.ref6=5 Eylül 2015 tarihinde Astana'da düzenlenen Dördüncü Eğitim Bakanları Toplantısı;
page.directive.art3.ref7=15 Mart 2019 tarihinde Bişkek'te düzenlenen Beşinci Eğitim Bakanları Toplantısı;
page.directive.art3.ref8=4 Kasım 2021 tarihinde İstanbul'da düzenlenen Altıncı Eğitim Bakanları Toplantısı;
page.directive.art3.ref9=14 Haziran 2023 tarihinde Semerkant'ta düzenlenen Yedinci Eğitim Bakanları Toplantısı;
page.directive.art3.ref10=23 Kasım 2022 tarihinde Türkistan'da düzenlenen Türk Devletleri Teşkilatı Türk Üniversiteler Birliği Altıncı Genel Kurulu.
page.directive.art4.title=Tanımlar
page.directive.art4.intro=(1) Bu Direktifin uygulanmasında:
page.directive.art4.def1=Türk Devletleri Teşkilatı, Türk Dili Konuşan Ülkeler İşbirliği Konseyi'ni ifade eder;
page.directive.art4.def2=Türk Devletleri Teşkilatı Zirvesi, Üye Devletlerin Devlet Başkanlarının Yıllık Toplantısını ifade eder;
page.directive.art4.def3=Türk Devletleri Teşkilatı Eğitim Bakanları Toplantısı, Eğitim Bakanlarının bir araya geldiği toplantıyı ifade eder. Birliğe ilişkin konuların görüşüldüğü durumlarda Türkiye Yükseköğretim Kurulu (YÖK) Başkanı da toplantıya katılır;
page.directive.art4.def4=Sekretarya, Türk Devletleri Teşkilatı Sekretaryasını ifade eder;
page.directive.art4.def5=Türk Devletleri Teşkilatı Eğitim Bakanları Kıdemli Yetkilileri, Üye Devletlerin Eğitim Bakanlıkları tarafından atanan ulusal uzmanlardan oluşan grubu ifade eder;
page.directive.art4.def6=Birlik, Türk Devletleri Teşkilatı himayesinde kurulan Türk Üniversiteler Birliği'ni ifade eder;
page.directive.art4.def7=Birlik Genel Kurulu, Üye Üniversitelerin Rektörlerinin veya temsilcilerinin yanı sıra Türk Devletleri Teşkilatı Genel Sekreterinin veya temsilcisinin katılımıyla oluşan Kurulu ifade eder;
page.directive.art4.def8=TCHEA, Türk Devletleri Teşkilatı Yükseköğretim Alanı'nı ifade eder.
page.directive.art5.title=Kurucu Üyeler
page.directive.art5.p1=(1) Birliğin kurucu üyeleri, dört üye devletten aşağıdaki 15 üniversitedir.
page.directive.art5.country=Ülke
page.directive.art5.university=Üniversite
page.directive.art5.memberslink=Birliğin güncel üye üniversitelerini görüntüleyin
page.directive.country.az=Azerbaycan
page.directive.country.kz=Kazakistan
page.directive.country.kg=Kırgızistan
page.directive.country.tr=Türkiye
page.directive.art6.title=Teşkilat Yapısı
page.directive.art6.p1=(1) Birlik, Türk Devletleri Teşkilatı üye ve gözlemci devletleri ile akraba toplulukların üniversitelerinden oluşur.
page.directive.art6.chairmanship=Birlik Başkanlığı
page.directive.art6.p2=(2) Birliğin Başkanı, Türk Devletleri Teşkilatı Genel Sekreteridir.
page.directive.art6.p3=(3) Dönem başkanlığı, Genel Kurul Toplantısında üye üniversiteler arasından gönüllülük esasına göre veya diğer katılımcıların önerisiyle iki yıllığına salt çoğunlukla seçilir.
page.directive.art6.p4=(4) Birlik Başkanı, görevlerini akademik işlerden sorumlu Dönem Başkanı Üniversite Rektörü ile eşgüdüm içinde yürütür.
page.directive.art6.p5=(5) Dönem Başkanı Üniversitenin görevleri şunlardır:
page.directive.art6.duty1=Birlik Genel Kurulu toplantısına ev sahipliği yapmak ve Genel Kurulda alınan kararları uygulamak;
page.directive.art6.duty2=başkanlık süresi boyunca Sekretarya ile eşgüdüm içinde Birlik üyeleri arasında gerekli iş birliğini ve iletişimi sağlamak.
page.directive.art6.p6=(6) Dönem Başkanı Üniversitenin Rektörü, görevleriyle ilgili olarak Türk Devletleri Teşkilatı Eğitim Bakanları Toplantısına ve/veya Türk Devletleri Teşkilatı Zirvesine davet edilebilir.
page.directive.art6.assembly=Genel Kurul
page.directive.art6.p7=(7) Türk Üniversiteler Birliği Genel Kurulu, üye ülkelerin üniversite temsilcilerinden oluşur. Üye üniversite temsilcileri; Rektör, ilgili Rektör Yardımcısı ve uluslararasılaşma biriminden bir temsilcidir.
page.directive.art6.board=Yönetim Kurulu
page.directive.art6.secretariat=Sekretarya
page.directive.art6.subcommittees=Alt Komiteler
page.directive.art6.subcommittees.intro=Genel Kurul tarafından belirlenen öncelikli faaliyetlerin yerine getirilmesi amacıyla yedi yürütme komitesi kurulmuştur:
page.directive.art6.committee1=Türk Dünyası Yükseköğretim Veri Bankası
page.directive.art6.committee2=Eğitim-Öğretim Komitesi
page.directive.art6.committee3=Bilim Komitesi
page.directive.art6.committee4=Türk Dünyası Eğitim Portalı
page.directive.art6.committee5=Yükseköğretim Kalite Güvence Kurulu
page.directive.art6.committee6=Spor-Kültür Komitesi
page.directive.art6.committee7=Öğrenci Konseyi
page.directive.art6.contactgroup=Temas Grubu
page.directive.art6.p8=(8) Temas Grubunda görev almak üzere Türk Devletleri Teşkilatı bir Genel Sekreter Yardımcısı, üye üniversiteler ise Birlik faaliyetlerinden sorumlu bir Rektör Yardımcısı ile bir temsilci atar.
page.directive.art6.p9=(9) Temas Grubunun görevi, Birlik kararlarının uygulanmasında eşgüdümü sağlamaktır.
page.directive.art6.p10=(10) Temas Grubu yılda en az iki kez toplanır.
page.directive.art6.studentcouncil=Öğrenci Konseyi
page.directive.art6.p11=(11) Birlik Öğrenci Konseyi, Birliğin Üye Üniversitelerinden seçilen öğrencilerden oluşur.
page.directive.art6.p12=(12) Öğrenci Konseyinin kuruluşuna, görev ve sorumluluklarına ve diğer hususlara ilişkin olarak Birlik tarafından bir Direktif hazırlanır.
page.directive.art7.title=Birliğin Amaçları
page.directive.art7.intro=Ortak tarih, kültür ve dil temelinde, Türk dili konuşan halklar arasında dostluğun ve iş birliğinin geliştirilmesi ve Üye Devletlerin yükseköğretim kurumları arasında iş birliğinin sağlanması için eğitim düzeyinin yükseltilmesi amacıyla aşağıdaki hedeflerin gerçekleştirilmesi öngörülmektedir:
page.directive.art7.obj1=Tüm üye üniversitelerde çağdaş bilimsel düzeye uygun eğitim standartlarının uygulanması yoluyla ortak medeniyet derslerinin okutulması ve böylece ortak kimlik ve kültür bilincine sahip nesillerin yetiştirilmesi;
page.directive.art7.obj2=Yükseköğretim programlarının uluslararası akreditasyon standartlarına uygun olarak uyumlaştırılması;
page.directive.art7.obj3=Akademik personele yönelik eğitim programlarının oluşturulması ve uygulanması;
page.directive.art7.obj4=Öğrenci ve akademik personel değişiminin teşvik edilmesi ve buna ilişkin gerekli düzenlemelerin yapılması;
page.directive.art7.obj5=Ortak bir kredi transfer sisteminin oluşturulması;
page.directive.art7.obj6=Üye üniversiteler arasında yükseköğretim programlarının tanınmasının sağlanması ve üye üniversitelerin diploma denkliklerinin karşılıklı tanınması için uygun bir zemin oluşturulması;
page.directive.art7.obj7=Üniversitelerin belirli alanlardaki karşılaştırmalı üstünlüklerinden yararlanılması;
page.directive.art7.obj8=Uygulanabilir ortak eğitim ve araştırma proje ve programlarının hayata geçirilmesi ve bu alanda yayınlar yapılması;
page.directive.art7.obj9=Sosyal ve kültürel alanlarda iş birliği yapılması;
page.directive.art7.obj10=Türk dünyası üzerine çalışmalar yürüten öğrencilere özel burslar sağlanması;
page.directive.art7.obj11=Türk dünyasına ilişkin akademik çalışmalar ve projeler hakkında bilgi paylaşımının elektronik ortamda sağlanması ve üniversiteler tarafından yürütülen ilgili çalışmaların adreslerinin, Türk Devletleri Teşkilatı internet sitesinde bağlantı verilmek üzere Sekretarya internet sitesine iletilmesi;
page.directive.art7.obj12=Birlik üyesi üniversitelerin dış değerlendirme ve akreditasyon süreçlerinin kalite güvencesine hizmet edecek bağımsız bir "Yükseköğretim Kalite Güvence Kurulu"nun kurulması ve faaliyetlerinin desteklenmesi;
page.directive.art7.obj13=Türk Devletleri Teşkilatı üyeleri için Yükseköğretim Veri Bankasının oluşturulması;
page.directive.art7.obj14=Türk Dünyası İndeksi ile alan indekslerinin oluşturulması;
page.directive.art7.obj15=Türk Dünyası Eğitim Portalının oluşturulması;
page.directive.art7.obj16=Türk Yükseköğretim Alanının oluşturulması.
page.directive.art8.title=Çalışma Esasları
page.directive.art8.p1=(1) Birlik kararları; Birlik üyesi üniversitelerin Rektörlerinin veya Rektör temsilcilerinin ve Türk Devletleri Teşkilatı Genel Sekreterinin veya temsilcilerinin katıldığı Genel Kurul toplantısında salt çoğunlukla alınır.
page.directive.art8.p2=(2) Birliğin sekretarya işleri, Dönem Başkanı Üniversite ile iş birliği içinde Türk Devletleri Teşkilatı Sekretaryası tarafından yürütülür.
page.directive.art8.p3=(3) Birliğin kurumsal yapısı, çalışma usul ve esasları ile mali konulardaki uygulamaları, Birlik üyesi üniversitelerin salt çoğunlukla alacağı karar üzerine hazırlanacak direktiflere göre belirlenir.
page.directive.art8.p4=(4) Uygulamaya yönelik alınan kararlar ve Birlik tarafından hazırlanan direktifler, Türkiye Yükseköğretim Kurulu (YÖK) Başkanının da katılacağı Türk Konseyi Eğitim Bakanları Toplantısında onaylanmasının ardından yürürlüğe girer.
page.directive.art8.p5=(5) Birliğin faaliyetleri, Yükseköğretim Kurulu (YÖK) Başkanlığından bir temsilcinin de yer aldığı Türk Devletleri Teşkilatı Eğitim Bakanları Kıdemli Yetkilileri tarafından izlenir. Söz konusu grubun amacı:
page.directive.art8.wp1=süreç içinde uygulanması planlanan projeleri takip etmek;
page.directive.art8.wp2=Üye Devletler arasında gerekli eşgüdümü sağlamak;
page.directive.art8.wp3=süreçte ortaya çıkabilecek sorunlara yönelik çözümler üretmek;
page.directive.art8.wp4=sürecin tarafları arasında kabul edilebilirlik ve uygulanabilirlik düzeyini artırmaya yönelik faaliyetler yürütmek;
page.directive.art8.wp5=ulusal düzeyde yaşanan sorunların çözümü için gerekli ulusal mevzuat değişiklikleri üzerinde çalışmak ve ilgili makamlara önerilerde bulunarak destek sağlamak.
page.directive.art9.title=Birliğin Mali Kaynakları
page.directive.art9.intro=(1) Birlik tarafından yürütülecek yükseköğretim faaliyetlerinin tüm giderleri, aşağıda belirtilen kaynaklardan karşılanır:
page.directive.art9.fin1=Üye üniversitelerin mali kaynakları;
page.directive.art9.fin2=Kurulacak olan "Türk Bilimsel Araştırma Fonu" tarafından sağlanacak kaynaklar ile ulusal veya uluslararası kurumlardan sağlanacak kaynaklar;
page.directive.art9.fin3=Üye Devletlerin üniversitelerinden proje bazında sağlanacak ek kaynaklar;
page.directive.art9.fin4=Türk Devletleri Teşkilatı üyelerinin bütçelerinden tahsis edilen kaynaklar.
page.directive.art10.title=Birliğe Üyelik
page.directive.art10.p1=(1) Adaylık başvuruları, yazılı gerekçeleriyle birlikte Türk Konseyi Sekretaryasına yapılır. Üyeliğe kabul ve üyeliğin sona erdirilmesi; temas grubu aracılığıyla üye üniversitelerin görüşleri alındıktan sonra, Birlik üyelerinin en az üçte ikisinin katılımıyla yapılacak Genel Kurul toplantısında salt çoğunlukla kararlaştırılır.
page.directive.art10.membershiplink=Üyelik prosedürü hakkında daha fazla bilgi edinin
page.directive.art11.title=Türk Dünyası Yükseköğretim Alanı
page.directive.art11.p1=(1) TCHEA, Üye Devletler arasında oluşturulan ve yükseköğretime ilişkin eğitim faaliyetlerinin yürütüldüğü alandır.
page.directive.art11.p2=(2) TCHEA, Üye Devletlerin oluşturacağı ortak platformlar aracılığıyla 7. Maddede belirtilen hedeflere ulaşmayı amaçlar.
page.directive.art12.title=Uygulama Süreçleri
page.directive.art12.p1=(1) Türk Dünyası Yükseköğretim Alanı çerçevesinde Birlik Üyesi Devletlerin, iş birliği alanlarında aşağıdaki hususları uyumlaştırmaları gerekmektedir:
page.directive.art12.item1=Öğrenci ve akademik personele yönelik değişim programları;
page.directive.art12.item2=Örgün, uzaktan veya açık öğretim yoluyla yürütülen ön lisans, lisans ve lisansüstü düzeylerde ortak sertifika programlarının açılmasına ilişkin olarak ülkelerinde yürürlükte bulunan mevzuat.
page.directive.art12.p2=(2) Yürütülecek iş birliği çerçevesinde aşağıdaki hususlar, Türkiye Yükseköğretim Kurulu (YÖK) Başkanlığından bir temsilcinin de yer alacağı Türk Devletleri Teşkilatı Eğitim Bakanları Kıdemli Yetkilileri tarafından desteklenir:
page.directive.art12.sup1=Birlik üyesi üniversiteler ve diğer resmî bilimsel kurumlar tarafından verilen diplomaların denkliğinin sağlanması;
page.directive.art12.sup2=Türk Dünyası Yükseköğretim Alanı'nın oluşturulmasına ve yaygınlaştırılmasına yönelik araçların kullanımı ve tanıtımı, Türkiye Yükseköğretim Kurulu Başkanlığından bir temsilcinin desteğiyle ve Türk Eğitim Bakanları Kıdemli Yetkilileri aracılığıyla teşvik edilir.
page.directive.art13.title=Öğrenci ve Akademik Personel Hareketliliği
page.directive.art13.p1=(1) Üye üniversitelerde hâlen faaliyette olan ve/veya açılacak yaz ve kış okullarına diğer üye üniversitelerin öğrencileri kabul edilir. Bu programlarda öğrencilere sağlanacak imkânlar karşılıklılık esasına göre belirlenir.
page.directive.art13.p2=(2) Öğrenci ve akademik personel değişiminde Orhun Programı örnek olarak uygulanır.
page.directive.art13.p3=(3) Öğrencilerin geçmiş öğrenimlerinin tanınması, öğrenci kabulü, öğrenim anlaşması ve not dökümünün (transkript) hazırlanması, üye üniversitelerce belirlenecek ortak bir kredi sistemine göre düzenlenir.
page.directive.art13.orhunlink=Orhun Değişim Programı hakkında daha fazla bilgi edinin
page.directive.art14.title=Hüküm Bulunmayan Hâller
page.directive.art14.p1=Bu Direktifin uygulanmasında ortaya çıkabilecek sorunların çözümüne yönelik değişiklikler, Genel Kurul tarafından ek bir belge ile kabul edilebilir.
page.directive.art15.title=Direktifin Dilleri
page.directive.art15.p1=Bu Direktif; Azerbaycanca, Kazakça, Kırgızca, Türkçe ve İngilizce olarak hazırlanmıştır.
page.directive.art16.title=Yürürlük
page.directive.art16.p1=Bu Direktif hükümleri, Birlik Genel Kurulunda kabul edilmesinin ardından Türk Devletleri Teşkilatı Eğitim Bakanları Toplantısında onaylandığı tarihte yürürlüğe girer.
page.directive.art17.title=Yürütme
page.directive.art17.p1=Bu Direktif hükümleri, Dönem Başkanı Üniversite ile iş birliği içinde Sekretarya tarafından yürütülür.
page.directive.art17.p2=Bu süreç Orhun Programı olarak adlandırılmıştır.
# Orhun Application Guide page
page.orhunguide.title=Orhun Değişim Programı — Başvuru Kılavuzu
page.orhunguide.intro=Öğrenciler ve akademik personel için uygulamalı bir kılavuz: başvuru koşulları, başvuru süreci, gerekli belgeler ve hareketlilik için seçildikten sonra tamamlanması gereken adımlar.
page.orhunguide.download=Kılavuzu İndir (PDF)
page.orhunguide.orhunlink=Güncel duyuru, kontenjanlar ve belge şablonları
page.orhunguide.toc=İçindekiler
page.orhunguide.doc.col1=Belge
page.orhunguide.doc.col2=Açıklama
page.orhunguide.s1.title=1. Orhun Değişim Programı Hakkında
page.orhunguide.s1.p1=Orhun Değişim Programı, Türk Devletleri Teşkilatı (TDT) bünyesinde faaliyet gösteren Türk Üniversiteler Birliği (TURKUNIB) tarafından yürütülen ve üye ülkelerin yükseköğretim kurumları arasında öğrenci ve öğretim elemanı hareketliliğini teşvik eden amiral gemisi niteliğinde bir programdır. Program; akademik iş birliğini geliştirmeyi, kurumlar arası bağları güçlendirmeyi ve halklar arasındaki kültürel etkileşimi artırmayı amaçlamaktadır.
page.orhunguide.s1.p2=Program, 2017–2018 akademik yılında pilot uygulama olarak başlamış; COVID-19 sonrası dönemde yeniden etkinleştirilerek kapsamı genişletilmiş ve bugün 170 üye üniversiteyi bir araya getiren geniş bir ağa dönüşmüştür.
page.orhunguide.s1.obj.title=Stratejik Hedefler
page.orhunguide.s1.obj1=Üye ülke üniversiteleri arasında akademik bütünleşmeyi ve hareketliliği artırmak,
page.orhunguide.s1.obj2="Türk Dünyası Yükseköğretim Alanı"nın oluşturulmasına katkı sağlamak,
page.orhunguide.s1.obj3=Yükseköğretim sistemlerini Bologna Süreci ve ECTS gibi uluslararası standartlarla uyumlu hale getirmek,
page.orhunguide.s1.obj4=Bölgesel kalkınmaya, araştırma iş birliğine ve yenilikçiliğe katkıda bulunmak.
page.orhunguide.s1.countries.title=Programın Kapsadığı Üye Ülkeler
page.orhunguide.s1.countries.p1=Program kapsamında akademik personel ve öğrenciler, Türk Devletleri Teşkilatı Üniversiteler Birliği'ne üye üniversitelerde hareketlilik gerçekleştirme imkânına sahiptir. Üye ülkeler şunlardır: Türkiye, Azerbaycan, Kırgızistan, Kazakistan, Özbekistan, Kuzey Kıbrıs Türk Cumhuriyeti (KKTC) ve Macaristan.
page.orhunguide.s2.title=2. Genel Esaslar
page.orhunguide.s2s1.title=2.1 Protokol Esası
page.orhunguide.s2s1.p1=Orhun Değişim Programı, yalnızca üye kurumlar arasında imzalanan "Orhun Değişim Programı Protokolü" çerçevesinde yürütülebilir. Bir üniversite, aralarında protokol bulunmayan bir kurumdan öğrenci veya öğretim elemanı kabul edemez ve bu kuruma öğrenci veya öğretim elemanı gönderemez. Protokolün bir nüshası Türk Devletleri Teşkilatı Sekretaryasında saklanır.
page.orhunguide.s2s2.title=2.2 Diller
page.orhunguide.s2s2.p1=Programa ilişkin mevzuat, bilgi, dosya ve belgeler; üye devletlerin resmî dillerinde, Türkçe ve İngilizce olarak hazırlanır. Metinler arasında farklılık olması halinde İngilizce metin esas alınır.
page.orhunguide.s2s3.title=2.3 Mali Kaynaklar
page.orhunguide.s2s3.fin1=Ulusal veya uluslararası kurum ve kuruluşlar tarafından sağlanan kaynaklar,
page.orhunguide.s2s3.fin2=Üye üniversitelerin kendi bütçe kaynakları,
page.orhunguide.s2s3.fin3=TURKUNIB Dönem Başkanı Üniversite ile Türk Devletleri Teşkilatı tarafından sağlanan kaynaklar.
page.orhunguide.s2s3.p1=Üye üniversitelerin, her akademik yıla ilişkin mali ihtiyaçlarını hareketlilik öncesinde kendi bütçelerinde belirtmeleri gerekir; kaynakların tahsisinde gerekli eşgüdüm Türk Devletleri Teşkilatı Sekretaryası tarafından sağlanır.
page.orhunguide.s3.title=3. Öğrenciler Nasıl Başvurur?
page.orhunguide.s3.p1=Orhun Değişim Programı kapsamında örgün eğitime kayıtlı öğrenciler, kendi yükseköğretim kurumlarının protokol imzaladığı bir üye kurumda bir veya iki yarıyıl (toplamda bir akademik yılı aşmamak üzere) öğrenimlerine devam edebilirler.
page.orhunguide.s3s1.title=3.1 Başvuru Koşulları
page.orhunguide.s3s1.req1=Örgün bir yükseköğretim programına kayıtlı olmak,
page.orhunguide.s3s1.req2=4 üzerinden en az 2,5 (veya eşdeğeri) genel not ortalamasına (GPA) sahip olmak,
page.orhunguide.s3s1.req3=Hazırlık sınıfı, birinci sınıf ve son sınıf öğrencileri programdan yararlanamaz,
page.orhunguide.s3s1.req4=Uluslararası öğrenci statüsüyle yurt dışında öğrenim görenler, kendi ülkelerindeki bir üniversiteye başvuramaz.
page.orhunguide.s3s2.title=3.2 Başvuru Süreci ve Duyuru
page.orhunguide.s3s2.item1=Yükseköğretim kurumu, imzaladığı Orhun Değişim Programı protokollerini ve ilgili kontenjanları kendi internet sitesinde duyurur.
page.orhunguide.s3s2.item2=Duyuruda programın tanıtımı, başvuru koşulları ve süreç adımları yer alır.
page.orhunguide.s3s2.item3=Öğrenci, ilan edilen kontenjan ve takvime uygun olarak ilgili kuruma başvurusunu yapar.
page.orhunguide.s3s2.item4=Başvurular, sisteme yüklenen belgelerle birlikte, kabul eden kuruma iletilmek üzere koordinatör üniversiteye gönderilir.
page.orhunguide.s3s2.item5=TURKUNIB Dönem Başkanı Üniversite, değişim öğrencilerinin sayısını ve dağılımını ikili protokoller çerçevesinde belirler.
page.orhunguide.s3s2.item6=Değerlendirme, adayların not ortalaması esas alınarak yapılır; sonuçlar imzacı kurumların internet sitelerinde duyurulur.
page.orhunguide.s3.note1=100'lük not sisteminden 4'lük not sistemine dönüşümde, kabul eden üniversitenin eşdeğerlik kararı esas alınır. Ayrıca TURKUNIB Dönem Başkanı Üniversite, etkin ve verimli bir hareketlilik için ek koşullar belirleyebilir.
page.orhunguide.s3s3.title=3.3 Gerekli Belgeler
page.orhunguide.s3.doc1=Başvuru Formu
page.orhunguide.s3.doc1.desc=Öğrenci başvuru belgesi
page.orhunguide.s3.doc2=Not Dökümü (Transkript)
page.orhunguide.s3.doc2.desc=Güncel not dökümü
page.orhunguide.s3.doc3=Öğrenci Yükümlülük Sözleşmesi
page.orhunguide.s3.doc3.desc=Öğrenci ile kurum arasında imzalanan Orhun Değişim Programı Öğrenci Yükümlülük Sözleşmesi
page.orhunguide.s3.doc4=Diğer belgeler
page.orhunguide.s3.doc4.desc=İmzacı üniversiteler tarafından belirlenen ek belgeler (varsa)
page.orhunguide.s3s3.p1=Değişim döneminin sonunda öğrenci; not dökümünü, öğrenim süresini gösteren Katılım Belgesini ve öğrenci nihai raporunu, dönüş tarihinden itibaren 30 gün içinde şahsen, posta yoluyla veya e-posta ile kendi kurumunun Orhun Değişim Programı koordinasyon ofisine teslim eder. Eksik belgeler için 15 güne kadar ek süre verilebilir; belgelerin verilen süre içinde tamamlanmaması halinde süreç geçersiz sayılır ve yapılan ödemelerin iadesi talep edilir.
page.orhunguide.s3s4.title=3.4 Öğrenim Anlaşması (Learning Agreement)
page.orhunguide.s3s4.p1=Hareketlilik başlamadan önce, öğrencinin kabul eden kurumda alacağı dersler ve krediler ile bunların kendi kurumundaki karşılıkları bir "Öğrenim Anlaşması" (Learning Agreement) aracılığıyla belirlenir. Anlaşma üç nüsha olarak hazırlanır; bir nüshası öğrencide, diğerleri iki kurumda kalır. Anlaşma, ilgili bölüm başkanları ile kurumların üst yöneticileri (veya yetkili temsilcileri) tarafından imzalanır. Zorunlu değişiklikler, kabul eden kurumun akademik döneminin başlangıcından itibaren en geç 30 gün içinde (ve zorunlu sınav tarihlerinden önce) yapılmalıdır.
page.orhunguide.s3s5.title=3.5 Ders Eşdeğerliği, Ders Tekrarı ve Sınavlar
page.orhunguide.s3s5.item1=Ders yükleri kredi esasına göre belirlenir; ders sayısı değil, krediler esas alınır. Kurumlar ECTS sistemini referans olarak kullanabilir.
page.orhunguide.s3s5.item2=Öğrencinin başarısız olduğu dersler, öğrenim anlaşmasında belirtilen eşdeğer ders esas alınarak kendi kurumunda tekrar alınır; ders tekrarı kabul eden kurumda yapılamaz.
page.orhunguide.s3s5.item3=Orhun Değişim Programı öğrencileri için koşullu geçme uygulanmaz; bütünleme sınavına yalnızca öğrencinin hâlihazırda değişim öğrencisi olarak bulunduğu kurumda girilebilir.
page.orhunguide.s3s5.item4=Tez, staj ve laboratuvar çalışmaları gibi çalışmalar, öğrencinin kendi kurumunun kurallarına tabidir.
page.orhunguide.s3s5.item5=Değişim sonunda kurumlar, başarıyla tamamlanan derslerin kredi ve notlarını tanımakla yükümlüdür; bu dersler diploma ekinde belirtilir.
page.orhunguide.s3s6.title=3.6 Mali Yükümlülükler
page.orhunguide.s3s6.item1=Öğrenci, değişim süresi boyunca zorunlu katkı payını/öğrenim ücretini kendi kurumuna ödemeye devam eder; kayıt dondurulamaz.
page.orhunguide.s3s6.item2=Kabul eden kuruma ayrıca öğrenim ücreti ödenmez.
page.orhunguide.s3s6.item3=Diğer burslar ve krediler öğrenim süresi boyunca devam eder.
page.orhunguide.s3s7.title=3.7 Disiplin
page.orhunguide.s3s7.p1=Değişim öğrencileri, hareketlilik süresi boyunca bulundukları kurumun disiplin kurallarına tabidir. Bir disiplin soruşturması açılması halinde sonuç, öğrencinin kayıtlı olduğu kuruma bildirilir; cezanın hareketlilik süresi içinde uygulanamaması durumunda ceza, öğrencinin kendi kurumu tarafından uygulanır.
page.orhunguide.s4.title=4. Akademik Personel Nasıl Başvurur?
page.orhunguide.s4.p1=Orhun Değişim Programı protokolünü imzalamış kurumlarda görev yapan tüm öğretim elemanları, öğretim elemanı hareketliliğine katılabilir. Hareketlilik, bir kurumun öğretim elemanının başka bir üye kurumda gerçekleştireceği öğretim faaliyetlerini kapsar.
page.orhunguide.s4s1.title=4.1 Kapsam ve Süre
page.orhunguide.s4s1.item1=Hareketlilik süresi en az iki hafta, en fazla üç ay olabilir; aynı akademik yıl içinde yalnızca bir kez gerçekleştirilebilir.
page.orhunguide.s4s1.item2=Haftalık toplam akademik faaliyet en az altı saat olmalıdır (ders saatleri esas alınır; yetersiz kalması halinde seminer, panel veya konferans gibi faaliyetlerle tamamlanabilir).
page.orhunguide.s4s1.item3=Ders verme faaliyeti içermeyen hareketlilik planları Orhun Değişim Programı kapsamında kabul edilmez.
page.orhunguide.s4s2.title=4.2 Başvuru Duyurusu ve Seçim Süreci
page.orhunguide.s4s2.item1=İmzalanan protokoller ve kontenjanlar, kurumun ve TURKUNIB'in internet sitelerinde duyurulur; duyurular en az 15 gün yayında kalır.
page.orhunguide.s4s2.item2=Duyuru süresi içinde yapılan tüm başvurular kayıt altına alınır; bir nüshası kurumun Orhun Değişim Programı koordinasyon ofisinde saklanır.
page.orhunguide.s4s2.item3=Öğretim elemanı, gitmek istediği kurumdaki ilgili bölümle iletişime geçerek uygun dersleri belirler ve "Öğretim Elemanı Hareketlilik Planı"nı hazırlar.
page.orhunguide.s4s2.item4=Plan, hem gönderen hem de kabul eden kurumun ilgili akademik birim kurulları tarafından onaylanır ve hareketlilik başlamadan en az 15 gün önce koordinasyon ofisine sunulur.
page.orhunguide.s4s2.item5=Değerlendirmede, daha önce değişim programına katılmamış öğretim elemanlarına ve Orhun bölüm koordinatörlerine öncelik verilir.
page.orhunguide.s4s2.item6=Sonuçlar, imzacı kurumun internet sitesinde duyurulur.
page.orhunguide.s4.note2=Seçildiği halde geçerli bir mazereti olmaksızın katılmayan öğretim elemanı, üç yıl süreyle programdan yararlanamaz.
page.orhunguide.s4s3.title=4.3 Gerekli Belgeler
page.orhunguide.s4.doc1=Akademik Personel Bilgi Formu
page.orhunguide.s4.doc1.desc=Kurumun internet sitesindeki "Belgeler" menüsünden temin edilir
page.orhunguide.s4.doc2=Akademik Personel Hareketlilik Programı
page.orhunguide.s4.doc2.desc=Gerçekleştirilecek faaliyetleri ayrıntılarıyla içeren plan; kurumun internet sitesinden temin edilir
page.orhunguide.s4.doc3=Özgeçmiş (CV)
page.orhunguide.s4.doc3.desc=Güncel özgeçmiş
page.orhunguide.s4.doc4=Katılım Belgesi
page.orhunguide.s4.doc4.desc=Hareketlilik sonunda kabul eden kurum tarafından imzalı/mühürlü olarak düzenlenir
page.orhunguide.s4.doc5=Faaliyet Sonuç Raporu
page.orhunguide.s4.doc5.desc=Öğretim elemanı tarafından hazırlanır; faaliyetin bitiminden itibaren en geç 15 gün içinde koordinasyon ofisine sunulur
page.orhunguide.s4s4.title=4.4 Mali Haklar ve Sorumluluklar
page.orhunguide.s4s4.item1=Öğretim elemanının özlük hakları kendi üniversitesinde saklı tutulur.
page.orhunguide.s4s4.item2=İlk iki hafta için gündelik (harcırah) ve yol giderleri gönderen kurum tarafından karşılanır.
page.orhunguide.s4s4.item3=Barınma ve iaşe (konaklama ve yemek) kabul eden üniversite tarafından sağlanır.
page.orhunguide.s5.title=5. Hareketlilik İçin Seçildim — Şimdi Ne Yapmalıyım?
page.orhunguide.s5.p1=Hareketlilik için seçilen öğrenci ve akademik personelin, hareketlilik başlamadan önce aşağıdaki altı adımı sırasıyla tamamlaması önerilir:
page.orhunguide.s5.step1=Kion Hesabı Oluşturma
page.orhunguide.s5.step1.text=İlgili değişim programı internet sitesinde yer alan bağlantı üzerinden bir Kion hesabı oluşturulmalıdır. Hareketlilik için gerekli belgeler bu sisteme yüklenecektir.
page.orhunguide.s5.step2=Kabul Mektubunun Alınması
page.orhunguide.s5.step2.text=Kabul Mektubunun alınması için yerleştirilen üniversite ile e-posta yoluyla iletişime geçilmelidir.
page.orhunguide.s5.step3=Ders İçeriklerine Erişim
page.orhunguide.s5.step3.text=Ders içerikleri, kabul eden üniversitenin internet sitesinden temin edilmelidir. Bu bilgilerin internet sitesinde bulunmaması halinde, karşı kurumdan e-posta yoluyla talep edilmelidir.
page.orhunguide.s5.step4=Öğrenim Anlaşmasının (Learning Agreement) Hazırlanması
page.orhunguide.s5.step4.text=Güncel not dökümü ve karşı kurumdan alınan ders listesi kullanılarak, Öğrenim Anlaşması (Learning Agreement) kurumun Orhun Bölüm Koordinatörü ile birlikte hazırlanmalıdır.
page.orhunguide.s5.step5=Öğrenim/Öğretim Anlaşması İmza Süreci
page.orhunguide.s5.step5.text=Hazırlanan Öğrenim/Öğretim Anlaşması, Bölüm Başkanı ve Bölüm Koordinatörü tarafından imzalanır; ardından nihai imza ve mühür için e-posta yoluyla Değişim Programları Koordinasyon Ofisine gönderilir.
page.orhunguide.s5.step6=Gerekli Belgelerin Teslimi
page.orhunguide.s5.step6.text=Öğrenci Yükümlülük Taahhütnamesi ve Uçuş Talep Formu gibi hareketlilik için gerekli belgeler Kion sistemine yüklenir.
page.orhunguide.s5.note3=Bu altı adım, hareketlilik için seçildikten sonra izlenecek genel süreci özetlemektedir; her üye kurumun kendi kurumsal sistemine (ör. Kion) bağlı olarak küçük farklılıklar olabilir. Güncel bilgi için ilgili kurumun Değişim Programları Koordinasyon Ofisi ile iletişime geçilmesi önerilir.
page.orhun.guidelink=Başvuru Kılavuzu

