<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Message</title>
</head>
<body>

<!-- Фрагмент для обычных сообщений об ошибках и успехе -->
<div th:fragment="message(error, success)">
    <div th:if="${error}" class="alert alert-danger border-danger shadow-sm" role="alert">
        <h4 class="alert-heading" th:text="#{common.error.heading}">
            Something Went Wrong
        </h4>
        <p th:text="${error}" class="mb-0"></p>
    </div>

    <div th:if="${success}" class="alert alert-success border-success shadow-sm" role="alert">
        <h4 class="alert-heading" th:text="#{common.success.heading}">
            Success
        </h4>
        <p th:text="${success}" class="mb-0"></p>
    </div>
</div>

</body>
</html>
