<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org" xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8">
    <title>Student Testimonials</title>
</head>
<body>
<div th:fragment="student-testimonials(cssClasses)">
    <!-- Student Testimonials -->
    <section class="student-testimonials container-fluid d-flex align-items-center"
             th:classappend="${cssClasses}">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-lg-2 d-none d-md-block text-center">
                    <!-- Placeholder for testimonials carousel or content if needed -->
                    <i class="bi bi-chat-quote"></i>
                </div>
                <div class="col-lg-7">
                    <h2 th:text="#{main.testimony.title}">Student Testimonials</h2>
                    <p class="fw-light fst-italic" th:text="#{main.testimony.description}">Hear from students who have participated in our exchange programs.</p>
                    <div id="testimonialsCarousel" class="carousel slide">
                        <div class="carousel-inner">
                            <div class="carousel-item active">
                                <figure class="mt-3">
                                    <blockquote class="blockquote">
                                        <p>"My semester at Istanbul University through the Orhun Exchange Program was
                                            life-changing.
                                            I improved my Turkish language skills, made lifelong friends, and gained a
                                            deeper
                                            understanding of Turkish culture and academic traditions."</p>
                                    </blockquote>
                                    <figcaption class="blockquote-footer">
                                        Aibek Nurmatov <cite title="Source Title">Kyrgyz-Turkish Manas University,
                                        Kyrgyzstan</cite>
                                    </figcaption>
                                </figure>
                            </div>
                            <div class="carousel-item">
                                <figure class="mt-3">
                                    <blockquote class="blockquote">
                                        <p>"Participating in the Orhun Exchange Program was an incredible experience. I
                                            gained new perspectives, developed valuable skills, and made connections
                                            that will last a lifetime."</p>
                                    </blockquote>
                                    <figcaption class="blockquote-footer">
                                        Dilnoza Karimova <cite title="Source Title">Tashkent International University,
                                        Uzbekistan</cite>
                                    </figcaption>
                                </figure>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-lg-3 text-end">
                    <a th:href="@{/{lang}/application/form(lang=${lang})}" class="btn btn-dark apply-link">
                        <span th:text="#{main.testimony.application.form}">Application form</span>
                        <i class="bi bi-arrow-right"></i>
                    </a>
                </div>
            </div>
        </div>
    </section>
</div>
</body>
</html>
