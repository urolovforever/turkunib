<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org"
      th:replace="~{web/fragments/layout :: layout (~{::content}, 'TURKUNIB :: FAQ', 'faq', ~{})}">
<head>
    <meta charset="UTF-8">
    <title>TIU TURKUNIB - FAQ</title>
</head>
<body>
<div th:fragment="content">

    <th:block th:replace="~{web/fragments/hero-banner :: hero-banner(${banners})}"></th:block>

    <section class="py-5">
        <div class="container">
            <div class="row mb-4">
                <div class="col">
                    <h1 class="h2-bigger" th:text="#{page.faq.title}">Frequently Asked Questions</h1>
                    <p class="text-muted" th:text="#{page.faq.intro}">Answers to common questions about TURKUNIB, the Orhun Exchange Program, membership and scholarships.</p>
                </div>
            </div>

            <div th:if="${faqGroups == null or faqGroups.isEmpty()}" class="text-center text-muted py-5">
                <i class="bi bi-question-circle fs-1 d-block mb-3"></i>
                <span th:text="#{page.faq.empty}">Questions and answers will be published here soon.</span>
            </div>

            <div th:each="entry : ${faqGroups}" class="mb-5">
                <h2 class="h4 mb-3" th:switch="${entry.key.name()}">
                    <span th:case="'GENERAL'" th:text="#{page.faq.cat.general}">General</span>
                    <span th:case="'ORKHUN_PROGRAM'" th:text="#{page.faq.cat.orkhun}">Orhun Exchange Program</span>
                    <span th:case="'MEMBERSHIP'" th:text="#{page.faq.cat.membership}">Membership</span>
                    <span th:case="'SCHOLARSHIPS'" th:text="#{page.faq.cat.scholarships}">Scholarships</span>
                </h2>
                <div class="accordion shadow-sm" th:id="'acc-' + ${entry.key.name()}">
                    <div class="accordion-item" th:each="f : ${entry.value}">
                        <h3 class="accordion-header" th:id="'h-' + ${f.id}">
                            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                                    th:data-bs-target="'#c-' + ${f.id}" aria-expanded="false" th:aria-controls="'c-' + ${f.id}"
                                    th:text="${f.question}">Question</button>
                        </h3>
                        <div th:id="'c-' + ${f.id}" class="accordion-collapse collapse"
                             th:aria-labelledby="'h-' + ${f.id}" th:data-bs-parent="'#acc-' + ${entry.key.name()}">
                            <div class="accordion-body" th:utext="${f.answer}">Answer</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

</div>

</body>
</html>
