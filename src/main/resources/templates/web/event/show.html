<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org"
      th:replace="~{web/fragments/layout :: layout (~{::content}, ${ event.title() + ' :: Event'}, 'events', ~{::pageScripts})}">
<head>
    <meta charset="UTF-8">
    <title>TIU TURKUNIB - Latest News</title>
</head>
<body>
<div th:fragment="content">

    <th:block th:replace="~{web/fragments/hero-banner :: hero-banner(${banners})}"></th:block>

    <!-- Event Section -->
    <div class="show-event-section ">
        <div class="container-fluid event-info-container pb-end-150">
            <div class="row justify-content-center ">
                <div class="col-md-5">
                    <div class="event-info shadow">
                        <div class="event-field mb-4">
                            <h2 th:text="#{page.event.title}">Information about Event</h2>
                            <p th:text="${event.title()}">International Conference on Education</p>
                        </div>

                        <div class="event-field mb-4">
                            <h4 th:text="#{page.event.description}">Description</h4>
                            <p th:text="${event.description()}" ></p>
                        </div>

                        <div class="event-field mb-4">
                            <h4 th:text="#{page.event.format}">Event format</h4>
                            <p th:text="${event.format()}" class="text-capitalize"></p>
                        </div>

                        <div class="event-field mb-4">
                            <h4 th:text="#{page.event.starts}">Event starts at</h4>
                            <p th:text="${#temporals.format(event.startAt(), 'MMMM dd, YYYY HH:mm')}">October 15, 2025 09:00 AM</p>
                        </div>

                        <div class="event-field mb-4">
                            <h4 th:text="#{page.event.ends}">Event ends at</h4>
                            <p th:text="${#temporals.format(event.endAt(), 'MMMM dd, YYYY HH:mm')}">October 15, 2025 05:00 PM</p>
                        </div>

                        <div class="event-field mb-4">
                            <h4 th:text="#{page.event.language}">Language</h4>
                            <p th:text="${event.language()}" class="text-capitalize">English</p>
                        </div>

                        <div class="event-field mb-4">
                            <h4 th:text="#{page.event.organizer}">Organizer</h4>
                            <p th:text="${event.organizer()}">Department of Educational Sciences</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-4 event-map">
                    <div id="YMapId" class="img-thumbnail shadow-sm" style="width: 100%; height: 720px;"></div>
                </div>
            </div>
        </div>
    </div>

    <th:block th:replace="~{web/fragments/application-form :: application-form('margin-top-150')}"></th:block>

</div>

<th:block th:fragment="pageScripts">

    <script th:src="@{'https://api-maps.yandex.ru/2.1/?apikey=' + ${yandexApiKey} + '&lang=en_US'}" type="text/javascript"></script>
    <script th:inline="javascript">
        const initLatitude = /*[[${event.latitude}]]*/;
        const initLongitude = /*[[${event.longitude}]]*/;

        ymaps.ready(init);

        function init() {
            let myMap = new ymaps.Map('YMapId', {
                center: [initLatitude, initLongitude],
                zoom: 17,
                controls: ['zoomControl']
            }, {
                suppressMapOpenBlock: true
            });
            const myPlacemark = new ymaps.Placemark([initLatitude, initLongitude], {}, {
                preset: 'islands#redIcon'
            });
            myMap.geoObjects.add(myPlacemark);
            myMap.behaviors.disable('scrollZoom');
        }
    </script>
</th:block>
</body>
</html>
