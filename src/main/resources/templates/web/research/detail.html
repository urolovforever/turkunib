<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org"
      th:replace="~{web/fragments/layout :: layout (~{::content}, ${project.title + ' :: TURKUNIB'}, 'research', ~{})}">
<head>
    <meta charset="UTF-8">
    <title>TIU TURKUNIB - Research Project</title>
</head>
<body>
<div th:fragment="content">

    <th:block th:replace="~{web/fragments/hero-banner :: hero-banner(${banners})}"></th:block>

    <section class="py-5">
        <div class="container">
            <a th:href="@{/{lang}/research/(lang=${lang})}" class="btn btn-sm btn-outline-brand mb-4">
                <i class="bi bi-arrow-left me-1"></i> <span th:text="#{page.research.all}">All research projects</span>
            </a>

            <div class="row g-5">
                <div class="col-lg-8">
                    <div class="d-flex align-items-center gap-2 mb-2">
                        <span class="badge" th:switch="${project.status.name()}"
                              th:classappend="${project.status.name() == 'COMPLETED'} ? 'bg-success' : (${project.status.name() == 'PLANNED'} ? 'bg-secondary' : 'bg-warning text-dark')">
                            <span th:case="'PLANNED'" th:text="#{page.research.status.planned}">Planned</span>
                            <span th:case="'ONGOING'" th:text="#{page.research.status.ongoing}">Ongoing</span>
                            <span th:case="'COMPLETED'" th:text="#{page.research.status.completed}">Completed</span>
                        </span>
                        <small class="text-muted" th:if="${project.startYear != null}">
                            <span th:text="${project.startYear}">2024</span><span th:if="${project.endYear != null}" th:text="'–' + ${project.endYear}">–2026</span>
                        </small>
                    </div>

                    <h1 class="h2-bigger mb-3" th:text="${project.title}">Project title</h1>

                    <p class="text-muted mb-4" th:if="${project.subjectArea != null}">
                        <i class="bi bi-tag me-1"></i><span th:text="${project.subjectArea}">Subject area</span>
                    </p>

                    <p class="lead" th:if="${project.description != null}" th:text="${project.description}"></p>

                    <div class="mt-3 static-page-content" th:if="${project.content != null and !project.content.isBlank()}"
                         th:utext="${project.content}"></div>
                </div>

                <div class="col-lg-4">
                    <div class="card border-1 shadow-sm" th:if="${project.participatingUniversities != null}">
                        <div class="card-body">
                            <h2 class="h6 text-brand" th:text="#{page.research.participating-universities}">Participating universities</h2>
                            <p class="mb-0 text-muted" th:text="${project.participatingUniversities}">Universities</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

</div>

</body>
</html>
