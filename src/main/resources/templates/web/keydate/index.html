<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org"
      th:replace="~{web/fragments/layout :: layout (~{::content}, 'TURKUNIB :: Academic Calendar', 'key-dates', ~{})}">
<head>
    <meta charset="UTF-8">
    <title>TIU TURKUNIB - Academic Calendar</title>
</head>
<body>
<div th:fragment="content">

    <th:block th:replace="~{web/fragments/hero-banner :: hero-banner(${banners})}"></th:block>

    <section class="py-5">
        <div class="container">
            <div class="row mb-4">
                <div class="col">
                    <h1 class="h2-bigger" th:text="#{page.calendar.title}">Academic Calendar &amp; Key Dates</h1>
                    <p class="text-muted" th:text="#{page.calendar.intro}">Application deadlines, summits and important events of the Turkic Universities Union.</p>
                </div>
            </div>

            <div class="list-group shadow-sm">
                <div class="list-group-item d-flex align-items-center" th:each="d : ${keyDates}">
                    <div class="text-center me-3 flex-shrink-0" style="width:72px;">
                        <div class="fw-bold text-brand" style="font-size:1.4rem;" th:text="${#temporals.format(d.eventDate, 'dd')}">01</div>
                        <div class="text-muted small text-uppercase" th:text="${#temporals.format(d.eventDate, 'MMM yyyy')}">Jan 2026</div>
                    </div>
                    <div class="flex-grow-1">
                        <div class="d-flex align-items-center gap-2 mb-1">
                            <span class="badge" th:switch="${d.type.name()}"
                                  th:classappend="${d.type.name() == 'DEADLINE'} ? 'bg-danger' : (${d.type.name() == 'SUMMIT'} ? 'bg-primary' : (${d.type.name() == 'ACADEMIC'} ? 'bg-success' : 'bg-secondary'))">
                                <span th:case="'DEADLINE'" th:text="#{page.calendar.type.deadline}">Deadline</span>
                                <span th:case="'SUMMIT'" th:text="#{page.calendar.type.summit}">Summit</span>
                                <span th:case="'ACADEMIC'" th:text="#{page.calendar.type.academic}">Academic</span>
                                <span th:case="'EVENT'" th:text="#{page.calendar.type.event}">Event</span>
                            </span>
                            <span class="text-muted small" th:if="${d.endDate != null}"
                                  th:text="#{page.calendar.until} + ' ' + ${#temporals.format(d.endDate, 'dd MMM yyyy')}">until</span>
                        </div>
                        <div class="fw-semibold" th:text="${d.title}">Title</div>
                        <small class="text-muted" th:if="${d.description}" th:text="${d.description}"></small>
                    </div>
                </div>
                <div th:if="${keyDates == null or keyDates.isEmpty()}" class="list-group-item text-center text-muted py-5">
                    <i class="bi bi-calendar-x fs-1 d-block mb-3"></i>
                    <span th:text="#{page.calendar.empty}">Key dates will be published here soon.</span>
                </div>
            </div>
        </div>
    </section>

</div>

</body>
</html>
