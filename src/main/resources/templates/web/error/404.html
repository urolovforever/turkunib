<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org"
      th:replace="~{web/fragments/layout :: layout (~{::content}, ${'Error :: Page Not Found'}, 'error', ~{})}">
<head>
    <meta charset="UTF-8">
    <title>TIU TURKUNIB — 404</title>
</head>
<body>
<div th:fragment="content">
    <div class="container-fluid" style="margin:15rem 0 15rem 0">
        <div class="row justify-content-center">
            <div class="col-8">
                <div class="text-center p-4 p-lg-5">
                    <h1 class="display-3 fw-bold mb-2" style="letter-spacing:1px;">404</h1>
                    <p class="text-muted mb-4" th:text="#{error.404.message}">The page you are looking for doesn’t exist or was moved.</p>

                    <div class="d-flex flex-column flex-sm-row gap-2 justify-content-center">
                        <a class="btn btn-primary px-4" th:href="@{'/'}">
                            <i class="bi bi-house-door me-1"></i>
                            <span th:text="#{error.home}">Go to Home</span>
                        </a>
                        <a class="btn btn-outline-secondary px-4" href="#" onclick="history.back(); return false;">
                            <i class="bi bi-arrow-left me-1"></i>
                            <span th:text="#{error.back}">Go Back</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
