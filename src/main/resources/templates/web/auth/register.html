<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TURKUNIB :: Register</title>
    <link th:href="@{/resources/web/css/bootstrap.min.css}" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/resources/web/css/turkunib.css}" rel="stylesheet">
    <style>
        :root { --brand: #36348E; --accent: #FFC53A; }
        body.auth-page { background: linear-gradient(135deg, #eaf3fb 0%, #b7d8ef 100%); }
        .auth-wrap { min-height: 100vh; }
        .auth-card { border: none; border-radius: 16px; overflow: hidden; }
        .auth-card .card-accent { height: 6px; background: var(--accent); }
        .auth-logo { width: 100%; max-width: 300px; height: auto; }
        .auth-title { color: var(--brand); }
        .auth-card .form-control:focus { border-color: var(--brand); box-shadow: 0 0 0 .2rem rgba(54,52,142,.15); }
        .btn-brand { background-color: var(--brand); border: 1px solid var(--brand); color: #fff; font-weight: 600; }
        .btn-brand:hover { background-color: #2a2870; border-color: #2a2870; color: #fff; }
        .auth-link { color: var(--brand); font-weight: 600; }
    </style>
</head>
<body class="auth-page">
<div class="container">
    <div class="row auth-wrap justify-content-center align-items-center">
        <div class="col-md-7 col-lg-6 col-xl-5">
            <div class="card auth-card shadow-lg my-5">
                <div class="card-accent"></div>
                <div class="card-body p-4 p-md-5 bg-white">
                    <div class="d-flex justify-content-end flex-wrap gap-2 mb-2" style="font-size:.8rem;">
                        <a th:each="lc : ${T(com.tiu.turk.common.enums.TranslationLocale).values()}"
                           th:href="@{/set-lang(lang=${lc.code},redirect='/register')}"
                           th:text="${#strings.toUpperCase(lc.code)}"
                           class="text-decoration-none"
                           th:classappend="${#locale.language == lc.code} ? 'fw-bold auth-link' : 'text-muted'">EN</a>
                    </div>
                    <div class="text-center mb-4">
                        <a th:href="@{/}"><img th:src="@{/resources/web/img/turkunib-logo-2.svg}" alt="TURKUNIB" class="auth-logo"></a>
                        <h1 class="h4 mt-4 mb-1 auth-title" th:text="#{auth.register.title}">Create a student account</h1>
                        <p class="text-muted small mb-0" th:text="#{auth.register.subtitle}">Join the TURKUNIB student portal</p>
                    </div>

                    <div th:if="${error}" class="alert alert-danger py-2 small" role="alert" th:text="${error}"></div>

                    <form method="post" th:action="@{/register}" th:object="${registerForm}">
                        <div class="row g-3">
                            <div class="col-sm-6">
                                <label for="firstName" class="form-label" th:text="#{auth.register.firstname}">First name</label>
                                <input type="text" class="form-control" id="firstName" th:field="*{firstName}" required autofocus>
                            </div>
                            <div class="col-sm-6">
                                <label for="lastName" class="form-label" th:text="#{auth.register.lastname}">Last name</label>
                                <input type="text" class="form-control" id="lastName" th:field="*{lastName}">
                            </div>
                            <div class="col-12">
                                <label for="email" class="form-label" th:text="#{auth.register.email}">Email</label>
                                <input type="email" class="form-control" id="email" th:field="*{email}"
                                       placeholder="you@example.com" th:placeholder="#{auth.register.email.placeholder}" required>
                            </div>
                            <div class="col-sm-6">
                                <label for="password" class="form-label" th:text="#{auth.register.password}">Password</label>
                                <input type="password" class="form-control" id="password" th:field="*{password}"
                                       minlength="6" required>
                            </div>
                            <div class="col-sm-6">
                                <label for="confirmPassword" class="form-label" th:text="#{auth.register.confirm}">Confirm password</label>
                                <input type="password" class="form-control" id="confirmPassword" th:field="*{confirmPassword}"
                                       minlength="6" required>
                            </div>
                        </div>
                        <div class="mt-3">
                            <div th:replace="~{web/auth/_captcha :: captcha}"></div>
                        </div>
                        <button type="submit" class="btn btn-brand w-100 mt-2" th:text="#{auth.register.submit}">Create account</button>
                    </form>

                    <hr class="my-4">
                    <p class="text-center small mb-0">
                        <span th:text="#{auth.register.haveaccount}">Already registered?</span>
                        <a th:href="@{/login}" class="auth-link text-decoration-none" th:text="#{auth.register.signin}">Sign in</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{web/auth/_password_eye :: eye}"></div>
</body>
</html>
