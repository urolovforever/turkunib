<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TURKUNIB :: New password</title>
    <link th:href="@{/resources/web/css/bootstrap.min.css}" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/resources/web/css/turkunib.css}" rel="stylesheet">
    <style>
        :root { --brand: #36348E; --accent: #FFC53A; }
        body.auth-page { background: linear-gradient(135deg, #eaf3fb 0%, #b7d8ef 100%); }
        .auth-wrap { min-height: 100vh; }
        .auth-card { border: none; border-radius: 16px; overflow: hidden; }
        .auth-card .card-accent { height: 6px; background: var(--accent); }
        .auth-logo { width: 100%; max-width: 300px; height: auto; }
        .auth-title { color: var(--brand); }
        .auth-card .form-control:focus { border-color: var(--brand); box-shadow: 0 0 0 .2rem rgba(54,52,142,.15); }
        .btn-brand { background-color: var(--brand); border: 1px solid var(--brand); color: #fff; font-weight: 600; }
        .btn-brand:hover { background-color: #2a2870; border-color: #2a2870; color: #fff; }
        .auth-link { color: var(--brand); font-weight: 600; }
    </style>
</head>
<body class="auth-page">
<div class="container">
    <div class="row auth-wrap justify-content-center align-items-center">
        <div class="col-md-6 col-lg-5 col-xl-4">
            <div class="card auth-card shadow-lg my-4">
                <div class="card-accent"></div>
                <div class="card-body p-4 p-md-5 bg-white">
                    <div class="text-center mb-4">
                        <a th:href="@{/}"><img th:src="@{/resources/web/img/turkunib-logo-2.svg}" alt="TURKUNIB" class="auth-logo"></a>
                        <h1 class="h4 mt-4 mb-1 auth-title" th:text="#{auth.reset.title}">Choose a new password</h1>
                        <p th:unless="${invalidToken}" class="text-muted small mb-0" th:text="#{auth.reset.subtitle}">Enter a new password for your account</p>
                    </div>

                    <div th:if="${invalidToken}">
                        <div class="alert alert-warning py-2 small" role="alert">
                            <strong th:text="#{auth.reset.invalid.title}">This link is invalid or has expired</strong><br>
                            <span th:text="#{auth.reset.invalid.text}">Password reset links are valid for 1 hour. Please request a new one.</span>
                        </div>
                        <a th:href="@{/forgot-password}" class="btn btn-brand w-100" th:text="#{auth.reset.invalid.again}">Request a new link</a>
                    </div>

                    <div th:unless="${invalidToken}">
                        <div th:if="${error}" class="alert alert-danger py-2 small" role="alert" th:text="${error}"></div>

                        <form method="post" th:action="@{/reset-password}">
                            <input type="hidden" name="token" th:value="${token}">
                            <div class="mb-3">
                                <label for="password" class="form-label" th:text="#{auth.reset.password}">New password</label>
                                <input type="password" class="form-control" id="password" name="password"
                                       minlength="6" required autofocus>
                            </div>
                            <div class="mb-3">
                                <label for="confirmPassword" class="form-label" th:text="#{auth.reset.confirm}">Confirm new password</label>
                                <input type="password" class="form-control" id="confirmPassword" name="confirmPassword"
                                       minlength="6" required>
                            </div>
                            <button type="submit" class="btn btn-brand w-100" th:text="#{auth.reset.submit}">Change password</button>
                        </form>
                    </div>

                    <hr class="my-4">
                    <p class="text-center small mb-0">
                        <a th:href="@{/login}" class="auth-link text-decoration-none" th:text="#{auth.forgot.back}">Back to sign in</a>
                    </p>
                </div>
            </div>
            <p class="text-center small mt-3 mb-4" style="color: #36348E;">© Turkic Universities Union</p>
        </div>
    </div>
</div>
<div th:replace="~{web/auth/_password_eye :: eye}"></div>
</body>
</html>
