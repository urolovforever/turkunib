<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<body>
<!-- Show/hide toggle for every password input on the page.
     Include at the end of <body> with th:replace="~{web/auth/_password_eye :: eye}" -->
<div th:fragment="eye" th:remove="tag">
    <style>
        .pw-wrap { position: relative; }
        .pw-wrap input { padding-right: 44px !important; }
        .pw-eye { position: absolute; top: 50%; right: 12px; transform: translateY(-50%);
            cursor: pointer; color: #999; font-size: 17px; line-height: 1; }
        .pw-eye:hover { color: var(--brand, #36348E); }
    </style>
    <script>
        (function () {
            document.querySelectorAll('input[type=password]').forEach(function (inp) {
                if (inp.dataset.pwEye) return;
                inp.dataset.pwEye = '1';
                var w = document.createElement('div');
                w.className = 'pw-wrap';
                inp.parentNode.insertBefore(w, inp);
                w.appendChild(inp);
                var eye = document.createElement('span');
                eye.className = 'pw-eye';
                eye.innerHTML = '<i class="bi bi-eye" aria-hidden="true"></i>';
                w.appendChild(eye);
                eye.addEventListener('click', function () {
                    var show = inp.type === 'password';
                    inp.type = show ? 'text' : 'password';
                    eye.innerHTML = show ? '<i class="bi bi-eye-slash" aria-hidden="true"></i>'
                                         : '<i class="bi bi-eye" aria-hidden="true"></i>';
                });
            });
        })();
    </script>
</div>
</body>
</html>
