<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TURKUNIB :: Check your email</title>
    <link th:href="@{/resources/web/css/bootstrap.min.css}" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/resources/web/css/turkunib.css}" rel="stylesheet">
    <style>
        :root { --brand: #36348E; --accent: #FFC53A; }
        body.auth-page { background: linear-gradient(135deg, #eaf3fb 0%, #b7d8ef 100%); }
        .auth-wrap { min-height: 100vh; }
        .auth-card { border: none; border-radius: 16px; overflow: hidden; }
        .auth-card .card-accent { height: 6px; background: var(--accent); }
        .auth-logo { width: 100%; max-width: 300px; height: auto; }
        .auth-title { color: var(--brand); }
        .btn-brand { background-color: var(--brand); border: 1px solid var(--brand); color: #fff; font-weight: 600; }
        .btn-brand:hover { background-color: #2a2870; border-color: #2a2870; color: #fff; }
        .auth-link { color: var(--brand); font-weight: 600; }
        .mail-icon { font-size: 56px; color: var(--brand); }
    </style>
</head>
<body class="auth-page">
<div class="container">
    <div class="row auth-wrap justify-content-center align-items-center">
        <div class="col-md-6 col-lg-5 col-xl-4">
            <div class="card auth-card shadow-lg my-4">
                <div class="card-accent"></div>
                <div class="card-body p-4 p-md-5 bg-white text-center">
                    <a th:href="@{/}"><img th:src="@{/resources/web/img/turkunib-logo-2.svg}" alt="TURKUNIB" class="auth-logo"></a>
                    <div class="mail-icon mt-4"><i class="bi bi-envelope-check"></i></div>
                    <h1 class="h4 mt-3 mb-2 auth-title" th:text="#{auth.activation.sent.title}">Check your email</h1>
                    <p class="text-muted small" th:text="#{auth.activation.sent.text}">
                        We have sent an activation link to your email address. Click the link to activate your account.
                    </p>
                    <p class="text-muted small" th:text="#{auth.activation.sent.hint}">
                        Didn't receive the email? Check your spam folder or request a new link.
                    </p>
                    <a th:href="@{/resend-activation}" class="auth-link text-decoration-none small" th:text="#{auth.activation.resend}">Resend activation email</a>
                    <hr class="my-4">
                    <p class="text-center small mb-0">
                        <a th:href="@{/login}" class="auth-link text-decoration-none" th:text="#{auth.forgot.back}">Back to sign in</a>
                    </p>
                </div>
            </div>
            <p class="text-center small mt-3 mb-4" style="color: #36348E;">© Turkic Universities Union</p>
        </div>
    </div>
</div>
</body>
</html>
