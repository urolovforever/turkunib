<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TURKUNIB :: Resend activation</title>
    <link th:href="@{/resources/web/css/bootstrap.min.css}" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/resources/web/css/turkunib.css}" rel="stylesheet">
    <style>
        :root { --brand: #36348E; --accent: #FFC53A; }
        body.auth-page { background: linear-gradient(135deg, #eaf3fb 0%, #b7d8ef 100%); }
        .auth-wrap { min-height: 100vh; }
        .auth-card { border: none; border-radius: 16px; overflow: hidden; }
        .auth-card .card-accent { height: 6px; background: var(--accent); }
        .auth-logo { width: 100%; max-width: 300px; height: auto; }
        .auth-title { color: var(--brand); }
        .auth-card .form-control:focus { border-color: var(--brand); box-shadow: 0 0 0 .2rem rgba(54,52,142,.15); }
        .btn-brand { background-color: var(--brand); border: 1px solid var(--brand); color: #fff; font-weight: 600; }
        .btn-brand:hover { background-color: #2a2870; border-color: #2a2870; color: #fff; }
        .auth-link { color: var(--brand); font-weight: 600; }
    </style>
</head>
<body class="auth-page">
<div class="container">
    <div class="row auth-wrap justify-content-center align-items-center">
        <div class="col-md-6 col-lg-5 col-xl-4">
            <div class="card auth-card shadow-lg my-4">
                <div class="card-accent"></div>
                <div class="card-body p-4 p-md-5 bg-white">
                    <div class="text-center mb-4">
                        <a th:href="@{/}"><img th:src="@{/resources/web/img/turkunib-logo-2.svg}" alt="TURKUNIB" class="auth-logo"></a>
                        <h1 class="h4 mt-4 mb-1 auth-title" th:text="#{auth.resend.title}">Resend activation link</h1>
                        <p class="text-muted small mb-0" th:text="#{auth.resend.subtitle}">Enter your email and we will send a new activation link</p>
                    </div>

                    <div th:if="${error}" class="alert alert-danger py-2 small" role="alert" th:text="${error}"></div>

                    <div th:if="${param.invalid}" class="alert alert-warning py-2 small" role="alert" th:text="#{auth.resend.invalidtoken}">
                        That activation link is invalid or has expired. Request a new one below.
                    </div>

                    <div th:if="${param.sent}" class="alert alert-success py-2 small" role="alert" th:text="#{auth.resend.sent}">
                        If an inactive account exists with that email, a new activation link has been sent.
                    </div>

                    <form th:unless="${param.sent}" method="post" th:action="@{/resend-activation}">
                        <div class="mb-3">
                            <label for="email" class="form-label" th:text="#{auth.forgot.email}">Email</label>
                            <input type="email" class="form-control" id="email" name="email" th:value="${email}"
                                   placeholder="you@example.com" th:placeholder="#{auth.login.email.placeholder}" required autofocus>
                        </div>
                        <div th:replace="~{web/auth/_captcha :: captcha}"></div>
                        <button type="submit" class="btn btn-brand w-100" th:text="#{auth.resend.submit}">Send activation link</button>
                    </form>

                    <hr class="my-4">
                    <p class="text-center small mb-0">
                        <a th:href="@{/login}" class="auth-link text-decoration-none" th:text="#{auth.forgot.back}">Back to sign in</a>
                    </p>
                </div>
            </div>
            <p class="text-center small mt-3 mb-4" style="color: #36348E;">© Turkic Universities Union</p>
        </div>
    </div>
</div>
</body>
</html>
