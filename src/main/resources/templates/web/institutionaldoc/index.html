<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org"
      th:replace="~{web/fragments/layout :: layout (~{::content}, ${heading + ' :: TURKUNIB'}, 'institutional-docs', ~{})}">
<head>
    <meta charset="UTF-8">
    <title>TIU TURKUNIB - Documents</title>
</head>
<body>
<div th:fragment="content">

    <th:block th:replace="~{web/fragments/hero-banner :: hero-banner(${banners})}"></th:block>

    <section class="py-5">
        <div class="container">
            <div class="row mb-4">
                <div class="col">
                    <h1 class="h2-bigger" th:text="${heading}">Documents</h1>
                    <p class="text-muted" th:text="${intro}">Intro</p>
                </div>
            </div>

            <div class="list-group shadow-sm">
                <div class="list-group-item d-flex justify-content-between align-items-center flex-wrap"
                     th:each="d : ${documents}">
                    <div class="me-3">
                        <div class="fw-semibold">
                            <span th:text="${d.title}">Title</span>
                            <span class="text-muted small" th:if="${d.documentYear != null}" th:text="' (' + ${d.documentYear} + ')'"></span>
                        </div>
                        <small class="text-muted" th:if="${d.description}" th:text="${d.description}"></small>
                    </div>
                    <a th:if="${d.file != null}"
                       th:href="@{|/uploads${d.file.filePath}${d.file.fileFileName}|}"
                       class="btn btn-sm btn-outline-brand mt-2 mt-md-0" target="_blank">
                        <i class="bi bi-download me-1"></i> <span th:text="#{common.download}">Download</span>
                    </a>
                </div>
                <div th:if="${documents == null or documents.isEmpty()}" class="list-group-item text-center text-muted py-5">
                    <i class="bi bi-file-earmark-text fs-1 d-block mb-3"></i>
                    <span th:text="#{page.docs.empty}">Documents will be published here soon.</span>
                </div>
            </div>
        </div>
    </section>

</div>

</body>
</html>
