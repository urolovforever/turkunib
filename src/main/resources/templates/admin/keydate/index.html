<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org"
      th:replace="~{admin/fragments/layout :: layout (~{::content}, 'TIU TURKUNIB :: Academic Calendar', 'key-dates', ~{})}">
<head>
    <meta charset="UTF-8">
    <title>TIU TURKUNIB - Academic Calendar</title>
</head>
<body>
<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 text-gray-800 mb-0">Academic Calendar &amp; Key Dates</h1>
    </div>

    <th:block th:replace="~{admin/fragments/message :: message(${error}, ${success})}"></th:block>

    <div class="row">
        <div class="col-lg-5 mb-4">
            <div class="card shadow">
                <div class="card-header py-3">
                    <h6 class="m-0 font-weight-bold text-primary">Add Date</h6>
                </div>
                <div class="card-body">
                    <form method="post" th:action="@{/admin/key-dates/create}" th:object="${form}">
                        <p class="text-muted small mb-2">Fill the <strong>EN</strong> tab (required); add other languages in their tabs — any left empty falls back to English.</p>
                        <th:block th:replace="~{admin/fragments/language-tab :: language-tabs}"></th:block>
                        <div class="tab-content mb-3">
                            <div class="tab-pane fade" th:classappend="${loc.name() == 'EN'} ? 'show active' : ''"
                                 th:each="loc : ${T(com.tiu.turk.common.enums.TranslationLocale).values()}"
                                 th:id="'lang-' + ${loc.code}" role="tabpanel">
                                <div class="form-group">
                                    <label>Title <span th:if="${loc.name() == 'EN'}" class="text-danger">*</span></label>
                                    <input type="text" class="form-control" th:field="*{translations[__${loc.name()}__].title}" th:required="${loc.name() == 'EN'}">
                                </div>
                                <div class="form-group">
                                    <label>Description</label>
                                    <textarea class="form-control" rows="3" th:field="*{translations[__${loc.name()}__].description}"></textarea>
                                </div>
                            </div>
                        </div>

                        <hr>
                        <p class="text-muted small mb-2">Shared (same for all languages):</p>
                        <div class="form-row">
                            <div class="form-group col-6">
                                <label for="eventDate">Date</label>
                                <input type="date" class="form-control" id="eventDate" name="eventDate" required>
                            </div>
                            <div class="form-group col-6">
                                <label for="endDate">End date <small class="text-muted">(optional)</small></label>
                                <input type="date" class="form-control" id="endDate" name="endDate">
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="type">Type</label>
                            <select class="form-control" id="type" name="type">
                                <option th:each="t : ${types}" th:value="${t.name()}" th:text="${t.name()}"></option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary shadow-sm">Add date</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-lg-7 mb-4">
            <div class="card shadow">
                <div class="card-header py-3">
                    <h6 class="m-0 font-weight-bold text-primary">Dates</h6>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="thead-light">
                            <tr>
                                <th>Date</th>
                                <th>Title</th>
                                <th>Type</th>
                                <th class="text-right">Action</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="d : ${keyDates}">
                                <td th:text="${#temporals.format(d.eventDate, 'dd MMM yyyy')}">—</td>
                                <td th:text="${d.title}">Title</td>
                                <td><span class="badge badge-info" th:text="${d.type}">TYPE</span></td>
                                <td class="text-right">
                                    <a th:href="@{|/admin/key-dates/edit/${d.id}|}" class="btn btn-sm btn-outline-primary">Edit</a>
                                    <a th:href="@{|/admin/key-dates/translations/${d.id}|}" class="btn btn-sm btn-outline-info">Languages</a>
                                    <a th:href="@{|/admin/key-dates/translate/${d.id}|}" class="btn btn-sm btn-outline-success"
                                       title="Translate to all 7 languages via AI"
                                       onclick="return confirm('Translate this date into all languages? This uses the AI translator.');">Translate</a>
                                    <form method="post" th:action="@{|/admin/key-dates/delete/${d.id}|}" class="d-inline"
                                          onsubmit="return confirm('Delete this date?');">
                                        <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                                    </form>
                                </td>
                            </tr>
                            <tr th:if="${keyDates == null or keyDates.isEmpty()}">
                                <td colspan="4" class="text-center text-muted py-4">No dates yet.</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
