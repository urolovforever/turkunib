<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org"
      th:replace="~{admin/fragments/layout :: layout (~{::content}, 'TIU TURKUNIB :: Newsletter', 'newsletter', ~{})}">
<head>
    <meta charset="UTF-8">
    <title>TIU TURKUNIB - Newsletter</title>
</head>
<body>
<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 text-gray-800 mb-0">Newsletter Subscribers</h1>
        <span class="badge badge-primary p-2">Total: <span th:text="${total}">0</span></span>
    </div>

    <div class="card shadow">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="thead-light">
                    <tr>
                        <th>Email</th>
                        <th>Subscribed at</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="s : ${subscribers}">
                        <td th:text="${s.email}">email</td>
                        <td th:text="${#temporals.format(s.createdAt, 'dd MMM yyyy, HH:mm')}">—</td>
                    </tr>
                    <tr th:if="${subscribers == null or subscribers.isEmpty()}">
                        <td colspan="2" class="text-center text-muted py-4">No subscribers yet.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

</body>
</html>
