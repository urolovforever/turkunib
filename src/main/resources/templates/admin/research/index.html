<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org"
      th:replace="~{admin/fragments/layout :: layout (~{::content}, 'TIU TURKUNIB :: Research Projects', 'research', ~{})}">
<head>
    <meta charset="UTF-8">
    <title>TIU TURKUNIB - Research Projects</title>
</head>
<body>
<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 text-gray-800 mb-0">Research Projects</h1>
    </div>

    <th:block th:replace="~{admin/fragments/message :: message(${error}, ${success})}"></th:block>

    <div class="row">
        <div class="col-lg-5 mb-4">
            <div class="card shadow">
                <div class="card-header py-3">
                    <h6 class="m-0 font-weight-bold text-primary">Add Research Project</h6>
                </div>
                <div class="card-body">
                    <form method="post" th:action="@{/admin/research/create}" th:object="${form}">
                        <p class="text-muted small mb-2">Fill the <strong>EN</strong> tab (required); add other languages in their tabs — any left empty falls back to English.</p>
                        <th:block th:replace="~{admin/fragments/language-tab :: language-tabs}"></th:block>
                        <div class="tab-content mb-3">
                            <div class="tab-pane fade" th:classappend="${loc.name() == 'EN'} ? 'show active' : ''"
                                 th:each="loc : ${T(com.tiu.turk.common.enums.TranslationLocale).values()}"
                                 th:id="'lang-' + ${loc.code}" role="tabpanel">
                                <div class="form-group">
                                    <label>Title <span th:if="${loc.name() == 'EN'}" class="text-danger">*</span></label>
                                    <input type="text" class="form-control" th:field="*{translations[__${loc.name()}__].title}" th:required="${loc.name() == 'EN'}">
                                </div>
                                <div class="form-group">
                                    <label>Subject area</label>
                                    <input type="text" class="form-control" th:field="*{translations[__${loc.name()}__].subjectArea}">
                                </div>
                                <div class="form-group">
                                    <label>Participating universities</label>
                                    <input type="text" class="form-control" th:field="*{translations[__${loc.name()}__].participatingUniversities}"
                                           placeholder="e.g. ADA University, Khazar University, TIU">
                                </div>
                                <div class="form-group">
                                    <label>Short description <small class="text-muted">(summary on the list)</small></label>
                                    <textarea class="form-control" rows="2" th:field="*{translations[__${loc.name()}__].description}"></textarea>
                                </div>
                                <div class="form-group">
                                    <label>Full details <small class="text-muted">(shown on the detail page; basic HTML allowed)</small></label>
                                    <textarea class="form-control" rows="6" th:field="*{translations[__${loc.name()}__].content}"></textarea>
                                </div>
                            </div>
                        </div>

                        <hr>
                        <p class="text-muted small mb-2">Shared (same for all languages):</p>
                        <div class="form-row">
                            <div class="form-group col-6">
                                <label for="startYear">Start year</label>
                                <input type="number" class="form-control" id="startYear" name="startYear" min="1900" max="2100">
                            </div>
                            <div class="form-group col-6">
                                <label for="endYear">End year</label>
                                <input type="number" class="form-control" id="endYear" name="endYear" min="1900" max="2100">
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="status">Status</label>
                            <select class="form-control" id="status" name="status">
                                <option th:each="s : ${statuses}" th:value="${s.name()}" th:text="${s.name()}"></option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary shadow-sm">Add project</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-lg-7 mb-4">
            <div class="card shadow">
                <div class="card-header py-3">
                    <h6 class="m-0 font-weight-bold text-primary">Projects</h6>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="thead-light">
                            <tr>
                                <th>Title</th>
                                <th>Subject</th>
                                <th>Status</th>
                                <th class="text-right">Action</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="p : ${projects}">
                                <td th:text="${p.title}">Title</td>
                                <td th:text="${p.subjectArea}">—</td>
                                <td><span class="badge badge-info" th:text="${p.status}">STATUS</span></td>
                                <td class="text-right">
                                    <a th:href="@{|/admin/research/edit/${p.id}|}" class="btn btn-sm btn-outline-primary">Edit</a>
                                    <a th:href="@{|/admin/research/translations/${p.id}|}" class="btn btn-sm btn-outline-info">Languages</a>
                                    <a th:href="@{|/admin/research/translate/${p.id}|}" class="btn btn-sm btn-outline-success"
                                       title="Translate to all 7 languages via AI"
                                       onclick="return confirm('Translate this research project into all languages? This uses the AI translator.');">Translate</a>
                                    <form method="post" th:action="@{|/admin/research/delete/${p.id}|}" class="d-inline"
                                          onsubmit="return confirm('Delete this project?');">
                                        <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                                    </form>
                                </td>
                            </tr>
                            <tr th:if="${projects == null or projects.isEmpty()}">
                                <td colspan="4" class="text-center text-muted py-4">No research projects yet.</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
