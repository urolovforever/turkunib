<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org"
      th:replace="~{admin/fragments/layout :: layout (~{::content}, 'TIU TURKUNIB :: Edit Resource', 'pre-departure', ~{})}">
<head>
    <meta charset="UTF-8">
    <title>TIU TURKUNIB - Edit Resource</title>
</head>
<body>
<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 text-gray-800 mb-0">Edit Resource</h1>
        <a th:href="@{/admin/pre-departure/}" class="btn btn-outline-secondary border-secondary shadow-sm">Back to list</a>
    </div>

    <th:block th:replace="~{admin/fragments/message :: message(${error}, ${success})}"></th:block>

    <div class="card shadow">
        <div class="card-body">
            <form method="post" th:action="@{|/admin/pre-departure/update/${resource.id}|}" enctype="multipart/form-data">
                <div class="form-group">
                    <label for="title">Title</label>
                    <input type="text" class="form-control" id="title" name="title" th:value="${resource.title}" required>
                </div>
                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea class="form-control" id="description" name="description" rows="3" th:text="${resource.description}"></textarea>
                </div>
                <div class="form-group">
                    <label for="file">File <small class="text-muted">Leave empty to keep the current file.</small></label>
                    <input type="file" class="form-control-file" id="file" name="file">
                    <small th:if="${resource.file != null}" class="form-text">
                        Current: <a th:href="@{|/uploads${resource.file.filePath}${resource.file.fileFileName}|}" target="_blank" th:text="${resource.file.fileFileName}">file</a>
                    </small>
                </div>
                <button type="submit" class="btn btn-primary shadow-sm">Save changes</button>
            </form>
        </div>
    </div>
</div>

</body>
</html>
