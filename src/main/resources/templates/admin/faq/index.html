<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org"
      th:replace="~{admin/fragments/layout :: layout (~{::content}, 'TIU TURKUNIB :: FAQ', 'faq', ~{})}">
<head>
    <meta charset="UTF-8">
    <title>TIU TURKUNIB - FAQ</title>
</head>
<body>
<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 text-gray-800 mb-0">Frequently Asked Questions</h1>
    </div>

    <th:block th:replace="~{admin/fragments/message :: message(${error}, ${success})}"></th:block>

    <div class="row">
        <div class="col-lg-5 mb-4">
            <div class="card shadow">
                <div class="card-header py-3">
                    <h6 class="m-0 font-weight-bold text-primary">Add Question</h6>
                </div>
                <div class="card-body">
                    <form method="post" th:action="@{/admin/faq/create}" th:object="${form}">
                        <p class="text-muted small mb-2">Fill the <strong>EN</strong> tab (required); add other languages in their tabs — any left empty falls back to English.</p>
                        <th:block th:replace="~{admin/fragments/language-tab :: language-tabs}"></th:block>
                        <div class="tab-content mb-3">
                            <div class="tab-pane fade" th:classappend="${loc.name() == 'EN'} ? 'show active' : ''"
                                 th:each="loc : ${T(com.tiu.turk.common.enums.TranslationLocale).values()}"
                                 th:id="'lang-' + ${loc.code}" role="tabpanel">
                                <div class="form-group">
                                    <label>Question <span th:if="${loc.name() == 'EN'}" class="text-danger">*</span></label>
                                    <textarea class="form-control" rows="2" th:field="*{translations[__${loc.name()}__].question}" th:required="${loc.name() == 'EN'}"></textarea>
                                </div>
                                <div class="form-group">
                                    <label>Answer <small class="text-muted">(basic HTML allowed)</small></label>
                                    <textarea class="form-control" rows="5" th:field="*{translations[__${loc.name()}__].answer}"></textarea>
                                </div>
                            </div>
                        </div>

                        <hr>
                        <p class="text-muted small mb-2">Shared (same for all languages):</p>
                        <div class="form-row">
                            <div class="form-group col-8">
                                <label for="category">Category</label>
                                <select class="form-control" id="category" name="category">
                                    <option th:each="c : ${categories}" th:value="${c.name()}" th:text="${c.name()}"></option>
                                </select>
                            </div>
                            <div class="form-group col-4">
                                <label for="displayOrder">Order</label>
                                <input type="number" class="form-control" id="displayOrder" name="displayOrder" value="0">
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary shadow-sm">Add question</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-lg-7 mb-4">
            <div class="card shadow">
                <div class="card-header py-3">
                    <h6 class="m-0 font-weight-bold text-primary">Questions</h6>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="thead-light">
                            <tr>
                                <th>Category</th>
                                <th>Question</th>
                                <th class="text-right">Action</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="f : ${faqs}">
                                <td><span class="badge badge-info" th:text="${f.category}">CAT</span></td>
                                <td th:text="${f.question}">Question</td>
                                <td class="text-right">
                                    <a th:href="@{|/admin/faq/edit/${f.id}|}" class="btn btn-sm btn-outline-primary">Edit</a>
                                    <a th:href="@{|/admin/faq/translations/${f.id}|}" class="btn btn-sm btn-outline-info">Languages</a>
                                    <a th:href="@{|/admin/faq/translate/${f.id}|}" class="btn btn-sm btn-outline-success"
                                       title="Translate to all 7 languages via AI"
                                       onclick="return confirm('Translate this question into all languages? This uses the AI translator.');">Translate</a>
                                    <form method="post" th:action="@{|/admin/faq/delete/${f.id}|}" class="d-inline"
                                          onsubmit="return confirm('Delete this question?');">
                                        <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                                    </form>
                                </td>
                            </tr>
                            <tr th:if="${faqs == null or faqs.isEmpty()}">
                                <td colspan="3" class="text-center text-muted py-4">No questions yet.</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
