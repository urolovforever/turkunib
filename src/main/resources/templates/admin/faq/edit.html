<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org"
      th:replace="~{admin/fragments/layout :: layout (~{::content}, 'TIU TURKUNIB :: Edit FAQ', 'faq', ~{})}">
<head>
    <meta charset="UTF-8">
    <title>TIU TURKUNIB - Edit FAQ</title>
</head>
<body>
<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 text-gray-800 mb-0">Edit Question</h1>
        <a th:href="@{/admin/faq/}" class="btn btn-outline-secondary border-secondary shadow-sm">Back to list</a>
    </div>

    <th:block th:replace="~{admin/fragments/message :: message(${error}, ${success})}"></th:block>

    <div class="card shadow">
        <div class="card-body">
            <form method="post" th:action="@{|/admin/faq/update/${faq.id}|}">
                <div class="form-group">
                    <label for="question">Question</label>
                    <input type="text" class="form-control" id="question" name="question" th:value="${faq.question}" required>
                </div>
                <div class="form-group">
                    <label for="answer">Answer <small class="text-muted">(basic HTML allowed)</small></label>
                    <textarea class="form-control" id="answer" name="answer" rows="5" th:text="${faq.answer}"></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group col-8">
                        <label for="category">Category</label>
                        <select class="form-control" id="category" name="category">
                            <option th:each="c : ${categories}" th:value="${c.name()}" th:text="${c.name()}" th:selected="${c == faq.category}"></option>
                        </select>
                    </div>
                    <div class="form-group col-4">
                        <label for="displayOrder">Order</label>
                        <input type="number" class="form-control" id="displayOrder" name="displayOrder" th:value="${faq.displayOrder}">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary shadow-sm">Save changes</button>
            </form>
        </div>
    </div>
</div>

</body>
</html>
