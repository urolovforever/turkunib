<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org"
      th:replace="~{admin/fragments/layout :: layout (~{::content}, 'TIU TURKUNIB :: Users List', 'users', ~{})}">
<head>
    <meta charset="UTF-8">
    <title>TIU TURKUNIB - Users List</title>
</head>
<body>
<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 text-gray-800 mb-0">Users List</h1>
        <div class="btn-group">
            <a th:href="@{/admin/user/create}" class="btn btn-primary btn-sm border-primary shadow-sm mr-2"><i class="fas fa-plus"></i> Add new user</a>
        </div>
    </div>

    <th:block th:replace="~{admin/fragments/message :: message(${error}, ${success})}"></th:block>

    <div class="card shadow mb-4">
        <div class="card-header py-3">
            <h6 class="m-0 font-weight-bold text-primary">Manage Users</h6>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover table-bordered table-sm align-middle mb-0">
                    <thead class="bg-light">
                    <tr>
                        <th class="font-weight-bold" style="min-width: 320px;">Email</th>
                        <th class="font-weight-bold" style="min-width: 120px;">Enabled</th>
                        <th class="font-weight-bold" style="min-width: 120px;">Full name</th>
                        <th class="font-weight-bold" style="min-width: 120px;">Roles</th>
                        <th class="font-weight-bold" style="min-width: 120px;">Updated</th>
                        <th class="font-weight-bold text-center" style="min-width: 120px;">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="item : ${page.content}">
                        <td th:text="${item.email}"></td>
                        <td>
                            <span th:if="${item.enabled}" class="badge badge-success">Enabled</span>
                            <span th:if="${!item.enabled}" class="badge badge-secondary">Disabled</span>
                        </td>
                        <td th:text="${item.firstName + ' ' + item.lastName}"></td>
                        <td>
                            <span th:each="role : ${item.roles}" class="badge badge-info mr-1" th:text="${role.fullName}"></span>
                        </td>
                        <td th:text="${#temporals.format(item.updatedAt, 'yyyy-MM-dd HH:mm')}"></td>
                        <td class="text-center">
                            <a th:href="@{/admin/user/show/{id}(id=${item.id})}" class="btn btn-link p-0 mx-1" title="View"><i class="fas fa-eye text-info"></i></a>
                            <a th:href="@{'/admin/user/edit/' + ${item.id}}" class="btn btn-link p-0 mx-1" title="Edit"><i class="fas fa-edit text-primary"></i></a>
                            <form th:action="@{/admin/user/delete/{id}(id=${item.id})}" method="post" class="d-inline" onsubmit="return confirm('Delete this user permanently?');">
                                <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <input type="hidden" name="_method" value="delete"/>
                                <button type="submit" class="btn btn-link p-0 mx-1" title="Delete"><i class="fas fa-trash text-danger"></i></button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(page.content)}">
                        <td colspan="6" class="text-center text-muted py-4">No users found.</td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div th:replace="~{admin/fragments/pagination :: pagination(${page}, '/admin/user/')}"></div>

        </div>
    </div>

</div>
</body>
</html>
