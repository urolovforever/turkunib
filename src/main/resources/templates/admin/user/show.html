<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org"
      th:replace="~{admin/fragments/layout :: layout (~{::content}, 'TIU TURKUNIB :: Show User', 'users', ~{})}">
<head>
    <meta charset="UTF-8">
    <title>TIU TURKUNIB - Show User</title>
</head>
<body>
<div th:fragment="content" th:object="${user}">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 text-gray-800 mb-0">User Details</h1>
        <div class="btn-group">
            <a th:href="@{/admin/user/edit/{id}(id=*{id})}" class="btn btn-primary btn-sm border-primary shadow-sm mr-2">
                <i class="fas fa-edit"></i> Edit
            </a>
        </div>
    </div>

    <th:block th:replace="~{admin/fragments/message :: message(${error}, ${success})}"></th:block>

    <div class="row">
        <!-- Left column: General info -->
        <div class="col-lg-7 mb-4">
            <div class="card shadow h-100">
                <div class="card-header py-3 d-flex align-items-center justify-content-between">
                    <h6 class="m-0 font-weight-bold text-primary">General Information</h6>
                    <span class="small badge badge-info">ID: <span th:text="*{id}">—</span></span>
                </div>
                <div class="card-body">
                    <ul class="list-unstyled show-info-list">
                        <li class="border-bottom-dotted">
                            <span class="badge badge-light-blue d-flex justify-content-between align-items-center">
                                <span>Full name:</span>
                                <span th:text="*{#strings.defaultString(firstName, '') + ' ' + #strings.defaultString(lastName, '')}"></span>
                            </span>
                        </li>
                        <li class="border-bottom-dotted">
                            <span class="badge badge-light-blue d-flex justify-content-between align-items-center">
                                <span>Email:</span>
                                <span th:text="*{email}"></span>
                            </span>
                        </li>
                        <li class="border-bottom-dotted">
                            <span class="badge badge-light-blue d-flex justify-content-between align-items-center">
                                <span>Roles:</span>
                                <span>
                                    <span th:each="r : *{roles}" class="badge badge-info mr-1" th:text="${r.fullName}"></span>
                                </span>
                            </span>
                        </li>
                        <li class="border-bottom-dotted">
                            <span class="badge badge-light-blue d-flex justify-content-between align-items-center">
                                <span>Created:</span>
                                <span th:text="${#temporals.format(user.createdAt, 'dd MMM yyyy HH:mm')}"></span>
                            </span>
                        </li>
                        <li class="border-bottom-dotted">
                            <span class="badge badge-light-blue d-flex justify-content-between align-items-center">
                                <span>Updated:</span>
                                <span th:text="${#temporals.format(user.updatedAt, 'dd MMM yyyy HH:mm')}"></span>
                            </span>
                        </li>
                        <li class="border-bottom-dotted">
                            <span class="badge badge-light-blue d-flex justify-content-between align-items-center">
                                <span>Enabled:</span>
                                <span>
                                    <span th:if="*{enabled}" class="text-success font-weight-bold">Yes</span>
                                    <span th:if="!*{enabled}" class="text-danger font-weight-bold">No</span>
                                </span>
                            </span>
                        </li>
                    </ul>
                </div>
            </div>
        </div>

        <!-- Right column: Placeholder (kept for layout consistency) -->
        <div class="col-lg-5 mb-4">
            <div class="card shadow h-100">
                <div class="card-header py-3 d-flex align-items-center justify-content-between">
                    <h6 class="m-0 font-weight-bold text-primary">Profile</h6>
                </div>
                <div class="card-body d-flex flex-column align-items-start">
                    <div class="text-muted small">No profile image.</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bottom action bar -->
    <div class="card shadow mb-4">
        <div class="card-body d-flex flex-wrap justify-content-between align-items-center">
            <a th:href="@{/admin/user/}" class="btn btn-outline-secondary border-secondary shadow-sm">Back to list</a>
        </div>
    </div>
</div>
</body>
</html>
