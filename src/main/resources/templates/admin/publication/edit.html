<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org"
      th:replace="~{admin/fragments/layout :: layout (~{::content}, 'TIU TURKUNIB :: Edit Publication', 'publications', ~{})}">
<head>
    <meta charset="UTF-8">
    <title>TIU TURKUNIB - Edit Publication</title>
</head>
<body>
<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 text-gray-800 mb-0">Edit Publication</h1>
        <a th:href="@{/admin/publications/}" class="btn btn-outline-secondary border-secondary shadow-sm">Back to list</a>
    </div>

    <th:block th:replace="~{admin/fragments/message :: message(${error}, ${success})}"></th:block>

    <div class="card shadow">
        <div class="card-body">
            <form method="post" th:action="@{|/admin/publications/update/${publication.id}|}" enctype="multipart/form-data">
                <div class="form-group">
                    <label for="title">Title</label>
                    <input type="text" class="form-control" id="title" name="title" th:value="${publication.title}" required>
                </div>
                <div class="form-row">
                    <div class="form-group col-md-6">
                        <label for="category">Category</label>
                        <select class="form-control" id="category" name="category">
                            <option th:each="c : ${categories}" th:value="${c.name()}" th:text="${c.name()}" th:selected="${c == publication.category}"></option>
                        </select>
                    </div>
                    <div class="form-group col-md-6">
                        <label for="publicationYear">Year</label>
                        <input type="number" class="form-control" id="publicationYear" name="publicationYear" min="1900" max="2100" th:value="${publication.publicationYear}">
                    </div>
                </div>
                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea class="form-control" id="description" name="description" rows="2" th:text="${publication.description}"></textarea>
                </div>
                <div class="form-group">
                    <label for="file">File (PDF) <small class="text-muted">Leave empty to keep the current file.</small></label>
                    <input type="file" class="form-control-file" id="file" name="file">
                    <small th:if="${publication.file != null}" class="form-text">
                        Current: <a th:href="@{|/uploads${publication.file.filePath}${publication.file.fileFileName}|}" target="_blank" th:text="${publication.file.fileFileName}">file</a>
                    </small>
                </div>
                <button type="submit" class="btn btn-primary shadow-sm">Save changes</button>
            </form>
        </div>
    </div>
</div>

</body>
</html>
