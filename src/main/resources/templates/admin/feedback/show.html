<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org"
      th:replace="~{admin/fragments/layout :: layout (~{::content}, 'TIU TURKUNIB :: Feedback', 'feedback', ~{})}">
<head>
    <meta charset="UTF-8">
    <title>TIU TURKUNIB - Feedback</title>
</head>
<body>
<div th:fragment="content" th:object="${feedback}">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 text-gray-800 mb-0">Feedback Details</h1>
    </div>

    <th:block th:replace="~{admin/fragments/message :: message(${error}, ${success})}"></th:block>

    <div class="row">
        <!-- Left column: General info -->
        <div class="col-lg-6 mb-4">
            <div class="card shadow h-100">
                <div class="card-header py-3 d-flex align-items-center justify-content-between">
                    <h6 class="m-0 font-weight-bold text-primary">General Information</h6>
                    <span class="small badge badge-info">ID: <span th:text="*{id}">—</span></span>
                </div>
                <div class="card-body">

                    <ul class="list-unstyled show-info-list">
                        <li class="border-bottom-dotted">
                            <span class="badge badge-light-blue d-flex justify-content-between align-items-center">
                                <span>Name:</span>
                                <span class="ml-3 text-truncate" th:text="*{fullName}"></span>
                            </span>
                        </li>
                        <li class="border-bottom-dotted">
                            <span class="badge badge-light-blue d-flex justify-content-between align-items-center">
                                <span>Email:</span>
                                <span class="ml-3 text-truncate" th:text="*{email}"></span>
                            </span>
                        </li>
                        <li class="border-bottom-dotted">
                            <span class="badge badge-light-blue d-flex justify-content-between align-items-center">
                                <span>Subject:</span>
                                <span th:text="*{subject}"></span>
                            </span>
                        </li>
                        <li class="border-bottom-dotted">
                            <span class="badge badge-light-blue d-flex justify-content-between align-items-center">
                                <span>Created:</span>
                                <span th:text="*{#temporals.format(createdAt, 'dd MMM yyyy HH:mm')}"></span>
                            </span>
                        </li>
                    </ul>
                </div>
            </div>
        </div>

        <!-- Left column: General info -->
        <div class="col-lg-6 mb-4">
            <div class="card shadow h-100">
                <div class="card-header py-3 d-flex align-items-center justify-content-between">
                    <h6 class="m-0 font-weight-bold text-primary">Message</h6>
                </div>
                <div class="card-body">
                    <div class="border rounded p-3 bg-white small" th:text="*{message}">—</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bottom action bar -->
    <div class="card shadow mb-4">
        <div class="card-body d-flex flex-wrap justify-content-between align-items-center">
            <a th:href="@{/admin/feedback/}" class="btn btn-outline-secondary border-secondary shadow-sm">Back to list</a>
        </div>
    </div>
</div>
</body>
</html>
