<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org"
      th:replace="~{admin/fragments/layout :: layout (~{::content}, 'TIU TURKUNIB :: Webinar Registrations', 'webinars', ~{})}">
<head>
    <meta charset="UTF-8">
    <title>TIU TURKUNIB - Registrations</title>
</head>
<body>
<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 text-gray-800 mb-0">Registrations</h1>
        <a th:href="@{/admin/webinars/}" class="btn btn-outline-secondary border-secondary shadow-sm">Back</a>
    </div>

    <div class="card shadow">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="thead-light">
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Registered at</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="r : ${registrations}">
                        <td th:text="${r.fullName}">Name</td>
                        <td th:text="${r.email}">email</td>
                        <td th:text="${#temporals.format(r.createdAt, 'dd MMM yyyy, HH:mm')}">—</td>
                    </tr>
                    <tr th:if="${registrations == null or registrations.isEmpty()}">
                        <td colspan="3" class="text-center text-muted py-4">No registrations yet.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

</body>
</html>
