<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org"
      th:replace="~{admin/fragments/layout :: layout (~{::content}, 'TIU TURKUNIB :: Leadership Languages', 'leadership', ~{})}">
<head>
    <meta charset="UTF-8">
    <title>TIU TURKUNIB - Leadership Languages</title>
</head>
<body>
<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 text-gray-800 mb-0">Languages — <span th:text="${member.fullName}">Member</span></h1>
        <div>
            <a th:href="@{|/admin/leadership/edit/${memberId}|}" class="btn btn-outline-primary shadow-sm">Edit (English)</a>
            <a th:href="@{/admin/leadership/}" class="btn btn-outline-secondary border-secondary shadow-sm">Back to list</a>
        </div>
    </div>

    <th:block th:replace="~{admin/fragments/message :: message(${error}, ${success})}"></th:block>

    <div class="card shadow">
        <div class="card-body">
            <p class="text-muted">The <strong>EN</strong> tab shows the English base content (edit it in the main Edit form). Fill the other
                languages here; any field left empty falls back to English on the public site. The member's name is the same in every
                language and is not translated here.</p>

            <form method="post" th:action="@{|/admin/leadership/translations/${memberId}|}" th:object="${form}">
                <th:block th:replace="~{admin/fragments/language-tab :: language-tabs}"></th:block>

                <div class="tab-content" id="nav-tabContent">
                    <div class="tab-pane fade" th:classappend="${loc.name() == 'EN'} ? 'show active' : ''"
                         th:each="loc : ${T(com.tiu.turk.common.enums.TranslationLocale).values()}"
                         th:id="'lang-' + ${loc.code}" role="tabpanel">

                        <div class="form-group">
                            <label>Position</label>
                            <input type="text" class="form-control"
                                   th:field="*{translations[__${loc.name()}__].position}" th:readonly="${loc.name() == 'EN'}">
                        </div>
                        <div class="form-group">
                            <label>Organization / University</label>
                            <input type="text" class="form-control"
                                   th:field="*{translations[__${loc.name()}__].organization}" th:readonly="${loc.name() == 'EN'}">
                        </div>
                        <div class="form-group">
                            <label>Short biography</label>
                            <textarea class="form-control" rows="4"
                                      th:field="*{translations[__${loc.name()}__].bio}" th:readonly="${loc.name() == 'EN'}"></textarea>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary shadow-sm">Save translations</button>
            </form>
        </div>
    </div>
</div>

</body>
</html>
