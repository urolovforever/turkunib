<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org"
      th:replace="~{admin/fragments/layout :: layout (~{::content}, 'TIU TURKUNIB :: Applications', 'application-process', ~{})}">
<head>
    <meta charset="UTF-8">
    <title>TIU TURKUNIB - Applications</title>
</head>
<body>
<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 text-gray-800 mb-0">
            <i class="fas fa-paper-plane text-primary mr-2"></i>Applications
        </h1>
        <div class="btn-group">
            <a th:href="@{/admin/application-process/create}" class="btn btn-primary btn-sm border-primary shadow-sm">
                <i class="fas fa-plus mr-1"></i> Submit Application
            </a>
        </div>
    </div>

    <th:block th:replace="~{admin/fragments/message :: message(${error}, ${success})}"></th:block>

    <div class="card shadow mb-4">
        <div class="card-header py-3">
            <h6 class="m-0 font-weight-bold text-primary">Manage Applications</h6>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover table-bordered table-sm align-middle mb-0">
                    <thead class="bg-light">
                    <tr>
                        <th class="font-weight-bold" style="min-width: 50px;">#</th>
                        <th class="font-weight-bold" style="min-width: 150px;">From University</th>
                        <th class="font-weight-bold" style="min-width: 150px;">To University</th>
                        <th class="font-weight-bold" style="min-width: 100px;">Status</th>
                        <th class="font-weight-bold" style="min-width: 120px;">Document</th>
                        <th class="font-weight-bold" style="min-width: 120px;">Submitted</th>
                        <th class="font-weight-bold text-center" style="min-width: 100px;">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="item : ${applications}">
                        <td th:text="${item.id}">1</td>
                        <td>
                            <div class="d-flex align-items-center">
                                <i class="fas fa-university text-success mr-2"></i>
                                <span th:text="${item.universitySent?.name}">University A</span>
                            </div>
                        </td>
                        <td>
                            <div class="d-flex align-items-center">
                                <i class="fas fa-university text-danger mr-2"></i>
                                <span th:text="${item.universityReceived?.name}">University B</span>
                            </div>
                        </td>
                        <td>
                            <span th:if="${item.status.name() == 'NEW'}" class="badge badge-info">New</span>
                            <span th:if="${item.status.name() == 'PENDING'}" class="badge badge-warning">Pending</span>
                            <span th:if="${item.status.name() == 'APPROVED'}" class="badge badge-success">Approved</span>
                            <span th:if="${item.status.name() == 'REJECTED'}" class="badge badge-danger">Rejected</span>
                        </td>
                        <td>
                            <a th:if="${item.file != null}"
                               th:href="${item.file.url}"
                               target="_blank"
                               class="btn btn-outline-primary btn-sm"
                               title="Download Document">
                                <i class="fas fa-file-download mr-1"></i>
                                <span th:text="${item.file.fileType}">PDF</span>
                            </a>
                            <span th:if="${item.file == null}" class="text-muted">—</span>
                        </td>
                        <td th:text="${#temporals.format(item.createdAt, 'yyyy-MM-dd HH:mm')}">2025-01-01 12:00</td>
                        <td class="text-center">
                            <a th:href="@{/admin/application-process/show/{id}(id=${item.id})}" class="btn btn-link p-0 mx-1" title="View">
                                <i class="fas fa-eye text-info"></i>
                            </a>
                            <form th:action="@{/admin/application-process/delete/{id}(id=${item.id})}" method="post" class="d-inline" onsubmit="return confirm('Delete this application permanently?');">
                                <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <input type="hidden" name="_method" value="delete"/>
                                <button type="submit" class="btn btn-link p-0 mx-1" title="Delete">
                                    <i class="fas fa-trash text-danger"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${applications == null or applications.isEmpty()}">
                        <td colspan="7" class="text-center text-muted py-4">
                            <i class="fas fa-inbox fa-2x mb-2 d-block"></i>
                            No applications found.
                            <a th:href="@{/admin/application-process/create}" class="text-primary">Submit your first application</a>.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>

</div>
</body>
</html>
