page.directive.art6.contactgroup=Aloqa guruhi
page.directive.art6.p8=(8) Aloqa guruhida ishtirok etish uchun Turkiy Davlatlar Tashkiloti Bosh kotib oʻrinbosarini, aʼzo universitetlar esa prorektor bilan birga Ittifoq faoliyati uchun masʼul vakilni tayinlaydi.
page.directive.art6.p9=(9) Aloqa guruhining vazifasi Ittifoq qarorlarining amalga oshirilishini muvofiqlashtirishdan iborat.
page.directive.art6.p10=(10) Aloqa guruhi yiliga kamida ikki marta yigʻiladi.
page.directive.art6.studentcouncil=Talabalar kengashi
page.directive.art6.p11=(11) Ittifoq Talabalar kengashi Ittifoqning aʼzo universitetlaridan saylangan talabalardan tashkil topadi.
page.directive.art6.p12=(12) Talabalar kengashini tashkil etish, uning vazifalari va masʼuliyati hamda boshqa masalalar yuzasidan Ittifoq tomonidan alohida koʻrsatma tayyorlanadi.
page.directive.art7.title=Ittifoqning maqsadlari
page.directive.art7.intro=Umumiy tarix, madaniyat va tilga asoslangan holda, turkiyzabon xalqlar oʻrtasida doʻstlik va hamkorlikni rivojlantirish hamda aʼzo davlatlarning oliy taʼlim muassasalari oʻrtasida hamkorlikni taʼminlash uchun taʼlim darajasini yuksaltirish maqsadida quyidagi maqsadlarga erishish koʻzda tutiladi:
page.directive.art7.obj1=Barcha aʼzo universitetlarda zamonaviy ilmiy darajadagi tegishli taʼlim standartlarini joriy etish orqali umumiy sivilizatsiyaga oid oʻquv kurslarini oʻtkazish va shu orqali umumiy oʻzlik hamda madaniy ongga ega avlodlarni tarbiyalash;
page.directive.art7.obj2=Oliy taʼlim dasturlarini xalqaro akkreditatsiya standartlariga muvofiq uygʻunlashtirish;
page.directive.art7.obj3=Akademik xodimlar uchun malaka oshirish dasturlarini yaratish va amalga oshirish;
page.directive.art7.obj4=Talabalar va akademik xodimlar almashinuvini ragʻbatlantirish hamda buning uchun zarur moslashtirishlarni amalga oshirish;
page.directive.art7.obj5=Umumiy kredit koʻchirish tizimini shakllantirish;
page.directive.art7.obj6=Aʼzo universitetlar oʻrtasida oliy taʼlim dasturlarining tan olinishini taʼminlash hamda aʼzo universitetlarning bir-birining hujjatlari ekvivalentligini tan olishi uchun tegishli asos yaratish;
page.directive.art7.obj7=Muayyan sohalarda universitetlarning qiyosiy ustunliklaridan foydalanish;
page.directive.art7.obj8=Amalga oshirish mumkin boʻlgan qoʻshma taʼlim va tadqiqot loyihalari hamda dasturlarini roʻyobga chiqarish va bu sohada nashrlar chop etish;
page.directive.art7.obj9=Ijtimoiy va madaniy sohalarda hamkorlik qilish;
page.directive.art7.obj10=Turkiy dunyo boʻyicha tadqiqotlar olib boradigan talabalar uchun maxsus stipendiyalar ajratish;
page.directive.art7.obj11=Turkiy dunyoga oid akademik tadqiqotlar va loyihalar haqidagi maʼlumotlarning elektron shaklda almashinuvini taʼminlash hamda universitetlar tomonidan amalga oshirilayotgan tegishli tadqiqotlar manzillarini Turkiy Davlatlar Tashkiloti veb-saytida havola berilishi uchun Kotibiyat veb-saytiga yetkazish;
page.directive.art7.obj12=Ittifoq aʼzo universitetlarining tashqi baholash va akkreditatsiya jarayonlarida sifat kafolatiga xizmat qiluvchi mustaqil "Oliy taʼlim sifatini taʼminlash kengashi"ni tashkil etish va uning faoliyatini qoʻllab-quvvatlash;
page.directive.art7.obj13=Turkiy Davlatlar Tashkiloti aʼzolari uchun Oliy taʼlim maʼlumotlar bankini yaratish;
page.directive.art7.obj14=Turkiy dunyo indeksi va soha indekslarini yaratish;
page.directive.art7.obj15=Turkiy dunyo taʼlim portalini yaratish;
page.directive.art7.obj16=Turkiy Oliy Taʼlim Maydonini tashkil etish.
page.directive.art8.title=Ish tamoyillari
page.directive.art8.p1=(1) Ittifoq qarorlari Ittifoqqa aʼzo universitetlarning rektorlari yoki rektor vakillari hamda Turkiy Davlatlar Tashkiloti Bosh kotibi yoki uning vakillari ishtirok etadigan Bosh Assambleya yigʻilishida oddiy koʻpchilik ovoz bilan qabul qilinadi.
page.directive.art8.p2=(2) Ittifoqning kotibiyat ishlari Turkiy Davlatlar Tashkiloti Kotibiyati tomonidan raislik qiluvchi universitet bilan hamkorlikda amalga oshiriladi.
page.directive.art8.p3=(3) Ittifoqning institutsional tuzilmasi, ish tartib-taomillari va tamoyillari hamda moliyaviy masalalardagi amaliyoti Ittifoqqa aʼzo universitetlar tomonidan oddiy koʻpchilik ovoz bilan qabul qilingan qarorga asosan tayyorlanadigan koʻrsatmalarga muvofiq belgilanadi.
page.directive.art8.p4=(4) Amalga oshirish uchun qabul qilingan qarorlar va Ittifoq tomonidan tayyorlangan koʻrsatmalar Turkiya Oliy taʼlim kengashi raisi ham ishtirok etadigan Turkiy Kengash taʼlim vazirlari yigʻilishida tasdiqlanganidan soʻng kuchga kiradi.
page.directive.art8.p5=(5) Ittifoq faoliyati Oliy taʼlim kengashi raisligi vakilini ham oʻz ichiga olgan Turkiy Davlatlar Tashkiloti taʼlim vazirlarining Katta mansabdor shaxslari tomonidan kuzatib boriladi. Yuqorida qayd etilgan guruhning maqsadi quyidagilardan iborat:
page.directive.art8.wp1=jarayon davomida amalga oshirilishi rejalashtirilgan loyihalarni kuzatib borish;
page.directive.art8.wp2=aʼzo davlatlar oʻrtasida zarur muvofiqlashtirishni taʼminlash;
page.directive.art8.wp3=jarayonda yuzaga kelishi mumkin boʻlgan muammolarning yechimlarini amalga oshirish;
page.directive.art8.wp4=jarayon ishtirokchi tomonlari oʻrtasida maqbullik va qoʻllanuvchanlik darajasini oshirishga qaratilgan faoliyatni amalga oshirish;
page.directive.art8.wp5=milliy darajada duch kelinadigan muammolarni hal etish uchun zarur milliy qonunchilik oʻzgarishlarini oʻrganish hamda tegishli idoralarga tavsiyalar berish orqali koʻmak koʻrsatish.
page.directive.art9.title=Ittifoqning moliyaviy resurslari
page.directive.art9.intro=(1) Ittifoq tomonidan amalga oshiriladigan oliy taʼlim faoliyatining barcha xarajatlari quyida koʻrsatilgan manbalardan moliyalashtiriladi:
page.directive.art9.fin1=Aʼzo universitetlarning moliyaviy resurslari;
page.directive.art9.fin2=Tashkil etilishi rejalashtirilgan "Turkiy ilmiy tadqiqotlar jamgʻarmasi" tomonidan ajratiladigan mablagʻlar, shuningdek, milliy yoki xalqaro muassasalardan olinadigan resurslar;
page.directive.art9.fin3=Aʼzo davlatlar universitetlaridan loyiha asosida ajratiladigan qoʻshimcha resurslar;
page.directive.art9.fin4=Turkiy Davlatlar Tashkiloti aʼzolarining byudjetlaridan ajratiladigan resurslar.
page.directive.art10.title=Ittifoqqa aʼzolik
page.directive.art10.p1=(1) Nomzodlik arizalari yozma asoslar bilan Turkiy Kengash Kotibiyatiga taqdim etiladi. Aʼzolikka qabul qilish va aʼzolikni tugatish toʻgʻrisidagi qarorlar aloqa guruhi orqali aʼzo universitetlarning fikrlari olinganidan soʻng, Ittifoq aʼzolarining kamida uchdan ikki qismi ishtirokida oʻtkaziladigan Bosh Assambleya yigʻilishida oddiy koʻpchilik ovoz bilan qabul qilinadi.
page.directive.art10.membershiplink=Aʼzolik tartibi haqida batafsil maʼlumot
page.directive.art11.title=Turkiy dunyo Oliy Taʼlim Maydoni
page.directive.art11.p1=(1) TCHEA – aʼzo davlatlar oʻrtasida tashkil etilgan va unda oliy taʼlimga oid taʼlim faoliyati amalga oshiriladigan maydondir.
page.directive.art11.p2=(2) TCHEA aʼzo davlatlar tashkil etadigan umumiy platformalar orqali 7-moddada koʻrsatilgan maqsadlarga erishishni koʻzlaydi.
page.directive.art12.title=Amalga oshirish jarayonlari
page.directive.art12.p1=(1) Turkiy dunyo Oliy Taʼlim Maydoni doirasida Ittifoqqa aʼzo davlatlar hamkorlik sohalari boʻyicha quyidagi bandlarni uygʻunlashtirishlari zarur:
page.directive.art12.item1=Talabalar va akademik xodimlar uchun almashinuv dasturlari;
page.directive.art12.item2=Rasmiy (kunduzgi), masofaviy yoki ochiq taʼlim orqali amalga oshiriladigan assotsiat (kichik mutaxassislik), bakalavriat va magistratura darajalaridagi qoʻshma sertifikat dasturlarini ochishga oid oʻz mamlakatlarida amalda boʻlgan qonunchilik.
page.directive.art12.p2=(2) Amalga oshiriladigan hamkorlik doirasida quyidagi bandlar Turkiya Oliy taʼlim kengashi raisligi vakilini ham oʻz ichiga oladigan Turkiy Davlatlar Tashkiloti taʼlim vazirlarining Katta mansabdor shaxslari tomonidan qoʻllab-quvvatlanadi:
page.directive.art12.sup1=Ittifoqqa aʼzo universitetlar va boshqa rasmiy ilmiy muassasalar tomonidan beriladigan hujjatlar ekvivalentligini taʼminlash;
page.directive.art12.sup2=Turkiy dunyo Oliy Taʼlim Maydonini shakllantirish va keng yoyish vositalaridan foydalanish hamda ularni targʻib etish Turkiya Oliy taʼlim kengashi raisligi vakilining koʻmagi, shuningdek, turkiy davlatlar taʼlim vazirlarining Katta mansabdor shaxslari orqali ragʻbatlantiriladi.
page.directive.art13.title=Talabalar va akademik xodimlar harakatchanligi
page.directive.art13.p1=(1) Aʼzo universitetlarda hozirda faoliyat yuritayotgan va/yoki ochilishi rejalashtirilgan yozgi va qishki maktablarga boshqa aʼzo universitetlarning talabalari qabul qilinadi. Ushbu dasturlarda talabalarga yaratiladigan sharoitlar oʻzarolik asosida belgilanadi.
page.directive.art13.p2=(2) Talabalar va akademik xodimlar almashinuvi uchun Orhun dasturi namuna sifatida qoʻllaniladi.
page.directive.art13.p3=(3) Talabalarning avvalgi taʼlimini tan olish, talabalarni qabul qilish, taʼlim shartnomasi va transkript tayyorlash aʼzo universitetlar tomonidan belgilanadigan umumiy kredit tizimiga muvofiq tashkil etiladi.
page.directive.art13.orhunlink=Orhun almashinuv dasturi haqida batafsil maʼlumot
page.directive.art14.title=Qoidalar nazarda tutilmagan masalalar
page.directive.art14.p1=Ushbu Koʻrsatmani amalga oshirishda yuzaga kelishi mumkin boʻlgan muammolarni hal etish uchun oʻzgartirishlar Bosh Assambleya tomonidan qoʻshimcha hujjat bilan qabul qilinishi mumkin.
page.directive.art15.title=Koʻrsatma tillari
page.directive.art15.p1=Ushbu Koʻrsatma ozarbayjon, qozoq, qirgʻiz, turk va ingliz tillarida tayyorlangan.
page.directive.art16.title=Kuchga kirishi
page.directive.art16.p1=Ushbu Koʻrsatma qoidalari Ittifoq Bosh Assambleyasida maʼqullanganidan soʻng Turkiy Davlatlar Tashkiloti taʼlim vazirlari yigʻilishida tasdiqlangan sanadan eʼtiboran kuchga kiradi.
page.directive.art17.title=Ijro etilishi
page.directive.art17.p1=Ushbu Koʻrsatma qoidalari Kotibiyat tomonidan raislik qiluvchi universitet bilan hamkorlikda ijro etiladi.
page.directive.art17.p2=Ushbu jarayon Orhun dasturi deb belgilangan.
# Orhun Application Guide page
page.orhunguide.title=Orhun almashinuv dasturi — Ariza topshirish qoʻllanmasi
page.orhunguide.intro=Talabalar va akademik xodimlar uchun amaliy qoʻllanma: nomzodlarga qoʻyiladigan talablar, ariza topshirish jarayoni, talab qilinadigan hujjatlar hamda harakatchanlik uchun tanlanganingizdan soʻng bajarilishi lozim boʻlgan qadamlar.
page.orhunguide.download=Qoʻllanmani yuklab olish (PDF)
page.orhunguide.orhunlink=Joriy eʼlon, kvotalar va hujjat shablonlari
page.orhunguide.toc=Mundarija
page.orhunguide.doc.col1=Hujjat
page.orhunguide.doc.col2=Tavsif
page.orhunguide.s1.title=1. Orhun almashinuv dasturi haqida
page.orhunguide.s1.p1=Orhun almashinuv dasturi Turkiy Davlatlar Tashkiloti (TDT) doirasida faoliyat yurituvchi Turkiy Universitetlar Ittifoqi (TURKUNIB) tomonidan amalga oshiriladigan yetakchi dastur boʻlib, aʼzo davlatlarning oliy taʼlim muassasalari oʻrtasida talabalar va professor-oʻqituvchilar harakatchanligini ragʻbatlantiradi. Dastur akademik hamkorlikni rivojlantirish, muassasalararo aloqalarni mustahkamlash va xalqlar oʻrtasidagi madaniy oʻzaro taʼsirni kuchaytirishni maqsad qilib qoʻyadi.
page.orhunguide.s1.p2=Dastur 2017–2018 oʻquv yilida tajriba-sinov tarzida boshlangan; COVID-19 pandemiyasidan keyingi davrda qayta faollashtirilib, koʻlami kengaytirildi va bugungi kunda u 170 ta aʼzo universitetni birlashtirgan keng tarmoqqa aylandi.
page.orhunguide.s1.obj.title=Strategik maqsadlar
page.orhunguide.s1.obj1=Aʼzo davlatlar universitetlari oʻrtasida akademik integratsiya va harakatchanlikni oshirish,
page.orhunguide.s1.obj2="Turkiy dunyo Oliy Taʼlim Maydoni"ni yaratishga hissa qoʻshish,
page.orhunguide.s1.obj3=Oliy taʼlim tizimlarini Boloniya jarayoni va ECTS kabi xalqaro standartlarga uygʻunlashtirish,
page.orhunguide.s1.obj4=Mintaqaviy rivojlanish, ilmiy-tadqiqot hamkorligi va innovatsiyalarga hissa qoʻshish.
page.orhunguide.s1.countries.title=Dastur qamrab olgan aʼzo davlatlar
page.orhunguide.s1.countries.p1=Dastur doirasida akademik xodimlar va talabalar Turkiy Davlatlar Tashkiloti Universitetlar Ittifoqiga aʼzo boʻlgan universitetlarda harakatchanlikni amalga oshirish imkoniyatiga ega. Aʼzo davlatlar quyidagilardan iborat: Turkiya, Ozarbayjon, Qirgʻiziston, Qozogʻiston, Oʻzbekiston, Shimoliy Kipr Turk Respublikasi va Vengriya.
page.orhunguide.s2.title=2. Umumiy tamoyillar
page.orhunguide.s2s1.title=2.1 Protokollarga asoslanish
page.orhunguide.s2s1.p1=Orhun almashinuv dasturi faqat aʼzo muassasalar oʻrtasida imzolangan "Orhun almashinuv dasturi protokoli" doirasida amalga oshirilishi mumkin. Universitet oʻzi bilan protokol imzolanmagan muassasadan talabalar yoki professor-oʻqituvchilarni qabul qila olmaydi va u yerga yubora olmaydi. Protokolning bir nusxasi Turkiy Davlatlar Tashkiloti Kotibiyatida saqlanadi.
page.orhunguide.s2s2.title=2.2 Tillar
page.orhunguide.s2s2.p1=Dasturga oid meʼyoriy-huquqiy hujjatlar, maʼlumotlar, fayllar va hujjatlar aʼzo davlatlarning rasmiy tillarida, turk va ingliz tillarida tayyorlanadi. Matnlar oʻrtasida tafovut yuzaga kelgan taqdirda ingliz tilidagi matn ustuvor hisoblanadi.
page.orhunguide.s2s3.title=2.3 Moliyaviy resurslar
page.orhunguide.s2s3.fin1=Milliy yoki xalqaro muassasa va tashkilotlar tomonidan taqdim etiladigan resurslar,
page.orhunguide.s2s3.fin2=Aʼzo universitetlarning oʻz byudjet resurslari,
page.orhunguide.s2s3.fin3=TURKUNIBga raislik qiluvchi universitet va Turkiy Davlatlar Tashkiloti tomonidan taqdim etiladigan resurslar.
page.orhunguide.s2s3.p1=Aʼzo universitetlar har bir oʻquv yili uchun moliyaviy ehtiyojlarini harakatchanlikdan oldin oʻz byudjetlarida koʻrsatishlari shart; resurslarni taqsimlashda zarur muvofiqlashtirish Turkiy Davlatlar Tashkiloti Kotibiyati tomonidan taʼminlanadi.
page.orhunguide.s3.title=3. Talabalar qanday ariza topshiradi?
page.orhunguide.s3.p1=Orhun almashinuv dasturi doirasida rasmiy (kunduzgi) taʼlimda tahsil olayotgan talabalar oʻz oliy taʼlim muassasasi protokol imzolagan aʼzo muassasada bir yoki ikki semestr davomida (jami bir oʻquv yilidan oshmagan holda) oʻqishlarini davom ettirishlari mumkin.
page.orhunguide.s3s1.title=3.1 Ariza topshirish talablari
page.orhunguide.s3s1.req1=Rasmiy (kunduzgi) oliy taʼlim dasturida tahsil olayotgan boʻlish,
page.orhunguide.s3s1.req2=Umumiy oʻrtacha baho (GPA) 4 ballik tizimda kamida 2,5 (yoki bunga teng koʻrsatkich) boʻlishi,
page.orhunguide.s3s1.req3=Tayyorlov yili, birinchi kurs va bitiruvchi kurs talabalari dasturdan foydalana olmaydi,
page.orhunguide.s3s1.req4=Xorijda xalqaro talaba maqomida tahsil olayotganlar oʻz mamlakatidagi universitetga ariza topshira olmaydi.
page.orhunguide.s3s2.title=3.2 Ariza topshirish jarayoni va eʼlon
page.orhunguide.s3s2.item1=Oliy taʼlim muassasasi oʻzi imzolagan Orhun almashinuv dasturi protokollari va tegishli kvotalarni oʻz veb-saytida eʼlon qiladi.
page.orhunguide.s3s2.item2=Eʼlonda dastur haqida qisqacha maʼlumot, ariza topshirish talablari va jarayon bosqichlari koʻrsatiladi.
page.orhunguide.s3s2.item3=Talaba eʼlon qilingan kvota va taqvimga muvofiq tegishli muassasaga ariza topshiradi.
page.orhunguide.s3s2.item4=Arizalar tizimga yuklangan hujjatlar bilan birga qabul qiluvchi muassasaga yetkazilishi uchun koordinator universitetga yuboriladi.
page.orhunguide.s3s2.item5=TURKUNIBga raislik qiluvchi universitet ikki tomonlama protokollar doirasida almashinuv talabalarining soni va taqsimotini belgilaydi.
page.orhunguide.s3s2.item6=Baholash nomzodlarning oʻrtacha bahosi asosida amalga oshiriladi; natijalar protokol imzolagan muassasalarning veb-saytlarida eʼlon qilinadi.
page.orhunguide.s3.note1=100 ballik baholash tizimidan 4 ballik tizimga oʻtkazish qabul qiluvchi universitetning ekvivalentlik toʻgʻrisidagi qaroriga asoslanadi. Bundan tashqari, TURKUNIBga raislik qiluvchi universitet samarali va natijali harakatchanlik uchun qoʻshimcha shartlar belgilashi mumkin.
page.orhunguide.s3s3.title=3.3 Talab qilinadigan hujjatlar
page.orhunguide.s3.doc1=Ariza shakli
page.orhunguide.s3.doc1.desc=Talabaning ariza hujjati
page.orhunguide.s3.doc2=Transkript
page.orhunguide.s3.doc2.desc=Soʻnggi holatdagi akademik transkript
page.orhunguide.s3.doc3=Talaba majburiyatlari shartnomasi
page.orhunguide.s3.doc3.desc=Orhun almashinuv dasturi talaba majburiyatlari shartnomasi — talaba va muassasa oʻrtasida imzolanadi
page.orhunguide.s3.doc4=Boshqa hujjatlar
page.orhunguide.s3.doc4.desc=Protokol imzolagan universitetlar tomonidan belgilanadigan qoʻshimcha hujjatlar (mavjud boʻlsa)
page.orhunguide.s3s3.p1=Almashinuv davri yakunida talaba transkriptni, oʻqish muddatini koʻrsatuvchi ishtirok sertifikatini va talabaning yakuniy hisobotini qaytib kelgan sanadan boshlab 30 kun ichida oʻz muassasasining Orhun almashinuv dasturi muvofiqlashtirish boʻlimiga shaxsan, pochta yoki elektron pochta orqali topshiradi. Yetishmayotgan hujjatlar uchun 15 kungacha qoʻshimcha muddat berilishi mumkin; hujjatlar belgilangan muddatda toʻliq topshirilmasa, jarayon haqiqiy emas deb hisoblanadi va amalga oshirilgan toʻlovlarni qaytarish talab qilinadi.
page.orhunguide.s3s4.title=3.4 Taʼlim kelishuvi (Learning Agreement)
page.orhunguide.s3s4.p1=Harakatchanlik boshlanishidan oldin talabaning qabul qiluvchi muassasada oʻzlashtiradigan fanlari va kreditlari hamda ularga oʻz muassasasida mos keladigan fanlar "Taʼlim kelishuvi" (Learning Agreement) orqali belgilanadi. Kelishuv uch nusxada tayyorlanadi; bir nusxasi talabada, qolganlari ikkala muassasada saqlanadi. Kelishuv tegishli kafedra mudirlari va muassasalarning yuqori maʼmuriy rahbarlari (yoki ularning vakolatli vakillari) tomonidan imzolanadi. Majburiy oʻzgartirishlar qabul qiluvchi muassasada oʻquv davri boshlanganidan soʻng koʻpi bilan 30 kun ichida (va majburiy imtihon sanalaridan oldin) kiritilishi lozim.
page.orhunguide.s3s5.title=3.5 Fanlar ekvivalentligi, qayta oʻzlashtirish va imtihonlar
page.orhunguide.s3s5.item1=Oʻquv yuklamasi kredit asosida belgilanadi; fanlar soni emas, kreditlar asos qilib olinadi. Muassasalar ECTS tizimini moʻljal sifatida qoʻllashlari mumkin.
page.orhunguide.s3s5.item2=Talaba oʻzlashtira olmagan fanlar taʼlim kelishuvida koʻrsatilgan ekvivalent fan asosida oʻz muassasasida qayta oʻzlashtiriladi; qayta oʻzlashtiriladigan fanni qabul qiluvchi muassasada oʻqib boʻlmaydi.
page.orhunguide.s3s5.item3=Orhun almashinuv dasturi talabalariga shartli oʻtish qoʻllanilmaydi; qayta topshirish imtihoni faqat talaba ayni paytda almashinuv talabasi boʻlib turgan muassasada topshirilishi mumkin.
page.orhunguide.s3s5.item4=Bitiruv malakaviy ishi (dissertatsiya), amaliyot va laboratoriya mashgʻulotlari kabi ishlar talabaning oʻz muassasasi qoidalariga muvofiq amalga oshiriladi.
page.orhunguide.s3s5.item5=Almashinuv yakunida muassasalar muvaffaqiyatli oʻzlashtirilgan fanlarning kreditlari va baholarini tan olishlari shart; ushbu fanlar diplom ilovasida koʻrsatiladi.
page.orhunguide.s3s6.title=3.6 Moliyaviy majburiyatlar
page.orhunguide.s3s6.item1=Talaba almashinuv davrida majburiy badal/oʻqish toʻlovini oʻz muassasasiga toʻlashda davom etadi; talabalik qaydi toʻxtatib turilishi mumkin emas.
page.orhunguide.s3s6.item2=Qabul qiluvchi muassasaga qoʻshimcha oʻqish toʻlovi toʻlanmaydi.
page.orhunguide.s3s6.item3=Boshqa stipendiyalar va taʼlim kreditlari oʻqish davri mobaynida toʻlanishda davom etadi.
page.orhunguide.s3s7.title=3.7 Intizom
page.orhunguide.s3s7.p1=Almashinuv talabalari harakatchanlik davrida oʻzlari turgan muassasaning intizom qoidalariga boʻysunadi. Intizomiy tekshiruv boshlangan taqdirda, uning natijasi haqida talabaning oʻz muassasasi xabardor qilinadi; agar jazoni harakatchanlik davrida qoʻllash imkoni boʻlmasa, u talabaning oʻz muassasasi tomonidan ijro etiladi.
page.orhunguide.s4.title=4. Akademik xodimlar qanday ariza topshiradi?
page.orhunguide.s4.p1=Orhun almashinuv dasturi protokolini imzolagan muassasalarda ishlayotgan barcha professor-oʻqituvchilar oʻqituvchilar harakatchanligida ishtirok etishlari mumkin. Harakatchanlik bir muassasa xodimining boshqa aʼzo muassasada amalga oshiradigan oʻqitish faoliyatini qamrab oladi.
page.orhunguide.s4s1.title=4.1 Qamrov va muddat
page.orhunguide.s4s1.item1=Harakatchanlik davri kamida ikki hafta va koʻpi bilan uch oy boʻlishi mumkin; u bir oʻquv yilida faqat bir marta amalga oshirilishi mumkin.
page.orhunguide.s4s1.item2=Haftalik umumiy akademik faoliyat kamida olti soat boʻlishi kerak (dars soatlari asos qilib olinadi; yetarli boʻlmasa, seminar, davra suhbati yoki konferensiya kabi tadbirlar bilan toʻldirilishi mumkin).
page.orhunguide.s4s1.item3=Oʻqitishni oʻz ichiga olmagan harakatchanlik rejalari Orhun almashinuv dasturi doirasida qabul qilinmaydi.
page.orhunguide.s4s2.title=4.2 Ariza eʼloni va tanlov jarayoni
page.orhunguide.s4s2.item1=Imzolangan protokollar va kvotalar muassasaning hamda TURKUNIBning veb-saytlarida eʼlon qilinadi; eʼlonlar kamida 15 kun davomida eʼlon qilingan holda qoladi.
page.orhunguide.s4s2.item2=Eʼlon davrida topshirilgan barcha arizalar qayd etiladi; bir nusxasi muassasaning Orhun almashinuv dasturi muvofiqlashtirish boʻlimida saqlanadi.
page.orhunguide.s4s2.item3=Xodim mos fanlarni aniqlash uchun oʻzi tashrif buyurmoqchi boʻlgan muassasadagi tegishli kafedra bilan bogʻlanadi va "Oʻqituvchilar harakatchanligi rejasi"ni tayyorlaydi.
page.orhunguide.s4s2.item4=Reja yuboruvchi va qabul qiluvchi muassasalarning tegishli akademik boʻlinma kengashlari tomonidan tasdiqlanadi hamda harakatchanlik boshlanishidan kamida 15 kun oldin muvofiqlashtirish boʻlimiga taqdim etiladi.
page.orhunguide.s4s2.item5=Baholashda ilgari almashinuv dasturida ishtirok etmagan professor-oʻqituvchilarga hamda Orhun kafedra koordinatorlariga ustuvorlik beriladi.
page.orhunguide.s4s2.item6=Natijalar protokol imzolagan muassasaning veb-saytida eʼlon qilinadi.
page.orhunguide.s4.note2=Tanlangan, biroq uzrli sababsiz ishtirok etmagan xodim uch yil davomida dasturdan foydalana olmaydi.
page.orhunguide.s4s3.title=4.3 Talab qilinadigan hujjatlar
page.orhunguide.s4.doc1=Akademik xodim maʼlumotlari shakli
page.orhunguide.s4.doc1.desc=Muassasa veb-saytidagi "Hujjatlar" menyusidan olinadi
page.orhunguide.s4.doc2=Akademik xodimlar harakatchanligi dasturi
page.orhunguide.s4.doc2.desc=Amalga oshiriladigan faoliyatni batafsil koʻrsatuvchi reja; muassasa veb-saytidan olinadi
page.orhunguide.s4.doc3=Tarjimai hol (CV)
page.orhunguide.s4.doc3.desc=Soʻnggi holatdagi CV
page.orhunguide.s4.doc4=Ishtirok sertifikati
page.orhunguide.s4.doc4.desc=Harakatchanlik yakunida qabul qiluvchi muassasa tomonidan imzolangan/muhrlangan holda beriladi
page.orhunguide.s4.doc5=Faoliyat natijalari hisoboti
page.orhunguide.s4.doc5.desc=Xodim tomonidan tayyorlanadi; faoliyat yakunlanganidan soʻng koʻpi bilan 15 kun ichida muvofiqlashtirish boʻlimiga topshiriladi
page.orhunguide.s4s4.title=4.4 Moliyaviy huquq va majburiyatlar
page.orhunguide.s4s4.item1=Xodimning mehnatga oid huquqlari oʻz universitetida saqlanib qoladi.
page.orhunguide.s4s4.item2=Dastlabki ikki hafta uchun kunlik xarajat puli va yoʻl xarajatlari yuboruvchi muassasa tomonidan qoplanadi.
page.orhunguide.s4s4.item3=Turar joy va kundalik taʼminot (yotoqxona va ovqatlanish) qabul qiluvchi universitet tomonidan taʼminlanadi.
page.orhunguide.s5.title=5. Harakatchanlik uchun tanlandim — endi nima qilishim kerak?
page.orhunguide.s5.p1=Harakatchanlik uchun tanlangan talabalar va akademik xodimlarga harakatchanlik boshlanishidan oldin quyidagi olti qadamni tartib bilan bajarish tavsiya etiladi:
page.orhunguide.s5.step1=Kion hisobini yaratish
page.orhunguide.s5.step1.text=Tegishli almashinuv dasturi veb-saytida berilgan havola orqali Kion hisobi yaratilishi kerak. Harakatchanlik uchun talab qilinadigan hujjatlar ushbu tizimga yuklanadi.
page.orhunguide.s5.step2=Qabul xatini (Letter of Acceptance) olish
page.orhunguide.s5.step2.text=Qabul xatini (Letter of Acceptance) olish uchun oʻzingiz joylashtirilgan universitet bilan elektron pochta orqali bogʻlanish lozim.
page.orhunguide.s5.step3=Fanlar mazmuni bilan tanishish
page.orhunguide.s5.step3.text=Fanlar mazmuni qabul qiluvchi universitetning veb-saytidan olinishi kerak. Agar bu maʼlumot veb-saytda mavjud boʻlmasa, u hamkor muassasadan elektron pochta orqali soʻralishi lozim.
page.orhunguide.s5.step4=Taʼlim kelishuvini (Learning Agreement) tayyorlash
page.orhunguide.s5.step4.text=Soʻnggi holatdagi transkript va hamkor muassasadan olingan fanlar roʻyxatidan foydalangan holda Taʼlim kelishuvi (Learning Agreement) muassasaning Orhun kafedra koordinatori bilan birgalikda tayyorlanishi kerak.
page.orhunguide.s5.step5=Taʼlim/oʻqitish kelishuvini imzolash jarayoni
page.orhunguide.s5.step5.text=Tayyorlangan taʼlim/oʻqitish kelishuvi kafedra mudiri va kafedra koordinatori tomonidan imzolanadi; soʻngra u yakuniy imzo va muhr uchun Almashinuv dasturlari muvofiqlashtirish boʻlimiga elektron pochta orqali yuboriladi.
page.orhunguide.s5.step6=Talab qilinadigan hujjatlarni topshirish
page.orhunguide.s5.step6.text=Harakatchanlik uchun talab qilinadigan hujjatlar, masalan, talaba majburiyatnomasi va parvoz soʻrovi shakli, Kion tizimiga yuklanadi.
page.orhunguide.s5.note3=Ushbu olti qadam harakatchanlik uchun tanlanganidan soʻng amal qilinishi lozim boʻlgan umumiy jarayonni umumlashtiradi; har bir aʼzo muassasaning oʻz institutsional tizimiga (masalan, Kion) qarab kichik farqlar boʻlishi mumkin. Dolzarb maʼlumot olish uchun tegishli muassasaning Almashinuv dasturlari muvofiqlashtirish boʻlimiga murojaat qilish tavsiya etiladi.
page.orhun.guidelink=Ariza topshirish qoʻllanmasi

