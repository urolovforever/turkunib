page.directive.art6.title=Tashkiliy tuzilma
page.directive.art6.p1=(1) Ittifoq Turkiy Davlatlar Tashkilotiga aʼzo va kuzatuvchi davlatlar hamda qardosh jamoalardagi universitetlardan tashkil topadi.
page.directive.art6.chairmanship=Ittifoq raisligi
page.directive.art6.p2=(2) Ittifoq Raisi Turkiy Davlatlar Tashkilotining Bosh kotibidir.
page.directive.art6.p3=(3) Navbatdagi raislik Bosh Assambleya yigʻilishida aʼzo universitetlar orasidan ixtiyoriylik asosida yoki boshqa ishtirokchilarning taklifi bilan ikki yil muddatga oddiy koʻpchilik ovoz bilan saylanadi.
page.directive.art6.p4=(4) Ittifoq Raisi oʻz vazifalarini akademik masalalar uchun masʼul boʻlgan raislik qiluvchi universitet rektori bilan muvofiqlashtirilgan holda bajaradi.
page.directive.art6.p5=(5) Raislik qiluvchi universitetning vazifalari quyidagilardan iborat:
page.directive.art6.duty1=Ittifoq Bosh Assambleyasi yigʻilishiga mezbonlik qilish va Bosh Assambleyada qabul qilingan qarorlarni amalga oshirish;
page.directive.art6.duty2=raislik davrida Kotibiyat bilan muvofiqlashtirilgan holda Ittifoq aʼzolari oʻrtasida zarur hamkorlik va aloqani taʼminlash.
page.directive.art6.p6=(6) Raislik qiluvchi universitet rektori oʻz vazifalariga doir masalalar yuzasidan Turkiy Davlatlar Tashkiloti taʼlim vazirlari yigʻilishiga va/yoki Turkiy Davlatlar Tashkiloti sammitiga taklif etilishi mumkin.
page.directive.art6.assembly=Bosh Assambleya
page.directive.art6.p7=(7) Turkiy Universitetlar Ittifoqi Bosh Assambleyasi aʼzo mamlakatlar universitetlarining vakillaridan tashkil topadi. Aʼzo universitet vakillari – rektor, tegishli prorektor va xalqarolashtirish boʻlimidan bitta vakildir.
