page.directive.intro=Turkiy Universitetlar Ittifoqi (TURKUNIB)ning taʼsis hujjati boʻlib, Ittifoqning tuzilishi, ish tamoyillari va faoliyat yoʻnalishlarini tartibga soladi hamda Turkiy Davlatlar Tashkilotining Oliy Taʼlim Maydonini tashkil etadi.
