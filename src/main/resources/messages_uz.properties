# --- membership page ---
page.membership.title=Turkiy Universitetlar Ittifoqi (TURKUNIB)ga aʼzolik
page.membership.intro=TURKUNIBga qanday aʼzo boʻlish mumkin: aʼzolik mezonlari, ariza topshirish tartibi va ariza hujjatlari toʻplamini tayyorlash boʻyicha yoʻriqnoma.
page.membership.criteria.title=Aʼzolik mezonlari
page.membership.criteria.intro=TURKUNIBga aʼzo boʻlishga intilayotgan universitet quyidagi shartlarga javob berishi kutiladi:
page.membership.criteria.item1=TURKUNIBning maqsad va vazifalariga mos tadbirlar tashkil etgan boʻlishi,
page.membership.criteria.item2=Turkiy dunyoga oid ilmiy tadqiqotlar yoki ilmiy ishlar olib borgan boʻlishi,
page.membership.criteria.item3=TDTga aʼzo davlatlar universitetlari bilan aniq va oʻlchanadigan hamkorlik aloqalarini oʻrnatgan boʻlishi (qoʻshma loyihalar, talabalar/xodimlar almashinuvi, qoʻshma tadqiqotlar va h.k.),
page.membership.criteria.item4=Almashinuv dasturlari boʻyicha tajribaga hamda Orhun almashinuv dasturiga hissa qoʻshish uchun institutsional salohiyatga ega boʻlishi,
page.membership.criteria.item5=Xalqaro reyting agentliklari maʼlumotlariga koʻra, oʻzi faoliyat yuritayotgan mamlakat universitetlarining eng yaxshi 20 foizi qatoriga kirishi.
page.membership.procedure.title=Ariza topshirish tartibi
page.membership.procedure.intro=Aʼzolik arizalari quyidagi bosqichlarda koʻrib chiqiladi:
page.membership.procedure.item1=Nomzod universitetlar oʻz arizalarini oʻzlari faoliyat yuritayotgan mamlakatning diplomatik kanallari orqali bevosita TDT Kotibiyatiga taqdim etadilar.
page.membership.procedure.item2=Arizalar kelib tushgach, TDT Kotibiyati ularni baholash uchun Ittifoq Raisi bilan kelishilgan holda tayinlanadigan, aʼzo universitetlar vakillaridan iborat 5 kishilik komissiya tuzadi.
page.membership.procedure.item3=Komissiya har bir arizani aʼzolik mezonlari asosida baholaydi va oʻz xulosalarini TDT Kotibiyatiga yetkazadi.
page.membership.procedure.item4=TDT Kotibiyati komissiya taklifini yakuniy qaror qabul qilish uchun TURKUNIB Bosh Assambleyasiga yuboradi.
page.membership.procedure.item5=Ittifoqqa aʼzolik toʻgʻrisidagi qaror Ittifoq aʼzolarining kamida uchdan ikki qismi ishtirok etgan Bosh Assambleya yigʻilishida oddiy koʻpchilik ovoz bilan qabul qilinadi.
page.membership.procedure.item6=TDTga aʼzo davlatlarning birida faoliyat yuritmaydigan, biroq Ittifoqqa qoʻshilishni istagan universitetlarga yuqoridagi tartib va mezonlarni bajargan taqdirda Kuzatuvchi maqomi berilishi mumkin.
page.membership.procedure.item7=Uzrli sababsiz ketma-ket uchta Bosh Assambleya yigʻilishida ishtirok etmagan aʼzo universitetning Ittifoqdagi aʼzoligi bekor qilinadi.
page.membership.guidance.title=Ariza hujjatlari toʻplami va Rektor maktubi boʻyicha yoʻriqnoma
page.membership.guidance.item1=Aʼzolik arizalari asoslantirilgan boʻlishi kutiladi. Ariza hujjatlari toʻplamiga arizaning asoslari va universitetning TURKUNIBga qoʻshilish niyatini aniq bayon etuvchi, Rektor tomonidan imzolangan Rektor maktubi (ilova xati) kiritilishi tavsiya etiladi.
page.membership.guidance.item2=Rektor maktubiga universitetning aʼzolik mezonlariga muvofiqligini koʻrsatuvchi toʻliq ariza hujjatlari toʻplami ilova qilinishi lozim; tasdiqlovchi hujjatlar qatoriga tegishli faoliyat dalillari, hamkorlik shartnomalari, almashinuv dasturlari boʻyicha maʼlumotlar, institutsional salohiyat toʻgʻrisidagi bayonotlar va qoʻshma loyihalar namunalari kirishi mumkin.
page.membership.guidance.item3=Ariza maktubi va unga ilova qilingan hujjatlar TDT Kotibiyati nomiga yoʻllanishi kerak. Taqdim etilgan hujjatlar toʻplami TDT Kotibiyati tomonidan dastlabki koʻrib chiqiladi. Maqbul deb topilgan taqdirda, ariza TURKUNIB Bosh Assambleyasi kun tartibiga kiritiladi va yakuniy qaror ovoz berish orqali qabul qilinadi. Tasdiqlangan aʼzolik TDT Kotibiyati tomonidan tayyorlangan hisobot orqali aʼzo davlatlarga maʼlum qilinadi va ariza jarayoni yakunlanadi.
footer.about.membership=Aʼzolik

