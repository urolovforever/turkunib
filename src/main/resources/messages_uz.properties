page.directive.art1.title=Maqsad
page.directive.art1.p1=(1) Ushbu Koʻrsatmaning maqsadi Turkiy Davlatlar Tashkilotiga aʼzo davlatlar oʻrtasida oliy taʼlim sohasidagi hamkorlikni takomillashtirish orqali Turkiy Davlatlar Tashkilotining Oliy Taʼlim Maydonini yaratishdir.
page.directive.art1.p2=(2) Ushbu Koʻrsatma, shuningdek, Turkiy Davlatlar Tashkiloti homiyligida tashkil etilgan Turkiy Universitetlar Ittifoqining tuzilishi, ish tamoyillari va faoliyat yoʻnalishlarini tartibga solishni ham nazarda tutadi.
page.directive.art2.title=Qamrov
page.directive.art2.p1=(1) Ushbu Koʻrsatma Turkiy Davlatlar Tashkiloti Turkiy Universitetlar Ittifoqiga aʼzo universitetlar oʻrtasida oliy taʼlim sohasida amalga oshiriladigan hamkorlikning tartib-taomillari va tamoyillarini qamrab oladi.
page.directive.art3.title=Asos
page.directive.art3.intro=(1) Ushbu Koʻrsatma quyidagilarda qabul qilingan qarorlar asosida tayyorlangan:
page.directive.art3.ref1=2012-yil 23-avgustda Bishkekda boʻlib oʻtgan Turkiy Davlatlar Tashkilotining Ikkinchi sammiti;
page.directive.art3.ref2=2012-yil 10-avgustda Cholpon-Otada boʻlib oʻtgan Turkiy Davlatlar Tashkiloti taʼlim vazirlari yigʻilishi;
page.directive.art3.ref3=2012-yil 28–29-mart kunlari Istanbulda boʻlib oʻtgan Turkiy Davlatlar Tashkiloti Turkiy Universitetlar Ittifoqining tayyorgarlik yigʻilishi;
page.directive.art3.ref4=2014-yil 16–17-oktyabr kunlari Arzurumda boʻlib oʻtgan Turkiy Universitetlar Ittifoqining Birinchi Bosh Assambleyasi;
page.directive.art3.ref5=2014-yil 28-noyabrda Bokuda boʻlib oʻtgan taʼlim vazirlarining Uchinchi yigʻilishi;
page.directive.art3.ref6=2015-yil 5-sentyabrda Astanada boʻlib oʻtgan taʼlim vazirlarining Toʻrtinchi yigʻilishi;
page.directive.art3.ref7=2019-yil 15-martda Bishkekda boʻlib oʻtgan taʼlim vazirlarining Beshinchi yigʻilishi;
page.directive.art3.ref8=2021-yil 4-noyabrda Istanbulda boʻlib oʻtgan taʼlim vazirlarining Oltinchi yigʻilishi;
page.directive.art3.ref9=2023-yil 14-iyunda Samarqandda boʻlib oʻtgan taʼlim vazirlarining Yettinchi yigʻilishi;
page.directive.art3.ref10=2022-yil 23-noyabrda Turkistonda boʻlib oʻtgan Turkiy Davlatlar Tashkiloti Turkiy Universitetlar Ittifoqining Oltinchi Bosh Assambleyasi.
page.directive.art4.title=Taʼriflar
page.directive.art4.intro=(1) Ushbu Koʻrsatma maqsadlari uchun:
page.directive.art4.def1=Turkiy Davlatlar Tashkiloti – Turkiyzabon Davlatlar Hamkorlik Kengashini anglatadi;
page.directive.art4.def2=Turkiy Davlatlar Tashkiloti sammiti – aʼzo davlatlar davlat rahbarlarining yillik yigʻilishini anglatadi;
page.directive.art4.def3=Turkiy Davlatlar Tashkiloti taʼlim vazirlari yigʻilishi – taʼlim vazirlari jam boʻladigan yigʻilishni anglatadi. Ittifoqqa oid masalalar muhokama qilinganda Turkiya Oliy taʼlim kengashi raisi ham ishtirok etadi;
page.directive.art4.def4=Kotibiyat – Turkiy Davlatlar Tashkiloti Kotibiyatini anglatadi;
page.directive.art4.def5=Turkiy Davlatlar Tashkiloti taʼlim vazirlarining Katta mansabdor shaxslari – aʼzo davlatlar taʼlim vazirliklari tomonidan tayinlangan milliy ekspertlardan iborat guruhni anglatadi;
page.directive.art4.def6=Ittifoq – Turkiy Davlatlar Tashkiloti homiyligida tashkil etilgan Turkiy Universitetlar Ittifoqini anglatadi;
page.directive.art4.def7=Ittifoq Bosh Assambleyasi – aʼzo universitetlar rektorlari yoki ularning vakillari hamda Turkiy Davlatlar Tashkiloti Bosh kotibi yoki uning vakili ishtirokida shakllantiriladigan qoʻmitani anglatadi;
page.directive.art4.def8=TCHEA – Turkiy Davlatlar Tashkiloti Oliy Taʼlim Maydonini anglatadi.
page.directive.art5.title=Taʼsischi aʼzolar
page.directive.art5.p1=(1) Ittifoqning taʼsischi aʼzolari toʻrt aʼzo davlatdan boʻlgan quyidagi 15 ta universitetdir.
