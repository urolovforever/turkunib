page.directive.art6.subcommittees.intro=Bosh Assambleya tomonidan belgilangan ustuvor faoliyat yoʻnalishlarini amalga oshirish uchun yettita ijroiya qoʻmitasi tashkil etilgan:
page.directive.art6.committee1=Turkiy dunyo oliy taʼlim maʼlumotlar banki
page.directive.art6.committee2=Taʼlim-oʻqitish qoʻmitasi
