page.cookies.intro=Ushbu veb-sayt brauzeringizdagi tajribangizni yaxshilash, sayt trafigini tahlil qilish va shaxsiylashtirilgan kontentni taqdim etish uchun cookie-fayllardan foydalanadi. Ushbu Siyosat cookie-fayllar nima ekanligini, qaysi turlaridan foydalanishimizni va ularni qanday boshqarishingiz mumkinligini tushuntiradi.
page.cookies.what.title=Cookie-fayllar nima?
page.cookies.what.text=Cookie-fayllar veb-sayt siz tashrif buyurganingizda qurilmangizda saqlaydigan kichik matnli fayllardir. Ular saytga qurilmangizni tanib olish, afzalliklaringizni eslab qolish va sahifa hamda funksiyalar bilan qanday oʻzaro ishlashingizni tushunish imkonini beradi.
