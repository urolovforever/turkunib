page.terms.title=Foydalanish shartlari
page.terms.lastupdated=Oxirgi yangilanish:
page.terms.intro=turkunib.org saytiga (“Sayt”) xush kelibsiz. Ushbu Foydalanish shartlari (“Shartlar”, “Bitim”) Saytdan foydalanish va unga kirishni tartibga soladi. Saytga kirish yoki undan foydalanish orqali siz ushbu Shartlarga rioya qilishga rozilik bildirasiz. Agar siz ushbu Shartlarga rozi boʻlmasangiz, iltimos, Saytdan foydalanmang.
page.terms.s1.title=1. Taʼriflar
page.terms.s1.text=“Biz”, “bizning” va “bizni” iboralari Sayt operatoriga ishora qiladi. “Siz” yoki “Foydalanuvchi” Saytga kiruvchi har qanday tashrif buyuruvchi, foydalanuvchi yoki boshqa shaxsga ishora qiladi.
page.terms.s2.title=2. Shartlarni qabul qilish
page.terms.s2.text=Saytdan foydalanishingiz ushbu Shartlar va barcha tegishli qonun hamda qoidalarga boʻysunadi. Agar siz Saytdan tashkilot nomidan foydalansangiz, uning nomidan ushbu Shartlarni qabul qilishga vakolatli ekanligingizni tasdiqlaysiz.
page.terms.s3.title=3. Ruxsat etilgan foydalanish
page.terms.s3.item1=Saytdan faqat qonuniy maqsadlarda va boshqalarning huquqlarini buzmaydigan tarzda foydalaning.
page.terms.s3.item2=Saytga, uning serverlariga yoki tegishli tizimlarga ruxsatsiz kirishga urinmang.
page.terms.s3.item3=Zararli dasturlar, zararli kodlar kiritmang yoki Saytni ishdan chiqaradigan yoki sifatini pasaytiradigan faoliyat bilan shugʻullanmang.
page.terms.s4.title=4. Hisoblar va xavfsizlik
page.terms.s4.text=Agar Sayt hisob yaratish imkonini bersa, maʼlumotlaringizni himoya qilish va hisobingiz ostida sodir boʻladigan barcha faoliyat uchun siz javobgarsiz. Biz ushbu Shartlarni yoki tegishli qonunni buzadigan hisoblarni toʻxtatib qoʻyish yoki bekor qilish huquqini oʻzimizda saqlab qolamiz.
page.terms.s5.title=5. Intellektual mulk
page.terms.s5.text=Saytdagi barcha kontent, jumladan matn, grafika, logotiplar, ikonkalar, tasvirlar va dizayn elementlari bizga yoki bizning litsenziarlarimizga tegishli boʻlib, tegishli mualliflik huquqi va boshqa intellektual mulk qonunlari bilan himoyalangan. Bizning oldindan yozma roziligimizsiz hech qanday kontentni nusxalash, koʻpaytirish, oʻzgartirish, tarqatish yoki ommaviy ravishda namoyish etish mumkin emas.
page.terms.s6.title=6. Kontent va aniqlik
page.terms.s6.text=Biz Saytdagi maʼlumotlar aniq va dolzarb boʻlishini taʼminlash uchun oqilona saʼy-harakatlar qilamiz; biroq, kontent xato yoki kamchiliklardan xoli ekanligiga kafolat bermaymiz. Biz maʼlumotlarni istalgan vaqtda oldindan ogohlantirmasdan yangilashimiz yoki tuzatishimiz mumkin.
page.terms.s7.title=7. Uchinchi tomon havolalari
page.terms.s7.text=Sayt biz egalik qilmaydigan yoki nazorat qilmaydigan uchinchi tomon veb-saytlari yoki xizmatlariga havolalarni oʻz ichiga olishi mumkin. Biz hech qanday uchinchi tomon veb-saytlarining kontenti, maxfiylik siyosati yoki amaliyoti uchun javobgar emasmiz.
page.terms.s8.title=8. Taqiqlangan faoliyatlar
page.terms.s8.item1=Saytni ishdan chiqarishi, ortiqcha yuklashi yoki buzishi mumkin boʻlgan har qanday tarzda foydalanish.
page.terms.s8.item2=Roziligimizsiz maʼlumotlarni qazib olish, skraping yoki shunga oʻxshash maʼlumot yigʻish usullari.
page.terms.s8.item3=Boshqa shaxs yoki tashkilot nomidan oʻzini koʻrsatish yoki aloqadorligingizni notoʻgʻri talqin qilish.
page.terms.s9.title=9. Rad etishlar
page.terms.s9.text=Sayt va uning kontenti hech qanday turdagi, aniq yoki nazarda tutilgan kafolatlarsiz, jumladan, savdoga yaroqlilik, muayyan maqsadga muvofiqlik va huquqlarni buzmaslik kabi nazarda tutilgan kafolatlar bilan cheklanmagan holda, “qanday boʻlsa shunday” va “mavjud boʻlganicha” asosida taqdim etiladi.
page.terms.s10.title=10. Javobgarlikni cheklash
page.terms.s10.text=Qonun ruxsat etgan eng toʻliq darajada, biz (a) sizning Saytdan foydalanishingiz yoki undan foydalana olmasligingiz; (b) serverlarimizga ruxsatsiz kirish yoki ulardan foydalanish; yoki (c) Saytdan olingan har qanday kontent natijasida yuzaga keladigan har qanday bilvosita, tasodifiy, maxsus, oqibatli yoki jazoviy zararlar, yoki har qanday foyda yoki daromad yoʻqotilishi, toʻgʻridan-toʻgʻri yoki bilvosita boʻlishidan qatʼi nazar, yoki maʼlumotlar, foydalanish, obroʻ yoki boshqa nomoddiy yoʻqotishlar uchun javobgar boʻlmaymiz.
page.terms.s11.title=11. Tovon toʻlash
page.terms.s11.text=Siz Saytdan foydalanishingiz yoki ushbu Shartlarni buzishingiz natijasida yoki u bilan har qanday tarzda bogʻliq boʻlgan har qanday daʼvolar, majburiyatlar, zararlar, yoʻqotishlar va xarajatlardan bizni hamda bizning sheriklarimiz, mansabdor shaxslarimiz, xodimlarimiz va vakillarimizni himoya qilishga, tovon toʻlashga va ziyondan saqlashga rozilik bildirasiz.
page.terms.s12.title=12. Amaldagi qonun va yurisdiksiya
page.terms.s12.text=Ushbu Shartlar bizning asosiy faoliyat joyimiz yurisdiksiyasida amaldagi qonunlarga muvofiq tartibga solinadi va talqin qilinadi, uning qonunlar nizosi qoidalaridan qatʼi nazar. Har qanday nizolar ushbu yurisdiksiyada joylashgan sudlarning mutlaq vakolatiga boʻysunadi.
page.terms.s13.title=13. Ushbu Shartlardagi oʻzgarishlar
page.terms.s13.text=Biz ushbu Shartlarni vaqti-vaqti bilan qayta koʻrib chiqishimiz mumkin. Yangilangan Shartlar ushbu sahifada “Oxirgi yangilanish” sanasi bilan eʼlon qilinadi. Oʻzgarishlar kuchga kirgandan keyin Saytdan foydalanishni davom ettirishingiz qayta koʻrib chiqilgan Shartlarni qabul qilishni anglatadi.
page.terms.s14.title=14. Biz bilan bogʻlaning
page.terms.s14.text=Agar ushbu Foydalanish shartlari boʻyicha savollaringiz boʻlsa, iltimos, bogʻlaning:
