page.cookies.thirdparty.title=Uchinchi tomon cookie-fayllari
page.cookies.thirdparty.text=Baʼzi cookie-fayllar sahifalarimizda paydo boʻladigan uchinchi tomon xizmatlari tomonidan oʻrnatilishi mumkin (masalan, joylashtirilgan media, xaritalar yoki tahlil vositalari). Ushbu uchinchi tomonlarning oʻz maxfiylik va cookie-fayllar siyosati mavjud. Ular maʼlumotlaringizni qanday qayta ishlashi haqida batafsil maʼlumot olish uchun ularning hujjatlarini koʻrib chiqishni tavsiya etamiz.
page.cookies.changes.title=Ushbu Siyosatdagi oʻzgarishlar
page.cookies.changes.text=Texnologiya, qonunchilik yoki xizmatlarimizdagi oʻzgarishlarni aks ettirish uchun ushbu Cookie-fayllar siyosatini vaqti-vaqti bilan yangilashimiz mumkin. Eng soʻnggi maʼlumotlar uchun ushbu sahifani vaqti-vaqti bilan koʻrib turishingizni tavsiya etamiz.
