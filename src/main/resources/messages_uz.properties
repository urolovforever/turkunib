# --- single pages (about/contacts/cookies/orhun/council/terms) ---
page.about.intro.p1=Turkiy Davlatlar Tashkiloti (TDT)ga aʼzo davlatlar oʻrtasida oliy taʼlim sohasidagi hamkorlikka institutsional shakl berish maqsadida Turkiy Universitetlar Ittifoqi (TURKUNIB)ni tashkil etish Tashkilot taʼsis etilganidan buyon ustuvor kun tartibi masalalaridan biri boʻlib kelmoqda. Ittifoq umumiy tarix, madaniyat va til merosi asosida universitetlararo hamkorlikni mustahkamlash, talabalar va akademik xodimlar harakatchanligini oshirish hamda yagona turkiy oliy taʼlim makonini yaratishni maqsad qilib qoʻyadi.
page.about.intro.p2=Bugungi kunda TURKUNIB TDTga aʼzo yoki kuzatuvchi davlatlar boʻlmish Ozarbayjon, Qozogʻiston, Qirgʻiziston, Turkiya, Oʻzbekiston, Vengriya va Shimoliy Kipr Turk Respublikasida joylashgan 170 ta universitetni qamrab olgan keng koʻlamli dasturga aylandi.
page.about.intro.p3=Orhun talabalar va akademik xodimlar almashinuv dasturi ham TURKUNIB doirasida amalga oshiriladi. TURKUNIBning asosini tashkil etuvchi Orhun almashinuv dasturi aʼzo davlatlar oʻrtasida talabalar va akademik xodimlar almashinuvini nazarda tutuvchi qoʻshma oliy taʼlim mexanizmidir. Uning tajriba-sinov tatbiqi 2017–2018 oʻquv yilida boshlangan boʻlib, shundan buyon bosqichma-bosqich kengaytirib borilmoqda.
page.about.members=Aʼzolarimiz
page.about.history=Tariximiz
page.about.mission.title=Vazifa
page.about.mission.text=Oʻqitish va ilmiy tadqiqotlarda yuksak sifatni ragʻbatlantirish, aʼzo universitetlar oʻrtasida akademik harakatchanlik va kredit koʻchirishni taʼminlash hamda Orhun almashinuv dasturi kabi qoʻshma dasturlar orqali madaniy va institutsional aloqalarni mustahkamlash yoʻli bilan turkiy dunyoda oliy taʼlimni rivojlantirish. TURKUNIB talabalar, professor-oʻqituvchilar va muassasalarga umumiy akademik va ijtimoiy maqsadlar yoʻlida chegaralar osha hamkorlik qilish imkonini beruvchi yagona oliy taʼlim ekotizimini barpo etishga sodiqdir.
page.about.vision.title=Istiqbol
page.about.vision.text=Talabalar va olimlar chegaralar osha uzluksiz hamkorlik qiladigan – taʼsirchan ilmiy tadqiqotlarni olgʻa suradigan, innovatsiyalarni ragʻbatlantiradigan hamda yanada mustahkam va oʻzaro bogʻliq turkiy dunyoni shakllantiradigan yangi avlod olimlari, yetakchilari va mutaxassislarini tarbiyalaydigan jonli, integratsiyalashgan turkiy oliy taʼlim makoni.
page.about.goals.title=Maqsadlarimiz
page.about.goals.subtitle=Biz talabalar, professor-oʻqituvchilar va muassasalarga foyda keltiradigan amaliy hamkorlikka eʼtibor qaratamiz.
