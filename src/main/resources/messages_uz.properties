page.orhun.title=Orhun almashinuv dasturi
page.orhun.intro.p1=Turkiy Universitetlar Ittifoqi (TURKUNIB) doirasida faoliyat yurituvchi Orhun almashinuv dasturi Turkiy Davlatlar Tashkiloti (TDT)ning oliy taʼlim sohasidagi asosiy harakatchanlik mexanizmiga aylandi. 2017–2018 oʻquv yilidagi tajriba-sinov tatbiqidan buyon Dastur koʻlami va taʼsiri jihatidan izchil oʻsib bormoqda hamda aʼzo va kuzatuvchi davlatlardagi qariyb 170 ta universitet oʻrtasida akademik almashinuvga koʻmaklashmoqda. Tizimli harakatchanlik sxemalari orqali Dastur talabalar va xodimlar almashinuvini, qoʻshma tadqiqot tashabbuslarini, oʻquv dasturlarini birgalikda ishlab chiqishni hamda oʻqitish va ilmiy faoliyatda universitetlararo hamkorlikni qoʻllab-quvvatlaydi.
page.orhun.intro.p2=Bevosita akademik natijalardan tashqari, Orhun almashinuv dasturi yaxlit va raqobatbardosh turkiy oliy taʼlim makonini shakllantirish, institutsional yaqinlashuv, sifatni oshirish hamda ishtirokchi universitetlar oʻrtasida akademik malakalarni oʻzaro tan olishni ragʻbatlantirishning strategik vositasi hisoblanadi. Talabalar, professor-oʻqituvchilar va tadqiqotchilar oʻrtasida bevosita muloqotni taʼminlash orqali Dastur turkiy dunyo boʻylab insonlararo aloqalar, madaniy hamjihatlik va akademik birdamlikni mustahkamlashda muhim rol oʻynaydi va shu tariqa Turkiy Davlatlar Tashkiloti koʻzda tutgan mintaqaviy integratsiyaning kengroq istiqboliga hissa qoʻshadi.
page.orhun.regulation.title=Nizom
page.orhun.regulation.text=Ushbu nizomning maqsadi Turkiy Kengash Turkiy Universitetlar Ittifoqi aʼzosi boʻlgan oliy taʼlim muassasalari oʻrtasida oʻqituvchilar va talabalar almashinuvi asoslarini belgilashdir. Ushbu Nizom Turkiy Kengash Turkiy Universitetlar Ittifoqi aʼzosi boʻlgan oliy taʼlim muassasalari oʻrtasida oʻqituvchilar va talabalar almashinuvi asoslarini qamrab oladi.
