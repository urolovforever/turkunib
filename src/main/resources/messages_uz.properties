# About the program
main.about.program=TURKUNIB haqida
main.about.program.tagline=Mustahkam kelajak yoʻlida turkiy universitetlarni birlashtirish
main.about.program.p1=TURKUNIB (Turkiy Universitetlar Ittifoqi) – turkiy dunyo universitetlari oʻrtasidagi akademik aloqalarni mustahkamlash va hamkorlikni rivojlantirishga qaratilgan dinamik tashabbusdir. Ozarbayjon, Qozogʻiston, Qirgʻiziston, Turkiya, Oʻzbekiston, Vengriya va Shimoliy Kipr Turk Respublikasidagi 170 ta universitetni birlashtirgan TURKUNIB umumiy tarix, madaniyat va tilga asoslangan yagona oliy taʼlim makonini barpo etadi.
main.about.program.p2=Yagona platforma yaratish orqali dastur talabalar harakatchanligini, professor-oʻqituvchilar almashinuvini hamda mintaqaviy va global muammolarni hal etishga qaratilgan qoʻshma ilmiy-tadqiqot loyihalarini ragʻbatlantiradi. Oʻz tarmogʻi, jumladan, Orhun talabalar va akademik xodimlar almashinuv dasturi orqali TURKUNIB taʼlim imkoniyatlarini kengaytirib, madaniy hamjihatlik, bilim almashinuvi va innovatsiyalarni rivojlantiradi.
main.about.program.p3=TURKUNIB oʻz mamlakatlarining barqaror rivojlanishiga hissa qoʻshadigan hamda turkiy xalqlar oʻrtasidagi birdamlik tuygʻusini mustahkamlaydigan yangi avlod olimlari, yetakchilari va mutaxassislarini tayyorlashga sodiqdir.
main.about.program.p4=Oʻz mohiyatiga koʻra, TURKUNIB shunchaki akademik hamkorlik emas – u insonlarni, gʻoyalarni va muassasalarni bogʻlovchi koʻprik boʻlib, yanada mustahkam va oʻzaro bogʻliq kelajak poydevorini yaratadi.
main.about.program.overview=Dasturga Umumiy Sharh

