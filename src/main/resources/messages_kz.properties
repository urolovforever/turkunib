page.about.intro.p1=Түркі мемлекеттері ұйымына (ТМҰ) мүше мемлекеттер арасындағы жоғары білім саласындағы ынтымақтастыққа институционалдық құрылым беру мақсатында Түркі университеттері одағын (TURKUNIB) құру Ұйым құрылған сәттен бастап басым күн тәртібіндегі мәселелердің бірі болып келеді. Одақ ортақ тарих, мәдениет және тілдік мұра негізінде университетаралық ынтымақтастықты нығайтуды, студенттер мен академиялық қызметкерлердің ұтқырлығын арттыруды және ортақ түркі жоғары білім беру кеңістігін құруды мақсат етеді.
page.about.intro.p2=Бүгінде TURKUNIB ТМҰ-ға мүше немесе бақылаушы мемлекеттер болып табылатын Әзірбайжан, Қазақстан, Қырғызстан, Түркия, Өзбекстан, Венгрия және Солтүстік Кипр Түрік Республикасында орналасқан 170 университетті қамтитын ауқымды бағдарламаға айналды.
page.about.intro.p3=TURKUNIB аясында Орхун студенттер мен академиялық қызметкерлер алмасу бағдарламасы да жүзеге асырылады. TURKUNIB-тің негізін құрайтын Орхун алмасу бағдарламасы – мүше мемлекеттер арасында студенттер мен академиялық қызметкерлердің алмасуын көздейтін бірлескен жоғары білім беру тетігі. Оның пилоттық жобасы 2017–2018 оқу жылында іске қосылып, содан бері кезең-кезеңімен кеңейтіліп келеді.
page.about.members=Біздің мүшелер
page.about.history=Біздің тарих
page.about.mission.title=Миссия
page.about.mission.text=Оқыту мен зерттеудегі үздіктікті насихаттау, мүше университеттер арасында академиялық ұтқырлық пен кредит трансферін қамтамасыз ету және Орхун алмасу бағдарламасы сияқты бірлескен бағдарламалар арқылы мәдени әрі институционалдық байланыстарды нығайту жолымен түркі әлеміндегі жоғары білімді дамыту. TURKUNIB студенттерге, оқытушыларға және оқу орындарына ортақ академиялық және қоғамдық мақсаттар жолында шекараларға қарамастан ынтымақтасуға мүмкіндік беретін біртұтас жоғары білім беру экожүйесін құруға бейілді.
page.about.vision.title=Көзқарас
page.about.vision.text=Студенттер мен ғалымдар шекараларға қарамастан еркін ынтымақтасатын – ықпалды зерттеулерді ілгерілететін, инновацияны дамытатын және берік әрі өзара тығыз байланысқан түркі әлемін қалыптастыратын жаңа буын ғалымдарды, көшбасшыларды және кәсіби мамандарды тәрбиелейтін – жанды, біртұтас түркі жоғары білім беру кеңістігі.
page.about.goals.title=Біздің мақсаттар
page.about.goals.subtitle=Біз студенттерге, профессор-оқытушылар құрамына және мекемелерге пайда әкелетін практикалық ынтымақтастыққа назар аударамыз.
page.about.goal.mobility.title=Академиялық ұтқырлық
page.about.goal.mobility.text=Студенттер мен қызметкерлер алмасу бағдарламалары; кредиттер мен дипломдарды өзара тану.
page.about.goal.standards.title=Ортақ стандарттар
page.about.goal.standards.text=Ортақ кредиттерді ауыстыру және сапаны қамтамасыз ету жүйесін әзірлеу.
page.about.goal.culture.title=Мәдени интеграция
page.about.goal.culture.text=Ортақ тарихты, мәдениет пен тілдерді дәріптейтін бағдарламалар.
page.about.goal.faculty.title=Профессор-оқытушылар құрамын дамыту
page.about.goal.faculty.text=Бірлескен оқыту, шеберлік сабақтары және ынтымақтасу негізіндегі оқыту бастамалары.
page.about.goal.competitions.title=Байқаулар мен симпозиумдар
page.about.goal.competitions.text=Мүшелер арасындағы академиялық байқаулар, симпозиумдар және мәдени іс-шаралар.
page.about.goal.scholarships.title=Стипендиялар
page.about.goal.scholarships.text=Түркі әлеміне бағытталған студенттер мен зерттеушілерді қолдау.
page.about.history.title=Біздің тарих
page.about.history.subtitle=Түркі университеттерінің одағын қалыптастырған кезеңдер.
page.about.history.item1=Білім министрлерінің кездесуінде өткен алғашқы талқылаулар ынтымақтастықтың негізін қалады.
page.about.history.item2=Түркі тілдес мемлекеттердің Ынтымақтастық кеңесінің Екінші саммитінде қабылданған шешімдер.
page.about.history.item3=Одақтың мүше университеттері арасында Жоғары білім беру кеңістігін құру туралы директива қабылданды.
