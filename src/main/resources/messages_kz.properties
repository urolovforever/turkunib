# About the program
main.about.program=TURKUNIB туралы
main.about.program.tagline=Түркі университеттерін берік болашақ үшін біріктіру
main.about.program.p1=TURKUNIB (Түркі университеттері одағы) – түркі әлеміндегі университеттер арасындағы академиялық байланыстарды нығайтуға және ынтымақтастықты дамытуға бағытталған серпінді бастама. Әзірбайжан, Қазақстан, Қырғызстан, Түркия, Өзбекстан, Венгрия және Солтүстік Кипр Түрік Республикасындағы 170 университетті біріктіре отырып, TURKUNIB ортақ тарихқа, мәдениетке және тілге негізделген біртұтас жоғары білім беру кеңістігін қалыптастырады.
main.about.program.p2=Біртұтас платформа құру арқылы бағдарлама студенттердің ұтқырлығын, оқытушылар алмасуын және аймақтық әрі жаһандық ортақ мәселелерді шешуге бағытталған бірлескен зерттеу жобаларын ынталандырады. TURKUNIB өз желісі – соның ішінде Орхун студенттер мен академиялық қызметкерлер алмасу бағдарламасы – арқылы білім беру мүмкіндіктерін кеңейтіп, мәдени түсіністікті, білім алмасуды және инновацияны дамытады.
main.about.program.p3=TURKUNIB өз елдерінің орнықты дамуына үлес қосып, түркі халықтары арасындағы бірлік сезімін нығайтатын жаңа буын ғалымдарды, көшбасшыларды және кәсіби мамандарды даярлауға бейілді.
main.about.program.p4=Түптеп келгенде, TURKUNIB – жай ғана академиялық серіктестік емес, ол адамдарды, идеяларды және институттарды байланыстыратын, берік әрі өзара тығыз байланысқан болашақтың іргетасын қалайтын көпір.
main.about.program.overview=Бағдарламаның жалпы шолуы

