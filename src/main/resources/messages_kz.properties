# --- membership page ---
page.membership.title=Түркі университеттері одағына (TURKUNIB) мүшелік
page.membership.intro=TURKUNIB-ке қалай мүше болуға болады: мүшелік талаптары, өтінім беру тәртібі және өтінім құжаттарын дайындау бойынша нұсқаулар.
page.membership.criteria.title=Мүшелік талаптары
page.membership.criteria.intro=TURKUNIB мүшелігіне үміткер университет мынадай шарттарға сай болуы тиіс:
page.membership.criteria.item1=TURKUNIB-тің мақсаттары мен міндеттеріне сәйкес іс-шаралар ұйымдастырған болуы,
page.membership.criteria.item2=Түркі әлеміне қатысты ғылыми зерттеулер немесе ғылыми жұмыстар жүргізген болуы,
page.membership.criteria.item3=ТМҰ-ға мүше мемлекеттердің университеттерімен нақты әрі өлшенетін ынтымақтастық орнатқан болуы (бірлескен жобалар, студенттер/қызметкерлер алмасуы, бірлескен зерттеулер және т.б.),
page.membership.criteria.item4=Алмасу бағдарламалары бойынша тәжірибесі және Орхун алмасу бағдарламасына үлес қосуға институционалдық әлеуеті болуы,
page.membership.criteria.item5=Халықаралық рейтинг агенттіктерінің деректері бойынша өзі жұмыс істейтін елдің үздік 20% университетінің қатарына кіруі.
page.membership.procedure.title=Өтінім беру тәртібі
page.membership.procedure.intro=Мүшелікке өтінімдер мынадай кезеңдерден өтеді:
page.membership.procedure.item1=Үміткер университеттер өтінімдерін өздері жұмыс істейтін елдің дипломатиялық арналары арқылы тікелей ТМҰ Хатшылығына жібереді.
page.membership.procedure.item2=Өтінімдер келіп түскеннен кейін ТМҰ Хатшылығы оларды бағалау үшін Одақ Төрағасымен келісе отырып тағайындалатын, мүше университеттер өкілдерінен құралған 5 адамдық комиссия құрады.
page.membership.procedure.item3=Комиссия әрбір өтінімді мүшелік талаптары тұрғысынан бағалап, қорытындыларын ТМҰ Хатшылығына жеткізеді.
page.membership.procedure.item4=ТМҰ Хатшылығы комиссияның ұсынысын түпкілікті шешім қабылдау үшін TURKUNIB Бас ассамблеясына жолдайды.
page.membership.procedure.item5=Одаққа мүшелік туралы шешім Одақ мүшелерінің кемінде үштен екісі қатысқан Бас ассамблея отырысында жай көпшілік дауыспен қабылданады.
page.membership.procedure.item6=ТМҰ-ға мүше мемлекеттердің бірінде жұмыс істемейтін, бірақ Одаққа қосылғысы келетін университеттерге жоғарыда аталған тәртіптер мен талаптарды орындаған жағдайда Бақылаушы мәртебесі берілуі мүмкін.
page.membership.procedure.item7=Дәлелді себепсіз қатарынан үш Бас ассамблея отырысына қатыспаған мүше университеттің Одақтағы мүшелігі тоқтатылады.
page.membership.guidance.title=Өтінім құжаттары мен Ректор хатына қатысты нұсқаулар
page.membership.guidance.item1=Мүшелікке өтінімдер негізделген болуы тиіс. Өтінім құжаттарының құрамына өтінімнің негіздемесі мен университеттің TURKUNIB-ке қосылу ниетін анық баяндайтын, Ректор қол қойған Ректор хатын (ілеспе хат) қосу ұсынылады.
page.membership.guidance.item2=Ректор хатына университеттің мүшелік талаптарына сай екенін дәлелдейтін толыққанды өтінім құжаттары қоса берілуі тиіс; растаушы құжаттарға тиісті іс-шаралардың дәлелдері, серіктестік келісімдері, алмасу бағдарламаларының жазбалары, институционалдық әлеует туралы мәлімдемелер және бірлескен жобалардың мысалдары кіруі мүмкін.
page.membership.guidance.item3=Өтінім хаты мен ілеспе құжаттар ТМҰ Хатшылығына жолдануы тиіс. Ұсынылған құжаттар ТМҰ Хатшылығының алдын ала қарауынан өтеді. Орынды деп танылған жағдайда өтінім TURKUNIB Бас ассамблеясының күн тәртібіне енгізіліп, түпкілікті шешім дауыс беру арқылы қабылданады. Мақұлданған мүшеліктер ТМҰ Хатшылығы дайындаған есеп арқылы мүше мемлекеттерге жеткізіліп, өтінім беру процесі аяқталады.
