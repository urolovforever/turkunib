page.directive.art3.title=Негіздеме
page.directive.art3.intro=(1) Осы Нұсқаулық мына отырыстарда қабылданған шешімдер негізінде әзірленді:
page.directive.art3.ref1=2012 жылғы 23 тамызда Бішкекте өткен Түркі мемлекеттері ұйымының Екінші саммитінде;
page.directive.art3.ref2=2012 жылғы 10 тамызда Шолпан-Атада өткен Түркі мемлекеттері ұйымы білім министрлерінің отырысында;
page.directive.art3.ref3=2012 жылғы 28-29 наурызда Ыстанбұлда өткен Түркі мемлекеттері ұйымы Түркі университеттері одағының дайындық отырысында;
page.directive.art3.ref4=2014 жылғы 16-17 қазанда Ерзурумда өткен Түркі университеттері одағының Бірінші Бас ассамблеясында;
page.directive.art3.ref5=2014 жылғы 28 қарашада Бакуде өткен білім министрлерінің Үшінші отырысында;
page.directive.art3.ref6=2015 жылғы 5 қыркүйекте Астанада өткен білім министрлерінің Төртінші отырысында;
page.directive.art3.ref7=2019 жылғы 15 наурызда Бішкекте өткен білім министрлерінің Бесінші отырысында;
page.directive.art3.ref8=2021 жылғы 4 қарашада Ыстанбұлда өткен білім министрлерінің Алтыншы отырысында;
page.directive.art3.ref9=2023 жылғы 14 маусымда Самарқандта өткен білім министрлерінің Жетінші отырысында;
page.directive.art3.ref10=2022 жылғы 23 қарашада Түркістанда өткен Түркі мемлекеттері ұйымының Түркі университеттері одағының Алтыншы Бас ассамблеясында.
page.directive.art4.title=Анықтамалар
page.directive.art4.intro=(1) Осы Нұсқаулықтың мақсаттары үшін:
page.directive.art4.def1=Түркі мемлекеттері ұйымы – Түркі тілдес мемлекеттердің Ынтымақтастық кеңесін білдіреді;
page.directive.art4.def2=Түркі мемлекеттері ұйымының саммиті – мүше мемлекеттердің мемлекет басшыларының жыл сайынғы кездесуін білдіреді;
page.directive.art4.def3=Түркі мемлекеттері ұйымы білім министрлерінің отырысы – білім министрлері бас қосатын отырысты білдіреді. Одаққа қатысты мәселелер талқыланған кезде отырысқа Түркияның Жоғары білім кеңесінің төрағасы да қатысады;
page.directive.art4.def4=Хатшылық – Түркі мемлекеттері ұйымының Хатшылығын білдіреді;
page.directive.art4.def5=Түркі мемлекеттері ұйымы білім министрлерінің жоғары лауазымды тұлғалары – мүше мемлекеттердің білім министрліктері тағайындаған ұлттық сарапшылардан құралған топты білдіреді;
page.directive.art4.def6=Одақ – Түркі мемлекеттері ұйымының аясында құрылған Түркі университеттері одағын білдіреді;
page.directive.art4.def7=Одақтың Бас ассамблеясы – мүше университеттердің ректорлары немесе олардың өкілдері, сондай-ақ Түркі мемлекеттері ұйымының Бас хатшысы немесе оның өкілі қатысуымен құрылатын комитетті білдіреді;
page.directive.art4.def8=TCHEA – Түркі мемлекеттері ұйымының Жоғары білім беру кеңістігін білдіреді.
page.directive.art5.title=Құрылтайшы мүшелер
page.directive.art5.p1=(1) Одақтың құрылтайшы мүшелері – төрт мүше мемлекеттен келген мына 15 университет.
page.directive.art5.country=Ел
page.directive.art5.university=Университет
page.directive.art5.memberslink=Одақтың қазіргі мүше университеттерін көру
page.directive.country.az=Әзербайжан
page.directive.country.kz=Қазақстан
page.directive.country.kg=Қырғызстан
page.directive.country.tr=Түркия
page.directive.art6.title=Ұйымдық құрылымы
page.directive.art6.p1=(1) Одақ Түркі мемлекеттері ұйымына мүше және бақылаушы мемлекеттер мен туыстас қауымдастықтардың университеттерінен тұрады.
page.directive.art6.chairmanship=Одақтың төрағалығы
page.directive.art6.p2=(2) Одақтың төрағасы – Түркі мемлекеттері ұйымының Бас хатшысы.
page.directive.art6.p3=(3) Кезекті төрағалық Бас ассамблея отырысында мүше университеттер арасынан ерікті негізде немесе басқа қатысушылардың ұсынысымен жай көпшілік дауыспен екі жылға сайланады.
page.directive.art6.p4=(4) Одақтың төрағасы өз міндеттерін академиялық мәселелерге жауапты кезекті төрағалық етуші университеттің ректорымен үйлестіре отырып атқарады.
page.directive.art6.p5=(5) Кезекті төрағалық етуші университеттің міндеттері:
page.directive.art6.duty1=Одақтың Бас ассамблея отырысын өткізу және Бас ассамблеяда қабылданған шешімдерді жүзеге асыру;
page.directive.art6.duty2=төрағалық кезеңінде Одақ мүшелері арасында Хатшылықпен үйлестіре отырып қажетті ынтымақтастық пен байланысты қамтамасыз ету.
page.directive.art6.p6=(6) Кезекті төрағалық етуші университеттің ректоры өз міндеттеріне байланысты Түркі мемлекеттері ұйымы білім министрлерінің отырысына және/немесе Түркі мемлекеттері ұйымының саммитіне шақырылуы мүмкін.
page.directive.art6.assembly=Бас ассамблея
page.directive.art6.p7=(7) Түркі университеттері одағының Бас ассамблеясы мүше елдердің университет өкілдерінен тұрады. Мүше университет өкілдері – ректор, тиісті проректор және интернационалдандыру бөлімінің бір өкілі.
page.directive.art6.board=Директорлар кеңесі
page.directive.art6.secretariat=Хатшылық
page.directive.art6.subcommittees=Кіші комитеттер
page.directive.art6.subcommittees.intro=Бас ассамблея айқындаған басым бағыттағы қызметтерді жүзеге асыру үшін жеті атқарушы комитет құрылды:
page.directive.art6.committee1=Түркі әлемі жоғары білім деректер банкі
page.directive.art6.committee2=Білім беру-оқыту комитеті
page.directive.art6.committee3=Ғылыми комитет
page.directive.art6.committee4=Түркі әлемі білім порталы
page.directive.art6.committee5=Жоғары білім сапасын қамтамасыз ету кеңесі
page.directive.art6.committee6=Спорт-мәдениет комитеті
page.directive.art6.committee7=Студенттік кеңес
page.directive.art6.contactgroup=Байланыс тобы
page.directive.art6.p8=(8) Байланыс тобына қатысу үшін Түркі мемлекеттері ұйымы Бас хатшының орынбасарын, ал мүше университеттер Одақ қызметіне жауапты проректор мен бір өкілді тағайындайды.
page.directive.art6.p9=(9) Байланыс тобының міндеті – Одақ шешімдерінің орындалуын үйлестіру.
page.directive.art6.p10=(10) Байланыс тобы жылына кемінде екі рет жиналады.
page.directive.art6.studentcouncil=Студенттік кеңес
page.directive.art6.p11=(11) Одақтың Студенттік кеңесі Одаққа мүше университеттерден сайланған студенттерден құралады.
page.directive.art6.p12=(12) Студенттік кеңесті құру, оның міндеттері мен жауапкершілігі және өзге де мәселелер бойынша Одақ тарапынан нұсқаулық әзірленеді.
page.directive.art7.title=Одақтың мақсаттары
page.directive.art7.intro=Ортақ тарихқа, мәдениет пен тілге сүйене отырып, түркі тілдес халықтар арасындағы достық пен ынтымақтастықты дамыту және мүше мемлекеттердің жоғары оқу орындары арасындағы ынтымақтастықты қамтамасыз ету мақсатында білім деңгейін көтеру үшін мынадай мақсаттар жүзеге асырылады:
page.directive.art7.obj1=Барлық мүше университеттерде заманауи ғылыми деңгейге сай тиісті білім беру стандарттарын енгізу арқылы ортақ өркениет пәндерін оқыту және сол арқылы ортақ бірегейлік пен мәдени сана-сезімге ие ұрпақ тәрбиелеу;
page.directive.art7.obj2=Жоғары білім беру бағдарламаларын халықаралық аккредиттеу стандарттарына сәйкес үйлестіру;
page.directive.art7.obj3=Академиялық қызметкерлерге арналған біліктілікті арттыру бағдарламаларын құру және жүзеге асыру;
page.directive.art7.obj4=Студенттер мен академиялық қызметкерлер алмасуын ынталандыру және осыған қажетті түзетулер енгізу;
page.directive.art7.obj5=Ортақ кредит трансфер жүйесін қалыптастыру;
page.directive.art7.obj6=Мүше университеттер арасында жоғары білім беру бағдарламаларының танылуын қамтамасыз ету және мүше университеттердің біліктілік құжаттарының баламалылығын өзара тану үшін тиісті негіз жасау;
page.directive.art7.obj7=Университеттердің белгілі бір салалардағы салыстырмалы артықшылықтарын пайдалану;
page.directive.art7.obj8=Қолданбалы бірлескен білім беру және зерттеу жобалары мен бағдарламаларын жүзеге асыру және осы салада басылымдар шығару;
page.directive.art7.obj9=Әлеуметтік және мәдени салаларда ынтымақтасу;
page.directive.art7.obj10=Түркі әлемі бойынша зерттеу жүргізетін студенттерге арнайы стипендиялар беру;
page.directive.art7.obj11=Түркі әлемі туралы академиялық зерттеулер мен жобалар жөнінде ақпарат алмасуды электронды түрде қамтамасыз ету және Түркі мемлекеттері ұйымының веб-сайтында сілтеме беру үшін университеттер жүргізетін тиісті зерттеулердің мекенжайларын Хатшылықтың веб-сайтына жіберу;
page.directive.art7.obj12=Одаққа мүше университеттердің сыртқы бағалау және аккредиттеу процестерінің сапасын қамтамасыз етуге қызмет ететін тәуелсіз "Жоғары білім сапасын қамтамасыз ету кеңесін" құру және оның қызметін қолдау;
page.directive.art7.obj13=Түркі мемлекеттері ұйымының мүшелеріне арналған жоғары білім деректер банкін құру;
page.directive.art7.obj14=Түркі әлемі индексін және салалық индекстерді құру;
page.directive.art7.obj15=Түркі әлемі білім порталын құру;
page.directive.art7.obj16=Түркі жоғары білім беру кеңістігін құру.
page.directive.art8.title=Жұмыс қағидаттары
page.directive.art8.p1=(1) Одақтың шешімдері Одаққа мүше университеттердің ректорлары немесе ректорлардың өкілдері және Түркі мемлекеттері ұйымының Бас хатшысы немесе оның өкілдері қатысатын Бас ассамблея отырысында жай көпшілік дауыспен қабылданады.
page.directive.art8.p2=(2) Одақтың хатшылық жұмысын Түркі мемлекеттері ұйымының Хатшылығы кезекті төрағалық етуші университетпен ынтымақтастықта жүргізеді.
page.directive.art8.p3=(3) Одақтың институционалдық құрылымы, жұмыс тәртібі мен қағидаттары және қаржы мәселелеріндегі практикасы Одаққа мүше университеттердің жай көпшілік дауыспен қабылдаған шешімі негізінде әзірленетін нұсқаулықтарға сәйкес айқындалады.
page.directive.art8.p4=(4) Одақ қабылдаған орындалуға тиіс шешімдер мен әзірлеген нұсқаулықтар Түркияның Жоғары білім кеңесінің төрағасы да қатысатын Түркі кеңесі білім министрлерінің отырысында бекітілгеннен кейін күшіне енеді.
page.directive.art8.p5=(5) Одақтың қызметін құрамында Жоғары білім кеңесі төрағалығының өкілі бар Түркі мемлекеттері ұйымы білім министрлерінің жоғары лауазымды тұлғалары қадағалайды. Аталған топтың мақсаты:
page.directive.art8.wp1=процесс барысында жүзеге асырылуы жоспарланған жобаларды қадағалау;
page.directive.art8.wp2=мүше мемлекеттер арасында қажетті үйлестіруді қамтамасыз ету;
page.directive.art8.wp3=процесс барысында туындауы мүмкін мәселелердің шешімін жүзеге асыру;
page.directive.art8.wp4=процеске қатысушы тараптар арасында қолайлылық пен қолданылу деңгейін арттыруға бағытталған іс-шараларды жүргізу;
page.directive.art8.wp5=ұлттық деңгейде туындаған мәселелерді шешу үшін қажетті ұлттық заңнамалық өзгерістерді зерделеу және тиісті органдарға ұсыныстар беру арқылы қолдау көрсету.
page.directive.art9.title=Одақтың қаржы көздері
page.directive.art9.intro=(1) Одақ жүзеге асыратын жоғары білім беру қызметінің барлық шығыстары төменде көрсетілген көздерден қаржыландырылады:
page.directive.art9.fin1=Мүше университеттердің қаржы ресурстары;
page.directive.art9.fin2=Құрылатын "Түркі ғылыми зерттеу қоры" беретін ресурстар, сондай-ақ ұлттық немесе халықаралық мекемелердің ресурстары;
page.directive.art9.fin3=Мүше мемлекеттердің университеттерінен жобалық негізде берілетін қосымша ресурстар;
page.directive.art9.fin4=Түркі мемлекеттері ұйымы мүшелерінің бюджеттерінен бөлінетін ресурстар.
page.directive.art10.title=Одаққа мүшелік
page.directive.art10.p1=(1) Кандидаттық өтінімдер жазбаша негіздемемен Түркі кеңесінің Хатшылығына беріледі. Мүшелікке қабылдау және мүшелікті тоқтату туралы шешімдер байланыс тобы арқылы мүше университеттердің пікірлері алынғаннан кейін Одақ мүшелерінің кемінде үштен екісінің қатысуымен өтетін Бас ассамблея отырысында жай көпшілік дауыспен қабылданады.
page.directive.art10.membershiplink=Мүшелік рәсімі туралы толығырақ білу
page.directive.art11.title=Түркі әлемі жоғары білім беру кеңістігі
page.directive.art11.p1=(1) TCHEA – мүше мемлекеттер арасында құрылған және жоғары білімге қатысты білім беру қызметі жүзеге асырылатын кеңістік.
page.directive.art11.p2=(2) TCHEA мүше мемлекеттер құратын ортақ платформалар арқылы 7-бапта көрсетілген мақсаттарға қол жеткізуді көздейді.
page.directive.art12.title=Іске асыру процестері
page.directive.art12.p1=(1) Түркі әлемі жоғары білім беру кеңістігі аясында Одаққа мүше мемлекеттер ынтымақтастық салалары бойынша мына мәселелерді үйлестіруі қажет:
page.directive.art12.item1=Студенттер мен академиялық қызметкерлерге арналған алмасу бағдарламалары;
page.directive.art12.item2=Күндізгі, қашықтықтан немесе ашық білім беру арқылы жүзеге асырылатын қысқа мерзімді жоғары білім, бакалавриат және жоғары оқу орнынан кейінгі деңгейлердегі бірлескен сертификаттық бағдарламаларды ашуға қатысты өз елдеріндегі қолданыстағы заңнама.
page.directive.art12.p2=(2) Жүзеге асырылатын ынтымақтастық аясында мына мәселелерді құрамына Түркияның Жоғары білім кеңесі төрағалығының өкілі кіретін Түркі мемлекеттері ұйымы білім министрлерінің жоғары лауазымды тұлғалары қолдайды:
page.directive.art12.sup1=Одаққа мүше университеттер және басқа да ресми ғылыми мекемелер беретін біліктілік құжаттарының баламалылығын қамтамасыз ету;
page.directive.art12.sup2=Түркі әлемі жоғары білім беру кеңістігін құру және тарату құралдарын пайдалану мен ілгерілету Түркияның Жоғары білім кеңесі төрағалығы өкілінің қолдауымен, сондай-ақ түркі мемлекеттері білім министрлерінің жоғары лауазымды тұлғалары арқылы ынталандырылады.
page.directive.art13.title=Студенттер мен академиялық қызметкерлердің ұтқырлығы
page.directive.art13.p1=(1) Мүше университеттерде қазіргі уақытта жұмыс істейтін және/немесе ашылатын жазғы және қысқы мектептерге басқа мүше университеттердің студенттері қабылданады. Осы бағдарламаларда студенттерге ұсынылатын мүмкіндіктер өзара теңдік негізінде айқындалады.
page.directive.art13.p2=(2) Студенттер мен академиялық қызметкерлер алмасуы үшін Орхун бағдарламасы үлгі ретінде қолданылады.
page.directive.art13.p3=(3) Студенттердің бұрынғы білімін тану, студент қабылдау, оқу келісімі және транскрипт дайындау мүше университеттер айқындайтын ортақ кредит жүйесіне сәйкес ұйымдастырылады.
page.directive.art13.orhunlink=Орхун алмасу бағдарламасы туралы толығырақ білу
page.directive.art14.title=Нұсқаулықта қамтылмаған мәселелер
page.directive.art14.p1=Осы Нұсқаулықты жүзеге асыру барысында туындауы мүмкін мәселелерді шешуге арналған өзгерістерді Бас ассамблея қосымша құжатпен қабылдай алады.
page.directive.art15.title=Нұсқаулық тілдері
page.directive.art15.p1=Осы Нұсқаулық әзербайжан, қазақ, қырғыз, түрік және ағылшын тілдерінде дайындалды.
page.directive.art16.title=Күшіне енуі
page.directive.art16.p1=Осы Нұсқаулықтың ережелері Одақтың Бас ассамблеясында мақұлданғаннан кейін Түркі мемлекеттері ұйымы білім министрлерінің отырысында бекітілген күнінен бастап күшіне енеді.
page.directive.art17.title=Орындалуы
page.directive.art17.p1=Осы Нұсқаулықтың ережелерін Хатшылық кезекті төрағалық етуші университетпен ынтымақтастықта жүзеге асырады.
page.directive.art17.p2=Бұл процесс Орхун бағдарламасы ретінде айқындалды.
# Orhun Application Guide page
page.orhunguide.title=Орхун алмасу бағдарламасы — Өтінім беру жөніндегі нұсқаулық
page.orhunguide.intro=Студенттер мен академиялық қызметкерлерге арналған практикалық нұсқаулық: өтінім беру талаптары, өтінім беру процесі, қажетті құжаттар және ұтқырлыққа іріктелгеннен кейін орындалатын қадамдар.
page.orhunguide.download=Нұсқаулықты жүктеп алу (PDF)
page.orhunguide.orhunlink=Ағымдағы хабарландыру, квоталар және құжат үлгілері
page.orhunguide.toc=Мазмұны
page.orhunguide.doc.col1=Құжат
page.orhunguide.doc.col2=Сипаттамасы
page.orhunguide.s1.title=1. Орхун алмасу бағдарламасы туралы
page.orhunguide.s1.p1=Орхун алмасу бағдарламасы – Түркі мемлекеттері ұйымының (ТМҰ) аясында жұмыс істейтін Түркі университеттері одағы (TURKUNIB) жүзеге асыратын және мүше елдердің жоғары оқу орындары арасында студенттер мен оқытушылар құрамының ұтқырлығын ілгерілететін басты бағдарлама. Бағдарламаның мақсаты – академиялық ынтымақтастықты дамыту, мекемеаралық байланыстарды нығайту және халықтар арасындағы мәдени өзара әрекеттестікті арттыру.
page.orhunguide.s1.p2=Бағдарлама 2017–2018 оқу жылында пилоттық жоба ретінде басталды; COVID-19-дан кейінгі кезеңде қайта жанданып, ауқымы кеңейді және бүгінде 170 мүше университетті біріктіретін кең желіге айналды.
page.orhunguide.s1.obj.title=Стратегиялық мақсаттар
page.orhunguide.s1.obj1=Мүше елдердің университеттері арасында академиялық интеграция мен ұтқырлықты арттыру,
page.orhunguide.s1.obj2=«Түркі әлемі жоғары білім беру кеңістігін» құруға үлес қосу,
page.orhunguide.s1.obj3=Жоғары білім беру жүйелерін Болон процесі және ECTS сияқты халықаралық стандарттармен үйлестіру,
page.orhunguide.s1.obj4=Аймақтық дамуға, зерттеу ынтымақтастығына және инновацияға үлес қосу.
page.orhunguide.s1.countries.title=Бағдарлама қамтитын мүше елдер
page.orhunguide.s1.countries.p1=Бағдарлама аясында академиялық қызметкерлер мен студенттер Түркі мемлекеттері ұйымының Университеттер одағына мүше университеттерге ұтқырлықпен барып қайту мүмкіндігіне ие. Мүше елдер: Түркия, Әзербайжан, Қырғызстан, Қазақстан, Өзбекстан, Солтүстік Кипр Түрік Республикасы және Венгрия.
page.orhunguide.s2.title=2. Жалпы қағидаттар
page.orhunguide.s2s1.title=2.1 Хаттамаларға негізделу
page.orhunguide.s2s1.p1=Орхун алмасу бағдарламасы тек мүше мекемелер арасында қол қойылған «Орхун алмасу бағдарламасының хаттамасы» аясында ғана жүзеге асырыла алады. Университет өзімен хаттама жасалмаған мекемеден студенттерді немесе оқытушылар құрамын қабылдай алмайды және оған жібере алмайды. Хаттаманың бір данасы Түркі мемлекеттері ұйымының Хатшылығында сақталады.
page.orhunguide.s2s2.title=2.2 Тілдер
page.orhunguide.s2s2.p1=Бағдарламаға қатысты нормативтік актілер, ақпарат, файлдар мен құжаттар мүше мемлекеттердің ресми тілдерінде, түрік және ағылшын тілдерінде дайындалады. Мәтіндер арасында алшақтық болған жағдайда ағылшын тіліндегі мәтін басым күшке ие болады.
page.orhunguide.s2s3.title=2.3 Қаржы көздері
page.orhunguide.s2s3.fin1=Ұлттық немесе халықаралық мекемелер мен ұйымдар бөлетін қаражат,
page.orhunguide.s2s3.fin2=Мүше университеттердің өз бюджеттік қаражаты,
page.orhunguide.s2s3.fin3=TURKUNIB-тің кезекті төрағалық етуші университеті мен Түркі мемлекеттері ұйымы бөлетін қаражат.
page.orhunguide.s2s3.p1=Мүше университеттер әрбір оқу жылына арналған қаржылық қажеттіліктерін ұтқырлыққа дейін өз бюджеттерінде көрсетуге міндетті; қаражатты бөлуде қажетті үйлестіруді Түркі мемлекеттері ұйымының Хатшылығы қамтамасыз етеді.
page.orhunguide.s3.title=3. Студенттер қалай өтінім береді?
page.orhunguide.s3.p1=Орхун алмасу бағдарламасы аясында ресми білім беру бағдарламасында оқитын студенттер өз жоғары оқу орны хаттамаға қол қойған мүше мекемеде бір немесе екі семестр бойы (жалпы алғанда бір оқу жылынан аспайтын мерзімде) оқуын жалғастыра алады.
page.orhunguide.s3s1.title=3.1 Өтінім беру талаптары
page.orhunguide.s3s1.req1=Ресми жоғары білім беру бағдарламасында оқып жатқан болу,
page.orhunguide.s3s1.req2=Жиынтық орташа балл (GPA) 4-тен кемінде 2,5 (немесе оған балама) болу,
page.orhunguide.s3s1.req3=Дайындық курсының, бірінші курстың және бітіруші курстың студенттері бағдарламаны пайдалана алмайды,
page.orhunguide.s3s1.req4=Шетелде халықаралық студент мәртебесімен оқитындар өз елінің университетіне өтінім бере алмайды.
page.orhunguide.s3s2.title=3.2 Өтінім беру процесі және хабарландыру
page.orhunguide.s3s2.item1=Жоғары оқу орны өзі қол қойған Орхун алмасу бағдарламасының хаттамалары мен тиісті квоталарды өз веб-сайтында жариялайды.
page.orhunguide.s3s2.item2=Хабарландыруда бағдарламаның таныстырылымы, өтінім беру талаптары және процесс қадамдары қамтылады.
page.orhunguide.s3s2.item3=Студент жарияланған квота мен күнтізбеге сәйкес тиісті мекемеге өтінім береді.
page.orhunguide.s3s2.item4=Өтінімдер жүйеге жүктелген құжаттармен бірге қабылдаушы мекемеге жеткізілу үшін үйлестіруші университетке жолданады.
page.orhunguide.s3s2.item5=TURKUNIB-тің кезекті төрағалық етуші университеті екіжақты хаттамалар аясында алмасу студенттерінің саны мен бөлінісін айқындайды.
page.orhunguide.s3s2.item6=Бағалау үміткерлердің орташа балы (GPA) негізінде жүргізіледі; нәтижелер хаттамаға қол қойған мекемелердің веб-сайттарында жарияланады.
page.orhunguide.s3.note1=100 балдық бағалау жүйесінен 4 балдық жүйеге ауыстыру қабылдаушы университеттің баламалылық туралы шешіміне негізделеді. Сонымен қатар, TURKUNIB-тің кезекті төрағалық етуші университеті тиімді әрі нәтижелі ұтқырлық үшін қосымша шарттар белгілей алады.
page.orhunguide.s3s3.title=3.3 Қажетті құжаттар
page.orhunguide.s3.doc1=Өтінім формасы
page.orhunguide.s3.doc1.desc=Студенттің өтінім құжаты
page.orhunguide.s3.doc2=Транскрипт
page.orhunguide.s3.doc2.desc=Жаңартылған академиялық транскрипт
page.orhunguide.s3.doc3=Студенттің міндеттемелер келісімі
page.orhunguide.s3.doc3.desc=Орхун алмасу бағдарламасы бойынша студенттің міндеттемелер келісімі — студент пен мекеме арасында қол қойылады
page.orhunguide.s3.doc4=Басқа құжаттар
page.orhunguide.s3.doc4.desc=Хаттамаға қол қойған университеттер белгілейтін қосымша құжаттар (бар болса)
page.orhunguide.s3s3.p1=Алмасу мерзімі аяқталған соң студент транскрипті, оқу мерзімін көрсететін Қатысу сертификатын және студенттің қорытынды есебін қайтып оралған күннен бастап 30 күн ішінде өз мекемесінің Орхун алмасу бағдарламасы жөніндегі үйлестіру кеңсесіне жеке өзі, пошта немесе электрондық пошта арқылы тапсырады. Жетіспейтін құжаттар үшін 15 күнге дейін қосымша мерзім берілуі мүмкін; құжаттар белгіленген мерзімде толықтырылмаса, процесс жарамсыз деп танылып, жасалған төлемдерді қайтару талап етіледі.
page.orhunguide.s3s4.title=3.4 Оқу келісімі
page.orhunguide.s3s4.p1=Ұтқырлық басталғанға дейін студенттің қабылдаушы мекемеде оқитын пәндері мен кредиттері және олардың өз мекемесіндегі сәйкес пәндері «Оқу келісімі» (Learning Agreement) арқылы айқындалады. Келісім үш данада дайындалады; бір данасы студентте, қалғандары екі мекемеде сақталады. Келісімге тиісті кафедра меңгерушілері мен мекемелердің жоғары лауазымды басшылары (немесе олардың уәкілетті өкілдері) қол қояды. Міндетті өзгерістер қабылдаушы мекеменің оқу кезеңі басталғаннан кейін ең кеш 30 күн ішінде (және міндетті емтихан күндерінен бұрын) енгізілуі тиіс.
page.orhunguide.s3s5.title=3.5 Пәндердің баламалылығы, қайта оқу және емтихандар
page.orhunguide.s3s5.item1=Оқу жүктемесі кредит негізінде айқындалады; пәндер саны емес, кредиттер негізге алынады. Мекемелер ECTS жүйесін негіз ретінде пайдалана алады.
page.orhunguide.s3s5.item2=Студент сәтсіз тапсырған пәндер оқу келісімінде көрсетілген балама пән негізінде өз мекемесінде қайта оқылады; қайта оқылатын пәнді қабылдаушы мекемеде алуға болмайды.
page.orhunguide.s3s5.item3=Орхун алмасу бағдарламасының студенттеріне шартты түрде өту қолданылмайды; қайта тапсыру емтиханын студент тек өзі қазіргі уақытта алмасу студенті болып отырған мекемеде тапсыра алады.
page.orhunguide.s3s5.item4=Дипломдық жұмыс, тәжірибеден өту және зертханалық жұмыстар сияқты жұмыс түрлері студенттің өз мекемесінің ережелеріне бағынады.
page.orhunguide.s3s5.item5=Алмасу аяқталған соң мекемелер сәтті аяқталған пәндердің кредиттері мен бағаларын тануға міндетті; бұл пәндер диплом қосымшасында көрсетіледі.
page.orhunguide.s3s6.title=3.6 Қаржылық міндеттемелер
page.orhunguide.s3s6.item1=Студент алмасу кезеңінде міндетті жарнаны/оқу ақысын өз мекемесіне төлеуді жалғастырады; тіркеуді тоқтата тұруға болмайды.
page.orhunguide.s3s6.item2=Қабылдаушы мекемеге қосымша оқу ақысы төленбейді.
page.orhunguide.s3s6.item3=Басқа стипендиялар мен несиелер оқу мерзімі бойы жалғаса береді.
page.orhunguide.s3s7.title=3.7 Тәртіп
page.orhunguide.s3s7.p1=Алмасу студенттері ұтқырлық кезеңінде өздері жүрген мекеменің тәртіптік ережелеріне бағынады. Тәртіптік тексеру басталған жағдайда оның нәтижесі студенттің өз мекемесіне хабарланады; жазаны ұтқырлық кезеңінде қолдану мүмкін болмаса, оны студенттің өз мекемесі орындайды.
page.orhunguide.s4.title=4. Академиялық қызметкерлер қалай өтінім береді?
page.orhunguide.s4.p1=Орхун алмасу бағдарламасының хаттамасына қол қойған мекемелерде жұмыс істейтін барлық оқытушылар оқытушылар құрамының ұтқырлығына қатыса алады. Ұтқырлық бір мекеменің қызметкері басқа мүше мекемеде жүзеге асыратын оқыту қызметін қамтиды.
page.orhunguide.s4s1.title=4.1 Ауқымы мен мерзімі
page.orhunguide.s4s1.item1=Ұтқырлық мерзімі кемінде екі апта, ең көбі үш ай болуы мүмкін; ол бір оқу жылында тек бір рет жүзеге асырылады.
page.orhunguide.s4s1.item2=Апталық жалпы академиялық қызмет кемінде алты сағат болуы тиіс (сабақ сағаттары негізге алынады; жеткіліксіз болса, семинар, панель немесе конференция сияқты іс-шаралармен толықтырылуы мүмкін).
page.orhunguide.s4s1.item3=Оқытуды қамтымайтын ұтқырлық жоспарлары Орхун алмасу бағдарламасы аясында қабылданбайды.
page.orhunguide.s4s2.title=4.2 Өтінім хабарландыруы және іріктеу процесі
page.orhunguide.s4s2.item1=Қол қойылған хаттамалар мен квоталар мекеменің және TURKUNIB-тің веб-сайттарында жарияланады; хабарландырулар кемінде 15 күн бойы жарияланып тұрады.
page.orhunguide.s4s2.item2=Хабарландыру мерзімінде берілген барлық өтінімдер тіркеледі; бір данасы мекеменің Орхун алмасу бағдарламасы жөніндегі үйлестіру кеңсесінде сақталады.
page.orhunguide.s4s2.item3=Қызметкер барғысы келетін мекемедегі тиісті кафедрамен байланысып, қолайлы пәндерді айқындайды және «Оқытушылар құрамының ұтқырлық жоспарын» дайындайды.
page.orhunguide.s4s2.item4=Жоспарды жіберуші және қабылдаушы мекемелердің тиісті академиялық бөлімшелерінің кеңестері бекітеді және ол ұтқырлық басталуына кемінде 15 күн қалғанда үйлестіру кеңсесіне тапсырылады.
page.orhunguide.s4s2.item5=Бағалау кезінде бұған дейін алмасу бағдарламасына қатыспаған оқытушыларға және Орхун кафедра үйлестірушілеріне басымдық беріледі.
page.orhunguide.s4s2.item6=Нәтижелер хаттамаға қол қойған мекеменің веб-сайтында жарияланады.
page.orhunguide.s4.note2=Іріктелген, бірақ дәлелді себепсіз қатыспаған қызметкер бағдарламаны үш жыл бойы пайдалана алмайды.
page.orhunguide.s4s3.title=4.3 Қажетті құжаттар
page.orhunguide.s4.doc1=Академиялық қызметкер туралы ақпарат формасы
page.orhunguide.s4.doc1.desc=Мекеменің веб-сайтындағы «Құжаттар» мәзірінен алынады
page.orhunguide.s4.doc2=Академиялық қызметкерлердің ұтқырлық бағдарламасы
page.orhunguide.s4.doc2.desc=Жүзеге асырылатын іс-шараларды егжей-тегжейлі сипаттайтын жоспар; мекеменің веб-сайтынан алынады
page.orhunguide.s4.doc3=Түйіндеме (CV)
page.orhunguide.s4.doc3.desc=Жаңартылған түйіндеме (CV)
page.orhunguide.s4.doc4=Қатысу сертификаты
page.orhunguide.s4.doc4.desc=Ұтқырлық аяқталған соң қабылдаушы мекеме қол қойып/мөр басып береді
page.orhunguide.s4.doc5=Қызмет нәтижелері туралы есеп
page.orhunguide.s4.doc5.desc=Қызметкер дайындайды; іс-шара аяқталғаннан кейін 15 күннен кешіктірмей үйлестіру кеңсесіне тапсырылады
page.orhunguide.s4s4.title=4.4 Қаржылық құқықтар мен міндеттер
page.orhunguide.s4s4.item1=Қызметкердің еңбек құқықтары өз университетінде сақталады.
page.orhunguide.s4s4.item2=Алғашқы екі аптаның тәуліктік жәрдемақысы мен жол шығындарын жіберуші мекеме өтейді.
page.orhunguide.s4s4.item3=Тұру мен күнкөрісті (жатын орын және тамақтану) қабылдаушы университет қамтамасыз етеді.
page.orhunguide.s5.title=5. Ұтқырлыққа іріктелдім — енді не істеуім керек?
page.orhunguide.s5.p1=Ұтқырлыққа іріктелген студенттер мен академиялық қызметкерлерге ұтқырлық басталғанға дейін келесі алты қадамды рет-ретімен орындау ұсынылады:
page.orhunguide.s5.step1=Kion аккаунтын ашу
page.orhunguide.s5.step1.text=Тиісті алмасу бағдарламасының веб-сайтында берілген сілтеме арқылы Kion аккаунтын ашу қажет. Ұтқырлыққа қажетті құжаттар осы жүйеге жүктеледі.
page.orhunguide.s5.step2=Қабылдау хатын алу
page.orhunguide.s5.step2.text=Қабылдау хатын алу үшін орналастырылған университетпен электрондық пошта арқылы байланысу қажет.
page.orhunguide.s5.step3=Пәндердің мазмұнына қол жеткізу
page.orhunguide.s5.step3.text=Пәндердің мазмұнын қабылдаушы университеттің веб-сайтынан алу қажет. Бұл ақпарат веб-сайтта болмаса, оны серіктес мекемеден электрондық пошта арқылы сұрату керек.
page.orhunguide.s5.step4=Оқу келісімін дайындау
page.orhunguide.s5.step4.text=Жаңартылған транскрипт пен серіктес мекемеден алынған пәндер тізімін пайдалана отырып, Оқу келісімін (Learning Agreement) мекеменің Орхун кафедра үйлестірушісімен бірлесіп дайындау қажет.
page.orhunguide.s5.step5=Оқу/оқыту келісіміне қол қою процесі
page.orhunguide.s5.step5.text=Дайындалған Оқу/Оқыту келісіміне (Learning/Teaching Agreement) кафедра меңгерушісі мен кафедра үйлестірушісі қол қояды; кейін ол түпкілікті қол қою және мөр басу үшін Алмасу бағдарламалары үйлестіру кеңсесіне электрондық пошта арқылы жіберіледі.
page.orhunguide.s5.step6=Қажетті құжаттарды тапсыру
page.orhunguide.s5.step6.text=Студенттің міндеттемелер туралы кепілдемесі және Әуе рейсіне сұраныс формасы сияқты ұтқырлыққа қажетті құжаттар Kion жүйесіне жүктеледі.
page.orhunguide.s5.note3=Бұл алты қадам ұтқырлыққа іріктелгеннен кейін орындалатын жалпы процесті қысқаша сипаттайды; әрбір мүше мекеменің өз институционалдық жүйесіне (мысалы, Kion) байланысты шағын айырмашылықтар болуы мүмкін. Жаңартылған ақпарат алу үшін тиісті мекеменің Алмасу бағдарламалары үйлестіру кеңсесіне хабарласу ұсынылады.
page.orhun.guidelink=Өтінім беру жөніндегі нұсқаулық

