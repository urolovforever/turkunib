page.orhun.title=Орхун алмасу бағдарламасы
page.orhun.intro.p1=Түркі университеттері одағы (TURKUNIB) аясында жұмыс істейтін Орхун алмасу бағдарламасы Түркі мемлекеттері ұйымының (ТМҰ) жоғары білім саласындағы басты ұтқырлық тетігіне айналды. 2017–2018 оқу жылында пилоттық жоба ретінде іске қосылғаннан бері Бағдарлама ауқымы мен ықпалы жағынан тұрақты түрде өсіп, мүше және бақылаушы мемлекеттердегі шамамен 170 университет арасында академиялық алмасуға жол ашып отыр. Құрылымдалған ұтқырлық схемалары арқылы Бағдарлама студенттер мен қызметкерлер алмасуын, бірлескен зерттеу бастамаларын, оқу бағдарламаларын бірлесіп әзірлеуді және оқыту мен ғылыми қызмет саласындағы университетаралық ынтымақтастықты қолдайды.
page.orhun.intro.p2=Тікелей академиялық нәтижелерімен қатар, Орхун алмасу бағдарламасы біртұтас әрі бәсекеге қабілетті Түркі жоғары білім беру кеңістігін қалыптастырудың, институционалдық жақындасуды, сапаны арттыруды және қатысушы университеттер арасында академиялық біліктіліктерді өзара тануды ілгерілетудің стратегиялық құралы болып табылады. Студенттер, оқытушылар мен зерттеушілер арасындағы тікелей байланысқа мүмкіндік бере отырып, Бағдарлама түркі әлеміндегі адамдар арасындағы байланысты, мәдени түсіністікті және академиялық ынтымақты нығайтуда шешуші рөл атқарады – осылайша Түркі мемлекеттері ұйымы көздеген аймақтық интеграцияның кең ауқымды пайымына үлес қосады.
page.orhun.regulation.title=Ереже
page.orhun.regulation.text=Бұл ережелердің мақсаты — Түркі кеңесінің Түркі университеттерінің одағына мүше жоғары оқу орындары арасында оқытушылар мен студенттер алмасуының негізін айқындау. Бұл Ереже Түркі кеңесінің Түркі университеттерінің одағына мүше жоғары оқу орындары арасында оқытушылар мен студенттер алмасуының негіздерін қамтиды.
