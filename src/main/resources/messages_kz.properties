page.terms.lastupdated=Соңғы жаңартылған:
page.terms.intro=turkunib.org-қа қош келдіңіз («Сайт»). Осы Шарттар мен ережелер («Шарттар», «Келісім») сіздің Сайтқа қол жеткізуіңіз бен оны пайдалануыңызды реттейді. Сайтқа кіру немесе оны пайдалану арқылы сіз осы Шарттарды сақтауға келісесіз. Егер сіз осы Шарттармен келіспесеңіз, Сайтты пайдаланбаңыз.
page.terms.s1.title=1. Анықтамалар
page.terms.s1.text=«Біз», «біздің» сөздері Сайт операторын білдіреді. «Сіз» немесе «Пайдаланушы» Сайтқа кіретін кез келген келушіні, пайдаланушыны немесе басқа адамды білдіреді.
page.terms.s2.title=2. Шарттарды қабылдау
page.terms.s2.text=Сіздің Сайтты пайдалануыңыз осы Шарттарға және барлық қолданыстағы заңдар мен ережелерге бағынады. Егер сіз Сайтты ұйым атынан пайдалансаңыз, оның атынан осы Шарттарды қабылдауға өкілеттігіңіз бар екенін растайсыз.
page.terms.s3.title=3. Рұқсат етілген пайдалану
page.terms.s3.item1=Сайтты тек заңды мақсаттарда және басқалардың құқықтарын бұзбайтын түрде пайдаланыңыз.
page.terms.s3.item2=Сайтқа, оның серверлеріне немесе кез келген байланысты жүйелерге рұқсатсыз қол жеткізуге әрекеттенбеңіз.
page.terms.s3.item3=Зиянды бағдарламалық жасақтаманы, зиянды кодты енгізбеңіз немесе Сайттың жұмысын бұзатын немесе нашарлататын әрекеттермен айналыспаңыз.
page.terms.s4.title=4. Тіркелгілер мен қауіпсіздік
page.terms.s4.text=Егер Сайт тіркелгі құру мүмкіндігін ұсынса, сіз өзіңіздің тіркелгі деректеріңізді қорғауға және тіркелгіңіз арқылы орындалатын барлық әрекеттерге жауаптысыз. Біз осы Шарттарды немесе қолданыстағы заңды бұзатын тіркелгілерді тоқтата тұру немесе жою құқығын өзімізде сақтаймыз.
page.terms.s5.title=5. Зияткерлік меншік
page.terms.s5.text=Сайттағы барлық мазмұн, соның ішінде мәтін, графика, логотиптер, белгішелер, суреттер және дизайн элементтері бізге немесе біздің лицензиарларымызға тиесілі және қолданыстағы авторлық құқық пен басқа да зияткерлік меншік заңдарымен қорғалған. Сіз біздің алдын ала жазбаша келісімімізсіз кез келген мазмұнды көшіруге, көбейтуге, өзгертуге, таратуға немесе көпшілікке көрсетуге құқығыңыз жоқ.
page.terms.s6.title=6. Мазмұн мен дәлдік
page.terms.s6.text=Біз Сайттағы ақпараттың дәл әрі өзекті болуын қамтамасыз ету үшін ақылға қонымды күш-жігер жұмсаймыз; алайда біз мазмұнның қателер мен олқылықтардан ада екеніне кепілдік бермейміз. Біз ақпаратты кез келген уақытта алдын ала ескертусіз жаңартуымыз немесе түзетуіміз мүмкін.
page.terms.s7.title=7. Үшінші тарап сілтемелері
page.terms.s7.text=Сайтта бізге тиесілі емес немесе біз бақыламайтын үшінші тарап веб-сайттарына немесе қызметтеріне сілтемелер болуы мүмкін. Біз кез келген үшінші тарап веб-сайттарының мазмұны, құпиялылық саясаты немесе тәжірибесі үшін жауапты емеспіз.
page.terms.s8.title=8. Тыйым салынған әрекеттер
page.terms.s8.item1=Сайтты оны өшіруі, шамадан тыс жүктеуі немесе бұзуы мүмкін кез келген түрде пайдалану.
page.terms.s8.item2=Біздің келісімімізсіз деректерді өндіру, скрейпинг немесе ұқсас деректерді жинау әдістері.
page.terms.s8.item3=Кез келген адам немесе ұйым болып көріну немесе өз қатыстылығыңызды бұрмалап көрсету.
page.terms.s9.title=9. Жауапкершіліктен бас тарту
page.terms.s9.text=Сайт пен оның мазмұны «бар күйінде» және «қол жетімді күйінде» негізінде, нақты немесе жасырын кез келген кепілдіктерсіз, соның ішінде сату жарамдылығына, белгілі бір мақсатқа жарамдылығына және құқық бұзбауға қатысты жасырын кепілдіктермен шектелмей, ұсынылады.
page.terms.s10.title=10. Жауапкершілікті шектеу
page.terms.s10.text=Заңмен рұқсат етілген барынша толық дәрежеде біз (а) сіздің Сайтты пайдалануыңыздан немесе пайдалана алмауыңыздан; (ә) біздің серверлерімізге кез келген рұқсатсыз қол жеткізуден немесе оларды пайдаланудан; немесе (б) Сайттан алынған кез келген мазмұннан туындайтын кез келген жанама, кездейсоқ, ерекше, салдарлы немесе айыппұл түріндегі зияндар үшін, не тікелей, не жанама келтірілгеніне қарамастан кез келген пайда немесе кіріс жоғалтуы үшін, не деректерді, пайдалануды, іскерлік беделді немесе басқа да материалдық емес шығындарды жоғалту үшін жауапты болмаймыз.
page.terms.s11.title=11. Залалдың орнын толтыру
page.terms.s11.text=Сіз бізді және біздің еншілес мекемелерімізді, лауазымды тұлғаларымызды, қызметкерлерімізді және агенттерімізді сіздің Сайтты пайдалануыңыздан немесе осы Шарттарды бұзуыңыздан туындайтын немесе олармен кез келген түрде байланысты кез келген талаптардан, міндеттемелерден, зияндардан, шығындардан және шығыстардан қорғауға, олардың орнын толтыруға және зиян келтірмеуге келісесіз.
page.terms.s12.title=12. Қолданылатын заң мен заңды құзыреттілік
page.terms.s12.text=Осы Шарттар біздің негізгі қызмет орнымыздың заңды құзыреттілігінде қолданылатын заңдарға сәйкес реттеледі және түсіндіріледі, оның заңдар қақтығысы туралы ережелеріне қарамастан. Кез келген даулар сол заңды құзыреттіліктегі соттардың айрықша құзыретіне жатады.
page.terms.s13.title=13. Осы Шарттардағы өзгерістер
page.terms.s13.text=Біз осы Шарттарды мезгіл-мезгіл қайта қарауымыз мүмкін. Жаңартылған Шарттар «Соңғы жаңартылған» күнімен осы парақта орналастырылады. Өзгерістер күшіне енгеннен кейін Сайтты пайдалануды жалғастыруыңыз қайта қаралған Шарттарды қабылдағаныңызды білдіреді.
