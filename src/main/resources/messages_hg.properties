# About the program
main.about.program=TURKUNIB-ről
main.about.program.tagline=A türk egyetemek összekapcsolása egy erősebb jövőért
main.about.program.p1=A TURKUNIB (Türk Egyetemek Szövetsége) egy dinamikus kezdeményezés, amelynek célja az akadémiai kapcsolatok megerősítése és az együttműködés elősegítése a türk világ egyetemei között. A TURKUNIB Azerbajdzsán, Kazahsztán, Kirgizisztán, Törökország, Üzbegisztán, Magyarország és az Észak-ciprusi Török Köztársaság 170 egyetemét egyesítve közös felsőoktatási teret épít, amely a közös történelemben, kultúrában és nyelvben gyökerezik.
main.about.program.p2=Egy egységes platform létrehozásával a program ösztönzi a hallgatói mobilitást, az oktatói cserét és a közös kutatási projekteket, amelyek közös regionális és globális kihívásokra adnak választ. Hálózatán keresztül – ideértve az Orhun hallgatói és oktatói csereprogramot is – a TURKUNIB bővíti az oktatási lehetőségeket, miközben elősegíti a kulturális megértést, a tudástranszfert és az innovációt.
main.about.program.p3=A TURKUNIB elkötelezett a tudósok, vezetők és szakemberek következő generációjának felkészítése iránt, akik hozzájárulnak országaik fenntartható fejlődéséhez, miközben erősítik a türk nemzetek közötti egység érzését.
main.about.program.p4=Lényegét tekintve a TURKUNIB több mint akadémiai partnerség – híd, amely összeköti az embereket, az eszméket és az intézményeket, megalapozva egy erősebb és szorosabban összekapcsolt jövőt.
main.about.program.overview=Program áttekintése

