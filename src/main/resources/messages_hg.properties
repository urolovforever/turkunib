page.directive.art6.title=Szervezeti felépítés
page.directive.art6.p1=(1) A Szövetség a Türk Államok Szervezete tag- és megfigyelő államainak, valamint a rokon közösségeknek az egyetemeiből áll.
page.directive.art6.chairmanship=A Szövetség elnöksége
page.directive.art6.p2=(2) A Szövetség elnöke a Türk Államok Szervezetének főtitkára.
page.directive.art6.p3=(3) A soros elnökséget a Közgyűlés ülésén a tagegyetemek közül egyszerű többséggel, két évre választják meg, önkéntes jelentkezés alapján vagy más résztvevők javaslatára.
page.directive.art6.p4=(4) A Szövetség elnöke feladatait a soros elnökséget betöltő egyetem akadémiai ügyekért felelős rektorával összehangoltan látja el.
page.directive.art6.p5=(5) A soros elnökséget betöltő egyetem feladatai:
page.directive.art6.duty1=a Szövetség Közgyűlése ülésének megrendezése és a Közgyűlésen hozott határozatok végrehajtása;
page.directive.art6.duty2=az elnökség ideje alatt a szükséges együttműködés és kommunikáció biztosítása a Szövetség tagjai között, a Titkársággal összehangoltan.
page.directive.art6.p6=(6) A soros elnökséget betöltő egyetem rektora feladataival összefüggésben meghívható a Türk Államok Szervezete oktatási minisztereinek találkozójára és/vagy a Türk Államok Szervezetének csúcstalálkozójára.
page.directive.art6.assembly=Közgyűlés
page.directive.art6.p7=(7) A Türk Egyetemek Szövetségének Közgyűlése a tagországok egyetemi képviselőiből áll. A tagegyetemek képviselői: a rektor, az illetékes rektorhelyettes, valamint a nemzetköziesítési egység egy képviselője.
page.directive.art6.board=Igazgatótanács
page.directive.art6.secretariat=Titkárság
page.directive.art6.subcommittees=Albizottságok
page.directive.art6.subcommittees.intro=A Közgyűlés által meghatározott kiemelt tevékenységek megvalósítása érdekében hét végrehajtó bizottság jött létre:
page.directive.art6.committee1=Türk Világ Felsőoktatási Adatbank
page.directive.art6.committee2=Oktatási-Képzési Bizottság
page.directive.art6.committee3=Tudományos Bizottság
page.directive.art6.committee4=Türk Világ Oktatási Portál
page.directive.art6.committee5=Felsőoktatási Minőségbiztosítási Testület
page.directive.art6.committee6=Sport- és Kulturális Bizottság
page.directive.art6.committee7=Hallgatói Tanács
page.directive.art6.contactgroup=Kapcsolattartó Csoport
page.directive.art6.p8=(8) A Türk Államok Szervezete főtitkárhelyettest nevez ki, míg a tagegyetemek egy rektorhelyettest, valamint a Szövetség tevékenységeiért felelős képviselőt jelölnek ki a Kapcsolattartó Csoportban való részvételre.
page.directive.art6.p9=(9) A Kapcsolattartó Csoport feladata a Szövetség határozatai végrehajtásának összehangolása.
page.directive.art6.p10=(10) A Kapcsolattartó Csoport évente legalább kétszer ülésezik.
page.directive.art6.studentcouncil=Hallgatói Tanács
page.directive.art6.p11=(11) A Szövetség Hallgatói Tanácsa a Szövetség tagegyetemeiről megválasztott hallgatókból áll.
page.directive.art6.p12=(12) A Hallgatói Tanács létrehozásáról, feladatairól és felelősségi köreiről, valamint az egyéb kérdésekről a Szövetség irányelvet készít.
page.directive.art7.title=A Szövetség célkitűzései
page.directive.art7.intro=A közös történelemre, kultúrára és nyelvre alapozva, a türk nyelvű népek közötti barátság és együttműködés fejlesztése, valamint az oktatás színvonalának emelése céljából, a tagállamok felsőoktatási intézményei közötti együttműködés biztosítása érdekében a következő célkitűzések valósítandók meg:
page.directive.art7.obj1=Közös civilizációs tantárgyak oktatása valamennyi tagegyetemen a korszerű tudományos színvonalnak megfelelő oktatási standardok alkalmazása révén, és ezáltal közös identitástudattal és kulturális tudatossággal rendelkező nemzedékek nevelése;
page.directive.art7.obj2=A felsőoktatási programok összehangolása a nemzetközi akkreditációs standardokkal összhangban;
page.directive.art7.obj3=Az oktatói állomány számára szóló képzési programok kidolgozása és megvalósítása;
page.directive.art7.obj4=A hallgatók és az oktatók cseréjének ösztönzése és az ehhez szükséges kiigazítások elvégzése;
page.directive.art7.obj5=Közös kreditátviteli rendszer kialakítása;
page.directive.art7.obj6=A felsőoktatási programok tagegyetemek közötti elismerésének biztosítása, valamint megfelelő alap megteremtése a tagegyetemek képesítései egyenértékűségének kölcsönös elismeréséhez;
page.directive.art7.obj7=Az egyetemek bizonyos területeken meglévő komparatív előnyeinek kiaknázása;
page.directive.art7.obj8=Megvalósítható közös oktatási és kutatási projektek és programok végrehajtása, valamint publikációk megjelentetése ezen a területen;
page.directive.art7.obj9=Együttműködés a társadalmi és kulturális területeken;
page.directive.art7.obj10=Külön ösztöndíjak biztosítása a türk világgal kapcsolatos tanulmányokat folytató hallgatók számára;
page.directive.art7.obj11=A türk világgal kapcsolatos akadémiai kutatásokra és projektekre vonatkozó információk elektronikus megosztásának biztosítása, valamint az egyetemek által végzett vonatkozó kutatások elérhetőségeinek továbbítása a Titkárság honlapjára, hogy azok hivatkozásként megjelenjenek a Türk Államok Szervezetének honlapján;
page.directive.art7.obj12=Független „Felsőoktatási Minőségbiztosítási Testület” létrehozása, amely a Szövetség tagegyetemeinek külső értékelési és akkreditációs folyamatai minőségbiztosítását szolgálja, valamint tevékenységének támogatása;
page.directive.art7.obj13=A Felsőoktatási Adatbank létrehozása a Türk Államok Szervezetének tagjai számára;
page.directive.art7.obj14=A Türk Világ Index és a szakterületi indexek létrehozása;
page.directive.art7.obj15=A Türk Világ Oktatási Portál létrehozása;
page.directive.art7.obj16=A Türk Felsőoktatási Térség létrehozása.
page.directive.art8.title=Működési elvek
page.directive.art8.p1=(1) A Szövetség határozatait a Közgyűlés ülésén egyszerű többséggel hozzák meg, amelyen a Szövetség tagegyetemeinek rektorai vagy a rektorok képviselői, valamint a Türk Államok Szervezetének főtitkára vagy annak képviselői vesznek részt.
page.directive.art8.p2=(2) A Szövetség titkársági feladatait a Türk Államok Szervezetének Titkársága látja el, a soros elnökséget betöltő egyetemmel együttműködésben.
page.directive.art8.p3=(3) A Szövetség intézményi felépítését, működési eljárásait és elveit, valamint a pénzügyi kérdésekben követett gyakorlatát a Szövetség tagegyetemei által egyszerű többséggel hozott határozat alapján kidolgozandó irányelvek szerint kell meghatározni.
page.directive.art8.p4=(4) A végrehajtás céljából hozott határozatok és a Szövetség által kidolgozott irányelvek azt követően lépnek hatályba, hogy azokat a Türk Tanács oktatási minisztereinek találkozóján jóváhagyták, amelyen Törökország Felsőoktatási Tanácsának elnöke is részt vesz.
page.directive.art8.p5=(5) A Szövetség tevékenységét a Türk Államok Szervezete oktatási minisztereinek magas rangú tisztviselői kísérik figyelemmel, köztük a Felsőoktatási Tanács elnökségének egy képviselőjével. A fent említett csoport célja:
page.directive.art8.wp1=a folyamat során megvalósítani tervezett projektek nyomon követése;
page.directive.art8.wp2=a szükséges koordináció biztosítása a tagállamok között;
page.directive.art8.wp3=a folyamat során esetlegesen felmerülő problémák megoldása;
page.directive.art8.wp4=tevékenységek végzése a folyamat részes felei közötti elfogadottság és alkalmazhatóság szintjének növelése érdekében;
page.directive.art8.wp5=a nemzeti szinten tapasztalt problémák megoldásához szükséges nemzeti jogszabályi változtatások vizsgálata, valamint támogatás nyújtása az illetékes hatóságoknak tett ajánlások révén.
page.directive.art9.title=A Szövetség pénzügyi forrásai
page.directive.art9.intro=(1) A Szövetség által végzendő felsőoktatási tevékenységek valamennyi költségét az alábbi forrásokból finanszírozzák:
page.directive.art9.fin1=A tagegyetemek pénzügyi forrásai;
page.directive.art9.fin2=A létrehozandó „Türk Tudományos Kutatási Alap” által biztosított források, valamint nemzeti vagy nemzetközi intézményektől származó források;
page.directive.art9.fin3=A tagállamok egyetemeitől projektalapon biztosítandó további források;
page.directive.art9.fin4=A Türk Államok Szervezete tagjainak költségvetéséből elkülönített források.
page.directive.art10.title=Tagság a Szövetségben
page.directive.art10.p1=(1) A tagjelölti kérelmeket írásbeli indokolással a Türk Tanács Titkárságához kell benyújtani. A tagfelvételről és a tagság megszüntetéséről a Közgyűlésnek a Szövetség tagjai legalább kétharmadának részvételével megtartott ülésén, egyszerű többséggel döntenek, miután a Kapcsolattartó Csoporton keresztül beszerezték a tagegyetemek véleményét.
page.directive.art10.membershiplink=Tudjon meg többet a tagfelvételi eljárásról
page.directive.art11.title=Türk Világ Felsőoktatási Térség
page.directive.art11.p1=(1) A TCHEA a tagállamok között létrehozott térség, amelyben a felsőoktatáshoz kapcsolódó oktatási tevékenységek folynak.
page.directive.art11.p2=(2) A TCHEA célja a 7. cikkben megjelölt célok elérése a tagállamok által létrehozandó közös platformok révén.
page.directive.art12.title=A végrehajtás folyamatai
page.directive.art12.p1=(1) A Türk Világ Felsőoktatási Térség keretében a Szövetség tagállamainak a következő elemeket kell összehangolniuk az együttműködési területeken:
page.directive.art12.item1=A hallgatói és oktatói csereprogramok;
page.directive.art12.item2=Az országaikban hatályos jogszabályok a formális, táv- vagy nyitott oktatás keretében megvalósuló, felsőoktatási szakképzési, alapképzési és posztgraduális szintű közös oklevélprogramok indítása tekintetében.
page.directive.art12.p2=(2) A megvalósítandó együttműködés keretében a következő elemeket támogatják a Türk Államok Szervezete oktatási minisztereinek magas rangú tisztviselői, akik között Törökország Felsőoktatási Tanácsa elnökségének egy képviselője is helyet kap:
page.directive.art12.sup1=A Szövetség tagegyetemei és más hivatalos tudományos intézmények által kiállított oklevelek egyenértékűségének biztosítása;
page.directive.art12.sup2=A Türk Világ Felsőoktatási Térség létrehozását és terjesztését szolgáló eszközök felhasználását és népszerűsítését a török Felsőoktatási Tanács elnöksége képviselőjének, valamint a türk oktatási miniszterek magas rangú tisztviselőinek támogatása révén ösztönzik.
page.directive.art13.title=Hallgatói és oktatói mobilitás
page.directive.art13.p1=(1) A tagegyetemeken jelenleg működő és/vagy a jövőben megnyitandó nyári és téli egyetemekre más tagegyetemek hallgatóit is felveszik. Az e programokban a hallgatók számára biztosítandó kedvezményeket kölcsönösségi alapon határozzák meg.
page.directive.art13.p2=(2) A hallgatók és az oktatók cseréje során az Orhun program alkalmazandó mintaként.
page.directive.art13.p3=(3) A hallgatók korábbi tanulmányainak elismerése, a hallgatói felvétel, a képzési megállapodás és a tanulmányi átirat elkészítése a tagegyetemek által meghatározandó közös kreditrendszer szerint történik.
page.directive.art13.orhunlink=Tudjon meg többet az Orhun csereprogramról
page.directive.art14.title=Rendelkezéssel nem szabályozott kérdések
page.directive.art14.p1=Az ezen irányelv végrehajtása során esetlegesen felmerülő problémák rendezésére szolgáló módosításokat a Közgyűlés kiegészítő dokumentum formájában fogadhatja el.
page.directive.art15.title=Az irányelv nyelvei
page.directive.art15.p1=Ez az irányelv azeri, kazah, kirgiz, török és angol nyelven készült.
page.directive.art16.title=Hatálybalépés
page.directive.art16.p1=Ezen irányelv rendelkezései azon a napon lépnek hatályba, amikor azokat a Szövetség Közgyűlésén történt jóváhagyásukat követően a Türk Államok Szervezete oktatási minisztereinek találkozóján megerősítik.
page.directive.art17.title=Végrehajtás
page.directive.art17.p1=Ezen irányelv rendelkezéseit a Titkárság hajtja végre, a soros elnökséget betöltő egyetemmel együttműködésben.
page.directive.art17.p2=Ezt a folyamatot Orhun program néven határozták meg.

# Orhun Application Guide page
page.orhunguide.title=Orhun csereprogram — Jelentkezési útmutató
page.orhunguide.intro=Gyakorlati útmutató hallgatók és oktatók számára: a jelentkezési feltételek, a jelentkezés folyamata, a szükséges dokumentumok, valamint a mobilitásra való kiválasztást követően elvégzendő lépések.
page.orhunguide.download=Az útmutató letöltése (PDF)
page.orhunguide.orhunlink=Aktuális közlemény, kvóták és dokumentumsablonok
page.orhunguide.toc=Tartalomjegyzék
page.orhunguide.doc.col1=Dokumentum
page.orhunguide.doc.col2=Leírás
page.orhunguide.s1.title=1. Az Orhun csereprogramról
page.orhunguide.s1.p1=Az Orhun csereprogram a Türk Államok Szervezete (TÁSZ) keretében működő Türk Egyetemek Szövetsége (TURKUNIB) kiemelt programja, amely a tagországok felsőoktatási intézményei közötti hallgatói és oktatói mobilitást segíti elő. A program célja az akadémiai együttműködés fejlesztése, az intézményközi kapcsolatok megerősítése és a népek közötti kulturális interakció fokozása.
page.orhunguide.s1.p2=A program a 2017–2018-as tanévben kísérleti jelleggel indult; a COVID-19 utáni időszakban újraindították és hatókörét kibővítették, mára pedig 170 tagegyetemet összefogó kiterjedt hálózattá nőtte ki magát.
page.orhunguide.s1.obj.title=Stratégiai célok
page.orhunguide.s1.obj1=A tagországok egyetemei közötti akadémiai integráció és mobilitás növelése,
page.orhunguide.s1.obj2=Hozzájárulás a „türk világ felsőoktatási térségének” megteremtéséhez,
page.orhunguide.s1.obj3=A felsőoktatási rendszerek összehangolása az olyan nemzetközi standardokkal, mint a bolognai folyamat és az ECTS,
page.orhunguide.s1.obj4=Hozzájárulás a regionális fejlődéshez, a kutatási együttműködéshez és az innovációhoz.
page.orhunguide.s1.countries.title=A programban részt vevő tagországok
page.orhunguide.s1.countries.p1=A program keretében az oktatók és a hallgatók a Türk Államok Szervezete keretében működő Türk Egyetemek Szövetségének tagegyetemein valósíthatnak meg mobilitást. A tagországok: Törökország, Azerbajdzsán, Kirgizisztán, Kazahsztán, Üzbegisztán, az Észak-ciprusi Török Köztársaság és Magyarország.
page.orhunguide.s2.title=2. Általános alapelvek
page.orhunguide.s2s1.title=2.1 A jegyzőkönyvi alapok
page.orhunguide.s2s1.p1=Az Orhun csereprogram kizárólag a tagintézmények között aláírt „Orhun csereprogram jegyzőkönyv” keretében valósítható meg. Az egyetem nem fogadhat és nem küldhet hallgatót vagy oktatót olyan intézménytől, illetve intézménybe, amellyel nincs érvényes jegyzőkönyve. A jegyzőkönyv egy példányát a Türk Államok Szervezetének Titkárságán őrzik.
page.orhunguide.s2s2.title=2.2 Nyelvek
page.orhunguide.s2s2.p1=A programra vonatkozó szabályozás, tájékoztatás, akták és dokumentumok a tagállamok hivatalos nyelvein, valamint török és angol nyelven készülnek. A szövegek közötti eltérés esetén az angol nyelvű szöveg az irányadó.
page.orhunguide.s2s3.title=2.3 Pénzügyi források
page.orhunguide.s2s3.fin1=Nemzeti vagy nemzetközi intézmények és szervezetek által biztosított források,
page.orhunguide.s2s3.fin2=A tagegyetemek saját költségvetési forrásai,
page.orhunguide.s2s3.fin3=A TURKUNIB soros elnökségét betöltő egyetem és a Türk Államok Szervezete által biztosított források.
page.orhunguide.s2s3.p1=A tagegyetemek kötelesek az egyes tanévekre vonatkozó pénzügyi szükségleteiket a mobilitást megelőzően saját költségvetésükben feltüntetni; a források elosztásához szükséges koordinációt a Türk Államok Szervezetének Titkársága biztosítja.
page.orhunguide.s3.title=3. Hogyan jelentkezhetnek a hallgatók?
page.orhunguide.s3.p1=Az Orhun csereprogram keretében a formális képzésben részt vevő hallgatók egy vagy két félévig (összesen legfeljebb egy tanévig) folytathatják tanulmányaikat egy olyan tagintézményben, amellyel saját felsőoktatási intézményük jegyzőkönyvet írt alá.
page.orhunguide.s3s1.title=3.1 Jelentkezési feltételek
page.orhunguide.s3s1.req1=Hallgatói jogviszony formális felsőoktatási képzésben,
page.orhunguide.s3s1.req2=Legalább 4-ből 2,5 (vagy azzal egyenértékű) halmozott tanulmányi átlag (GPA),
page.orhunguide.s3s1.req3=Az előkészítő éves, az első éves és a végzős hallgatók nem vehetnek részt a programban,
page.orhunguide.s3s1.req4=A külföldön nemzetközi hallgatói státusszal tanulók nem jelentkezhetnek saját országuk egyetemére.
page.orhunguide.s3s2.title=3.2 A jelentkezési folyamat és a közlemény
page.orhunguide.s3s2.item1=A felsőoktatási intézmény saját honlapján teszi közzé az általa aláírt Orhun csereprogram-jegyzőkönyveket és a kapcsolódó kvótákat.
page.orhunguide.s3s2.item2=A közlemény tartalmazza a program bemutatását, a jelentkezési feltételeket és a folyamat lépéseit.
page.orhunguide.s3s2.item3=A hallgató a közzétett kvótának és ütemtervnek megfelelően nyújtja be jelentkezését az érintett intézményhez.
page.orhunguide.s3s2.item4=A jelentkezéseket a rendszerbe feltöltött dokumentumokkal együtt továbbítják a koordinátor egyetemhez, amely eljuttatja azokat a fogadó intézményhez.
page.orhunguide.s3s2.item5=A cserehallgatók számát és elosztását a TURKUNIB soros elnökségét betöltő egyetem határozza meg a kétoldalú jegyzőkönyvek keretében.
page.orhunguide.s3s2.item6=Az elbírálás a jelentkezők tanulmányi átlaga alapján történik; az eredményeket az aláíró intézmények honlapjain teszik közzé.
page.orhunguide.s3.note1=A 100 pontos értékelési rendszerről a 4 pontos rendszerre történő átszámítás a fogadó egyetem egyenértékűségi döntése alapján történik. Emellett a TURKUNIB soros elnökségét betöltő egyetem további feltételeket határozhat meg a hatékony és eredményes mobilitás érdekében.
page.orhunguide.s3s3.title=3.3 Szükséges dokumentumok
page.orhunguide.s3.doc1=Jelentkezési űrlap
page.orhunguide.s3.doc1.desc=Hallgatói jelentkezési dokumentum
page.orhunguide.s3.doc2=Leckekönyv (transcript)
page.orhunguide.s3.doc2.desc=Naprakész tanulmányi átirat
page.orhunguide.s3.doc3=Hallgatói kötelezettségvállalási megállapodás
page.orhunguide.s3.doc3.desc=Az Orhun csereprogram hallgatói kötelezettségvállalási megállapodása — a hallgató és az intézmény között kerül aláírásra
page.orhunguide.s3.doc4=Egyéb dokumentumok
page.orhunguide.s3.doc4.desc=Az aláíró egyetemek által meghatározott további dokumentumok (ha vannak)
page.orhunguide.s3s3.p1=A csereidőszak végén a hallgató a tanulmányi átiratot, a tanulmányi időszakot igazoló részvételi igazolást és a hallgatói zárójelentést a hazaérkezés napjától számított 30 napon belül személyesen, postai úton vagy e-mailben nyújtja be saját intézménye Orhun csereprogram-koordinációs irodájának. A hiányzó dokumentumok pótlására legfeljebb 15 nap póthatáridő adható; ha a dokumentumok a megadott határidőn belül nem kerülnek benyújtásra, az eljárás érvénytelennek minősül, és a teljesített kifizetések visszafizetését kérik.
page.orhunguide.s3s4.title=3.4 Tanulmányi megállapodás (Learning Agreement)
page.orhunguide.s3s4.p1=A mobilitás megkezdése előtt a hallgató által a fogadó intézményben felveendő kurzusokat és krediteket, valamint az ezeknek megfelelő, saját intézményében elismerendő kurzusokat tanulmányi megállapodás (Learning Agreement) rögzíti. A megállapodás három példányban készül; egy példány a hallgatónál, a többi a két intézménynél marad. A megállapodást az érintett tanszékvezetők és az intézmények felső vezetői (vagy meghatalmazott képviselőik) írják alá. A kötelező módosításokat legkésőbb a fogadó intézmény tanulmányi félévének kezdetétől számított 30 napon belül (és a kötelező vizsgaidőpontok előtt) kell elvégezni.
page.orhunguide.s3s5.title=3.5 Kurzusegyenértékűség, újrafelvétel és vizsgák
page.orhunguide.s3s5.item1=A kurzusterhelést kreditalapon határozzák meg; nem a kurzusok száma, hanem a kreditek számítanak. Az intézmények referenciaként az ECTS-rendszert alkalmazhatják.
page.orhunguide.s3s5.item2=A sikertelen kurzusokat a hallgató saját intézményében veszi fel újra, a tanulmányi megállapodásban (Learning Agreement) megjelölt egyenértékű kurzus alapján; újrafelvett kurzus a fogadó intézményben nem vehető fel.
page.orhunguide.s3s5.item3=Az Orhun csereprogram hallgatóira a feltételes továbbhaladás nem alkalmazható; pótvizsga csak abban az intézményben tehető, ahol a hallgató éppen cserehallgatói jogviszonyban áll.
page.orhunguide.s3s5.item4=A szakdolgozatok, a szakmai gyakorlatok és a laboratóriumi munkák a hallgató saját intézményének szabályai szerint zajlanak.
page.orhunguide.s3s5.item5=A csere végén az intézmények kötelesek elismerni a sikeresen teljesített kurzusok kreditjeit és érdemjegyeit; ezek a kurzusok az oklevélmellékletben kerülnek feltüntetésre.
page.orhunguide.s3s6.title=3.6 Pénzügyi kötelezettségek
page.orhunguide.s3s6.item1=A hallgató a csereidőszak alatt is saját intézményének fizeti a kötelező hozzájárulást/tandíjat; a hallgatói jogviszony nem szüneteltethető.
page.orhunguide.s3s6.item2=A fogadó intézménynek nem kell további tandíjat fizetni.
page.orhunguide.s3s6.item3=Az egyéb ösztöndíjak és hitelek folyósítása a tanulmányi időszak alatt is folytatódik.
page.orhunguide.s3s7.title=3.7 Fegyelem
page.orhunguide.s3s7.p1=A cserehallgatókra a mobilitási időszak alatt annak az intézménynek a fegyelmi szabályai vonatkoznak, ahol tartózkodnak. Fegyelmi eljárás megindítása esetén annak eredményéről a hallgató küldő intézményét tájékoztatják; ha a büntetés a mobilitási időszak alatt nem hajtható végre, azt a hallgató saját intézménye érvényesíti.
page.orhunguide.s4.title=4. Hogyan jelentkezhetnek az oktatók?
page.orhunguide.s4.p1=Az oktatói mobilitásban részt vehet minden olyan oktató, aki az Orhun csereprogram jegyzőkönyvét aláíró intézményben dolgozik. A mobilitás azokat az oktatási tevékenységeket foglalja magában, amelyeket az egyik intézmény oktatója egy másik tagintézményben végez.
page.orhunguide.s4s1.title=4.1 Hatókör és időtartam
page.orhunguide.s4s1.item1=A mobilitási időszak legalább két hét, legfeljebb három hónap lehet; ugyanabban a tanévben csak egyszer vehető igénybe.
page.orhunguide.s4s1.item2=A heti akadémiai tevékenységnek összesen legalább hat órát kell kitennie (az alapot az oktatási órák képezik; ha ezek nem elegendők, a tevékenység szemináriumokkal, panelbeszélgetésekkel vagy konferenciákkal egészíthető ki).
page.orhunguide.s4s1.item3=Az oktatást nem tartalmazó mobilitási tervek az Orhun csereprogram keretében nem fogadhatók el.
page.orhunguide.s4s2.title=4.2 A jelentkezési közlemény és a kiválasztási folyamat
page.orhunguide.s4s2.item1=Az aláírt jegyzőkönyveket és a kvótákat az intézmény és a TURKUNIB honlapján teszik közzé; a közlemények legalább 15 napig elérhetők maradnak.
page.orhunguide.s4s2.item2=A közleményi időszakban benyújtott valamennyi jelentkezést nyilvántartásba veszik; egy példányt az intézmény Orhun csereprogram-koordinációs irodája őriz.
page.orhunguide.s4s2.item3=Az oktató felveszi a kapcsolatot a felkeresni kívánt intézmény érintett tanszékével a megfelelő kurzusok meghatározása érdekében, és elkészíti az „oktatói mobilitási tervet”.
page.orhunguide.s4s2.item4=A tervet mind a küldő, mind a fogadó intézmény illetékes akadémiai testületei hagyják jóvá, és azt legalább 15 nappal a mobilitás megkezdése előtt be kell nyújtani a koordinációs irodához.
page.orhunguide.s4s2.item5=Az elbírálás során elsőbbséget élveznek azok az oktatók, akik korábban nem vettek részt a csereprogramban, valamint az Orhun tanszéki koordinátorok.
page.orhunguide.s4s2.item6=Az eredményeket az aláíró intézmény honlapján teszik közzé.
page.orhunguide.s4.note2=Az az oktató, akit kiválasztottak, de érvényes indok nélkül nem vesz részt a mobilitásban, három évig nem részesülhet a program előnyeiből.
page.orhunguide.s4s3.title=4.3 Szükséges dokumentumok
page.orhunguide.s4.doc1=Oktatói adatlap
page.orhunguide.s4.doc1.desc=Az intézmény honlapjának „Dokumentumok” menüjéből érhető el
page.orhunguide.s4.doc2=Oktatói mobilitási program
page.orhunguide.s4.doc2.desc=A megvalósítandó tevékenységeket részletező terv; az intézmény honlapjáról érhető el
page.orhunguide.s4.doc3=Szakmai önéletrajz (CV)
page.orhunguide.s4.doc3.desc=Naprakész önéletrajz
page.orhunguide.s4.doc4=Részvételi igazolás
page.orhunguide.s4.doc4.desc=A mobilitás végén a fogadó intézmény állítja ki, aláírással/pecséttel ellátva
page.orhunguide.s4.doc5=Tevékenységi záróbeszámoló
page.orhunguide.s4.doc5.desc=Az oktató készíti el; a tevékenység befejezése után legkésőbb 15 nappal kell benyújtani a koordinációs irodához
page.orhunguide.s4s4.title=4.4 Pénzügyi jogok és kötelezettségek
page.orhunguide.s4s4.item1=Az oktató munkavállalói jogai saját egyetemén változatlanul fennmaradnak.
page.orhunguide.s4s4.item2=Az első két hét napidíját és utazási költségeit a küldő intézmény fedezi.
page.orhunguide.s4s4.item3=A szállást és az ellátást (lakhatás és étkezés) a fogadó egyetem biztosítja.
page.orhunguide.s5.title=5. Kiválasztottak a mobilitásra — mit tegyek most?
page.orhunguide.s5.p1=A mobilitásra kiválasztott hallgatóknak és oktatóknak ajánlott a mobilitás megkezdése előtt sorrendben elvégezniük a következő hat lépést:
page.orhunguide.s5.step1=Kion-fiók létrehozása
page.orhunguide.s5.step1.text=A Kion-fiókot az érintett csereprogram honlapján megadott hivatkozáson keresztül kell létrehozni. A mobilitáshoz szükséges dokumentumokat ebbe a rendszerbe kell feltölteni.
page.orhunguide.s5.step2=A befogadó nyilatkozat beszerzése
page.orhunguide.s5.step2.text=A befogadó nyilatkozat beszerzése érdekében e-mailben kell felvenni a kapcsolatot az elhelyezés szerinti egyetemmel.
page.orhunguide.s5.step3=A kurzustartalmak elérése
page.orhunguide.s5.step3.text=A kurzustartalmakat a fogadó egyetem honlapjáról kell beszerezni. Ha ezek az információk a honlapon nem érhetők el, e-mailben kell kérni őket a partnerintézménytől.
page.orhunguide.s5.step4=A tanulmányi megállapodás (Learning Agreement) elkészítése
page.orhunguide.s5.step4.text=A naprakész tanulmányi átirat és a partnerintézménytől kapott kurzuslista alapján a tanulmányi megállapodást (Learning Agreement) az intézmény Orhun tanszéki koordinátorával együtt kell elkészíteni.
page.orhunguide.s5.step5=A tanulmányi/oktatási megállapodás aláírási folyamata
page.orhunguide.s5.step5.text=Az elkészített tanulmányi/oktatási megállapodást (Learning/Teaching Agreement) a tanszékvezető és a tanszéki koordinátor írja alá; ezt követően e-mailben megküldik a Csereprogramok Koordinációs Irodájának végső aláírásra és lepecsételésre.
page.orhunguide.s5.step6=A szükséges dokumentumok benyújtása
page.orhunguide.s5.step6.text=A mobilitáshoz szükséges dokumentumokat, például a hallgatói kötelezettségvállalási nyilatkozatot és a repülőjegy-igénylő űrlapot, a Kion rendszerbe kell feltölteni.
page.orhunguide.s5.note3=Ez a hat lépés a mobilitásra való kiválasztás utáni általános folyamatot foglalja össze; az egyes tagintézmények saját intézményi rendszerétől (pl. Kion) függően kisebb eltérések előfordulhatnak. A naprakész információkért ajánlott az érintett intézmény Csereprogramok Koordinációs Irodájához fordulni.
