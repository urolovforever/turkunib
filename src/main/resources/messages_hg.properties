page.terms.intro=Üdvözöljük a turkunib.org oldalon (a „Webhely”). Ezek az Általános szerződési feltételek (a „Feltételek”, „Megállapodás”) szabályozzák a Webhelyhez való hozzáférését és annak használatát. A Webhelyhez való hozzáféréssel vagy annak használatával Ön elfogadja, hogy ezek a Feltételek kötik. Ha nem ért egyet ezekkel a Feltételekkel, kérjük, ne használja a Webhelyet.
page.terms.s1.title=1. Fogalommeghatározások
page.terms.s1.text=A „Mi”, „minket” és „miénk” a Webhely üzemeltetőjére utal. Az „Ön” vagy „Felhasználó” bármely látogatóra, felhasználóra vagy más személyre utal, aki a Webhelyhez hozzáfér.
page.terms.s2.title=2. A feltételek elfogadása
page.terms.s2.text=A Webhely Ön általi használata ezekre a Feltételekre, valamint minden vonatkozó jogszabályra és előírásra vonatkozik. Ha a Webhelyet egy szervezet nevében használja, Ön kijelenti, hogy jogosult elfogadni ezeket a Feltételeket annak nevében.
page.terms.s3.title=3. Megengedett használat
