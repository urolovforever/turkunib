# --- membership page ---
page.membership.title=Tagság a Türk Egyetemek Szövetségében (TURKUNIB)
page.membership.intro=Hogyan válhat egy egyetem a TURKUNIB tagjává: a tagsági kritériumok, a jelentkezési eljárás és útmutató a jelentkezési dokumentáció összeállításához.
page.membership.criteria.title=Tagsági kritériumok
page.membership.criteria.intro=A TURKUNIB-tagságra pályázó egyetemtől az alábbi feltételek teljesítése várható el:
page.membership.criteria.item1=A TURKUNIB céljaival és célkitűzéseivel összhangban álló tevékenységeket szervezett,
page.membership.criteria.item2=A türk világgal kapcsolatos tudományos kutatást vagy tudományos munkát végzett,
page.membership.criteria.item3=Konkrét és mérhető együttműködéseket alakított ki a Türk Államok Szervezete (TÁSZ) tagállamainak egyetemeivel (közös projektek, hallgatói/oktatói csere, közös kutatás stb.),
page.membership.criteria.item4=Rendelkezik csereprogramokkal kapcsolatos tapasztalattal és az Orhun csereprogramhoz való hozzájáruláshoz szükséges intézményi kapacitással,
page.membership.criteria.item5=A nemzetközi rangsoroló ügynökségek szerint a működési helye szerinti ország egyetemeinek legjobb 20%-ába tartozik.
page.membership.procedure.title=Jelentkezési eljárás
page.membership.procedure.intro=A tagsági jelentkezések az alábbi szakaszokban zajlanak:
page.membership.procedure.item1=A tagjelölt egyetemek jelentkezésüket a működésük szerinti ország diplomáciai csatornáin keresztül közvetlenül a TÁSZ Titkárságához nyújtják be.
page.membership.procedure.item2=A beérkezést követően a TÁSZ Titkársága a jelentkezések elbírálására a tagegyetemek képviselőiből álló, 5 fős bizottságot hoz létre, amelynek tagjait a Szövetség elnökével egyeztetve nevezi ki.
page.membership.procedure.item3=A bizottság minden jelentkezést a tagsági kritériumok alapján értékel, és megállapításait közli a TÁSZ Titkárságával.
page.membership.procedure.item4=A TÁSZ Titkársága a bizottság javaslatát végleges döntéshozatalra a TURKUNIB Közgyűlése elé terjeszti.
page.membership.procedure.item5=A szövetségi tagságról a Közgyűlés egyszerű többséggel dönt olyan ülésen, amelyen a Szövetség tagjainak legalább kétharmada jelen van.
page.membership.procedure.item6=Azok az egyetemek, amelyek nem a TÁSZ valamely tagállamában működnek, de csatlakozni kívánnak a Szövetséghez, megfigyelői státuszt kaphatnak, feltéve, hogy teljesítik a fenti eljárásokat és kritériumokat.
page.membership.procedure.item7=Megszűnik annak a tagegyetemnek a szövetségi tagsága, amely érvényes indok nélkül három egymást követő közgyűlési ülésen nem vesz részt.
page.membership.guidance.title=Útmutató a jelentkezési dokumentációhoz és a rektori levélhez
page.membership.guidance.item1=A tagsági jelentkezéseket megfelelően alá kell támasztani. Ajánlott, hogy a jelentkezési dokumentáció tartalmazzon a rektor által aláírt rektori levelet (kísérőlevelet), amely egyértelműen bemutatja a jelentkezés indokait és az egyetem TURKUNIB-hez való csatlakozási szándékát.
page.membership.guidance.item2=A rektori levélhez átfogó jelentkezési dokumentációt kell mellékelni, amely igazolja, hogy az egyetem megfelel a tagsági kritériumoknak; az alátámasztó dokumentumok között szerepelhetnek a releváns tevékenységek igazolásai, partnerségi megállapodások, csereprogramokra vonatkozó nyilvántartások, intézményi kapacitásról szóló nyilatkozatok és közös projektek példái.
page.membership.guidance.item3=A jelentkezési levelet és a kísérő dokumentumokat a TÁSZ Titkárságának kell címezni. A benyújtott dokumentációt a TÁSZ Titkársága előzetesen megvizsgálja. Amennyiben megfelelőnek ítéli, a jelentkezés a TURKUNIB Közgyűlésének napirendjére kerül, és a végleges döntés szavazással születik meg. A jóváhagyott tagságokról a tagállamokat a TÁSZ Titkársága által készített jelentés tájékoztatja, és ezzel a jelentkezési eljárás lezárul.
