page.directive.art1.title=Cél
page.directive.art1.p1=(1) Ezen irányelv célja a Türk Államok Szervezete Felsőoktatási Térségének létrehozása a Türk Államok Szervezete tagállamai közötti felsőoktatási együttműködés fejlesztése révén.
page.directive.art1.p2=(2) Ezen irányelv célja továbbá a Türk Államok Szervezetének égisze alatt létrehozott Türk Egyetemek Szövetsége felépítésének, működési elveinek és tevékenységi köreinek szabályozása.
page.directive.art2.title=Hatály
page.directive.art2.p1=(1) Ezen irányelv a Türk Államok Szervezete Türk Egyetemek Szövetségének tagegyetemei között a felsőoktatás területén megvalósítandó együttműködés eljárásait és elveit foglalja magában.
page.directive.art3.title=Hivatkozás
page.directive.art3.intro=(1) Ezen irányelv a következő üléseken hozott határozatok alapján készült:
page.directive.art3.ref1=a Türk Államok Szervezetének 2012. augusztus 23-án Biskekben megtartott második csúcstalálkozója;
page.directive.art3.ref2=a Türk Államok Szervezete oktatási minisztereinek 2012. augusztus 10-én Csolpon-Atában megtartott találkozója;
page.directive.art3.ref3=a Türk Államok Szervezete Türk Egyetemek Szövetségének 2012. március 28–29-én Isztambulban megtartott előkészítő ülése;
page.directive.art3.ref4=a Türk Egyetemek Szövetségének 2014. október 16–17-én Erzurumban megtartott első Közgyűlése;
page.directive.art3.ref5=az oktatási miniszterek 2014. november 28-án Bakuban megtartott harmadik találkozója;
page.directive.art3.ref6=az oktatási miniszterek 2015. szeptember 5-én Asztanában megtartott negyedik találkozója;
page.directive.art3.ref7=az oktatási miniszterek 2019. március 15-én Biskekben megtartott ötödik találkozója;
page.directive.art3.ref8=az oktatási miniszterek 2021. november 4-én Isztambulban megtartott hatodik találkozója;
page.directive.art3.ref9=az oktatási miniszterek 2023. június 14-én Szamarkandban megtartott hetedik találkozója;
page.directive.art3.ref10=a Türk Államok Szervezete Türk Egyetemek Szövetségének 2022. november 23-án Türkisztánban megtartott hatodik Közgyűlése.
page.directive.art4.title=Fogalommeghatározások
page.directive.art4.intro=(1) Ezen irányelv alkalmazásában:
page.directive.art4.def1=Türk Államok Szervezete: a Türk Nyelvű Államok Együttműködési Tanácsa;
page.directive.art4.def2=a Türk Államok Szervezetének csúcstalálkozója: a tagállamok államfőinek éves találkozója;
page.directive.art4.def3=a Türk Államok Szervezete oktatási minisztereinek találkozója: az a találkozó, amelyen az oktatási miniszterek üléseznek. A Szövetséget érintő kérdések megvitatásakor Törökország Felsőoktatási Tanácsának elnöke is részt vesz;
page.directive.art4.def4=Titkárság: a Türk Államok Szervezetének Titkársága;
page.directive.art4.def5=a Türk Államok Szervezete oktatási minisztereinek magas rangú tisztviselői: a tagállamok oktatási minisztériumai által kinevezett nemzeti szakértőkből álló csoport;
page.directive.art4.def6=Szövetség: a Türk Államok Szervezetének égisze alatt létrehozott Türk Egyetemek Szövetsége;
page.directive.art4.def7=a Szövetség Közgyűlése: a tagegyetemek rektorainak vagy képviselőiknek, valamint a Türk Államok Szervezete főtitkárának vagy képviselőjének részvételével létrehozott bizottság;
page.directive.art4.def8=TCHEA: a Türk Államok Szervezetének Felsőoktatási Térsége.
