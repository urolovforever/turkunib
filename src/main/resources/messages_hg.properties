page.cookies.lastupdated=Utolsó frissítés:
page.cookies.intro=Ez a weboldal sütiket használ a böngészési élmény javítása, a webhelyforgalom elemzése és a személyre szabott tartalom biztosítása érdekében. Ez a szabályzat ismerteti, mik a sütik, milyen típusokat használunk, és hogyan szabályozhatja azokat.
page.cookies.what.title=Mik azok a sütik?
page.cookies.what.text=A sütik kis szövegfájlok, amelyeket egy weboldal az Ön eszközén tárol, amikor meglátogatja azt. Lehetővé teszik a webhely számára, hogy felismerje az eszközét, megjegyezze beállításait, és megértse, hogyan használja az oldalakat és funkciókat.
