page.cookies.thirdparty.title=Harmadik féltől származó sütik
page.cookies.thirdparty.text=Egyes sütiket az oldalainkon megjelenő harmadik féltől származó szolgáltatások állíthatnak be (például beágyazott média, térképek vagy analitika). Ezeknek a harmadik feleknek saját adatvédelmi és süti szabályzatuk van. Javasoljuk, hogy tekintse át dokumentációjukat az adatkezelésük részleteiért.
page.cookies.changes.title=A szabályzat módosításai
page.cookies.changes.text=Időről időre frissíthetjük ezt a süti szabályzatot, hogy tükrözze a technológia, a jogszabályok vagy szolgáltatásaink változásait. Javasoljuk, hogy rendszeresen tekintse át ezt az oldalt a legfrissebb információkért.
