page.orhun.title=Orhun csereprogram
page.orhun.intro.p1=A Türk Egyetemek Szövetsége (TURKUNIB) keretében működő Orhun csereprogram a Türk Államok Szervezetének (TÁSZ) legfontosabb felsőoktatási mobilitási mechanizmusává vált. A 2017–2018-as tanévben indult kísérleti szakasz óta a program hatóköre és hatása folyamatosan bővült, és mára mintegy 170 egyetem között teszi lehetővé az akadémiai cserét a tag- és megfigyelő államokban. Strukturált mobilitási rendszerei révén a program támogatja a hallgatói és oktatói cserét, a közös kutatási kezdeményezéseket, a tantervek közös fejlesztését, valamint az egyetemek közötti együttműködést az oktatásban és a tudományos tevékenységekben.
page.orhun.intro.p2=Közvetlen akadémiai eredményein túl az Orhun csereprogram stratégiai eszköz egy összetartó és versenyképes türk felsőoktatási térség kialakításához, elősegítve az intézményi konvergenciát, a minőség javítását és a felsőfokú képesítések kölcsönös elismerését a részt vevő egyetemek között. Azáltal, hogy közvetlen kapcsolatot teremt a hallgatók, az oktatók és a kutatók között, a program kulcsszerepet játszik az emberek közötti kapcsolatok, a kulturális megértés és az akadémiai szolidaritás erősítésében a türk világban – hozzájárulva ezzel a Türk Államok Szervezete által megfogalmazott regionális integráció átfogó jövőképéhez.
page.orhun.regulation.title=Szabályzat
page.orhun.regulation.text=E szabályzat célja, hogy meghatározza az oktatók és hallgatók cseréjének alapját a Türk Tanács Türk Egyetemek Szövetségének tagjai közé tartozó felsőoktatási intézmények között. Ez a szabályzat a Türk Tanács Türk Egyetemek Szövetségének tagjai közé tartozó felsőoktatási intézmények közötti oktató- és hallgatócsere alapjaira terjed ki.
