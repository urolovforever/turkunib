page.terms.s3.item2=Ne kíséreljen meg jogosulatlanul hozzáférni a Webhelyhez, annak szervereihez vagy bármely kapcsolódó rendszerhez.
page.terms.s3.item3=Ne juttasson be kártevőket, káros kódot, és ne folytasson olyan tevékenységeket, amelyek megzavarják vagy rontják a Webhelyet.
page.terms.s4.title=4. Fiókok és biztonság
page.terms.s4.text=Ha a Webhely lehetőséget kínál fiók létrehozására, Ön felelős hitelesítő adatainak védelméért és a fiókja alatt végzett minden tevékenységért. Fenntartjuk a jogot, hogy felfüggesszük vagy megszüntessük azokat a fiókokat, amelyek megsértik ezeket a Feltételeket vagy a vonatkozó jogszabályokat.
page.terms.s5.title=5. Szellemi tulajdon
page.terms.s5.text=A Webhely minden tartalma, beleértve a szövegeket, grafikákat, logókat, ikonokat, képeket és tervezési elemeket, a mi vagy licencadóink tulajdona, és a vonatkozó szerzői jogi és egyéb szellemi tulajdonjogi törvények védik. Előzetes írásbeli hozzájárulásunk nélkül semmilyen tartalmat nem másolhat, sokszorosíthat, módosíthat, terjeszthet vagy jeleníthet meg nyilvánosan.
page.terms.s6.title=6. Tartalom és pontosság
page.terms.s6.text=Ésszerű erőfeszítéseket teszünk annak biztosítására, hogy a Webhelyen szereplő információk pontosak és naprakészek legyenek; azonban nem garantáljuk, hogy a tartalom mentes a hibáktól vagy hiányosságoktól. Bármikor, előzetes értesítés nélkül frissíthetjük vagy javíthatjuk az információkat.
page.terms.s7.title=7. Harmadik felek linkjei
page.terms.s7.text=A Webhely tartalmazhat olyan harmadik felek webhelyeire vagy szolgáltatásaira mutató linkeket, amelyek nem a mi tulajdonunkban vannak, vagy amelyeket nem mi felügyelünk. Nem vállalunk felelősséget harmadik felek webhelyeinek tartalmáért, adatvédelmi irányelveiért vagy gyakorlatáért.
page.terms.s8.title=8. Tiltott tevékenységek
page.terms.s8.item1=A Webhely olyan módon való használata, amely letilthatja, túlterhelheti vagy károsíthatja azt.
page.terms.s8.item2=Adatbányászat, adatlehúzás (scraping) vagy hasonló adatgyűjtési módszerek a hozzájárulásunk nélkül.
page.terms.s8.item3=Bármely személy vagy szervezet megszemélyesítése, illetve hovatartozásának félrevezető megjelenítése.
page.terms.s9.title=9. Felelősségkizárás
page.terms.s9.text=A Webhely és tartalma „adott állapotában” és „elérhetőség szerint” kerül biztosításra, bármilyen kifejezett vagy hallgatólagos garancia nélkül, beleértve, de nem kizárólagosan az értékesíthetőségre, az adott célra való alkalmasságra és a jogsértésmentességre vonatkozó hallgatólagos garanciákat.
page.terms.s10.title=10. A felelősség korlátozása
page.terms.s10.text=A jogszabályok által megengedett legteljesebb mértékben nem vállalunk felelősséget semmilyen közvetett, járulékos, különleges, következményi vagy büntető jellegű kárért, illetve nyereség- vagy bevételkiesésért, akár közvetlenül, akár közvetve következett be, sem adatok, használat, jó hírnév vagy egyéb immateriális javak elvesztéséért, amely (a) a Webhely Ön általi használatából vagy használhatatlanságából; (b) szervereinkhez való bármely jogosulatlan hozzáférésből vagy azok használatából; vagy (c) a Webhelyről szerzett bármely tartalomból ered.
page.terms.s11.title=11. Kártalanítás
page.terms.s11.text=Ön vállalja, hogy megvédi, kártalanítja és mentesíti minket, valamint kapcsolt vállalkozásainkat, tisztségviselőinket, alkalmazottainkat és megbízottainkat minden olyan igénnyel, felelősséggel, kárral, veszteséggel és költséggel szemben, amely a Webhely Ön általi használatából vagy ezen Feltételek megsértéséből ered, vagy azzal bármilyen módon összefügg.
page.terms.s12.title=12. Irányadó jog és joghatóság
page.terms.s12.text=Ezekre a Feltételekre a fő üzleti helyünk joghatóságában alkalmazandó jog irányadó, és ennek megfelelően kell értelmezni, tekintet nélkül annak kollíziós jogi rendelkezéseire. Bármely vita az adott joghatóságban található bíróságok kizárólagos joghatósága alá tartozik.
