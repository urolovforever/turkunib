# --- single pages (about/contacts/cookies/orhun/council/terms) ---
page.about.intro.p1=A Türk Államok Szervezete (TÁSZ) tagállamai közötti felsőoktatási együttműködés intézményes kereteinek megteremtése a Türk Egyetemek Szövetsége (TURKUNIB) létrehozása révén a Szervezet megalapítása óta a kiemelt napirendi pontok közé tartozik. A Szövetség célja az egyetemek közötti együttműködés megerősítése a közös történelem, kultúra és nyelvi örökség alapján, a hallgatói és oktatói mobilitás növelése, valamint egy közös türk felsőoktatási térség létrehozása.
page.about.intro.p2=Mára a TURKUNIB széles körű programmá nőtte ki magát, amely 170 egyetemet fog össze Azerbajdzsánban, Kazahsztánban, Kirgizisztánban, Törökországban, Üzbegisztánban, Magyarországon és az Észak-ciprusi Török Köztársaságban – a TÁSZ tag-, illetve megfigyelő államaiban.
page.about.intro.p3=A TURKUNIB keretében valósul meg az Orhun hallgatói és oktatói csereprogram is. A TURKUNIB alapját képező Orhun csereprogram egy közös felsőoktatási mechanizmus, amely a hallgatók és az oktatók tagállamok közötti cseréjét irányozza elő. Kísérleti bevezetésére a 2017–2018-as tanévben került sor, és azóta szakaszosan bővült.
page.about.members=Tagjaink
page.about.history=Történetünk
page.about.mission.title=Küldetés
page.about.mission.text=A türk világ felsőoktatásának előmozdítása az oktatás és a kutatás kiválóságának ösztönzésével, az akadémiai mobilitás és a kreditátvitel lehetővé tételével a tagegyetemek között, valamint a kulturális és intézményi kapcsolatok erősítésével olyan közös programok révén, mint az Orhun csereprogram. A TURKUNIB elkötelezett egy egységes felsőoktatási ökoszisztéma kiépítése mellett, amely képessé teszi a hallgatókat, az oktatókat és az intézményeket a határokon átnyúló együttműködésre a közös akadémiai és társadalmi célok elérése érdekében.
page.about.vision.title=Jövőkép
page.about.vision.text=Egy élénk, integrált türk felsőoktatási térség, ahol a hallgatók és a kutatók zökkenőmentesen működnek együtt a határokon át – hatásos kutatásokat ösztönözve, elősegítve az innovációt, és nevelve a tudósok, vezetők és szakemberek következő nemzedékét, akik egy erősebb, szorosabban összekapcsolt türk világot formálnak.
page.about.goals.title=Céljaink
page.about.goals.subtitle=A gyakorlati együttműködésre összpontosítunk, amely a hallgatók, az oktatók és az intézmények javát szolgálja.
page.about.goal.mobility.title=Akadémiai mobilitás
page.about.goal.mobility.text=Hallgatói és munkatársi csereprogramok; a kreditek és diplomák kölcsönös elismerése.
