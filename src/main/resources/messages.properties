template.menu.top.directive=Founding Directive
footer.about.directive=Founding Directive
page.directive.title=Directive on the Establishment of the Turkic University Union and Higher Education Area
page.directive.intro=The founding document of the Turkic Universities Union (TURKUNIB), regulating the structure, working principles and fields of activity of the Union and establishing the Higher Education Area of the Organization of Turkic States.
page.directive.download=Download the official document (PDF)
page.directive.amendnote=(Amended by the Decision of the 9th Meeting of the Ministers of Education of the Organization of Turkic States Member States, dated 8 June 2026)
page.directive.toc=Table of Contents
page.directive.art.n=Art. {0}
page.directive.article.n=Article {0}
page.directive.part1=Part I
page.directive.part2=Part II
page.directive.part3=Part III
page.directive.part4=Part IV
page.directive.part5=Part V
page.directive.part1.title=Purpose, Scope, Reference and Definitions
page.directive.part2.title=Structure of the Union
page.directive.part3.title=Working Principles of the Union, Financial Resources, Membership
page.directive.part4.title=Turkic Council Higher Education Area, Processes for Implementation and Exchange Programs
page.directive.part5.title=Other Provisions
page.directive.art1.title=Purpose
page.directive.art1.p1=(1) The purpose of this Directive is to create the Higher Education Area of the Organization of Turkic States by improving cooperation in higher education among the Organization of Turkic States Member States.
page.directive.art1.p2=(2) This Directive also intends to regulate structure, working principles and field of activities for the Turkic University Union established under the auspices of the Organization of Turkic States.
page.directive.art2.title=Scope
page.directive.art2.p1=(1) This Directive comprises procedures and principles of cooperation in higher education area to be made between the member universities of the Organization of Turkic States Turkic University Union.
page.directive.art3.title=Reference
page.directive.art3.intro=(1) This Directive has been prepared subject to the decisions taken at:
page.directive.art3.ref1=the Second Summit of the Organization of Turkic States held in Bishkek on August 23, 2012;
page.directive.art3.ref2=the Meeting of Organization of Turkic States Ministers of Education held in Colpan-Ata on August 10, 2012;
page.directive.art3.ref3=the Preparatory Meeting of Organization of Turkic States Turkic University Union held in Istanbul on 28-29 March 2012;
page.directive.art3.ref4=the First General Assembly of the Turkic Universities Union held in Erzurum on October 16-17, 2014;
page.directive.art3.ref5=the Third Meeting of Education Ministers held in Baku on November 28, 2014;
page.directive.art3.ref6=the Fourth Meeting of Education Ministers held in Astana on September 5, 2015;
page.directive.art3.ref7=the Fifth Meeting of Education Ministers held in Bishkek on March 15, 2019;
page.directive.art3.ref8=the Sixth Meeting of Education Ministers held in Istanbul on November 4, 2021;
page.directive.art3.ref9=the Seventh Meeting of Education Ministers held in Samarkand on June 14, 2023;
page.directive.art3.ref10=the Sixth General Assembly of the Turkic Universities Union of the Organization of Turkic States held in Turkistan on November 23, 2022.
page.directive.art4.title=Definitions
page.directive.art4.intro=(1) For the purpose of this Directive:
page.directive.art4.def1=Organization of Turkic States means the Cooperation Council of Turkic Speaking States;
page.directive.art4.def2=Organization of Turkic States Summit means Annual Meeting of the Heads of State of the Member States;
page.directive.art4.def3=Organization of Turkic States Ministers of Education Meeting means the meeting where Ministers of Education convene. The President of Council of Higher Education of Turkey also takes part when the issues related to the Union are discussed;
page.directive.art4.def4=Secretariat means the Secretariat of the Organization of Turkic States;
page.directive.art4.def5=Senior Officials of the Organization of Turkic States Ministers of Education means the group composed of national experts appointed by the Ministry of Education of the Member States;
page.directive.art4.def6=Union means the Turkic University Union established under the auspices of the Organization of Turkic States;
page.directive.art4.def7=Union of the General Assembly refers to the Committee formed with the participation of Rectors of the Member Universities or their representatives, as well as the Secretary-General of the Organization of Turkic States or his representative;
page.directive.art4.def8=TCHEA means Organization of Turkic States Higher Education Area.
page.directive.art5.title=Founding Members
page.directive.art5.p1=(1) Founding members of the Union are the following 15 universities from four member states.
page.directive.art5.country=Country
page.directive.art5.university=University
page.directive.art5.memberslink=View the current member universities of the Union
page.directive.country.az=Azerbaijan
page.directive.country.kz=Kazakhstan
page.directive.country.kg=Kyrgyzstan
page.directive.country.tr=Türkiye
page.directive.art6.title=Organizational Structure
page.directive.art6.p1=(1) The Union consists of universities from member and observer states of the Organization of Turkic States and related communities.
page.directive.art6.chairmanship=Chairmanship of the Union
page.directive.art6.p2=(2) Chairman of the Union is the Secretary General of the Organization of the Turkic States.
page.directive.art6.p3=(3) The chairmanship-in-office is elected by simple majority for two years at the Meeting of the General Assembly among the member universities on a voluntary basis or with the proposal of other participants.
page.directive.art6.p4=(4) Chairman of the Union performs his duties in coordination with Rector of Chair University-in-office in charge of academic affairs.
page.directive.art6.p5=(5) Duties of Chair University-in-office are:
page.directive.art6.duty1=to host the meeting of the General Assembly of the Union and implement decisions taken at the General Assembly;
page.directive.art6.duty2=to provide necessary cooperation and communication in coordination with the Secretariat among the members of the Union during the chairmanship.
page.directive.art6.p6=(6) Rector of Chair University-in-Office, in relation to his duties, shall be able to be invited to meeting of the Organization of the Turkic States Ministers of Education and/or the Organization of the Turkic States Summit.
page.directive.art6.assembly=General Assembly
page.directive.art6.p7=(7) General Assembly of Turkic Universities Union consists of university representatives from member countries. The member university representatives are the Rector, the relevant Vice Rector and one representative from the internationalization unit.
page.directive.art6.board=The Board of Directors
page.directive.art6.secretariat=The Secretariat
page.directive.art6.subcommittees=Sub-Committees
page.directive.art6.subcommittees.intro=To fulfill the prioritized activities determined by the General Assembly, seven executive committees have been established:
page.directive.art6.committee1=Turkic World Higher Education Databank
page.directive.art6.committee2=Education-Teaching Committee
page.directive.art6.committee3=Scientific Committee
page.directive.art6.committee4=Turkic World Education Portal
page.directive.art6.committee5=Higher Education Quality Assurance Board
page.directive.art6.committee6=Sports-Culture Committee
page.directive.art6.committee7=Student Council
page.directive.art6.contactgroup=Contact Group
page.directive.art6.p8=(8) The Organization of Turkic States appoints a Deputy Secretary-General while the member universities appoint a Vice-Rector together with a representative in charge of the Union activities to take part in the Contact Group.
page.directive.art6.p9=(9) The duty of the Contact Group is to co-ordinate the implementation of the Union decisions.
page.directive.art6.p10=(10) The Contact Group meets at least twice a year.
page.directive.art6.studentcouncil=Student Council
page.directive.art6.p11=(11) Student Council of the Union is composed of students elected from the Member Universities of the Union.
page.directive.art6.p12=(12) A Directive is prepared by the Union for establishment of the Student Council, duties and responsibilities and other issues.
page.directive.art7.title=Objectives of the Union
page.directive.art7.intro=Based on the common history, culture and language, with the aim of developing friendship and cooperation among Turkic speaking peoples and raising the level of education in order to ensure cooperation between higher education institutions of the Member States, the following objectives are to be realized:
page.directive.art7.obj1=Having courses of common civilization, through the implementation of appropriate educational standards with modern scientific level in all member universities, and thus educating generations with a common identity and cultural awareness;
page.directive.art7.obj2=Synchronizing higher education programs in compliance with the international accreditation standards;
page.directive.art7.obj3=Establishing and implementing training programs for academic staff;
page.directive.art7.obj4=Encouraging exchange of students and academic staff and making the necessary adjustments thereto;
page.directive.art7.obj5=Forming a common credit transfer system;
page.directive.art7.obj6=Ensuring recognition of higher education programs among the member universities and providing an appropriate basis for the recognition of each other's certification equivalence of the member universities;
page.directive.art7.obj7=Benefiting from comparative superiorities of universities in certain areas;
page.directive.art7.obj8=Implementing applicable cooperative education and research projects and programs, and making publications in this field;
page.directive.art7.obj9=Cooperating in social and cultural fields;
page.directive.art7.obj10=Providing special scholarships for students who conduct studies on the Turkic world;
page.directive.art7.obj11=Ensuring information sharing about academic studies and projects on the Turkic world electronically, and transmitting addresses of the relevant studies carried out by universities to the Secretariat website to provide them with a link on the Organization of Turkic States website;
page.directive.art7.obj12=Establishing an independent "Higher Education Quality Assurance Board" to serve for the quality assurance of external evaluation and accreditation processes of the member universities of the Union and supporting its activities;
page.directive.art7.obj13=Establishing the Higher Education Databank for Organization of Turkic States members;
page.directive.art7.obj14=Establishing the Turkic World Index and domain indexes;
page.directive.art7.obj15=Establishing the Turkic World Education Portal;
page.directive.art7.obj16=Establishing the Turkic Higher Education Area.
page.directive.art8.title=Working Principles
page.directive.art8.p1=(1) Decisions of the Union are taken by simple majority at the meeting of the General Assembly where Rector or representatives of the Rector of the member universities of the Union and Secretary General of the Organization of Turkic States or his representatives shall participate.
page.directive.art8.p2=(2) The secretarial work of the Union is carried out by Secretariat of the Organization of Turkic States in cooperation with the Chair University-in-Office.
page.directive.art8.p3=(3) Institutional structure, working procedures and principles with practices in financial matters of the Union are determined according to the directives to be prepared upon the decision taken with simple majority by the member universities of the Union.
page.directive.art8.p4=(4) Decisions taken for implementation and directives prepared by the Union enter into force after their approval at the Turkic Council Ministers of Education Meeting where the President of the Higher Education Council of Turkey shall also participate.
page.directive.art8.p5=(5) Activities of the Union shall be monitored by Senior Officials of the Organization of Turkic States Ministers of Education including a representative of the Presidency of the Higher Education Council. The purpose of the abovementioned group is:
page.directive.art8.wp1=to follow up projects planned to be implemented in the process;
page.directive.art8.wp2=to ensure necessary coordination between the Member States;
page.directive.art8.wp3=to carry out solutions to the problems that may arise in the process;
page.directive.art8.wp4=to carry out activities in order to increase the level of acceptability and applicability between the parties of the process;
page.directive.art8.wp5=to study for necessary national legislative changes for the solution of problems experienced at the national level and provide support by making recommendations to the relevant authorities.
page.directive.art9.title=Financial Resources of the Union
page.directive.art9.intro=(1) All expenses of higher education activities to be undertaken by the Union are funded from the resources stated below:
page.directive.art9.fin1=The financial resources of the member universities;
page.directive.art9.fin2=Resources provided by the "Turkish Scientific Research Fund" to be established, as well as resources from national or international institutions;
page.directive.art9.fin3=Additional resources that shall be provided on a project basis from universities of the Member States;
page.directive.art9.fin4=Resources allocated from the budgets of Organization of the Turkic States members.
page.directive.art10.title=Membership to the Union
page.directive.art10.p1=(1) Nomination applications are made to the Secretariat of Turkic Council with written reasons. Admission to membership and termination of membership are decided by simple majority at the meeting of the General Assembly to be held with the participation of at least two thirds of members of the Union, after receiving views of the member universities through the contact group.
page.directive.art10.membershiplink=Learn more about the membership procedure
page.directive.art11.title=Turkic World Higher Education Area
page.directive.art11.p1=(1) TCHEA is the area established among the Member States and in which educational activities related to higher education is performed.
page.directive.art11.p2=(2) TCHEA aims at achieving goals indicated in Article 7 through common platforms that the Member States will establish.
page.directive.art12.title=Processes for Implementation
page.directive.art12.p1=(1) In the framework of the Turkic World Higher Education Area the Member States of the Union need to harmonize the following items on the areas of cooperation:
page.directive.art12.item1=Exchange programs for student and academic staff;
page.directive.art12.item2=Legislation in force in their countries with regard to the opening joint certificate programs of associate, bachelor and graduate degrees implemented through formal, distance or open education.
page.directive.art12.p2=(2) In the framework of the cooperation to be carried out, the following items are supported by the Senior Officials of the Organization of Turkic States Ministers of Education that shall include a representative from the Presidency of Higher Education Council of Turkey:
page.directive.art12.sup1=Ensuring certificate equivalence given by the member universities of the Union and other official scientific institutions;
page.directive.art12.sup2=The utilization and promotion of tools for establishing and disseminating the Turkic World Higher Education Area are encouraged through the support of a representative from the Turkish Higher Education Council Presidency, as well as through the Senior Officials of Turkish Education Ministers.
page.directive.art13.title=Student and Academic Staff Mobility
page.directive.art13.p1=(1) Students from other member universities are accepted to the summer and winter schools that currently operate in and/or to be opened at the member universities. Facilities to be provided to students in these programs are determined on a reciprocal basis.
page.directive.art13.p2=(2) Orhun Program is applied as example for the exchange of student and academic staff.
page.directive.art13.p3=(3) Recognition of past education of students, student admission, education agreement and preparation of the transcript are organized according to a common credit system to be determined by the member universities.
page.directive.art13.orhunlink=Learn more about the Orhun Exchange Program
page.directive.art14.title=Issues for Which There Are No Provisions
page.directive.art14.p1=Changes for the settlement of the problems that may occur for implementation of this Directive can be adopted by the General Assembly with an additional document.
page.directive.art15.title=Languages of the Directive
page.directive.art15.p1=This Directive has been prepared in Azerbaijani, Kazakh, Kyrgyz, Turkish and English languages.
page.directive.art16.title=Validity
page.directive.art16.p1=Provisions of this Directive enters into effect on the date of its endorsement at the Organization of Turkic States Ministers of Education Meeting after its approval at the General Assembly of the Union.
page.directive.art17.title=Implementation
page.directive.art17.p1=Provisions of this Directive are carried out by the Secretariat in cooperation with the Chair University-in-Office.
page.directive.art17.p2=This process has been identified as Orhun Program.

# Orhun Application Guide page
page.orhunguide.title=Orhun Exchange Program — Application Guide
page.orhunguide.intro=A practical guide for students and academic staff: eligibility requirements, the application process, required documents, and the steps to complete once you have been selected for mobility.
page.orhunguide.download=Download the guide (PDF)
page.orhunguide.orhunlink=Current announcement, quotas and document templates
page.orhunguide.toc=Table of Contents
page.orhunguide.doc.col1=Document
page.orhunguide.doc.col2=Description
page.orhunguide.s1.title=1. About the Orhun Exchange Program
page.orhunguide.s1.p1=The Orhun Exchange Program is a flagship program run by the Turkic Universities Union (TURKUNIB), operating under the Organization of Turkic States (OTS), which promotes the mobility of students and teaching staff among the higher education institutions of member countries. The program aims to develop academic cooperation, strengthen inter-institutional ties, and increase cultural interaction among peoples.
page.orhunguide.s1.p2=The program began as a pilot in the 2017–2018 academic year; it was reactivated and expanded in scope in the post-COVID-19 period, and today it has grown into a broad network bringing together 170 member universities.
page.orhunguide.s1.obj.title=Strategic Objectives
page.orhunguide.s1.obj1=Increasing academic integration and mobility among universities of member countries,
page.orhunguide.s1.obj2=Contributing to the creation of a "Turkic World Higher Education Area",
page.orhunguide.s1.obj3=Aligning higher education systems with international standards such as the Bologna Process and ECTS,
page.orhunguide.s1.obj4=Contributing to regional development, research cooperation, and innovation.
page.orhunguide.s1.countries.title=Member Countries Covered by the Program
page.orhunguide.s1.countries.p1=Under the program, academic staff and students have the opportunity to undertake mobility to universities that are members of the Universities Union of the Organization of Turkic States. The member countries are: Türkiye, Azerbaijan, Kyrgyzstan, Kazakhstan, Uzbekistan, the Turkish Republic of Northern Cyprus, and Hungary.
page.orhunguide.s2.title=2. General Principles
page.orhunguide.s2s1.title=2.1 Basis in Protocols
page.orhunguide.s2s1.p1=The Orhun Exchange Program can only be carried out within the framework of the "Orhun Exchange Program Protocol" signed between member institutions. A university may not accept or send students or teaching staff to/from an institution with which it has no protocol in place. A copy of the protocol is kept at the Secretariat of the Organization of Turkic States.
page.orhunguide.s2s2.title=2.2 Languages
page.orhunguide.s2s2.p1=Legislation, information, files and documents relating to the program are prepared in the official languages of the member states, in Turkish and English. In the event of a discrepancy between the texts, the English text shall prevail.
page.orhunguide.s2s3.title=2.3 Financial Resources
page.orhunguide.s2s3.fin1=Resources provided by national or international institutions and organisations,
page.orhunguide.s2s3.fin2=Member universities' own budgetary resources,
page.orhunguide.s2s3.fin3=Resources provided by the TURKUNIB Term President University and the Organization of Turkic States.
page.orhunguide.s2s3.p1=Member universities are required to indicate their financial needs for each academic year in their own budgets prior to mobility; the necessary coordination in the allocation of resources is provided by the Secretariat of the Organization of Turkic States.
page.orhunguide.s3.title=3. How Do Students Apply?
page.orhunguide.s3.p1=Under the Orhun Exchange Program, students enrolled in formal education may continue their studies for one or two semesters (not exceeding one academic year in total) at a member institution with which their own higher education institution has signed a protocol.
page.orhunguide.s3s1.title=3.1 Application Requirements
page.orhunguide.s3s1.req1=Being enrolled in a formal higher education program,
page.orhunguide.s3s1.req2=Having a cumulative GPA of at least 2.5 out of 4 (or equivalent),
page.orhunguide.s3s1.req3=Preparatory-year, first-year and final-year students may not benefit from the program,
page.orhunguide.s3s1.req4=Those studying abroad with international student status may not apply to a university in their own country.
page.orhunguide.s3s2.title=3.2 Application Process and Announcement
page.orhunguide.s3s2.item1=The higher education institution announces the Orhun Exchange Program protocols it has signed and the relevant quotas on its own website.
page.orhunguide.s3s2.item2=The announcement includes an introduction to the program, application requirements, and process steps.
page.orhunguide.s3s2.item3=The student submits an application to the relevant institution in accordance with the announced quota and calendar.
page.orhunguide.s3s2.item4=Applications, together with the documents uploaded to the system, are forwarded to the coordinating university to be transmitted to the receiving institution.
page.orhunguide.s3s2.item5=The TURKUNIB Term President University determines the number and distribution of exchange students within the framework of bilateral protocols.
page.orhunguide.s3s2.item6=Evaluation is based on candidates' grade point average; results are announced on the websites of the signatory institutions.
page.orhunguide.s3.note1=The conversion from a 100-point grading system to a 4-point system is based on the equivalence decision of the host university. In addition, the TURKUNIB Term President University may set additional conditions for effective and efficient mobility.
page.orhunguide.s3s3.title=3.3 Required Documents
page.orhunguide.s3.doc1=Application Form
page.orhunguide.s3.doc1.desc=Student application document
page.orhunguide.s3.doc2=Transcript
page.orhunguide.s3.doc2.desc=Up-to-date transcript of records
page.orhunguide.s3.doc3=Student Obligations Agreement
page.orhunguide.s3.doc3.desc=Orhun Exchange Program Student Obligations Agreement — signed between the student and the institution
page.orhunguide.s3.doc4=Other documents
page.orhunguide.s3.doc4.desc=Additional documents determined by the signatory universities (if any)
page.orhunguide.s3s3.p1=At the end of the exchange period, the student submits the transcript, a Certificate of Participation showing the duration of study, and the student's final report to their own institution's Orhun Exchange Program coordination office, in person, by post, or by e-mail, within 30 days of the return date. An additional period of up to 15 days may be granted for missing documents; if the documents are not completed within the given time, the process is deemed invalid and repayment of any payments made will be requested.
page.orhunguide.s3s4.title=3.4 Learning Agreement
page.orhunguide.s3s4.p1=Before mobility begins, the courses and credits the student will take at the host institution, and the courses at their own institution to which these correspond, are determined through a "Learning Agreement." The agreement is prepared in three copies; one copy is kept by the student, and the others are kept by the two institutions. The agreement is signed by the relevant department chairs and the senior administrators of the institutions (or their authorised representatives). Compulsory changes must be made within 30 days at the latest from the start of the host institution's academic term (and before compulsory examination dates).
page.orhunguide.s3s5.title=3.5 Course Equivalence, Retakes and Examinations
page.orhunguide.s3s5.item1=Course loads are determined on a credit basis; credits, not the number of courses, are taken as the basis. Institutions may use the ECTS system as a reference.
page.orhunguide.s3s5.item2=Courses in which the student fails are retaken at their own institution, based on the equivalent course specified in the learning agreement; a retake course may not be taken at the host institution.
page.orhunguide.s3s5.item3=Conditional passing does not apply to Orhun Exchange Program students; a make-up examination may only be taken at the institution where the student is currently an exchange student.
page.orhunguide.s3s5.item4=Work such as theses, internships, and laboratory studies is subject to the rules of the student's own institution.
page.orhunguide.s3s5.item5=At the end of the exchange, institutions are obliged to recognise the credits and grades of successfully completed courses; these courses are indicated in the diploma supplement.
page.orhunguide.s3s6.title=3.6 Financial Obligations
page.orhunguide.s3s6.item1=The student continues to pay the compulsory contribution/tuition fee to their own institution during the exchange period; registration may not be suspended.
page.orhunguide.s3s6.item2=No additional tuition fee is paid to the host institution.
page.orhunguide.s3s6.item3=Other scholarships and loans continue throughout the study period.
page.orhunguide.s3s7.title=3.7 Discipline
page.orhunguide.s3s7.p1=Exchange students are subject to the disciplinary rules of the institution where they are located during the mobility period. If a disciplinary investigation is opened, the student's home institution is informed of the outcome; if the penalty cannot be applied during the mobility period, it is enforced by the student's own institution.
page.orhunguide.s4.title=4. How Do Academic Staff Apply?
page.orhunguide.s4.p1=All teaching staff working at institutions that have signed the Orhun Exchange Program protocol may take part in teaching staff mobility. Mobility covers the teaching activities that a member of staff of one institution will carry out at another member institution.
page.orhunguide.s4s1.title=4.1 Scope and Duration
page.orhunguide.s4s1.item1=The mobility period may be a minimum of two weeks and a maximum of three months; it may be undertaken only once in the same academic year.
page.orhunguide.s4s1.item2=The total weekly academic activity must be at least six hours (teaching hours are the basis; if insufficient, this may be supplemented with activities such as seminars, panels or conferences).
page.orhunguide.s4s1.item3=Mobility plans that do not include teaching are not accepted under the Orhun Exchange Program.
page.orhunguide.s4s2.title=4.2 Application Announcement and Selection Process
page.orhunguide.s4s2.item1=Signed protocols and quotas are announced on the institution's and TURKUNIB's websites; announcements remain published for at least 15 days.
page.orhunguide.s4s2.item2=All applications made during the announcement period are recorded; a copy is kept at the institution's Orhun Exchange Program coordination office.
page.orhunguide.s4s2.item3=The staff member contacts the relevant department at the institution they wish to visit to determine suitable courses and prepares the "Teaching Staff Mobility Plan."
page.orhunguide.s4s2.item4=The plan is approved by the relevant academic unit boards of both the sending and host institutions and is submitted to the coordination office at least 15 days before mobility begins.
page.orhunguide.s4s2.item5=In the evaluation, priority is given to teaching staff who have not previously participated in the exchange program and to Orhun department coordinators.
page.orhunguide.s4s2.item6=Results are announced on the signatory institution's website.
page.orhunguide.s4.note2=A staff member who is selected but does not participate without a valid excuse may not benefit from the program for a period of three years.
page.orhunguide.s4s3.title=4.3 Required Documents
page.orhunguide.s4.doc1=Academic Staff Information Form
page.orhunguide.s4.doc1.desc=Obtained from the "Documents" menu on the institution's website
page.orhunguide.s4.doc2=Academic Staff Mobility Program
page.orhunguide.s4.doc2.desc=A plan detailing the activities to be carried out; obtained from the institution's website
page.orhunguide.s4.doc3=Curriculum Vitae (CV)
page.orhunguide.s4.doc3.desc=Up-to-date CV
page.orhunguide.s4.doc4=Certificate of Participation
page.orhunguide.s4.doc4.desc=Issued signed/sealed by the host institution at the end of the mobility
page.orhunguide.s4.doc5=Activity Outcome Report
page.orhunguide.s4.doc5.desc=Prepared by the staff member; submitted to the coordination office no later than 15 days after the activity ends
page.orhunguide.s4s4.title=4.4 Financial Rights and Responsibilities
page.orhunguide.s4s4.item1=The staff member's employment rights are preserved at their own university.
page.orhunguide.s4s4.item2=Daily allowance and travel expenses for the first two weeks are covered by the sending institution.
page.orhunguide.s4s4.item3=Accommodation and subsistence (lodging and meals) are provided by the host university.
page.orhunguide.s5.title=5. I Have Been Selected for Mobility — What Should I Do Now?
page.orhunguide.s5.p1=Students and academic staff who have been selected for mobility are advised to complete the following six steps, in order, before mobility begins:
page.orhunguide.s5.step1=Creating a Kion Account
page.orhunguide.s5.step1.text=A Kion account should be created via the link provided on the relevant exchange program website. Documents required for mobility will be uploaded to this system.
page.orhunguide.s5.step2=Obtaining the Letter of Acceptance
page.orhunguide.s5.step2.text=Contact should be made by e-mail with the placement university to obtain the Letter of Acceptance.
page.orhunguide.s5.step3=Accessing Course Contents
page.orhunguide.s5.step3.text=Course contents should be obtained from the host university's website. If this information is not available on the website, it should be requested from the counterpart institution by e-mail.
page.orhunguide.s5.step4=Preparing the Learning Agreement
page.orhunguide.s5.step4.text=Using the up-to-date transcript and the course list obtained from the counterpart institution, the Learning Agreement should be prepared together with the institution's Orhun Department Coordinator.
page.orhunguide.s5.step5=Learning/Teaching Agreement Signing Process
page.orhunguide.s5.step5.text=The prepared Learning/Teaching Agreement is signed by the Department Chair and the Department Coordinator; it is then sent by e-mail to the Exchange Programs Coordination Office for final signature and seal.
page.orhunguide.s5.step6=Submission of Required Documents
page.orhunguide.s5.step6.text=Documents required for mobility, such as the Student Obligations Undertaking and the Flight Request Form, are uploaded to the Kion system.
page.orhunguide.s5.note3=These six steps summarise the general process to be followed after selection for mobility; minor differences may occur depending on each member institution's own institutional system (e.g., Kion). For up-to-date information, it is recommended to contact the relevant institution's Exchange Programs Coordination Office.
page.orhun.guidelink=Application Guide

