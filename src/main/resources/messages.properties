# --- membership page ---
page.membership.title=Membership to the Turkic Universities Union (TURKUNIB)
page.membership.intro=How to become a member of TURKUNIB: membership criteria, the application procedure, and guidance on preparing the application file.
page.membership.criteria.title=Membership Criteria
page.membership.criteria.intro=A university seeking TURKUNIB membership is expected to meet the following conditions:
page.membership.criteria.item1=Have organized activities consistent with TURKUNIB's aims and objectives,
page.membership.criteria.item2=Have conducted scientific research or scholarly work related to the Turkic world,
page.membership.criteria.item3=Have established concrete and measurable collaborations with universities in OTS Member States (joint projects, student/staff exchange, joint research, etc.),
page.membership.criteria.item4=Possess experience with exchange programs and the institutional capacity to contribute to the Orhun Exchange Program,
page.membership.criteria.item5=Be ranked within the top 20% of universities in the country where the applicant operates, according to international ranking agencies.
page.membership.procedure.title=Application Procedure
page.membership.procedure.intro=Membership applications follow these stages:
page.membership.procedure.item1=Candidate universities submit their applications directly to the OTS Secretariat through the diplomatic channels of the country where they operate.
page.membership.procedure.item2=Upon receipt, the OTS Secretariat establishes a commission composed of 5 persons from Member Universities, appointed in consultation with the Chairman of the Union, to assess the applications.
page.membership.procedure.item3=The commission evaluates each application against the membership criteria and communicates its findings to the OTS Secretariat.
page.membership.procedure.item4=The OTS Secretariat transmits the commission's proposal to the TURKUNIB General Assembly for a final decision.
page.membership.procedure.item5=Union membership is decided by simple majority at a General Assembly meeting attended by at least two-thirds of the Union members.
page.membership.procedure.item6=Universities that do not operate in one of the OTS Member States but wish to join the Union may be granted Observer status, provided they fulfil the above procedures and criteria.
page.membership.procedure.item7=The Union membership of a Member University that fails to participate in three consecutive General Assembly meetings without a valid excuse shall be terminated.
page.membership.guidance.title=Guidance for Application File and Rector's Letter
page.membership.guidance.item1=Membership applications are expected to be substantiated. It is recommended that the application file include a Rector's Letter (cover letter) signed by the Rector, clearly stating the rationale for the application and the university's intention to join TURKUNIB.
page.membership.guidance.item2=The Rector's Letter should be accompanied by a comprehensive application file demonstrating that the university meets the membership criteria; supporting documents may include evidence of relevant activities, partnership agreements, exchange program records, institutional capacity statements, and examples of joint projects.
page.membership.guidance.item3=The application letter and accompanying documents should be addressed to the OTS Secretariat. The file submitted will undergo a preliminary review by the OTS Secretariat. If deemed appropriate, the application will be placed on the agenda of the TURKUNIB General Assembly and the final decision will be made by vote. Approved memberships will be communicated to Member States through a report prepared by the OTS Secretariat and the application process will be concluded.
footer.about.membership=Membership

