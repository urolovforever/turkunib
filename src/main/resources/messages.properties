page.about.intro.p1=Establishing the Turkic Universities Union (TURKUNIB) in order to give institutional structure to cooperation in the field of higher education among the member states of the Organization of Turkic States (OTS) has been one of the priority agenda items since the founding of the Organization. The Union aims to strengthen inter-university cooperation on the basis of shared history, culture, and linguistic heritage, to increase student and academic staff mobility, and to create a common Turkic higher education area.
page.about.intro.p2=Today, TURKUNIB has grown into a wide-ranging program encompassing 170 universities located in Azerbaijan, Kazakhstan, Kyrgyzstan, Türkiye, Uzbekistan, Hungary, and the Turkish Republic of Northern Cyprus, which are member or observer states of the OTS.
page.about.intro.p3=The Orhun Student and Academic Staff Exchange Program is also carried out under the framework of TURKUNIB. The Orhun Exchange Program, which forms the foundation of TURKUNIB, is a joint higher education mechanism envisaging the exchange of students and academic staff among member states. Its pilot implementation was launched in the 2017–2018 academic year and has since been expanded in phases.
page.about.members=Our Members
page.about.history=Our History
page.about.mission.title=Mission
page.about.mission.text=To advance higher education across the Turkic world by promoting excellence in teaching and research, enabling academic mobility and credit transfer among member universities, and strengthening cultural and institutional ties through joint programs such as the Orhun Exchange Program. TURKUNIB is committed to building a unified higher education ecosystem that empowers students, faculty, and institutions to collaborate across borders in pursuit of shared academic and societal goals.
page.about.vision.title=Vision
page.about.vision.text=A vibrant, integrated Turkic higher education area where students and scholars seamlessly collaborate across borders – driving impactful research, fostering innovation, and nurturing the next generation of scholars, leaders, and professionals who will shape a stronger, more interconnected Turkic world.
