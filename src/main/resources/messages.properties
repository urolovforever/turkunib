# About the program
main.about.program=About TURKUNIB
main.about.program.tagline=Connecting Turkic Universities for a Stronger Future
main.about.program.p1=TURKUNIB (Turkic Universities Union) is a dynamic initiative designed to strengthen academic bonds and foster collaboration among universities across the Turkic world. Uniting 170 universities across Azerbaijan, Kazakhstan, Kyrgyzstan, Türkiye, Uzbekistan, Hungary, and the Turkish Republic of Northern Cyprus, TURKUNIB builds a shared higher education space rooted in common history, culture, and language.
main.about.program.p2=By creating a unified platform, the program encourages student mobility, faculty exchange, and joint research projects that address shared regional and global challenges. Through its network – including the Orhun Student and Academic Staff Exchange Program – TURKUNIB enhances educational opportunities while promoting cultural understanding, knowledge transfer, and innovation.
main.about.program.p3=TURKUNIB is committed to preparing the next generation of scholars, leaders, and professionals who will contribute to the sustainable development of their countries while reinforcing the sense of unity among Turkic nations.
main.about.program.p4=At its core, TURKUNIB is more than an academic partnership – it is a bridge that connects people, ideas, and institutions, laying the foundation for a stronger, more interconnected future.
main.about.program.overview=Program Overview

