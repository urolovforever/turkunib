page.orhun.title=Orhun Exchange Program
page.orhun.intro.p1=The Orhun Exchange Program, operating under the Turkic Universities Union (TURKUNIB), has emerged as the principal higher education mobility mechanism of the Organization of Turkic States (OTS). Since its pilot launch in the 2017–2018 academic year, the Program has grown steadily in both scope and impact, facilitating academic exchange across approximately 170 universities in member and observer states. Through structured mobility schemes, the Program supports student and staff exchange, joint research initiatives, collaborative curriculum development, and inter-university cooperation in teaching and scientific activities.
page.orhun.intro.p2=Beyond its immediate academic outcomes, the Orhun Exchange Program constitutes a strategic instrument for fostering a cohesive and competitive Turkic Higher Education Area, promoting institutional convergence, quality enhancement, and the mutual recognition of academic qualifications among participating universities. By enabling direct engagement between students, faculty members, and researchers, the Program plays a pivotal role in strengthening people-to-people connectivity, cultural understanding, and academic solidarity across the Turkic world – thereby contributing to the broader vision of regional integration envisaged by the Organization of Turkic States.
page.orhun.regulation.title=Regulation
page.orhun.regulation.text=The goals of these regulations are to determine the basis for the exchange of teachers and students between higher educational institutions that are members of the Turkic Council Turkic Universities Union. This Regulation covers the basics of the exchange of teachers and students between higher education institutions that are members of the Turkic Council Turkic Universities Union.
page.orhun.regulation.download=Download Regulation (DOCX)
