page.orhun.title=Orhun Mübadilə Proqramı
page.orhun.intro.p1=Türk Universitetləri Birliyi (TURKUNIB) çərçivəsində fəaliyyət göstərən Orhun Mübadilə Proqramı Türk Dövlətləri Təşkilatının (TDT) əsas ali təhsil mobillik mexanizminə çevrilmişdir. 2017–2018-ci tədris ilində pilot şəkildə başladıldığı vaxtdan Proqram həm əhatə dairəsi, həm də təsiri baxımından davamlı inkişaf edərək üzv və müşahidəçi dövlətlərdəki təxminən 170 universitet arasında akademik mübadiləni asanlaşdırır. Strukturlaşdırılmış mobillik sxemləri vasitəsilə Proqram tələbə və heyət mübadiləsini, birgə tədqiqat təşəbbüslərini, tədris proqramlarının birgə hazırlanmasını, habelə tədris və elmi fəaliyyət sahəsində universitetlərarası əməkdaşlığı dəstəkləyir.
page.orhun.intro.p2=Bilavasitə akademik nəticələrindən əlavə, Orhun Mübadilə Proqramı vahid və rəqabətqabiliyyətli Türk Ali Təhsil Məkanının formalaşdırılması üçün strateji alət olub, iştirakçı universitetlər arasında institusional yaxınlaşmanı, keyfiyyətin yüksəldilməsini və akademik kvalifikasiyaların qarşılıqlı tanınmasını təşviq edir. Tələbələr, professor-müəllim heyəti və tədqiqatçılar arasında birbaşa əlaqəni mümkün etməklə Proqram türk dünyasında insanlar arasında əlaqələrin, mədəni anlayışın və akademik həmrəyliyin gücləndirilməsində mühüm rol oynayır və bununla da Türk Dövlətləri Təşkilatının nəzərdə tutduğu regional inteqrasiyanın daha geniş vizyonuna töhfə verir.
page.orhun.regulation.title=Əsasnamə
page.orhun.regulation.text=Bu əsasnamənin məqsədi Türk Şurası Türk Universitetləri Birliyinin üzvü olan ali təhsil müəssisələri arasında müəllim və tələbə mübadiləsinin əsaslarını müəyyən etməkdir. Bu Əsasnamə Türk Şurası Türk Universitetləri Birliyinin üzvü olan ali təhsil müəssisələri arasında müəllim və tələbə mübadiləsinin əsaslarını əhatə edir.
