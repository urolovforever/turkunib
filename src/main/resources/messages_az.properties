page.orhunguide.doc.col2=Təsvir
page.orhunguide.s1.title=1. Orhun Mübadilə Proqramı haqqında
page.orhunguide.s1.p1=Orhun Mübadilə Proqramı Türk Dövlətləri Təşkilatının (TDT) himayəsi altında fəaliyyət göstərən Türk Universitetləri Birliyinin (TURKUNIB) həyata keçirdiyi aparıcı proqram olub, üzv ölkələrin ali təhsil müəssisələri arasında tələbələrin və professor-müəllim heyətinin mobilliyini təşviq edir. Proqramın məqsədi akademik əməkdaşlığı inkişaf etdirmək, qurumlararası əlaqələri gücləndirmək və xalqlar arasında mədəni qarşılıqlı əlaqəni artırmaqdır.
page.orhunguide.s1.p2=Proqram 2017–2018-ci tədris ilində pilot layihə kimi başlamış, COVID-19-dan sonrakı dövrdə yenidən fəallaşdırılaraq əhatə dairəsi genişləndirilmiş və bu gün 170 üzv universiteti bir araya gətirən geniş şəbəkəyə çevrilmişdir.
page.orhunguide.s1.obj.title=Strateji Məqsədlər
page.orhunguide.s1.obj1=Üzv ölkələrin universitetləri arasında akademik inteqrasiyanın və mobilliyin artırılması,
page.orhunguide.s1.obj2="Türk Dünyası Ali Təhsil Məkanı"nın yaradılmasına töhfə verilməsi,
page.orhunguide.s1.obj3=Ali təhsil sistemlərinin Bolonya prosesi və ECTS kimi beynəlxalq standartlara uyğunlaşdırılması,
page.orhunguide.s1.obj4=Regional inkişafa, tədqiqat əməkdaşlığına və innovasiyaya töhfə verilməsi.
page.orhunguide.s1.countries.title=Proqramın Əhatə Etdiyi Üzv Ölkələr
page.orhunguide.s1.countries.p1=Proqram çərçivəsində akademik heyət və tələbələr Türk Dövlətləri Təşkilatının Universitetlər Birliyinə üzv olan universitetlərdə mobillik həyata keçirmək imkanına malikdirlər. Üzv ölkələr bunlardır: Türkiyə, Azərbaycan, Qırğızıstan, Qazaxıstan, Özbəkistan, Şimali Kipr Türk Respublikası və Macarıstan.
page.orhunguide.s2.title=2. Ümumi Prinsiplər
page.orhunguide.s2s1.title=2.1 Protokollara Əsaslanma
page.orhunguide.s2s1.p1=Orhun Mübadilə Proqramı yalnız üzv qurumlar arasında imzalanmış "Orhun Mübadilə Proqramı Protokolu" çərçivəsində həyata keçirilə bilər. Universitet protokol imzalamadığı quruma tələbə və ya professor-müəllim heyəti göndərə bilməz və həmin qurumdan qəbul edə bilməz. Protokolun bir nüsxəsi Türk Dövlətləri Təşkilatının Katibliyində saxlanılır.
page.orhunguide.s2s2.title=2.2 Dillər
page.orhunguide.s2s2.p1=Proqramla bağlı normativ sənədlər, məlumatlar, fayllar və sənədlər üzv dövlətlərin rəsmi dillərində, türk və ingilis dillərində hazırlanır. Mətnlər arasında uyğunsuzluq olduqda ingilis dilindəki mətn əsas götürülür.
page.orhunguide.s2s3.title=2.3 Maliyyə Mənbələri
page.orhunguide.s2s3.fin1=Milli və ya beynəlxalq qurum və təşkilatlar tərəfindən ayrılan vəsaitlər,
page.orhunguide.s2s3.fin2=Üzv universitetlərin öz büdcə vəsaitləri,
page.orhunguide.s2s3.fin3=TURKUNIB dövri Sədr Universiteti və Türk Dövlətləri Təşkilatı tərəfindən ayrılan vəsaitlər.
page.orhunguide.s2s3.p1=Üzv universitetlər hər tədris ili üçün maliyyə ehtiyaclarını mobillikdən əvvəl öz büdcələrində göstərməlidirlər; vəsaitlərin bölüşdürülməsində zəruri əlaqələndirmə Türk Dövlətləri Təşkilatının Katibliyi tərəfindən təmin edilir.
page.orhunguide.s3.title=3. Tələbələr Necə Müraciət Edir?
page.orhunguide.s3.p1=Orhun Mübadilə Proqramı çərçivəsində əyani təhsil alan tələbələr öz ali təhsil müəssisəsinin protokol imzaladığı üzv qurumda bir və ya iki semestr (ümumilikdə bir tədris ilindən çox olmamaqla) təhsillərini davam etdirə bilərlər.
page.orhunguide.s3s1.title=3.1 Müraciət Tələbləri
page.orhunguide.s3s1.req1=Əyani ali təhsil proqramında təhsil alması,
page.orhunguide.s3s1.req2=Ümumi orta balının (GPA) 4 üzərindən ən azı 2,5 (və ya ekvivalent) olması,
page.orhunguide.s3s1.req3=Hazırlıq kursu, birinci kurs və sonuncu kurs tələbələri proqramdan yararlana bilməzlər,
page.orhunguide.s3s1.req4=Xaricdə beynəlxalq tələbə statusu ilə təhsil alanlar öz ölkələrindəki universitetə müraciət edə bilməzlər.
page.orhunguide.s3s2.title=3.2 Müraciət Prosesi və Elan
page.orhunguide.s3s2.item1=Ali təhsil müəssisəsi imzaladığı Orhun Mübadilə Proqramı protokollarını və müvafiq kvotaları öz internet saytında elan edir.
page.orhunguide.s3s2.item2=Elanda proqramın təqdimatı, müraciət tələbləri və proses addımları öz əksini tapır.
page.orhunguide.s3s2.item3=Tələbə elan edilmiş kvota və təqvimə uyğun olaraq müvafiq quruma müraciət edir.
page.orhunguide.s3s2.item4=Müraciətlər sistemə yüklənmiş sənədlərlə birlikdə qəbul edən quruma ötürülmək üçün əlaqələndirici universitetə göndərilir.
page.orhunguide.s3s2.item5=TURKUNIB dövri Sədr Universiteti ikitərəfli protokollar çərçivəsində mübadilə tələbələrinin sayını və bölgüsünü müəyyən edir.
page.orhunguide.s3s2.item6=Qiymətləndirmə namizədlərin orta balı əsasında aparılır; nəticələr imzalayan qurumların internet saytlarında elan olunur.
page.orhunguide.s3.note1=100 ballıq qiymətləndirmə sistemindən 4 ballıq sistemə çevrilmə qəbul edən universitetin ekvivalentlik qərarına əsaslanır. Bundan əlavə, TURKUNIB dövri Sədr Universiteti səmərəli və effektiv mobillik üçün əlavə şərtlər müəyyən edə bilər.
page.orhunguide.s3s3.title=3.3 Tələb Olunan Sənədlər
page.orhunguide.s3.doc1=Müraciət Forması
page.orhunguide.s3.doc1.desc=Tələbənin müraciət sənədi
page.orhunguide.s3.doc2=Transkript
page.orhunguide.s3.doc2.desc=Aktual akademik transkript
page.orhunguide.s3.doc3=Tələbə Öhdəlikləri Müqaviləsi
page.orhunguide.s3.doc3.desc=Orhun Mübadilə Proqramı Tələbə Öhdəlikləri Müqaviləsi — tələbə ilə qurum arasında imzalanır
page.orhunguide.s3.doc4=Digər sənədlər
page.orhunguide.s3.doc4.desc=İmzalayan universitetlər tərəfindən müəyyən edilən əlavə sənədlər (olduqda)
page.orhunguide.s3s3.p1=Mübadilə dövrünün sonunda tələbə transkripti, təhsil müddətini göstərən İştirak Sertifikatını və tələbənin yekun hesabatını qayıdış tarixindən sonra 30 gün ərzində şəxsən, poçt və ya e-poçt vasitəsilə öz qurumunun Orhun Mübadilə Proqramı əlaqələndirmə ofisinə təqdim edir. Çatışmayan sənədlər üçün 15 günədək əlavə müddət verilə bilər; sənədlər verilmiş müddət ərzində tamamlanmadıqda proses etibarsız sayılır və edilmiş ödənişlərin geri qaytarılması tələb olunur.
page.orhunguide.s3s4.title=3.4 Təhsil Sazişi (Learning Agreement)
page.orhunguide.s3s4.p1=Mobillik başlamazdan əvvəl tələbənin qəbul edən qurumda götürəcəyi fənlər və kreditlər, habelə bunların öz qurumundakı hansı fənlərə uyğun gəldiyi "Təhsil Sazişi (Learning Agreement)" vasitəsilə müəyyən edilir. Saziş üç nüsxədə hazırlanır; bir nüsxə tələbədə, digərləri isə iki qurumda saxlanılır. Saziş müvafiq kafedra müdirləri və qurumların yüksək vəzifəli rəhbərləri (və ya onların səlahiyyətli nümayəndələri) tərəfindən imzalanır. Məcburi dəyişikliklər qəbul edən qurumun tədris dövrünün başlanmasından ən geci 30 gün ərzində (və məcburi imtahan tarixlərindən əvvəl) edilməlidir.
page.orhunguide.s3s5.title=3.5 Fənn Ekvivalentliyi, Təkrar Fənlər və İmtahanlar
page.orhunguide.s3s5.item1=Dərs yükü kredit əsasında müəyyən edilir; fənlərin sayı deyil, kreditlər əsas götürülür. Qurumlar ECTS sistemindən istinad kimi istifadə edə bilərlər.
page.orhunguide.s3s5.item2=Tələbənin uğursuz olduğu fənlər Təhsil Sazişində (Learning Agreement) göstərilən ekvivalent fənn əsasında öz qurumunda təkrar götürülür; təkrar fənn qəbul edən qurumda götürülə bilməz.
page.orhunguide.s3s5.item3=Şərti keçid Orhun Mübadilə Proqramı tələbələrinə tətbiq olunmur; bərpa imtahanı yalnız tələbənin hazırda mübadilə tələbəsi olduğu qurumda verilə bilər.
page.orhunguide.s3s5.item4=Tezis, təcrübə və laboratoriya işləri kimi fəaliyyətlər tələbənin öz qurumunun qaydalarına tabedir.
page.orhunguide.s3s5.item5=Mübadilənin sonunda qurumlar uğurla tamamlanmış fənlərin kreditlərini və qiymətlərini tanımağa borcludurlar; bu fənlər diploma əlavəsində göstərilir.
page.orhunguide.s3s6.title=3.6 Maliyyə Öhdəlikləri
page.orhunguide.s3s6.item1=Tələbə mübadilə dövründə məcburi ödənişi/təhsil haqqını öz qurumuna ödəməyə davam edir; qeydiyyat dayandırıla bilməz.
page.orhunguide.s3s6.item2=Qəbul edən quruma əlavə təhsil haqqı ödənilmir.
page.orhunguide.s3s6.item3=Digər təqaüdlər və kreditlər təhsil müddəti ərzində davam edir.
page.orhunguide.s3s7.title=3.7 İntizam
page.orhunguide.s3s7.p1=Mübadilə tələbələri mobillik dövründə olduqları qurumun intizam qaydalarına tabedirlər. İntizam araşdırması açıldıqda nəticə barədə tələbənin öz qurumu məlumatlandırılır; cəza mobillik dövründə tətbiq edilə bilmədikdə, o, tələbənin öz qurumu tərəfindən icra olunur.
page.orhunguide.s4.title=4. Akademik Heyət Necə Müraciət Edir?
page.orhunguide.s4.p1=Orhun Mübadilə Proqramı protokolunu imzalamış qurumlarda çalışan bütün professor-müəllim heyəti müəllim mobilliyində iştirak edə bilər. Mobillik bir qurumun əməkdaşının digər üzv qurumda həyata keçirəcəyi tədris fəaliyyətlərini əhatə edir.
page.orhunguide.s4s1.title=4.1 Əhatə Dairəsi və Müddət
page.orhunguide.s4s1.item1=Mobillik müddəti minimum iki həftə, maksimum üç ay ola bilər; eyni tədris ilində yalnız bir dəfə həyata keçirilə bilər.
page.orhunguide.s4s1.item2=Həftəlik ümumi akademik fəaliyyət ən azı altı saat olmalıdır (dərs saatları əsas götürülür; kifayət etmədikdə seminar, panel və ya konfrans kimi fəaliyyətlərlə tamamlana bilər).
page.orhunguide.s4s1.item3=Tədrisi əhatə etməyən mobillik planları Orhun Mübadilə Proqramı çərçivəsində qəbul edilmir.
page.orhunguide.s4s2.title=4.2 Müraciət Elanı və Seçim Prosesi
page.orhunguide.s4s2.item1=İmzalanmış protokollar və kvotalar qurumun və TURKUNIB-in internet saytlarında elan olunur; elanlar ən azı 15 gün ərzində dərc olunmuş qalır.
page.orhunguide.s4s2.item2=Elan müddətində edilmiş bütün müraciətlər qeydə alınır; bir nüsxə qurumun Orhun Mübadilə Proqramı əlaqələndirmə ofisində saxlanılır.
page.orhunguide.s4s2.item3=Əməkdaş uyğun fənləri müəyyən etmək üçün getmək istədiyi qurumun müvafiq kafedrası ilə əlaqə saxlayır və "Müəllim Heyəti Mobillik Planı"nı hazırlayır.
page.orhunguide.s4s2.item4=Plan həm göndərən, həm də qəbul edən qurumun müvafiq akademik bölmə şuraları tərəfindən təsdiq edilir və mobillik başlamazdan ən azı 15 gün əvvəl əlaqələndirmə ofisinə təqdim olunur.
page.orhunguide.s4s2.item5=Qiymətləndirmədə əvvəllər mübadilə proqramında iştirak etməmiş professor-müəllim heyətinə və Orhun kafedra koordinatorlarına üstünlük verilir.
page.orhunguide.s4s2.item6=Nəticələr imzalayan qurumun internet saytında elan olunur.
page.orhunguide.s4.note2=Seçildiyi halda üzrlü səbəb olmadan iştirak etməyən əməkdaş üç il müddətində proqramdan yararlana bilməz.
page.orhunguide.s4s3.title=4.3 Tələb Olunan Sənədlər
page.orhunguide.s4.doc1=Akademik Heyət Məlumat Forması
page.orhunguide.s4.doc1.desc=Qurumun internet saytındakı "Sənədlər" menyusundan əldə olunur
page.orhunguide.s4.doc2=Akademik Heyət Mobillik Proqramı
page.orhunguide.s4.doc2.desc=Həyata keçiriləcək fəaliyyətləri ətraflı əks etdirən plan; qurumun internet saytından əldə olunur
page.orhunguide.s4.doc3=Tərcümeyi-hal (CV)
page.orhunguide.s4.doc3.desc=Aktual CV
page.orhunguide.s4.doc4=İştirak Sertifikatı
page.orhunguide.s4.doc4.desc=Mobilliyin sonunda qəbul edən qurum tərəfindən imzalanmış/möhürlənmiş şəkildə verilir
page.orhunguide.s4.doc5=Fəaliyyət Nəticə Hesabatı
page.orhunguide.s4.doc5.desc=Əməkdaş tərəfindən hazırlanır; fəaliyyət başa çatdıqdan sonra ən geci 15 gün ərzində əlaqələndirmə ofisinə təqdim olunur
page.orhunguide.s4s4.title=4.4 Maliyyə Hüquqları və Öhdəlikləri
page.orhunguide.s4s4.item1=Əməkdaşın əmək hüquqları öz universitetində qorunub saxlanılır.
page.orhunguide.s4s4.item2=İlk iki həftə üçün gündəlik xərclik və yol xərcləri göndərən qurum tərəfindən ödənilir.
page.orhunguide.s4s4.item3=Yerləşdirmə və təminat (qalacaq yer və qidalanma) qəbul edən universitet tərəfindən təmin olunur.
page.orhunguide.s5.title=5. Mobillik Üçün Seçilmişəm — İndi Nə Etməliyəm?
page.orhunguide.s5.p1=Mobillik üçün seçilmiş tələbələrə və akademik heyətə mobillik başlamazdan əvvəl aşağıdakı altı addımı ardıcıllıqla tamamlamaları tövsiyə olunur:
page.orhunguide.s5.step1=Kion Hesabının Yaradılması
page.orhunguide.s5.step1.text=Müvafiq mübadilə proqramı internet saytında verilmiş keçid vasitəsilə Kion hesabı yaradılmalıdır. Mobillik üçün tələb olunan sənədlər bu sistemə yüklənəcək.
page.orhunguide.s5.step2=Qəbul Məktubunun Alınması
page.orhunguide.s5.step2.text=Qəbul Məktubunu əldə etmək üçün yerləşdirmə universiteti ilə e-poçt vasitəsilə əlaqə saxlanılmalıdır.
page.orhunguide.s5.step3=Fənn Məzmunlarının Əldə Olunması
page.orhunguide.s5.step3.text=Fənn məzmunları qəbul edən universitetin internet saytından əldə olunmalıdır. Bu məlumat saytda mövcud olmadıqda, qarşı tərəf qurumdan e-poçt vasitəsilə tələb olunmalıdır.
page.orhunguide.s5.step4=Təhsil Sazişinin (Learning Agreement) Hazırlanması
page.orhunguide.s5.step4.text=Aktual transkriptdən və qarşı tərəf qurumdan əldə olunmuş fənn siyahısından istifadə etməklə Təhsil Sazişi (Learning Agreement) qurumun Orhun Kafedra Koordinatoru ilə birlikdə hazırlanmalıdır.
page.orhunguide.s5.step5=Təhsil/Tədris Sazişinin İmzalanması Prosesi
page.orhunguide.s5.step5.text=Hazırlanmış Təhsil/Tədris Sazişi kafedra müdiri və kafedra koordinatoru tərəfindən imzalanır; sonra yekun imza və möhür üçün Mübadilə Proqramları Əlaqələndirmə Ofisinə e-poçt vasitəsilə göndərilir.
page.orhunguide.s5.step6=Tələb Olunan Sənədlərin Təqdim Edilməsi
page.orhunguide.s5.step6.text=Tələbə Öhdəlikləri Müqaviləsi və Uçuş Tələbi Forması kimi mobillik üçün tələb olunan sənədlər Kion sisteminə yüklənir.
page.orhunguide.s5.note3=Bu altı addım mobillik üçün seçildikdən sonra izlənilməli olan ümumi prosesi xülasə edir; hər bir üzv qurumun öz institusional sistemindən (məsələn, Kion) asılı olaraq kiçik fərqlər ola bilər. Aktual məlumat üçün müvafiq qurumun Mübadilə Proqramları Əlaqələndirmə Ofisi ilə əlaqə saxlamaq tövsiyə olunur.
page.orhun.guidelink=Müraciət Bələdçisi

