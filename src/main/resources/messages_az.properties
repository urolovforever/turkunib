# About the program
main.about.program=TURKUNIB haqqında
main.about.program.tagline=Daha güclü gələcək naminə türk universitetlərini birləşdiririk
main.about.program.p1=TURKUNIB (Türk Universitetləri Birliyi) türk dünyası üzrə universitetlər arasında akademik əlaqələri gücləndirmək və əməkdaşlığı təşviq etmək məqsədilə yaradılmış dinamik təşəbbüsdür. Azərbaycan, Qazaxıstan, Qırğızıstan, Türkiyə, Özbəkistan, Macarıstan və Şimali Kipr Türk Respublikasında fəaliyyət göstərən 170 universiteti birləşdirən TURKUNIB ortaq tarixə, mədəniyyətə və dilə əsaslanan vahid ali təhsil məkanı qurur.
main.about.program.p2=Vahid platforma yaratmaqla proqram tələbə mobilliyini, professor-müəllim heyəti mübadiləsini və regionun və dünyanın ortaq çağırışlarına yönəlmiş birgə tədqiqat layihələrini təşviq edir. Orhun Tələbə və Akademik Heyət Mübadilə Proqramı da daxil olmaqla öz şəbəkəsi vasitəsilə TURKUNIB təhsil imkanlarını genişləndirir, eyni zamanda mədəni anlayışı, bilik transferini və innovasiyanı təşviq edir.
main.about.program.p3=TURKUNIB öz ölkələrinin dayanıqlı inkişafına töhfə verəcək və türk xalqları arasında birlik hissini möhkəmləndirəcək yeni nəsil alimlərin, liderlərin və peşəkarların hazırlanmasına sadiqdir.
main.about.program.p4=Mahiyyət etibarilə TURKUNIB sadəcə akademik tərəfdaşlıq deyil – insanları, ideyaları və qurumları birləşdirən, daha güclü və daha sıx bağlı gələcəyin təməlini qoyan bir körpüdür.
main.about.program.overview=Proqramın icmalı

