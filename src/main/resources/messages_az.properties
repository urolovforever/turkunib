# --- single pages (about/contacts/cookies/orhun/council/terms) ---
page.about.intro.p1=Türk Dövlətləri Təşkilatına (TDT) üzv dövlətlər arasında ali təhsil sahəsində əməkdaşlığa institusional struktur qazandırmaq məqsədilə Türk Universitetləri Birliyinin (TURKUNIB) yaradılması Təşkilatın təsis olunduğu gündən prioritet gündəlik məsələlərindən biri olmuşdur. Birlik ortaq tarix, mədəniyyət və dil irsi əsasında universitetlərarası əməkdaşlığı gücləndirməyi, tələbə və akademik heyət mobilliyini artırmağı və vahid türk ali təhsil məkanı yaratmağı hədəfləyir.
page.about.intro.p2=Bu gün TURKUNIB TDT-nin üzv və ya müşahidəçi dövlətləri olan Azərbaycan, Qazaxıstan, Qırğızıstan, Türkiyə, Özbəkistan, Macarıstan və Şimali Kipr Türk Respublikasında yerləşən 170 universiteti əhatə edən genişmiqyaslı proqrama çevrilmişdir.
page.about.intro.p3=Orhun Tələbə və Akademik Heyət Mübadilə Proqramı da TURKUNIB çərçivəsində həyata keçirilir. TURKUNIB-in təməlini təşkil edən Orhun Mübadilə Proqramı üzv dövlətlər arasında tələbə və akademik heyət mübadiləsini nəzərdə tutan birgə ali təhsil mexanizmidir. Onun pilot tətbiqi 2017–2018-ci tədris ilində başlamış və o vaxtdan mərhələli şəkildə genişləndirilmişdir.
page.about.members=Üzvlərimiz
page.about.history=Tariximiz
page.about.mission.title=Missiya
page.about.mission.text=Tədris və tədqiqatda mükəmməlliyi təşviq etməklə, üzv universitetlər arasında akademik mobillik və kredit transferini mümkün etməklə, Orhun Mübadilə Proqramı kimi birgə proqramlar vasitəsilə mədəni və institusional əlaqələri gücləndirməklə türk dünyasında ali təhsili inkişaf etdirmək. TURKUNIB tələbələrə, professor-müəllim heyətinə və qurumlara ortaq akademik və ictimai məqsədlər naminə sərhədləri aşan əməkdaşlıq imkanı verən vahid ali təhsil ekosistemi qurmağa sadiqdir.
page.about.vision.title=Vizyon
page.about.vision.text=Tələbələrin və alimlərin sərhədlərdən asılı olmayaraq maneəsiz əməkdaşlıq etdiyi, təsirli tədqiqatlara təkan verən, innovasiyanı təşviq edən və daha güclü, daha sıx bağlı türk dünyasını formalaşdıracaq yeni nəsil alimləri, liderləri və peşəkarları yetişdirən canlı, inteqrasiya olunmuş türk ali təhsil məkanı.
page.about.goals.title=Məqsədlərimiz
page.about.goals.subtitle=Tələbələrə, professor-müəllim heyətinə və qurumlara fayda verən praktik əməkdaşlığa diqqət yetiririk.
page.about.goal.mobility.title=Akademik Hərəkətlilik
page.about.goal.mobility.text=Tələbə və işçi heyəti mübadiləsi proqramları; kreditlərin və diplomların qarşılıqlı tanınması.
page.about.goal.standards.title=Ortaq Standartlar
page.about.goal.standards.text=Ortaq kredit transferi və keyfiyyət təminatı çərçivəsinin işlənib hazırlanması.
page.about.goal.culture.title=Mədəni İnteqrasiya
page.about.goal.culture.text=Ortaq tarixi, mədəniyyəti və dilləri qeyd edən proqramlar.
page.about.goal.faculty.title=Professor-Müəllim Heyətinin İnkişafı
page.about.goal.faculty.text=Ortaq təlimlər, seminarlar və əməkdaşlıq əsasında tədris təşəbbüsləri.
page.about.goal.competitions.title=Müsabiqələr və Simpoziumlar
page.about.goal.competitions.text=Üzvlər arasında akademik müsabiqələr, simpoziumlar və mədəni tədbirlər.
page.about.goal.scholarships.title=Təqaüdlər
page.about.goal.scholarships.text=Türk dünyasına yönəlmiş tələbə və tədqiqatçılara dəstək.
page.about.history.title=Tariximiz
