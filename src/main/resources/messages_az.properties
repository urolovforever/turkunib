# --- membership page ---
page.membership.title=Türk Universitetləri Birliyinə (TURKUNIB) Üzvlük
page.membership.intro=TURKUNIB-ə necə üzv olmaq olar: üzvlük meyarları, müraciət proseduru və müraciət sənədləri toplusunun hazırlanmasına dair tövsiyələr.
page.membership.criteria.title=Üzvlük Meyarları
page.membership.criteria.intro=TURKUNIB üzvlüyünə namizəd universitetin aşağıdakı şərtlərə cavab verməsi gözlənilir:
page.membership.criteria.item1=TURKUNIB-in məqsəd və vəzifələrinə uyğun fəaliyyətlər təşkil etmiş olması,
page.membership.criteria.item2=Türk dünyası ilə bağlı elmi tədqiqatlar və ya elmi işlər aparmış olması,
page.membership.criteria.item3=TDT-yə üzv dövlətlərin universitetləri ilə konkret və ölçülə bilən əməkdaşlıqlar qurmuş olması (birgə layihələr, tələbə/heyət mübadiləsi, birgə tədqiqatlar və s.),
page.membership.criteria.item4=Mübadilə proqramları üzrə təcrübəyə və Orhun Mübadilə Proqramına töhfə vermək üçün institusional potensiala malik olması,
page.membership.criteria.item5=Beynəlxalq reytinq agentliklərinə əsasən fəaliyyət göstərdiyi ölkənin universitetləri arasında ilk 20%-ə daxil olması.
page.membership.procedure.title=Müraciət Proseduru
page.membership.procedure.intro=Üzvlük müraciətləri aşağıdakı mərhələlər üzrə aparılır:
page.membership.procedure.item1=Namizəd universitetlər müraciətlərini fəaliyyət göstərdikləri ölkənin diplomatik kanalları vasitəsilə birbaşa TDT Katibliyinə təqdim edirlər.
page.membership.procedure.item2=Müraciətlər daxil olduqdan sonra TDT Katibliyi onların qiymətləndirilməsi üçün Birliyin Sədri ilə məsləhətləşmə əsasında təyin olunan, üzv universitetlərin nümayəndələrindən ibarət 5 nəfərlik komissiya yaradır.
page.membership.procedure.item3=Komissiya hər bir müraciəti üzvlük meyarları baxımından qiymətləndirir və nəticələrini TDT Katibliyinə bildirir.
page.membership.procedure.item4=TDT Katibliyi komissiyanın təklifini yekun qərarın qəbulu üçün TURKUNIB Ümumi Yığıncağına təqdim edir.
page.membership.procedure.item5=Birliyə üzvlük Birlik üzvlərinin ən azı üçdə ikisinin iştirak etdiyi Ümumi Yığıncaq iclasında sadə səs çoxluğu ilə qərara alınır.
page.membership.procedure.item6=TDT-yə üzv dövlətlərdən birində fəaliyyət göstərməyən, lakin Birliyə qoşulmaq istəyən universitetlərə yuxarıdakı prosedur və meyarları yerinə yetirmək şərtilə Müşahidəçi statusu verilə bilər.
page.membership.procedure.item7=Üzrlü səbəb olmadan ardıcıl üç Ümumi Yığıncaq iclasında iştirak etməyən üzv universitetin Birlik üzvlüyünə xitam verilir.
page.membership.guidance.title=Müraciət Sənədləri Toplusu və Rektor Məktubuna dair Tövsiyələr
page.membership.guidance.item1=Üzvlük müraciətlərinin əsaslandırılması gözlənilir. Müraciət sənədləri toplusuna müraciətin səbəblərini və universitetin TURKUNIB-ə qoşulmaq niyyətini aydın şəkildə ifadə edən, Rektor tərəfindən imzalanmış Rektor Məktubunun (müşayiət məktubunun) daxil edilməsi tövsiyə olunur.
page.membership.guidance.item2=Rektor Məktubu universitetin üzvlük meyarlarına cavab verdiyini nümayiş etdirən əhatəli müraciət sənədləri toplusu ilə müşayiət olunmalıdır; təsdiqedici sənədlərə müvafiq fəaliyyətlərə dair sübutlar, tərəfdaşlıq müqavilələri, mübadilə proqramı qeydləri, institusional potensial haqqında arayışlar və birgə layihə nümunələri daxil ola bilər.
page.membership.guidance.item3=Müraciət məktubu və müşayiətedici sənədlər TDT Katibliyinə ünvanlanmalıdır. Təqdim olunan sənədlər toplusu TDT Katibliyi tərəfindən ilkin baxışdan keçirilir. Məqsədəuyğun hesab edildikdə, müraciət TURKUNIB Ümumi Yığıncağının gündəliyinə salınır və yekun qərar səsvermə yolu ilə qəbul edilir. Təsdiq edilmiş üzvlüklər TDT Katibliyi tərəfindən hazırlanan hesabat vasitəsilə üzv dövlətlərə bildirilir və müraciət prosesi yekunlaşdırılır.
