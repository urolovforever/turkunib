page.terms.title=Şərtlər və Qaydalar
page.terms.lastupdated=Son yenilənmə:
page.terms.intro=turkunib.org saytına (“Sayt”) xoş gəlmisiniz. Bu Şərtlər və Qaydalar (“Şərtlər”, “Müqavilə”) Sayta girişinizi və istifadənizi tənzimləyir. Sayta daxil olmaqla və ya ondan istifadə etməklə bu Şərtlərə əməl etməyə razılaşırsınız. Bu Şərtlərlə razı deyilsinizsə, zəhmət olmasa Saytdan istifadə etməyin.
page.terms.s1.title=1. Təriflər
page.terms.s1.text=“Biz”, “bizim” və “bizə” Saytın operatoruna istinad edir. “Siz” və ya “İstifadəçi” Sayta daxil olan istənilən ziyarətçi, istifadəçi və ya digər şəxsə istinad edir.
page.terms.s2.title=2. Şərtlərin Qəbulu
page.terms.s2.text=Saytdan istifadəniz bu Şərtlərə və bütün müvafiq qanun və qaydalara tabedir. Saytdan bir təşkilat adından istifadə edirsinizsə, bu Şərtləri onun adından qəbul etmək səlahiyyətinə malik olduğunuzu təsdiq edirsiniz.
page.terms.s3.title=3. İcazə Verilən İstifadə
page.terms.s3.item1=Saytdan yalnız qanuni məqsədlər üçün və başqalarının hüquqlarını pozmayan şəkildə istifadə edin.
page.terms.s3.item2=Sayta, onun serverlərinə və ya hər hansı əlaqəli sistemlərə icazəsiz girişə cəhd etməyin.
page.terms.s3.item3=Zərərli proqram, ziyanlı kod daxil etməyin və ya Saytı pozan və ya zəiflədən fəaliyyətlərlə məşğul olmayın.
page.terms.s4.title=4. Hesablar və Təhlükəsizlik
page.terms.s4.text=Sayt hesab yaratmaq imkanı təklif edirsə, etibarnamələrinizi qorumaqdan və hesabınız altında baş verən bütün fəaliyyətlərdən siz məsuliyyət daşıyırsınız. Bu Şərtləri və ya müvafiq qanunu pozan hesabları dayandırmaq və ya ləğv etmək hüququnu özümüzdə saxlayırıq.
page.terms.s5.title=5. Əqli Mülkiyyət
page.terms.s5.text=Saytdakı bütün məzmun, o cümlədən mətn, qrafika, loqolar, ikonlar, şəkillər və dizayn elementləri bizə və ya lisenziarlarımıza məxsusdur və müvafiq müəllif hüququ və digər əqli mülkiyyət qanunları ilə qorunur. Əvvəlcədən yazılı razılığımız olmadan heç bir məzmunu kopyalaya, çoxalda, dəyişdirə, yaya və ya ictimaiyyətə nümayiş etdirə bilməzsiniz.
page.terms.s6.title=6. Məzmun və Dəqiqlik
page.terms.s6.text=Saytdakı məlumatın dəqiq və güncəl olmasını təmin etmək üçün ağlabatan səylər göstəririk; lakin məzmunun səhvlərdən və ya çatışmazlıqlardan azad olmasına zəmanət vermirik. Məlumatı istənilən vaxt əvvəlcədən xəbərdarlıq etmədən yeniləyə və ya düzəldə bilərik.
page.terms.s7.title=7. Üçüncü Tərəf Keçidləri
page.terms.s7.text=Sayt bizə məxsus olmayan və ya bizim tərəfimizdən idarə olunmayan üçüncü tərəf veb-saytlarına və ya xidmətlərinə keçidlər ehtiva edə bilər. Hər hansı üçüncü tərəf veb-saytlarının məzmununa, məxfilik siyasətlərinə və ya təcrübələrinə görə məsuliyyət daşımırıq.
page.terms.s8.title=8. Qadağan Edilmiş Fəaliyyətlər
page.terms.s8.item1=Saytı sıradan çıxara, həddən artıq yükləyə və ya zəiflədə biləcək hər hansı şəkildə istifadə etmək.
page.terms.s8.item2=Razılığımız olmadan məlumat toplama, qaşıma və ya oxşar məlumat toplama üsulları.
page.terms.s8.item3=Hər hansı şəxsi və ya qurumu özünü kimi göstərmək və ya əlaqənizi yanlış təqdim etmək.
page.terms.s9.title=9. İmtinalar
page.terms.s9.text=Sayt və onun məzmunu “olduğu kimi” və “mövcud olduğu kimi” əsasında, satış qabiliyyəti, müəyyən məqsədə uyğunluq və pozulmama ilə bağlı nəzərdə tutulan zəmanətlər də daxil olmaqla, lakin bunlarla məhdudlaşmayan, açıq və ya nəzərdə tutulan heç bir zəmanət olmadan təqdim edilir.
page.terms.s10.title=10. Məsuliyyətin Məhdudlaşdırılması
page.terms.s10.text=Qanunla icazə verilən tam həddə, (a) Saytdan istifadəniz və ya istifadə edə bilməməyiniz; (b) serverlərimizə hər hansı icazəsiz giriş və ya istifadə; və ya (c) Saytdan əldə edilən hər hansı məzmun nəticəsində, birbaşa və ya dolayı yolla yaranan hər hansı dolayı, təsadüfi, xüsusi, nəticəvi və ya cəza xarakterli zərərlərə, hər hansı mənfəət və ya gəlir itkisinə, və ya hər hansı məlumat, istifadə, nüfuz və ya digər qeyri-maddi itkilərə görə məsuliyyət daşımırıq.
page.terms.s11.title=11. Zərərin Ödənilməsi
page.terms.s11.text=Saytdan istifadənizdən və ya bu Şərtlərin pozulmasından irəli gələn və ya hər hansı şəkildə bağlı olan hər hansı iddialardan, öhdəliklərdən, zərərlərdən, itkilərdən və xərclərdən bizi və törəmə şirkətlərimizi, vəzifəli şəxslərimizi, işçilərimizi və agentlərimizi müdafiə etməyə, zərərini ödəməyə və zərərsiz saxlamağa razılaşırsınız.
page.terms.s12.title=12. Tətbiq Olunan Qanun və Yurisdiksiya
page.terms.s12.text=Bu Şərtlər qanunlar toqquşması müddəalarına baxmayaraq, əsas fəaliyyət yerimizin yurisdiksiyasında tətbiq olunan qanunlarla tənzimlənir və şərh edilir. Hər hansı mübahisə həmin yurisdiksiyada yerləşən məhkəmələrin müstəsna yurisdiksiyasına tabe olacaq.
page.terms.s13.title=13. Bu Şərtlərə Dəyişikliklər
page.terms.s13.text=Bu Şərtləri vaxtaşırı yenidən nəzərdən keçirə bilərik. Yenilənmiş Şərtlər “Son yenilənmə” tarixi ilə bu səhifədə dərc olunacaq. Dəyişikliklər qüvvəyə mindikdən sonra Saytdan istifadəyə davam etməyiniz yenilənmiş Şərtlərin qəbulu deməkdir.
page.terms.s14.title=14. Bizimlə Əlaqə
page.terms.s14.text=Bu Şərtlər və Qaydalar barədə hər hansı sualınız varsa, zəhmət olmasa əlaqə saxlayın:
