page.directive.art1.p1=(1) Bu Direktivin məqsədi Türk Dövlətləri Təşkilatına üzv dövlətlər arasında ali təhsil sahəsində əməkdaşlığı təkmilləşdirməklə Türk Dövlətləri Təşkilatının Ali Təhsil Məkanını yaratmaqdır.
page.directive.art1.p2=(2) Bu Direktiv həmçinin Türk Dövlətləri Təşkilatının himayəsi altında yaradılmış Türk Universitetləri Birliyinin strukturunu, iş prinsiplərini və fəaliyyət istiqamətlərini tənzimləmək məqsədi daşıyır.
page.directive.art2.title=Əhatə Dairəsi
page.directive.art2.p1=(1) Bu Direktiv Türk Dövlətləri Təşkilatı Türk Universitetləri Birliyinin üzv universitetləri arasında ali təhsil sahəsində həyata keçiriləcək əməkdaşlığın qayda və prinsiplərini əhatə edir.
page.directive.art3.title=İstinad
page.directive.art3.intro=(1) Bu Direktiv aşağıdakı tədbirlərdə qəbul edilmiş qərarlar əsasında hazırlanmışdır:
page.directive.art3.ref1=Türk Dövlətləri Təşkilatının 23 avqust 2012-ci il tarixində Bişkekdə keçirilmiş İkinci Zirvə Görüşündə;
page.directive.art3.ref2=Türk Dövlətləri Təşkilatı Təhsil Nazirlərinin 10 avqust 2012-ci il tarixində Çolpan-Atada keçirilmiş Görüşündə;
page.directive.art3.ref3=Türk Dövlətləri Təşkilatı Türk Universitetləri Birliyinin 28-29 mart 2012-ci il tarixlərində İstanbulda keçirilmiş Hazırlıq Görüşündə;
page.directive.art3.ref4=Türk Universitetləri Birliyinin 16-17 oktyabr 2014-cü il tarixlərində Ərzurumda keçirilmiş Birinci Ümumi Yığıncağında;
page.directive.art3.ref5=Təhsil Nazirlərinin 28 noyabr 2014-cü il tarixində Bakıda keçirilmiş Üçüncü Görüşündə;
page.directive.art3.ref6=Təhsil Nazirlərinin 5 sentyabr 2015-ci il tarixində Astanada keçirilmiş Dördüncü Görüşündə;
page.directive.art3.ref7=Təhsil Nazirlərinin 15 mart 2019-cu il tarixində Bişkekdə keçirilmiş Beşinci Görüşündə;
page.directive.art3.ref8=Təhsil Nazirlərinin 4 noyabr 2021-ci il tarixində İstanbulda keçirilmiş Altıncı Görüşündə;
page.directive.art3.ref9=Təhsil Nazirlərinin 14 iyun 2023-cü il tarixində Səmərqənddə keçirilmiş Yeddinci Görüşündə;
page.directive.art3.ref10=Türk Dövlətləri Təşkilatı Türk Universitetləri Birliyinin 23 noyabr 2022-ci il tarixində Türküstanda keçirilmiş Altıncı Ümumi Yığıncağında.
page.directive.art4.title=Anlayışlar
page.directive.art4.intro=(1) Bu Direktivin məqsədləri üçün:
page.directive.art4.def1=Türk Dövlətləri Təşkilatı — Türkdilli Dövlətlərin Əməkdaşlıq Şurasını ifadə edir;
page.directive.art4.def2=Türk Dövlətləri Təşkilatının Zirvə Görüşü — üzv dövlətlərin dövlət başçılarının illik toplantısını ifadə edir;
page.directive.art4.def3=Türk Dövlətləri Təşkilatı Təhsil Nazirlərinin Görüşü — Təhsil Nazirlərinin bir araya gəldiyi görüşü ifadə edir. Birliklə bağlı məsələlər müzakirə olunarkən Türkiyə Ali Təhsil Şurasının sədri də iştirak edir;
page.directive.art4.def4=Katiblik — Türk Dövlətləri Təşkilatının Katibliyini ifadə edir;
page.directive.art4.def5=Türk Dövlətləri Təşkilatı Təhsil Nazirlərinin Yüksək Vəzifəli Şəxsləri — üzv dövlətlərin Təhsil Nazirlikləri tərəfindən təyin edilmiş milli ekspertlərdən ibarət qrupu ifadə edir;
page.directive.art4.def6=Birlik — Türk Dövlətləri Təşkilatının himayəsi altında yaradılmış Türk Universitetləri Birliyini ifadə edir;
page.directive.art4.def7=Birliyin Ümumi Yığıncağı — üzv universitetlərin Rektorlarının və ya onların nümayəndələrinin, habelə Türk Dövlətləri Təşkilatının Baş katibinin və ya onun nümayəndəsinin iştirakı ilə formalaşan Komitəni ifadə edir;
page.directive.art4.def8=TCHEA — Türk Dövlətləri Təşkilatının Ali Təhsil Məkanını ifadə edir.
page.directive.art5.title=Təsisçi Üzvlər
page.directive.art5.p1=(1) Birliyin təsisçi üzvləri dörd üzv dövlətdən olan aşağıdakı 15 universitetdir.
page.directive.art5.country=Ölkə
page.directive.art5.university=Universitet
page.directive.art5.memberslink=Birliyin hazırkı üzv universitetlərinə baxın
page.directive.country.az=Azərbaycan
page.directive.country.kz=Qazaxıstan
page.directive.country.kg=Qırğızıstan
page.directive.country.tr=Türkiyə
page.directive.art6.title=Təşkilati Struktur
page.directive.art6.p1=(1) Birlik Türk Dövlətləri Təşkilatının üzv və müşahidəçi dövlətlərinin universitetlərindən və əlaqəli icmalardan ibarətdir.
page.directive.art6.chairmanship=Birliyin Sədrliyi
page.directive.art6.p2=(2) Birliyin Sədri Türk Dövlətləri Təşkilatının Baş katibidir.
page.directive.art6.p3=(3) Dövri sədrlik Ümumi Yığıncağın iclasında üzv universitetlər arasından könüllülük əsasında və ya digər iştirakçıların təklifi ilə sadə səs çoxluğu ilə iki il müddətinə seçilir.
page.directive.art6.p4=(4) Birliyin Sədri öz vəzifələrini akademik məsələlərə cavabdeh olan dövri Sədr Universitetin Rektoru ilə əlaqələndirilmiş şəkildə həyata keçirir.
page.directive.art6.p5=(5) Dövri Sədr Universitetin vəzifələri aşağıdakılardır:
page.directive.art6.duty1=Birliyin Ümumi Yığıncağının iclasına ev sahibliyi etmək və Ümumi Yığıncaqda qəbul edilmiş qərarları icra etmək;
page.directive.art6.duty2=sədrlik dövründə Katibliklə əlaqələndirilmiş şəkildə Birlik üzvləri arasında zəruri əməkdaşlığı və kommunikasiyanı təmin etmək.
page.directive.art6.p6=(6) Dövri Sədr Universitetin Rektoru öz vəzifələri ilə əlaqədar Türk Dövlətləri Təşkilatı Təhsil Nazirlərinin Görüşünə və/və ya Türk Dövlətləri Təşkilatının Zirvə Görüşünə dəvət oluna bilər.
page.directive.art6.assembly=Ümumi Yığıncaq
page.directive.art6.p7=(7) Türk Universitetləri Birliyinin Ümumi Yığıncağı üzv ölkələrin universitet nümayəndələrindən ibarətdir. Üzv universitetin nümayəndələri Rektor, müvafiq prorektor və beynəlmiləlləşmə bölməsindən bir nümayəndədir.
page.directive.art6.board=İdarə Heyəti
page.directive.art6.secretariat=Katiblik
page.directive.art6.subcommittees=Alt Komitələr
page.directive.art6.subcommittees.intro=Ümumi Yığıncaq tərəfindən müəyyən edilmiş prioritet fəaliyyətləri yerinə yetirmək məqsədilə yeddi icra komitəsi yaradılmışdır:
page.directive.art6.committee1=Türk Dünyası Ali Təhsil Məlumat Bankı
page.directive.art6.committee2=Təhsil-Tədris Komitəsi
page.directive.art6.committee3=Elmi Komitə
page.directive.art6.committee4=Türk Dünyası Təhsil Portalı
page.directive.art6.committee5=Ali Təhsil Keyfiyyət Təminatı Şurası
page.directive.art6.committee6=İdman-Mədəniyyət Komitəsi
page.directive.art6.committee7=Tələbə Şurası
page.directive.art6.contactgroup=Əlaqə Qrupu
page.directive.art6.p8=(8) Əlaqə Qrupunda iştirak etmək üçün Türk Dövlətləri Təşkilatı Baş katib müavinini, üzv universitetlər isə Birliyin fəaliyyətlərinə cavabdeh olan nümayəndə ilə birlikdə bir prorektoru təyin edir.
page.directive.art6.p9=(9) Əlaqə Qrupunun vəzifəsi Birlik qərarlarının icrasını əlaqələndirməkdir.
page.directive.art6.p10=(10) Əlaqə Qrupu ildə ən azı iki dəfə toplanır.
page.directive.art6.studentcouncil=Tələbə Şurası
page.directive.art6.p11=(11) Birliyin Tələbə Şurası Birliyin üzv universitetlərindən seçilmiş tələbələrdən ibarətdir.
page.directive.art6.p12=(12) Tələbə Şurasının yaradılması, vəzifə və məsuliyyətləri, habelə digər məsələlərlə bağlı Birlik tərəfindən Direktiv hazırlanır.
page.directive.art7.title=Birliyin Məqsədləri
page.directive.art7.intro=Ortaq tarixə, mədəniyyətə və dilə əsaslanaraq, türkdilli xalqlar arasında dostluq və əməkdaşlığı inkişaf etdirmək və üzv dövlətlərin ali təhsil müəssisələri arasında əməkdaşlığı təmin etmək üçün təhsil səviyyəsini yüksəltmək məqsədilə aşağıdakı hədəflərin gerçəkləşdirilməsi nəzərdə tutulur:
page.directive.art7.obj1=Bütün üzv universitetlərdə müasir elmi səviyyəyə uyğun təhsil standartlarının tətbiqi vasitəsilə ortaq sivilizasiya dərslərinin keçirilməsi və bununla da ortaq kimlik və mədəni şüura malik nəsillərin yetişdirilməsi;
page.directive.art7.obj2=Ali təhsil proqramlarının beynəlxalq akkreditasiya standartlarına uyğun şəkildə sinxronlaşdırılması;
page.directive.art7.obj3=Akademik heyət üçün təlim proqramlarının yaradılması və həyata keçirilməsi;
page.directive.art7.obj4=Tələbə və akademik heyət mübadiləsinin təşviq edilməsi və bununla bağlı zəruri tənzimləmələrin aparılması;
page.directive.art7.obj5=Ortaq kredit transferi sisteminin formalaşdırılması;
page.directive.art7.obj6=Üzv universitetlər arasında ali təhsil proqramlarının tanınmasının təmin edilməsi və üzv universitetlərin sənədlərinin ekvivalentliyinin qarşılıqlı tanınması üçün müvafiq zəminin yaradılması;
page.directive.art7.obj7=Müəyyən sahələrdə universitetlərin müqayisəli üstünlüklərindən faydalanılması;
page.directive.art7.obj8=Tətbiq oluna bilən birgə təhsil və tədqiqat layihələrinin və proqramlarının həyata keçirilməsi və bu sahədə nəşrlərin edilməsi;
page.directive.art7.obj9=Sosial və mədəni sahələrdə əməkdaşlıq edilməsi;
page.directive.art7.obj10=Türk dünyası üzrə tədqiqatlar aparan tələbələr üçün xüsusi təqaüdlərin verilməsi;
page.directive.art7.obj11=Türk dünyasına dair akademik tədqiqatlar və layihələr haqqında məlumatların elektron şəkildə paylaşılmasının təmin edilməsi və universitetlər tərəfindən aparılan müvafiq tədqiqatların ünvanlarının Türk Dövlətləri Təşkilatının internet saytında keçid verilməsi üçün Katibliyin internet saytına ötürülməsi;
page.directive.art7.obj12=Birliyin üzv universitetlərinin xarici qiymətləndirmə və akkreditasiya proseslərinin keyfiyyət təminatına xidmət edəcək müstəqil "Ali Təhsil Keyfiyyət Təminatı Şurası"nın yaradılması və onun fəaliyyətinin dəstəklənməsi;
page.directive.art7.obj13=Türk Dövlətləri Təşkilatı üzvləri üçün Ali Təhsil Məlumat Bankının yaradılması;
page.directive.art7.obj14=Türk Dünyası İndeksinin və sahə indekslərinin yaradılması;
page.directive.art7.obj15=Türk Dünyası Təhsil Portalının yaradılması;
page.directive.art7.obj16=Türk Ali Təhsil Məkanının yaradılması.
page.directive.art8.title=İş Prinsipləri
page.directive.art8.p1=(1) Birliyin qərarları Birliyin üzv universitetlərinin Rektorlarının və ya Rektor nümayəndələrinin və Türk Dövlətləri Təşkilatının Baş katibinin və ya onun nümayəndələrinin iştirak etdiyi Ümumi Yığıncağın iclasında sadə səs çoxluğu ilə qəbul edilir.
page.directive.art8.p2=(2) Birliyin katiblik işləri dövri Sədr Universitetlə əməkdaşlıq şəraitində Türk Dövlətləri Təşkilatının Katibliyi tərəfindən həyata keçirilir.
page.directive.art8.p3=(3) Birliyin institusional strukturu, iş qaydaları və prinsipləri, habelə maliyyə məsələlərində tətbiq olunan qaydalar Birliyin üzv universitetlərinin sadə səs çoxluğu ilə qəbul etdiyi qərar əsasında hazırlanacaq direktivlərə uyğun müəyyən edilir.
page.directive.art8.p4=(4) İcra üçün qəbul edilmiş qərarlar və Birlik tərəfindən hazırlanmış direktivlər Türkiyə Ali Təhsil Şurasının sədrinin də iştirak etdiyi Türk Şurası Təhsil Nazirlərinin Görüşündə təsdiq olunduqdan sonra qüvvəyə minir.
page.directive.art8.p5=(5) Birliyin fəaliyyətinə Ali Təhsil Şurası sədrliyinin nümayəndəsi də daxil olmaqla Türk Dövlətləri Təşkilatı Təhsil Nazirlərinin Yüksək Vəzifəli Şəxsləri tərəfindən nəzarət olunur. Yuxarıda adı çəkilən qrupun məqsədi:
page.directive.art8.wp1=prosesdə həyata keçirilməsi planlaşdırılan layihələri izləmək;
page.directive.art8.wp2=üzv dövlətlər arasında zəruri koordinasiyanı təmin etmək;
page.directive.art8.wp3=proses zamanı yarana biləcək problemlərin həllini həyata keçirmək;
page.directive.art8.wp4=prosesin tərəfləri arasında qəbuledilənlik və tətbiqedilənlik səviyyəsini artırmaq məqsədilə fəaliyyətlər həyata keçirmək;
page.directive.art8.wp5=milli səviyyədə yaşanan problemlərin həlli üçün zəruri milli qanunvericilik dəyişikliklərini öyrənmək və müvafiq orqanlara tövsiyələr verməklə dəstək göstərmək.
page.directive.art9.title=Birliyin Maliyyə Mənbələri
page.directive.art9.intro=(1) Birlik tərəfindən həyata keçiriləcək ali təhsil fəaliyyətlərinin bütün xərcləri aşağıda göstərilən mənbələrdən maliyyələşdirilir:
page.directive.art9.fin1=Üzv universitetlərin maliyyə resursları;
page.directive.art9.fin2=Yaradılacaq "Türk Elmi Tədqiqat Fondu" tərəfindən təmin edilən resurslar, habelə milli və ya beynəlxalq qurumlardan daxil olan resurslar;
page.directive.art9.fin3=Üzv dövlətlərin universitetlərindən layihə əsasında təmin ediləcək əlavə resurslar;
page.directive.art9.fin4=Türk Dövlətləri Təşkilatı üzvlərinin büdcələrindən ayrılan resurslar.
page.directive.art10.title=Birliyə Üzvlük
page.directive.art10.p1=(1) Namizədlik müraciətləri yazılı əsaslandırma ilə Türk Şurasının Katibliyinə edilir. Üzvlüyə qəbul və üzvlüyə xitam verilməsi barədə qərar üzv universitetlərin rəyləri Əlaqə Qrupu vasitəsilə alındıqdan sonra Birlik üzvlərinin ən azı üçdə ikisinin iştirak etdiyi Ümumi Yığıncaq iclasında sadə səs çoxluğu ilə qəbul edilir.
page.directive.art10.membershiplink=Üzvlük proseduru haqqında ətraflı məlumat əldə edin
page.directive.art11.title=Türk Dünyası Ali Təhsil Məkanı
page.directive.art11.p1=(1) TCHEA üzv dövlətlər arasında yaradılmış və ali təhsillə bağlı təhsil fəaliyyətlərinin həyata keçirildiyi məkandır.
page.directive.art11.p2=(2) TCHEA üzv dövlətlərin yaradacağı ortaq platformalar vasitəsilə 7-ci maddədə göstərilən məqsədlərə nail olmağı hədəfləyir.
page.directive.art12.title=İcra Prosesləri
page.directive.art12.p1=(1) Türk Dünyası Ali Təhsil Məkanı çərçivəsində Birliyin üzv dövlətləri əməkdaşlıq sahələri üzrə aşağıdakı məsələləri uyğunlaşdırmalıdırlar:
page.directive.art12.item1=tələbə və akademik heyət üçün mübadilə proqramları;
page.directive.art12.item2=əyani, distant və ya açıq təhsil vasitəsilə həyata keçirilən subbakalavr, bakalavr və magistr dərəcələri üzrə birgə sertifikat proqramlarının açılması ilə bağlı öz ölkələrində qüvvədə olan qanunvericilik.
page.directive.art12.p2=(2) Həyata keçiriləcək əməkdaşlıq çərçivəsində aşağıdakı məsələlər Türkiyə Ali Təhsil Şurası sədrliyinin nümayəndəsinin də daxil olacağı Türk Dövlətləri Təşkilatı Təhsil Nazirlərinin Yüksək Vəzifəli Şəxsləri tərəfindən dəstəklənir:
page.directive.art12.sup1=Birliyin üzv universitetləri və digər rəsmi elmi qurumlar tərəfindən verilən sertifikatların ekvivalentliyinin təmin edilməsi;
page.directive.art12.sup2=Türk Dünyası Ali Təhsil Məkanının yaradılması və yayılması üçün vasitələrin istifadəsi və təşviqi Türkiyə Ali Təhsil Şurası sədrliyinin nümayəndəsinin dəstəyi, habelə Türk Təhsil Nazirlərinin Yüksək Vəzifəli Şəxsləri vasitəsilə həvəsləndirilir.
page.directive.art13.title=Tələbə və Akademik Heyət Mobilliyi
page.directive.art13.p1=(1) Üzv universitetlərdə hazırda fəaliyyət göstərən və/və ya açılacaq yay və qış məktəblərinə digər üzv universitetlərin tələbələri qəbul edilir. Bu proqramlarda tələbələrə təqdim ediləcək imkanlar qarşılıqlılıq əsasında müəyyən edilir.
page.directive.art13.p2=(2) Tələbə və akademik heyət mübadiləsi üçün Orhun Proqramı nümunə kimi tətbiq edilir.
page.directive.art13.p3=(3) Tələbələrin əvvəlki təhsilinin tanınması, tələbə qəbulu, təhsil müqaviləsi və transkriptin hazırlanması üzv universitetlər tərəfindən müəyyən ediləcək ortaq kredit sisteminə uyğun təşkil olunur.
page.directive.art13.orhunlink=Orhun Mübadilə Proqramı haqqında ətraflı məlumat əldə edin
page.directive.art14.title=Müddəa Nəzərdə Tutulmayan Məsələlər
page.directive.art14.p1=Bu Direktivin icrası zamanı yarana biləcək problemlərin həlli üçün dəyişikliklər Ümumi Yığıncaq tərəfindən əlavə sənədlə qəbul edilə bilər.
page.directive.art15.title=Direktivin Dilləri
page.directive.art15.p1=Bu Direktiv Azərbaycan, qazax, qırğız, türk və ingilis dillərində hazırlanmışdır.
page.directive.art16.title=Qüvvəyə Minmə
page.directive.art16.p1=Bu Direktivin müddəaları Birliyin Ümumi Yığıncağında təsdiq edildikdən sonra Türk Dövlətləri Təşkilatı Təhsil Nazirlərinin Görüşündə bəyənildiyi tarixdə qüvvəyə minir.
page.directive.art17.title=İcra
page.directive.art17.p1=Bu Direktivin müddəaları dövri Sədr Universitetlə əməkdaşlıq şəraitində Katiblik tərəfindən icra olunur.
page.directive.art17.p2=Bu proses Orhun Proqramı olaraq müəyyən edilmişdir.
# Orhun Application Guide page
page.orhunguide.title=Orhun Mübadilə Proqramı — Müraciət Bələdçisi
page.orhunguide.intro=Tələbələr və akademik heyət üçün praktiki bələdçi: uyğunluq tələbləri, müraciət prosesi, tələb olunan sənədlər və mobillik üçün seçildikdən sonra tamamlanmalı addımlar.
page.orhunguide.download=Bələdçini yükləyin (PDF)
